<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>章節挑選 ／ 劇情</title>
<style>
:root{
  --void:#05070a;
  --panel:#0b1018;
  --panel-2:#0f1622;
  --line:#1c2836;
  --text:#d7e4ee;
  --text-dim:#6c7d8f;
  --ch1:#39ff9d; --ch2:#4fc3ff; --ch3:#a86bff; --ch4:#ffd23f; --ch5:#ff8a3d;
  --ch6:#ff5c7a; --ch7:#5cffe0; --ch8:#ff5cf0; --ch9:#ff3b3b;
  --accent: var(--ch1);
  --danger:#ff3b3b; --good:#39ff9d;
  --mono:'JetBrains Mono','Noto Sans Mono TC','Courier New',monospace;
  --disp:'Orbitron','Noto Sans TC',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{width:100%;height:100%;background:var(--void);color:var(--text);font-family:var(--mono);-webkit-font-smoothing:antialiased;}
body{padding:26px 4vw;overflow-y:auto;}
.disp{font-family:var(--disp);letter-spacing:.04em;}
.eyebrow{font-size:11px;letter-spacing:.35em;text-transform:uppercase;color:var(--text-dim);}
button{font-family:var(--mono);cursor:pointer;background:none;border:none;color:inherit;}
.btn{padding:12px 26px;border:1px solid var(--accent);color:var(--accent);font-family:var(--mono);font-size:13px;letter-spacing:.05em;background:none;cursor:pointer;transition:background .15s;}
.btn:hover{background:rgba(255,255,255,0.06);}
.btn.ghost{border-color:var(--line);color:var(--text-dim);}
.btn.ghost:hover{color:var(--text);border-color:var(--text-dim);}

.header-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px;flex-wrap:wrap;gap:12px;}
.flex-row{display:flex;align-items:center;gap:10px;}
.icon-btn{width:34px;height:34px;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:14px;color:var(--text-dim);}
.icon-btn:hover{color:var(--accent);border-color:var(--accent);}
.hud-stat{display:flex;flex-direction:column;gap:2px;min-width:64px;}
.hud-stat .hs-label{font-size:9px;color:var(--text-dim);letter-spacing:.15em;text-transform:uppercase;}
.hud-stat .hs-val{font-size:15px;font-family:var(--disp);}

/* ================= CHAPTER SELECT ================= */
.chapter-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(230px,1fr));
  gap:16px;padding-bottom:30px;
}
.chapter-card{
  border:1px solid var(--line);
  background:var(--panel);
  padding:18px;
  display:flex;flex-direction:column;gap:8px;
  clip-path:polygon(0 0,calc(100% - 14px) 0,100% 14px,100% 100%,14px 100%,0 calc(100% - 14px));
  transition:all .18s ease;
  --cc: var(--ch1);
}
.chapter-card:not(.locked){cursor:pointer;}
.chapter-card:not(.locked):hover{border-color:var(--cc);box-shadow:0 0 22px color-mix(in srgb, var(--cc) 30%, transparent);}
.chapter-card.locked{opacity:.35;}
.chapter-num{font-size:11px;color:var(--cc);letter-spacing:.2em;text-transform:uppercase;}
.chapter-title{font-family:var(--disp);font-size:16px;}
.chapter-desc{font-size:11px;color:var(--text-dim);line-height:1.5;flex:1;}
.chapter-stars{font-size:12px;color:var(--cc);letter-spacing:.1em;}
.chapter-progress-bar{height:4px;background:var(--line);border-radius:2px;overflow:hidden;}
.chapter-progress-fill{height:100%;background:var(--cc);}

/* ================= LEVEL SELECT (within chapter) ================= */
.level-list{display:flex;flex-direction:column;gap:10px;max-width:720px;}
.level-row{
  display:flex;align-items:center;gap:16px;
  border:1px solid var(--line);background:var(--panel);
  padding:14px 18px;
  clip-path:polygon(0 0,calc(100% - 12px) 0,100% 12px,100% 100%,12px 100%,0 calc(100% - 12px));
}
.level-row:not(.locked){cursor:pointer;}
.level-row:not(.locked):hover{border-color:var(--accent);}
.level-row.locked{opacity:.35;}
.level-idx{font-family:var(--disp);font-size:20px;color:var(--accent);width:44px;}
.level-info{flex:1;}
.level-info .lname{font-size:14px;}
.level-info .lsub{font-size:11px;color:var(--text-dim);margin-top:2px;}
.level-stars{font-size:13px;color:var(--ch1);width:60px;text-align:right;}

/* ================= STORY SCREEN ================= */
#viewStory{
  display:flex;align-items:center;justify-content:center;
  min-height:70vh;
  padding:5vh 2vw;
  text-align:left;
}
.story-box{
  max-width:680px;width:100%;
  border:1px solid var(--line);
  background:linear-gradient(160deg, rgba(11,16,24,0.9), rgba(15,22,34,0.9));
  padding:32px 36px;
  clip-path:polygon(0 0,calc(100% - 24px) 0,100% 24px,100% 100%,24px 100%,0 calc(100% - 24px));
}
.story-chapter-tag{font-size:11px;letter-spacing:.3em;color:var(--accent);text-transform:uppercase;margin-bottom:6px;}
.story-title{font-family:var(--disp);font-size:24px;margin-bottom:18px;}
.story-body{font-size:14px;line-height:2;color:var(--text);white-space:pre-wrap;min-height:160px;}
.story-quote{
  margin-top:18px;padding:14px 18px;border-left:3px solid var(--accent);
  font-size:13px;color:var(--accent);background:rgba(255,255,255,0.02);
  font-style:italic;line-height:1.7;
}
.story-nav{display:flex;justify-content:flex-end;gap:12px;margin-top:24px;}

.view{display:none;}
.view.active{display:block;}
</style>
</head>
<body>

<!-- CHAPTER SELECT -->
<div class="view" id="viewChapters">
  <div class="header-row">
    <div class="flex-row">
      <button class="icon-btn" id="btnBackToMenu">←</button>
      <div>
        <div class="eyebrow">CHAPTER SELECT</div>
        <div class="disp" style="font-size:20px;">章節挑選</div>
      </div>
    </div>
    <div class="flex-row">
      <div class="hud-stat"><span class="hs-label">Core 核心代幣</span><span class="hs-val" id="coreDisplay">0</span></div>
    </div>
  </div>
  <div class="chapter-grid" id="chapterGrid"></div>
</div>

<!-- LEVEL SELECT -->
<div class="view" id="viewLevels">
  <div class="header-row">
    <div class="flex-row">
      <button class="icon-btn" id="btnBackToChapters">←</button>
      <div>
        <div class="eyebrow" id="levelChapterTag">CHAPTER 1</div>
        <div class="disp" style="font-size:20px;" id="levelChapterName">中列 - 核心機房重啟</div>
      </div>
    </div>
  </div>
  <div class="level-list" id="levelList"></div>
</div>

<!-- STORY -->
<div class="view" id="viewStory">
  <div class="story-box">
    <div class="story-chapter-tag" id="storyTag">第一章</div>
    <div class="story-title disp" id="storyTitle">中列 - 核心機房重啟</div>
    <div class="story-body" id="storyBody"></div>
    <div class="story-quote" id="storyQuote"></div>
    <div class="story-nav">
      <button class="btn ghost" id="btnSkipStory">略過 SKIP</button>
      <button class="btn" id="btnEnterLevel">進入關卡 →</button>
    </div>
  </div>
</div>

   This page holds no *save* state of its own — the parent (main game page)
   remains the single source of truth for SAVE/unlock progress and only ever
   pushes this page a fully-computed render payload ("story:render").

   What THIS page does own is the heavy part: Chapters 2-9 and the ENDLESS
   definition (story text + level/wave configs), which used to live inline
   in the main page. On load we hand that data back to the parent once
   ("story:dataInit") so it can merge it into its own CHAPTERS/ENDLESS and
   every existing save/achievement/config-io function keeps working

  return Object.assign({
    id, name, pools, mobType,
    waveCount: 5,
    spawnInterval: 2200,
    mobSpeed: 26,
    baseHp: 100,
    keys: opts.keys || ""
  }, opts);
}

    lvl("9-6","文學與語法 II", ["sentence"], "basic", {keys:"經典課文段落", waveCount:4, spawnInterval:3400, mobSpeed:17}),
    lvl("9-7","文學與語法 III", ["sentence"], "basic", {keys:"經典課文段落", waveCount:5, spawnInterval:3300, mobSpeed:18}),
    lvl("9-8","毀滅者·Omega", ["sentence"], "boss", {keys:"最終決戰", waveCount:1, spawnInterval:99999, mobSpeed:12, isBoss:true})
  ]
}
];

const ENDLESS_EXT = {
  id:"endless", key:"endless", color:"var(--ch9)",
  name:"深淵矩陣：無盡的駭客任務", short:"無限極限關卡",
  story:{
    title:"深淵矩陣：無盡的駭客任務",
    body:"雖然主要病毒被清除，但網際網路的深處仍存在著無窮無盡的殘留垃圾代碼與未知變種病毒。\n\n作為拯救世界的「傳奇黑客」，你自願將意識永久駐留在「深淵矩陣」中，成為守護人類世界永遠不倒的「最後一塊晶片」。",
    quote:"[WARNING: SYSTEM OVERLOAD - CURRENT SPEED: 120WPM]"
  },
  ranks:[
    {min:0,   name:"初級代碼清洗工", grade:"B"},
    {min:180, name:"防火牆幽靈",     grade:"A"},
    {min:420, name:"神經網絡主宰者", grade:"S"}
  ]
};

function formatTime(sec){
  sec = Math.floor(sec||0);
  const m = Math.floor(sec/60), s = sec%60;
  return `${m}:${String(s).padStart(2,"0")}`;
}

window.addEventListener("message", (e)=>{
  const msg = e.data;
  if(!msg || typeof msg !== "object") return;
  if(msg.type === "story:render"){
    STATE = msg;
    render();
  }
});

function showView(id){
  document.querySelectorAll(".view").forEach(v=>v.classList.remove("active"));
  document.getElementById(id).classList.add("active");
}

document.getElementById("btnBackToMenu").addEventListener("click", ()=> post({type:"story:back"}));
document.getElementById("btnBackToChapters").addEventListener("click", ()=> post({type:"story:backToChapters"}));
document.getElementById("btnSkipStory").addEventListener("click", ()=> post({type:"story:enterLevel"}));
document.getElementById("btnEnterLevel").addEventListener("click", ()=> post({type:"story:enterLevel"}));

function render(){
  if(!STATE) return;
  if(STATE.view === "chapters") renderChapters();
  else if(STATE.view === "levels") renderLevels();
  else if(STATE.view === "story") renderStory();
}

function renderChapters(){
  document.getElementById("coreDisplay").textContent = STATE.core;
  const grid = document.getElementById("chapterGrid");
  grid.innerHTML = "";
  STATE.chapterInfo.forEach(ch=>{
    const unlocked = ch.unlocked;
    const div = document.createElement("div");
    div.className = "chapter-card"+(unlocked?"":" locked");
    div.style.setProperty("--cc", ch.color);
    div.innerHTML = `
      <div class="chapter-num">${ch.short}</div>
      <div class="chapter-title">${unlocked? ch.name : "🔒 未解鎖"}</div>
      <div class="chapter-desc">${unlocked? ch.keysFocus : "完成前一章劇情以解鎖"}</div>
      ${unlocked?`
      <div class="chapter-stars">★ ${ch.totalStars} / ${ch.maxStars}</div>
      <div class="chapter-progress-bar"><div class="chapter-progress-fill" style="width:${(ch.totalStars/ch.maxStars*100)||0}%;background:${ch.color};"></div></div>
      `:""}
    `;
    if(unlocked){ div.addEventListener("click", ()=> post({type:"story:selectChapter", chapterId: ch.id})); }
    grid.appendChild(div);
  });

  const ei = STATE.endlessInfo;
  const div = document.createElement("div");
  div.className = "chapter-card"+(ei.unlocked?"":" locked");
  div.style.setProperty("--cc", ei.color);
  div.innerHTML = `
    <div class="chapter-num">♾️ 無限模式</div>
    <div class="chapter-title">${ei.unlocked? ei.name : "🔒 通關第九章後解鎖"}</div>
    <div class="chapter-desc">${ei.unlocked? "深淵矩陣：無盡的駭客任務" : "完成劇情模式終局之戰"}</div>
    ${ei.unlocked?`<div class="chapter-stars">最佳存活：${formatTime(ei.bestTime)}　評級：${ei.bestGrade}</div>`:""}
  `;
  if(ei.unlocked){ div.addEventListener("click", ()=> post({type:"story:selectEndless"})); }
  grid.appendChild(div);

  showView("viewChapters");
}

function renderLevels(){
  const meta = STATE.chapterMeta;
  if(!meta) return;
  document.getElementById("levelChapterTag").textContent = meta.short;
  document.getElementById("levelChapterName").textContent = meta.name;
  const list = document.getElementById("levelList");
  list.innerHTML = "";
  (STATE.levels||[]).forEach(lv=>{
    const unlocked = lv.unlocked;
    const rec = lv.rec;
    const row = document.createElement("div");
    row.className = "level-row"+(unlocked?"":" locked");
    row.innerHTML = `
      <div class="level-idx" style="color:${meta.color};">${lv.id}</div>
      <div class="level-info">
        <div class="lname">${unlocked?lv.name:"🔒 未解鎖"}</div>
        <div class="lsub">${unlocked? (lv.keys||"") + (rec.cleared? `　最佳 WPM ${rec.bestWpm} / 正確率 ${rec.bestAcc}%` : "") : "先通關上一關"}</div>
      </div>
      <div class="level-stars" style="color:${meta.color};">${unlocked? "★".repeat(rec.stars)+"☆".repeat(3-rec.stars) : ""}</div>
    `;
    if(unlocked){ row.addEventListener("click", ()=> post({type:"story:selectLevel", chapterId: meta.id, levelIdx: lv.idx})); }
    list.appendChild(row);
  });

  // 番外篇：只有本章節全破（bonusLevel.unlocked）才會顯示成可點擊，
  // 否則顯示鎖定提示，跟一般關卡的鎖定樣式一致但文字提醒是「全破本章」。
  const bonus = STATE.bonusLevel;
  if(bonus){
    const row = document.createElement("div");
    row.className = "level-row"+(bonus.unlocked?"":" locked");
    row.style.marginTop = "18px";
    row.style.borderColor = bonus.unlocked ? meta.color : "";
    const timeLabel = bonus.timeLimitSec ? `限時 ${Math.floor(bonus.timeLimitSec/60)}:${String(bonus.timeLimitSec%60).padStart(2,"0")}` : "";
    row.innerHTML = `
      <div class="level-idx" style="color:${meta.color};">✦</div>
      <div class="level-info">
        <div class="lname">${bonus.unlocked? bonus.name : "🔒 番外篇（全破本章解鎖）"}</div>
        <div class="lsub">${bonus.unlocked? `${bonus.keys||""}　${timeLabel}　正確率需達 ${bonus.minAccuracy}% 以上${bonus.rec && bonus.rec.cleared? "　✅ 已通過" : ""}` : "先通關本章全部關卡"}</div>
      </div>
      <div class="level-stars" style="color:${meta.color};">${bonus.unlocked && bonus.rec && bonus.rec.cleared ? "✅" : ""}</div>
    `;
    if(bonus.unlocked){ row.addEventListener("click", ()=> post({type:"story:selectBonusLevel", chapterId: meta.id})); }
    list.appendChild(row);
  }

  showView("viewLevels");
}

function renderStory(){
  const sd = STATE.storyData;
  if(!sd) return;
  document.getElementById("storyTag").textContent = sd.short;
  document.getElementById("storyTitle").textContent = sd.title;
  document.getElementById("storyBody").textContent = sd.body;
  document.getElementById("storyQuote").textContent = sd.quote;
  document.documentElement.style.setProperty("--accent", sd.color);
  showView("viewStory");
}

// Hand the heavy chapter/endless data back to the parent once, then ask for
// the initial render state (queued by the parent until this fires).
post({type:"story:dataInit", chapters: CHAPTERS_EXT, endless: ENDLESS_EXT});
post({type:"story:ready"});
</script>
</body>
</html>
