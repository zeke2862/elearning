<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>分數加法(同分母) - 科幻田徑跨欄遊戲</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #120a2a;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }
        h1 {
            font-size: 1.3rem;
            margin-bottom: 5px;
            color: #00f3ff;
            text-shadow: 0 0 10px rgba(0, 243, 255, 0.5);
        }
        #game-container {
            position: relative;
            width: 800px;
            height: 450px;
            box-shadow: 0 0 30px rgba(138, 43, 226, 0.6);
            border: 2px solid #8a2be2;
            border-radius: 8px;
            overflow: hidden;
            background: linear-gradient(180deg, #180536 0%, #2b0b4a 100%);
        }

        .track-ground {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 130px;
            background: #2b0b4a;
            border-top: 3px solid #00f3ff;
            box-shadow: 0 -5px 15px rgba(0, 243, 255, 0.4);
        }
        .grid-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 320px;
            background-image: linear-gradient(rgba(138, 43, 226, 0.15) 1px, transparent 1px);
            background-size: 100% 30px;
        }

        #top-hud {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 5;
            font-weight: bold;
            font-size: 1rem;
            text-shadow: 0 0 5px rgba(0,0,0,0.8);
        }

        #game-hud {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 70px;
            background: rgba(18, 10, 42, 0.9);
            border-top: 1px solid #8a2be2;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            z-index: 5;
        }

        #runner {
            position: absolute;
            left: 100px;
            bottom: 125px;
            width: 50px;
            height: 85px;
            transition: bottom 0.3s cubic-bezier(0.1, 0.9, 0.2, 1);
            z-index: 4;
        }
        .runner-body {
            position: absolute;
            bottom: 0;
            left: 15px;
            width: 24px;
            height: 40px;
            background: #0055ff;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 8px;
            font-weight: bold;
            box-shadow: 0 0 8px rgba(0, 85, 255, 0.8);
        }
        .runner-head {
            position: absolute;
            bottom: 38px;
            left: 11px;
            width: 28px;
            height: 28px;
            background: #ffdbac;
            border-radius: 50%;
        }
        .runner-hair {
            position: absolute;
            bottom: 58px;
            left: 4px;
            width: 42px;
            height: 30px;
            background: #ffcc00;
            clip-path: polygon(50% 0%, 20% 40%, 0% 20%, 15% 70%, 40% 60%, 50% 100%, 60% 60%, 85% 70%, 100% 20%, 80% 40%);
            box-shadow: 0 0 10px #ffcc00;
        }

        .obstacle {
            position: absolute;
            bottom: 125px;
            width: 140px;
            height: 70px;
            background: rgba(255, 0, 85, 0.2);
            border: 2px solid #ff0055;
            box-shadow: 0 0 15px rgba(255, 0, 85, 0.6);
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            font-weight: bold;
            color: #fff;
            z-index: 3;
            transition: left 0.05s linear;
        }

        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(18, 10, 42, 0.95);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10;
            padding: 20px;
            text-align: center;
        }
        .hidden {
            display: none !important;
        }

        /* 類別選擇按鈕 (真、假、帶) */
        .category-container {
            display: flex;
            gap: 15px;
            margin: 20px 0;
        }
        .category-btn {
            background: linear-gradient(135deg, #2b0b4a, #4a1578);
            color: #00f3ff;
            border: 2px solid #00f3ff;
            padding: 15px 25px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1.1rem;
            font-weight: bold;
            box-shadow: 0 0 10px rgba(0, 243, 255, 0.3);
            transition: all 0.2s;
        }
        .category-btn:hover {
            background: #00f3ff;
            color: #120a2a;
            box-shadow: 0 0 20px #00f3ff;
            transform: translateY(-2px);
        }
        .category-btn:hover, .btn:hover, .level-btn:hover:not(:disabled) {
            animation: mgfx-bounce-btn 0.5s ease-in-out infinite;
        }

        /* 關卡選單 4x4 */
        #level-select {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            max-width: 550px;
            margin: 15px 0;
            padding: 5px;
        }
        .level-btn {
            background: #2b0b4a;
            color: #00f3ff;
            border: 1px solid #00f3ff;
            padding: 10px 15px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 0.85rem;
            transition: all 0.2s;
        }
        .level-btn:hover:not(:disabled) {
            background: #00f3ff;
            color: #120a2a;
            box-shadow: 0 0 10px #00f3ff;
        }
        .level-btn:disabled {
            background: #111;
            color: #555;
            border-color: #333;
            cursor: not-allowed;
        }

        .btn {
            background: linear-gradient(45deg, #00f3ff, #7b00ff);
            color: white;
            border: none;
            padding: 10px 25px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 25px;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.4);
            margin-top: 10px;
            transition: transform 0.1s;
        }
        .btn:active {
            transform: scale(0.95);
        }

        input[type="text"] {
            padding: 8px 15px;
            font-size: 1.1rem;
            border-radius: 5px;
            border: 2px solid #00f3ff;
            background: #0b0518;
            color: #fff;
            width: 160px;
            text-align: center;
            outline: none;
        }
        input[type="text"]:focus {
            box-shadow: 0 0 10px #00f3ff;
        }
        .instruction {
            font-size: 0.85rem;
            color: #aaa;
            margin-top: 5px;
        }
    </style>
</head>
<body>

    <div id="mg-fit-stage">
    <h1>分數加法 (同分母) - 科幻田徑跨欄</h1>

    <div id="game-container">
        <div class="grid-bg"></div>
        <div class="track-ground"></div>

        <!-- 頂部 HUD -->
        <div id="top-hud">
            <div>
                <span id="hud-lives" style="color: #ff0055;">❤️ (5/5)</span> | 
                <span id="hud-score" style="color: #00f3ff;">分數: 0</span>
            </div>
            <div>
                <span id="hud-progress" style="color: #fff;">進度: 0/10</span> | 
                <span id="hud-category" style="color: #ffcc00;">真分數系列</span>
            </div>
            <div>
                <span id="hud-timer" style="color: #00ff66;">時間: 0.0s</span>
            </div>
        </div>

        <!-- 主角 -->
        <div id="runner">
            <div class="runner-hair"></div>
            <div class="runner-head"></div>
            <div class="runner-body">TW</div>
        </div>

        <!-- 障礙物層 -->
        <div id="obstacle-layer"></div>

        <!-- 底部答題操作列 -->
        <div id="game-hud" class="hidden">
            <form id="answer-form" onsubmit="submitAnswer(event)">
                <input type="text" id="answer-input" placeholder="例: 3/4 或 1_1/2" autocomplete="off">
                <button type="submit" class="btn" style="margin-top:0; padding:8px 20px;">回答</button>
            </form>
        </div>

        <!-- 首頁：選擇三大系列 -->
        <div id="home-screen" class="overlay">
            <h2 style="color: #00f3ff; font-size: 2rem; margin-bottom: 10px;">科幻跨欄大賽</h2>
            <p style="max-width: 500px; font-size: 0.95rem; color: #ddd; line-height: 1.5; margin-bottom: 15px;">
                操控金髮賽亞人外型的TEAM TAIWAN選手，在紫色未來田徑場上跨越「同分母分數加法」！<br>
                請選擇您想挑戰的系列：
            </p>
            <div class="category-container">
                <button class="category-btn" onclick="selectCategory('proper')">🌟 真分數系列</button>
                <button class="category-btn" onclick="selectCategory('improper')">⚡ 假分數系列</button>
                <button class="category-btn" onclick="selectCategory('mixed')">🔥 帶分數系列</button>
            </div>
        </div>

        <!-- 關卡選單 (針對選定系列顯示16關) -->
        <div id="menu-screen" class="overlay hidden">
            <h2 id="category-title" style="color: #00f3ff; margin-bottom: 5px;">選擇挑戰關卡</h2>
            <p class="instruction">通關後解鎖下一關 (目標：連續對5題 或 答對率 ≥ 80%)<br>✨ 支援所有等值分數與約分自動判定！</p>
            <div id="level-select"></div>
            <button class="btn" onclick="returnToHome()">返回系列選擇</button>
        </div>

        <!-- 結算畫面 -->
        <div id="result-screen" class="overlay hidden">
            <h2 id="result-title" style="color: #00f3ff; margin-bottom: 10px;">通關成功！</h2>
            <div id="result-stats" style="font-size: 1.1rem; line-height: 1.8; margin-bottom: 15px;"></div>
            <button class="btn" onclick="openLevelSelect()">返回關卡選單</button>
        </div>
    </div>
    </div><!-- /mg-fit-stage -->

    <!-- 💡 保護殼：如果下面四個共用檔案（math-game-common.js /
    mobile-fit.js / math-game-audio.js / math-game-fx.js）沒有跟這個
    html 放在同一個資料夾、讀取失敗，遊戲本身還是能正常開始玩，只是
    暫時沒有登入/代幣/音效/特效這些附加功能。等檔案補齊、重新整理
    網頁後，功能就會自動恢復正常，不用改這段程式碼。 -->
    <script>
        window.MathGameCommon = window.MathGameCommon || {
            renderIdentityBadge: function () {},
            finishAttempt: function () { return Promise.resolve({ gbitAwarded: 0, newBalance: 0 }); },
            reportResult: function () { return Promise.resolve(); },
            awardGbit: function () { return 0; },
            getActiveStudent: function () { return null; }
        };
        window.MathGameAudio = window.MathGameAudio || {
            setMusicMap: function () {}, playBgm: function () {}, stopBgm: function () {},
            setBgmVolume: function () {}, setSfxMap: function () {}, playSfx: function () {},
            bindClickSfx: function () {}
        };
        window.MathGameFX = window.MathGameFX || {
            burst: function () {}, shake: function () {}, flash: function () {},
            popText: function () {}, confetti: function () {}, floatStars: function () {}
        };
    </script>
    <script src="math-game-common.js"></script>
    <script src="mobile-fit.js"></script>
    <script src="math-game-audio.js"></script>
    <script src="math-game-fx.js"></script>
    <script>
        MathGameCommon.renderIdentityBadge();
        MathGameFX.floatStars(document.getElementById('game-container'), 40);

        // 💡 背景音樂設定：真分數／假分數／帶分數三個系列＝三個大關卡。
        // 之後要換成各系列專屬的音樂，把右邊路徑換成你自己的檔名就好。
        MathGameAudio.setMusicMap({
            proper: "./audio/fraction-add-bgm-proper.mp3",
            improper: "./audio/fraction-add-bgm-proper.mp3", // 🔶 預留位置，之後換成假分數系列專屬曲目
            mixed: "./audio/fraction-add-bgm-proper.mp3"     // 🔶 預留位置，之後換成帶分數系列專屬曲目
        });
        // 💡 音效設定：目前先用內建合成音效，之後有真的音效檔再解除註解、填檔名
        MathGameAudio.setSfxMap({
            // correct: "./audio/sfx-correct.mp3",
            // wrong:   "./audio/sfx-wrong.mp3",
            // click:   "./audio/sfx-click.mp3",
            // win:     "./audio/sfx-win.mp3",
            // lose:    "./audio/sfx-lose.mp3"
        });
        MathGameAudio.bindClickSfx('button, .category-btn');

        let currentCategory = 'proper'; // 'proper', 'improper', 'mixed'
        let currentLevel = 1;

        // 三個系列的獨立解鎖進度（每個系列各自有16關）
        let progressData = {
            proper: Array(17).fill(false),
            improper: Array(17).fill(false),
            mixed: Array(17).fill(false)
        };
        progressData.proper[1] = true;
        progressData.improper[1] = true;
        progressData.mixed[1] = true;

        let lives = 5;
        let score = 0;
        let questionCount = 0;
        let correctCount = 0;
        let consecutiveCorrect = 0;
        let currentQuestion = null;
        let obstacleX = 800;
        let obstacleObj = null;
        let gameTimer = 0;
        let gameInterval = null;
        let isJumping = false;

        function getCategoryName(cat) {
            if (cat === 'proper') return '真分數系列';
            if (cat === 'improper') return '假分數系列';
            return '帶分數系列';
        }

        function selectCategory(cat) {
            currentCategory = cat;
            openLevelSelect();
        }

        function openLevelSelect() {
            document.getElementById('home-screen').classList.add('hidden');
            document.getElementById('result-screen').classList.add('hidden');
            document.getElementById('menu-screen').classList.remove('hidden');
            document.getElementById('game-hud').classList.add('hidden');

            document.getElementById('category-title').innerText = `${getCategoryName(currentCategory)} - 選擇關卡`;
            initLevelSelect();
        }

        function returnToHome() {
            document.getElementById('menu-screen').classList.add('hidden');
            document.getElementById('home-screen').classList.remove('hidden');
        }

        // 關卡設定：1-4關為正正、負負、正負、負正，5-12為其他組合擴充，13-16為綜合隨機
        function getLevelConfig(lvl) {
            let mode = '++';
            if (lvl === 2 || lvl === 6 || lvl === 10) mode = '--';
            else if (lvl === 3 || lvl === 7 || lvl === 11) mode = '+-';
            else if (lvl === 4 || lvl === 8 || lvl === 12) mode = '-+';
            else if (lvl >= 13) mode = 'mixed';

            return { type: currentCategory, mode: mode };
        }

        function initLevelSelect() {
            const container = document.getElementById('level-select');
            container.innerHTML = '';
            let currentProgress = progressData[currentCategory];

            for (let i = 1; i <= 16; i++) {
                const btn = document.createElement('button');
                btn.className = 'level-btn';
                btn.innerText = `關卡 ${i}\n` + getLevelSubName(i);
                btn.disabled = !currentProgress[i];
                btn.onclick = () => startLevel(i);
                container.appendChild(btn);
            }
        }

        function getLevelSubName(lvl) {
            if (lvl === 1) return '正+正';
            if (lvl === 2) return '負+負';
            if (lvl === 3) return '正+負';
            if (lvl === 4) return '負+正';
            if (lvl <= 8) return '進階組合';
            if (lvl <= 12) return '高難組合';
            return '全能隨機';
        }

        function startLevel(lvl) {
            currentLevel = lvl;
            lives = 5;
            score = 0;
            questionCount = 0;
            correctCount = 0;
            consecutiveCorrect = 0;
            MathGameAudio.playBgm(currentCategory);

            document.getElementById('menu-screen').classList.add('hidden');
            document.getElementById('game-hud').classList.remove('hidden');
            document.getElementById('answer-input').value = '';
            document.getElementById('answer-input').focus();
            document.getElementById('hud-category').innerText = getCategoryName(currentCategory);

            spawnNextQuestion();

            if (gameInterval) clearInterval(gameInterval);
            gameInterval = setInterval(updateGame, 20);
        }

        function gcd(a, b) {
            return b === 0 ? a : gcd(b, a % b);
        }

        function simplify(n, d) {
            let common = gcd(Math.abs(n), Math.abs(d));
            return { n: n / common, d: d / common };
        }

        function generateFraction(type, mode) {
            let denominators = [2, 3, 4, 5, 6, 8, 10];
            let d = denominators[Math.floor(Math.random() * denominators.length)];
            let w = 0, n = 0;

            if (type === 'proper') {
                n = Math.floor(Math.random() * (d - 1)) + 1;
                w = 0;
            } else if (type === 'improper') {
                n = Math.floor(Math.random() * (d * 2 - d + 1)) + d;
                w = 0;
            } else if (type === 'mixed') {
                w = Math.floor(Math.random() * 3) + 1;
                n = Math.floor(Math.random() * (d - 1)) + 1;
            }

            let sign = 1;
            if (mode === '--') sign = -1;
            else if (mode === '+-') sign = Math.random() < 0.5 ? 1 : -1;
            
            return { w, n, d, sign };
        }

        function generateQuestion(config) {
            let fType = config.type;
            if (config.mode === 'mixed') {
                const subTypes = ['proper', 'improper', 'mixed'];
                fType = subTypes[Math.floor(Math.random() * subTypes.length)];
            }

            let mode = config.mode === 'mixed' ? '+-' : config.mode;
            let sign1 = 1, sign2 = 1;
            if (mode === '++') { sign1 = 1; sign2 = 1; }
            else if (mode === '--') { sign1 = -1; sign2 = -1; }
            else if (mode === '+-') { sign1 = 1; sign2 = -1; }
            else if (mode === '-+') { sign1 = -1; sign2 = 1; }

            let f1 = generateFraction(fType, mode);
            let f2 = generateFraction(fType, mode);
            f1.sign = sign1;
            f2.sign = sign2;
            let d = f1.d;
            f2.d = d;

            let val1 = f1.sign * (f1.w * d + f1.n);
            let val2 = f2.sign * (f2.w * d + f2.n);
            let totalN = val1 + val2;

            let sim = simplify(Math.abs(totalN), d);
            let ansSign = totalN < 0 ? -1 : 1;
            let exactNumerator = ansSign * sim.n;
            let exactDenominator = sim.d;

            function formatF(f) {
                let s = f.sign < 0 ? '-' : '';
                if (f.w > 0) return `${s}${f.w}_${f.n}/${f.d}`;
                return `${s}${f.n}/${f.d}`;
            }

            let textQ = `${formatF(f1)} + (${formatF(f2)})`;
            textQ = textQ.replace(/\+\(-\)/g, '- ').replace(/\+\(/g, '').replace(/\)/g, '');

            return { text: textQ, exactNumerator, exactDenominator };
        }

        function parseUserFraction(inputStr) {
            inputStr = inputStr.trim().replace(/\s+/g, '');
            if (!inputStr) return null;

            let sign = 1;
            if (inputStr.startsWith('-')) {
                sign = -1;
                inputStr = inputStr.substring(1);
            } else if (inputStr.startsWith('+')) {
                inputStr = inputStr.substring(1);
            }

            let num = 0, den = 1;
            if (inputStr.includes('_')) {
                let parts = inputStr.split('_');
                if (parts.length !== 2) return null;
                let whole = parseInt(parts[0], 10);
                let fracParts = parts[1].split('/');
                if (fracParts.length !== 2) return null;
                let n = parseInt(fracParts[0], 10);
                let d = parseInt(fracParts[1], 10);
                if (isNaN(whole) || isNaN(n) || isNaN(d) || d === 0) return null;
                num = whole * d + n;
                den = d;
            } else if (inputStr.includes('/')) {
                let fracParts = inputStr.split('/');
                if (fracParts.length !== 2) return null;
                let n = parseInt(fracParts[0], 10);
                let d = parseInt(fracParts[1], 10);
                if (isNaN(n) || isNaN(d) || d === 0) return null;
                num = n;
                den = d;
            } else {
                let whole = parseInt(inputStr, 10);
                if (isNaN(whole)) return null;
                num = whole;
                den = 1;
            }

            num *= sign;
            let sim = simplify(Math.abs(num), den);
            return {
                n: (num < 0 ? -1 : 1) * sim.n,
                d: sim.d
            };
        }

        function spawnNextQuestion() {
            if (questionCount >= 10) {
                endLevel();
                return;
            }
            questionCount++;
            let config = getLevelConfig(currentLevel);
            currentQuestion = generateQuestion(config);
            gameTimer = 0;
            obstacleX = 800;

            const layer = document.getElementById('obstacle-layer');
            layer.innerHTML = `<div id="obstacle" class="obstacle" style="left: 800px;">${currentQuestion.text}</div>`;
            obstacleObj = document.getElementById('obstacle');
        }

        function submitAnswer(e) {
            e.preventDefault();
            if (!currentQuestion) return;

            const inputElem = document.getElementById('answer-input');
            let userRaw = inputElem.value;
            inputElem.value = '';

            let userParsed = parseUserFraction(userRaw);
            let isCorrect = false;

            if (userParsed) {
                if (userParsed.n === currentQuestion.exactNumerator && userParsed.d === currentQuestion.exactDenominator) {
                    isCorrect = true;
                }
            }

            if (isCorrect) {
                correctCount++;
                consecutiveCorrect++;
                
                let multiplier = 0.5;
                if (gameTimer <= 5) multiplier = 2.0;
                else if (gameTimer <= 10) multiplier = 1.5;
                else if (gameTimer <= 30) multiplier = 1.0;

                score += Math.round(100 * multiplier);
                triggerJump();

                if (obstacleObj) obstacleObj.remove();
                setTimeout(spawnNextQuestion, 400);
            } else {
                consecutiveCorrect = 0;
                triggerHit();
            }
        }

        function triggerJump() {
            MathGameAudio.playSfx('correct');
            const runner = document.getElementById('runner');
            const rect = runner.getBoundingClientRect();
            MathGameFX.burst(rect.left + rect.width / 2, rect.top);
            MathGameFX.popText(rect.left, rect.top - 10, '✨ 答對！', null, '#00f3ff');
            isJumping = true;
            runner.style.bottom = '220px';
            setTimeout(() => {
                runner.style.bottom = '125px';
                isJumping = false;
            }, 400);
        }

        function triggerHit() {
            MathGameAudio.playSfx('wrong');
            MathGameFX.shake(document.getElementById('game-container'));
            MathGameFX.flash(document.getElementById('game-container'), 'rgba(255,0,85,0.8)');
            lives--;
            if (lives <= 0) {
                endLevel();
            }
        }

        function updateGame() {
            gameTimer += 0.02;
            obstacleX -= 2.2;

            if (obstacleObj) {
                obstacleObj.style.left = obstacleX + 'px';
                if (obstacleX <= 100 && obstacleX > 80 && !isJumping) {
                    triggerHit();
                    if (obstacleObj) obstacleObj.remove();
                    spawnNextQuestion();
                }
            }

            document.getElementById('hud-lives').innerText = `❤️ (${lives}/5)`;
            document.getElementById('hud-score').innerText = `分數: ${score}`;
            document.getElementById('hud-progress').innerText = `進度: ${questionCount}/10`;
            document.getElementById('hud-timer').innerText = `時間: ${gameTimer.toFixed(1)}s`;
        }

        function endLevel() {
            if (gameInterval) clearInterval(gameInterval);
            document.getElementById('game-hud').classList.add('hidden');
            if (obstacleObj) obstacleObj.remove();
            MathGameAudio.stopBgm();
            
            let passRate = (correctCount / questionCount) * 100;
            let isPassed = (consecutiveCorrect >= 5) || (passRate >= 80);
            MathGameAudio.playSfx(isPassed ? 'win' : 'lose');
            if (isPassed) MathGameFX.confetti(document.getElementById('game-container'));

            let titleElem = document.getElementById('result-title');
            let statsElem = document.getElementById('result-stats');

            if (isPassed) {
                titleElem.innerText = `關卡 ${currentLevel} 通關成功！`;
                titleElem.style.color = '#00f3ff';
                if (currentLevel < 16) {
                    progressData[currentCategory][currentLevel + 1] = true;
                }
            } else {
                titleElem.innerText = `挑戰失敗...再接再厲！`;
                titleElem.style.color = '#ff0055';
            }

            statsElem.innerHTML = `
                系列：${getCategoryName(currentCategory)}<br>
                答對題數：${correctCount} / ${questionCount} (${passRate.toFixed(1)}%)<br>
                連續答對：${consecutiveCorrect} 題<br>
                獲得總分：${score} 分
                <br><span id="gbitAwardedLine" style="color:#ffcc00;">代幣結算中…</span>
            `;

            document.getElementById('result-screen').classList.remove('hidden');

            // 💡 回傳這次挑戰成績、依答對率發代幣
            MathGameCommon.finishAttempt({
                game: '分數加法(同分母)',
                mode: getCategoryName(currentCategory),
                topic: `關卡${currentLevel}`,
                correct: correctCount,
                total: questionCount
            }).then(result => {
                const line = document.getElementById('gbitAwardedLine');
                if (line) line.textContent = `🪙 這次獲得 ${result.gbitAwarded} 枚代幣（目前共有 ${result.newBalance} 枚）`;
            });
        }
    </script>
</body>
</html>
