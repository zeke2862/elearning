<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>乘法極速跑酷</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Noto+Sans+TC:wght@400;700;900&display=swap');

        :root {
            --primary: #ffd700;
            --secondary: #00e5ff;
            --bg-dark: #0f0f1b;
            --text-light: #f0f8ff;
            --danger: #ff3366;
            --success: #00ff66;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: var(--bg-dark);
            font-family: 'Orbitron', 'Noto Sans TC', sans-serif;
            color: var(--text-light);
            user-select: none;
        }

        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: radial-gradient(circle at center, #1a1a2e 0%, #0f0f1b 100%);
        }

        canvas {
            display: block;
            box-shadow: 0 0 50px rgba(0, 229, 255, 0.2);
            /* Game aspect ratio 16:9 */
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        /* UI Overlay */
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
        }

        .screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: rgba(15, 15, 27, 0.85);
            backdrop-filter: blur(8px);
            z-index: 100;
            transition: opacity 0.3s ease;
            pointer-events: auto;
        }

        .hidden {
            opacity: 0;
            pointer-events: none !important;
        }

        h1 {
            font-size: 4rem;
            font-weight: 900;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 4px;
            background: linear-gradient(45deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 20px rgba(255, 215, 0, 0.5);
        }

        h2 {
            font-size: 2rem;
            color: var(--secondary);
            margin-bottom: 30px;
        }

        p.desc {
            font-size: 1.2rem;
            max-width: 600px;
            text-align: center;
            line-height: 1.6;
            margin-bottom: 40px;
            color: #aaa;
        }

        button.main-btn {
            padding: 15px 40px;
            font-size: 1.5rem;
            font-family: inherit;
            font-weight: 700;
            color: var(--bg-dark);
            background: linear-gradient(45deg, var(--primary), var(--secondary));
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(0, 229, 255, 0.4);
            transition: transform 0.2s, box-shadow 0.2s;
            text-transform: uppercase;
            pointer-events: auto;
        }

        button.main-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 30px rgba(0, 229, 255, 0.8);
        }

        /* HUD */
        #hud {
            position: absolute;
            top: 20px;
            left: 20px;
            right: 20px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            z-index: 50;
            pointer-events: none;
        }

        .hud-panel {
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(0, 229, 255, 0.3);
            border-radius: 15px;
            padding: 15px 25px;
            backdrop-filter: blur(4px);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
        }

        .stats-top {
            display: flex;
            gap: 20px;
            font-size: 1.2rem;
            font-weight: 700;
        }

        .stat-item span {
            color: var(--secondary);
            font-size: 1.5rem;
        }

        #health-bar {
            display: flex;
            gap: 8px;
            margin-top: 10px;
        }

        .heart {
            width: 24px;
            height: 24px;
            background-color: var(--danger);
            clip-path: polygon(50% 100%, 15% 65%, 0% 35%, 15% 0%, 50% 20%, 85% 0%, 100% 35%, 85% 65%);
            box-shadow: 0 0 10px var(--danger);
            transition: all 0.3s ease;
        }

        .heart.lost {
            background-color: #333;
            box-shadow: none;
        }

        /* Center Question Panel */
        #question-panel {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            width: 600px;
            pointer-events: auto;
        }

        #question-text {
            font-size: 3rem;
            font-weight: 900;
            letter-spacing: 2px;
            color: var(--primary);
            text-shadow: 0 0 15px rgba(255, 215, 0, 0.6);
            margin: 0;
            background: rgba(0, 0, 0, 0.7);
            padding: 10px 40px;
            border-radius: 20px;
            border: 2px solid var(--primary);
        }

        #timer-container {
            width: 100%;
            height: 10px;
            background: #222;
            border-radius: 5px;
            margin-top: 10px;
            overflow: hidden;
            box-shadow: inset 0 0 5px #000;
        }

        #timer-bar {
            height: 100%;
            width: 100%;
            background: linear-gradient(90deg, var(--success), var(--primary));
            transition: width 0.1s linear, background-color 0.3s;
        }

        #timer-bar.warning {
            background: var(--danger);
        }

        /* Options Panel */
        #options-container {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 20px;
            flex-wrap: wrap;
        }

        .option-btn {
            background: rgba(0, 0, 0, 0.8);
            border: 2px solid var(--secondary);
            color: #fff;
            font-size: 2rem;
            font-weight: bold;
            font-family: 'Orbitron', sans-serif;
            padding: 15px 20px;
            border-radius: 15px;
            cursor: pointer;
            min-width: 100px;
            transition: all 0.2s ease;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            position: relative;
            overflow: hidden;
        }

        .option-btn:hover {
            transform: translateY(-5px);
            background: rgba(0, 229, 255, 0.2);
            box-shadow: 0 8px 15px rgba(0, 229, 255, 0.4);
        }
        
        .option-btn .shortcut {
            position: absolute;
            top: 2px;
            left: 5px;
            font-size: 0.8rem;
            color: var(--secondary);
        }

        /* Controls info */
        #controls-hint {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255, 255, 255, 0.5);
            font-size: 1rem;
            background: rgba(0,0,0,0.5);
            padding: 5px 15px;
            border-radius: 10px;
        }

        /* Notifications */
        #notification {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.5);
            font-size: 4rem;
            font-weight: 900;
            opacity: 0;
            pointer-events: none;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            text-shadow: 0 0 20px rgba(0,0,0,0.8);
            z-index: 200;
        }
        
        #notification.show {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1);
        }

        .combo-text { color: var(--primary); }
        .wrong-text { color: var(--danger); }
        .invincible-text { 
            color: #ff00ff; 
            text-shadow: 0 0 20px #ff00ff;
        }
        .speed-text { color: var(--secondary); }
    </style>
</head>
<body>

<div id="game-container">
    <canvas id="gameCanvas"></canvas>
    
    <div id="ui-layer">
        <!-- HUD -->
        <div id="hud" class="hidden">
            <div class="hud-panel">
                <div class="stats-top">
                    <div class="stat-item">關卡: <span id="level-display">1</span></div>
                    <div class="stat-item">分數: <span id="score-display">0</span></div>
                    <div class="stat-item">進度: <span id="progress-display">0/10</span></div>
                </div>
                <div id="health-bar">
                    <div class="heart" id="hp-1"></div>
                    <div class="heart" id="hp-2"></div>
                    <div class="heart" id="hp-3"></div>
                    <div class="heart" id="hp-4"></div>
                </div>
            </div>
            
            <div id="question-panel">
                <div id="question-text">? x ?</div>
                <div id="timer-container">
                    <div id="timer-bar"></div>
                </div>
                <div id="options-container">
                    <!-- Buttons injected via JS -->
                </div>
            </div>
            
            <div class="hud-panel" style="text-align: right;">
                <div class="stat-item" style="font-size: 1rem; color: #ccc;">環境: <span id="env-display" style="color: var(--secondary); font-size: 1.2rem;">街道</span></div>
                <div class="stat-item" style="font-size: 1rem; color: #ccc;">敵人: <span id="monster-display" style="color: var(--danger); font-size: 1.2rem;">強盜</span></div>
                <div class="stat-item" style="margin-top: 5px;">連擊: <span id="combo-display" style="color: var(--primary);">0</span></div>
                <div class="stat-item" style="margin-top: 5px; font-size:1rem;">速度: <span id="speed-display" style="color: var(--secondary);">1x</span></div>
            </div>
        </div>

        <div id="controls-hint" class="hidden">使用滑鼠點擊 或 鍵盤 [1]~[4] 選擇答案</div>
        <div id="notification"></div>

        <!-- Start Screen -->
        <div id="start-screen" class="screen">
            <h1>乘法極速跑酷</h1>
            <p class="desc">
                化身魔導勇者，原地蓄力，在答題瞬間衝刺對決！<br>
                連續答對獲得無敵星，閃避怪物獲得疊加的高速快感。<br>
                10秒內答對速度提升2倍！你能突破十種極限地形嗎？
            </p>
            <button class="main-btn" id="btn-start">開始冒險</button>
        </div>

        <!-- Game Over Screen -->
        <div id="game-over-screen" class="screen hidden">
            <h1 style="color: var(--danger); text-shadow: 0 0 20px var(--danger);">挑戰失敗</h1>
            <h2>生命歸零 或 準確率過低</h2>
            <div style="font-size: 1.5rem; margin-bottom: 30px;">
                <p>最終分數: <span id="final-score" style="color: var(--primary); font-size: 2rem;">0</span></p>
                <p>到達關卡: <span id="final-level" style="color: var(--secondary); font-size: 2rem;">1</span></p>
                <p id="final-gbit" style="color: #ffd700; font-size: 1.2rem;"></p>
            </div>
            <button class="main-btn" id="btn-restart">重新開始</button>
        </div>

        <!-- Victory Screen -->
        <div id="victory-screen" class="screen hidden">
            <h1 style="color: var(--success); text-shadow: 0 0 20px var(--success);">全破關卡！</h1>
            <h2>你已成為乘法極速傳說！</h2>
            <div style="font-size: 1.5rem; margin-bottom: 30px;">
                <p>總分: <span id="victory-score" style="color: var(--primary); font-size: 2rem;">0</span></p>
                <p id="victory-gbit" style="color: #ffd700; font-size: 1.2rem;"></p>
            </div>
            <button class="main-btn" id="btn-play-again">再次挑戰</button>
        </div>
        
        <!-- Level Transition Screen -->
        <div id="level-screen" class="screen hidden" style="background: rgba(0,0,0,0.9);">
            <h1 id="level-title">關卡完成!</h1>
            <h2 id="level-subtitle">準備進入下一區域...</h2>
            <div class="stat-item" style="font-size: 1.5rem; margin-bottom: 30px;">
                準確率: <span id="accuracy-display" style="color: var(--success);">100%</span>
            </div>
        </div>
    </div>
</div>

<script src="math-game-common.js"></script>
<script>
/**
 * 乘法極速跑酷 - 遭遇戰模式 (Turn-based Action Runner)
 */
MathGameCommon.renderIdentityBadge();

// --- 遊戲設定與資料 ---
const CANVAS_WIDTH = 1280;
const CANVAS_HEIGHT = 720;
const GROUND_Y = CANVAS_HEIGHT * 0.7; // 地面高度
const PLAYER_START_X = 250;
const MONSTER_START_X = 1050;

const LEVELS = [
    { id: 1, env: '街道', monster: '強盜', bg: '#2c3e50', fg: '#34495e', num1: [1, 9], num2: [1, 9] },
    { id: 2, env: '森林', monster: '樹妖', bg: '#1e3f20', fg: '#2d5a27', num1: [10, 99], num2: [1, 9] },
    { id: 3, env: '沙漠', monster: '仙人掌怪', bg: '#8b6914', fg: '#a68026', num1: [10, 99], num2: [10, 99] },
    { id: 4, env: '海底', monster: '鯊魚精', bg: '#003366', fg: '#004c99', num1: [100, 999], num2: [10, 99] },
    { id: 5, env: '高原極地', monster: '冰雪公主', bg: '#4a6b8c', fg: '#6384a6', num1: [100, 999], num2: [100, 999] },
    { id: 6, env: '山洞', monster: '蝙蝠', bg: '#1a1a1a', fg: '#2a2a2a', num1: [1000, 9999], num2: [1, 9] },
    { id: 7, env: '公園', monster: '一群野狗', bg: '#3a5f0b', fg: '#4c7c0f', num1: [1000, 9999], num2: [10, 99] },
    { id: 8, env: '廢墟', monster: '發狂的機器人', bg: '#4d4d4d', fg: '#666666', num1: [1000, 9999], num2: [100, 999] },
    { id: 9, env: '火山', monster: '地獄三頭犬', bg: '#4a0e0e', fg: '#6b1414', num1: [1000, 9999], num2: [1000, 9999] },
    { id: 10, env: '雪地', monster: '大腳雪怪', bg: '#b3d9ff', fg: '#cce6ff', num1: 'mixed', num2: 'mixed' }
];

// --- 系統變數 ---
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
canvas.width = CANVAS_WIDTH;
canvas.height = CANVAS_HEIGHT;

let globalGameState = 'START'; // START, PLAYING, LEVEL_TRANSITION, GAME_OVER, VICTORY
let combatState = 'THINKING'; // THINKING, DASHING, RESOLVING, RESETTING
let lastTime = 0;
let frameCount = 0;

// --- 遊戲狀態變數 ---
let currentLevelIdx = 0;
let hp = 4;
let score = 0;
let combo = 0;
let isInvincible = false;
let invincibleTimer = 0;
let speedMult = 1.0;
let baseSpeed = 400; // pixels per second
let levelCorrect = 0;
let levelAttempted = 0;
let requiredCorrect = 10;
let minAccuracy = 0.8;
// 💡 累計整場遊戲的答對/總題數（levelCorrect/levelAttempted 每關會歸零，不能拿來算總成績）
let totalCorrectAll = 0;
let totalAttemptedAll = 0;
let gameStartedAt = 0;

// 戰鬥狀態暫存
let actionResult = {
    isCorrect: false,
    timeTaken: 0,
    timer: 0 // 用於動畫計時
};

// 題目系統
let currentQuestion = {
    n1: 0, n2: 0, answer: 0, options: [], timeLimit: 60, timeRemaining: 60, isActive: false
};

// 實體系統
let player;
let monster;
let background;
let particles = [];
let speedLines = [];

// DOM Elements
const uiHUD = document.getElementById('hud');
const uiControls = document.getElementById('controls-hint');
const screenStart = document.getElementById('start-screen');
const screenGameOver = document.getElementById('game-over-screen');
const screenVictory = document.getElementById('victory-screen');
const screenLevel = document.getElementById('level-screen');
const textQuestion = document.getElementById('question-text');
const barTimer = document.getElementById('timer-bar');
const optionsContainer = document.getElementById('options-container');
const notification = document.getElementById('notification');

// --- 類別定義 ---

class Player {
    constructor() {
        this.baseX = PLAYER_START_X;
        this.x = this.baseX;
        this.y = GROUND_Y - 40;
        this.radius = 30;
        this.color = '#ffd700'; // 白金魔導服
        this.wingSpan = 0;
        this.hitTimer = 0;
        this.bob = 0;
    }

    update(dt) {
        // 原地跑步的上下浮動
        this.bob = Math.abs(Math.sin(frameCount * 0.15)) * 10;
        
        // 翅膀動畫 (隨速度與狀態變大)
        let wingTarget = 20 + (speedMult * 5);
        if (combatState === 'DASHING' || combatState === 'RESOLVING') {
            wingTarget += 30;
        }
        this.wingSpan += (wingTarget - this.wingSpan) * 10 * dt;
        
        if (this.hitTimer > 0) this.hitTimer -= dt;
        if (isInvincible && globalGameState === 'PLAYING') {
            invincibleTimer -= dt;
            if (invincibleTimer <= 0) {
                isInvincible = false;
                showNotification("無敵結束", "white");
            }
        }
    }

    draw(ctx) {
        if (this.hitTimer > 0 && Math.floor(frameCount / 5) % 2 === 0) return; // 閃爍效果

        ctx.save();
        ctx.translate(this.x, this.y - this.bob);

        // 光環特效 / 無敵特效
        if (isInvincible) {
            ctx.beginPath();
            ctx.arc(0, 0, this.radius + 20, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(255, 0, 255, 0.3)';
            ctx.fill();
            ctx.strokeStyle = '#ff00ff';
            ctx.lineWidth = 3;
            ctx.stroke();
        } else {
            ctx.beginPath();
            ctx.arc(0, 0, this.radius + 10 + Math.sin(frameCount*0.2)*5, 0, Math.PI * 2);
            ctx.fillStyle = `rgba(255, 215, 0, ${0.1 + Math.sin(frameCount * 0.1)*0.05})`;
            ctx.fill();
        }

        // 噴射幾何羽翼 (背部)
        ctx.fillStyle = 'rgba(0, 229, 255, 0.6)';
        ctx.beginPath();
        ctx.moveTo(-this.radius, 0);
        ctx.lineTo(-this.radius - this.wingSpan, -20);
        ctx.lineTo(-this.radius - 10, 0);
        ctx.lineTo(-this.radius - this.wingSpan, 20);
        ctx.fill();

        // 身體 (魔導作戰服)
        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.arc(0, 0, this.radius, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = this.color;
        ctx.lineWidth = 4;
        ctx.stroke();

        // 衝刺時傾斜
        if (combatState === 'DASHING') {
            ctx.rotate(0.2);
        }

        // 手環全息投影
        ctx.fillStyle = '#00e5ff';
        ctx.fillRect(5, -this.radius - 5, 20, 10);
        
        // 眼睛
        ctx.fillStyle = '#000';
        ctx.beginPath();
        ctx.arc(15, -10, 4, 0, Math.PI * 2);
        ctx.fill();

        ctx.restore();
    }
}

class Monster {
    constructor() {
        this.baseX = MONSTER_START_X;
        this.x = this.baseX;
        this.y = GROUND_Y - 50;
        this.radius = 40;
        this.name = "";
        this.color = '#ff3366';
        this.bob = 0;
        this.active = true;
    }
    
    setName(name) {
        this.name = name;
        this.active = true;
        this.x = this.baseX;
    }

    update(dt) {
        if(!this.active) return;
        this.bob = Math.sin(frameCount * 0.1) * 5;
    }

    draw(ctx) {
        if(!this.active) return;
        ctx.save();
        ctx.translate(this.x, this.y - this.bob);

        // 畫抽象怪物本體
        ctx.fillStyle = this.color;
        ctx.beginPath();
        ctx.moveTo(0, -this.radius);
        ctx.lineTo(this.radius, this.radius);
        ctx.lineTo(-this.radius, this.radius);
        ctx.fill();
        
        ctx.fillStyle = '#fff';
        ctx.font = '20px Noto Sans TC';
        ctx.textAlign = 'center';
        ctx.fillText(this.name, 0, -this.radius - 10);
        
        // 眼睛
        ctx.fillStyle = '#000';
        ctx.beginPath();
        ctx.arc(-10, 0, 5, 0, Math.PI*2);
        ctx.arc(10, 0, 5, 0, Math.PI*2);
        ctx.fill();

        ctx.restore();
    }
}

class Background {
    constructor() {
        this.x = 0;
        this.config = LEVELS[0];
    }

    setLevel(levelConfig) {
        this.config = levelConfig;
    }

    update(dt) {
        // 根據不同狀態決定背景流動速度
        let currentSpeed = baseSpeed;
        if (combatState === 'THINKING' || combatState === 'RESETTING') {
            currentSpeed = baseSpeed * 0.5 * Math.max(1, speedMult * 0.5); // 原地跑也有基本速度感
        } else if (combatState === 'DASHING') {
            currentSpeed = baseSpeed * 3 * speedMult; // 衝刺時極快
        } else if (combatState === 'RESOLVING') {
            currentSpeed = actionResult.isCorrect ? (baseSpeed * 4 * speedMult) : 0; // 答錯停住
        }

        this.x -= currentSpeed * dt;
        if (this.x <= -CANVAS_WIDTH) {
            this.x += CANVAS_WIDTH;
        }
    }

    draw(ctx) {
        // 畫漸層背景
        ctx.fillStyle = this.config.bg;
        ctx.fillRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);

        ctx.fillStyle = this.config.fg;
        for (let i = 0; i < 3; i++) {
            let bgX = this.x + i * CANVAS_WIDTH;
            
            // 地面
            ctx.fillRect(bgX, GROUND_Y, CANVAS_WIDTH, CANVAS_HEIGHT - GROUND_Y);
            
            // 環境裝飾 (簡單幾何代表地形)
            ctx.globalAlpha = 0.4;
            ctx.beginPath();
            ctx.moveTo(bgX + 150, GROUND_Y);
            ctx.lineTo(bgX + 300, GROUND_Y - 150);
            ctx.lineTo(bgX + 450, GROUND_Y);
            ctx.fill();
            
            ctx.beginPath();
            ctx.moveTo(bgX + 700, GROUND_Y);
            ctx.lineTo(bgX + 800, GROUND_Y - 100);
            ctx.lineTo(bgX + 900, GROUND_Y);
            ctx.fill();
            ctx.globalAlpha = 1.0;
        }
        
        // 畫地面動態線條增強速度感
        ctx.fillStyle = 'rgba(255,255,255,0.2)';
        for(let i=0; i<5; i++) {
            let lineX = (this.x * (1 + i*0.2)) % CANVAS_WIDTH;
            if(lineX < 0) lineX += CANVAS_WIDTH;
            ctx.fillRect(lineX, GROUND_Y + 10 + i*20, 100, 4);
        }
    }
}

class Particle {
    constructor(x, y, color, speedScale = 1) {
        this.x = x;
        this.y = y;
        this.vx = (Math.random() - 0.5) * 600 * speedScale;
        this.vy = (Math.random() - 0.5) * 600 * speedScale;
        this.life = 1.0;
        this.color = color;
        this.size = Math.random() * 8 + 4;
    }
    update(dt) {
        this.x += this.vx * dt;
        this.y += this.vy * dt;
        this.life -= dt * 2;
    }
    draw(ctx) {
        ctx.globalAlpha = Math.max(0, this.life);
        ctx.fillStyle = this.color;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI*2);
        ctx.fill();
        ctx.globalAlpha = 1.0;
    }
}

class SpeedLine {
    constructor() {
        this.reset();
    }
    reset() {
        this.x = CANVAS_WIDTH + Math.random() * 500;
        this.y = Math.random() * CANVAS_HEIGHT;
        this.length = Math.random() * 100 + 50;
        this.speed = Math.random() * 1000 + 1000;
        this.active = speedMult > 1 || combatState === 'DASHING';
    }
    update(dt) {
        if (!this.active) return;
        this.x -= (this.speed * speedMult) * dt;
        if (this.x + this.length < 0) {
            this.reset();
        }
    }
    draw(ctx) {
        if (!this.active || this.x > CANVAS_WIDTH) return;
        ctx.strokeStyle = 'rgba(0, 229, 255, 0.3)';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(this.x, this.y);
        ctx.lineTo(this.x + this.length, this.y);
        ctx.stroke();
    }
}

// --- 核心邏輯 ---

function initGame() {
    currentLevelIdx = 0;
    hp = 4;
    score = 0;
    combo = 0;
    speedMult = 1.0;
    totalCorrectAll = 0;
    totalAttemptedAll = 0;
    gameStartedAt = Date.now();
    player = new Player();
    monster = new Monster();
    background = new Background();
    particles = [];
    speedLines = Array(20).fill().map(() => new SpeedLine());
    
    updateHUD();
    startLevel();
    globalGameState = 'PLAYING';
    
    screenStart.classList.add('hidden');
    screenGameOver.classList.add('hidden');
    screenVictory.classList.add('hidden');
    uiHUD.classList.remove('hidden');
    uiControls.classList.remove('hidden');
}

function startLevel() {
    levelCorrect = 0;
    levelAttempted = 0;
    background.setLevel(LEVELS[currentLevelIdx]);
    
    document.getElementById('level-display').innerText = LEVELS[currentLevelIdx].id;
    document.getElementById('env-display').innerText = LEVELS[currentLevelIdx].env;
    document.getElementById('monster-display').innerText = LEVELS[currentLevelIdx].monster;
    updateProgress();
    
    generateNewQuestion();
}

function getRandomInt(min, max) {
    return Math.floor(Math.random() * (max - min + 1)) + min;
}

function generateNewQuestion() {
    let conf = LEVELS[currentLevelIdx];
    let n1Range = conf.num1;
    let n2Range = conf.num2;
    
    if (n1Range === 'mixed') {
        n1Range = LEVELS[getRandomInt(0, 8)].num1;
        n2Range = LEVELS[getRandomInt(0, 8)].num2;
    }

    currentQuestion.n1 = getRandomInt(n1Range[0], n1Range[1]);
    currentQuestion.n2 = getRandomInt(n2Range[0], n2Range[1]);
    currentQuestion.answer = currentQuestion.n1 * currentQuestion.n2;
    
    textQuestion.innerText = `${currentQuestion.n1} x ${currentQuestion.n2} = ?`;
    
    currentQuestion.timeRemaining = currentQuestion.timeLimit;
    currentQuestion.isActive = true;

    // 產生選項
    let answers = [currentQuestion.answer];
    let numOptions = 4;
    
    while (answers.length < numOptions) {
        let offset = getRandomInt(-5, 5);
        if (offset === 0) offset = 1;
        
        let wrongAns = currentQuestion.answer;
        if (currentQuestion.answer < 100) wrongAns += offset;
        else if (currentQuestion.answer < 1000) wrongAns += offset * 10;
        else wrongAns += offset * 100;
        
        if (wrongAns <= 0) wrongAns = Math.abs(wrongAns) + 1;
        
        if (!answers.includes(wrongAns)) {
            answers.push(wrongAns);
        }
    }
    
    // 洗牌
    answers.sort(() => Math.random() - 0.5);
    currentQuestion.options = answers;
    
    renderOptionsUI();
    
    // 設置怪物與狀態
    monster.setName(LEVELS[currentLevelIdx].monster);
    player.x = player.baseX;
    
    combatState = 'THINKING';
    optionsContainer.style.pointerEvents = 'auto';
    optionsContainer.style.opacity = '1';
}

function renderOptionsUI() {
    optionsContainer.innerHTML = '';
    currentQuestion.options.forEach((val, idx) => {
        let btn = document.createElement('button');
        btn.className = 'option-btn';
        btn.innerHTML = `<span class="shortcut">[${idx+1}]</span> ${val}`;
        btn.onclick = () => selectAnswer(val);
        optionsContainer.appendChild(btn);
    });
}

function selectAnswer(selectedValue) {
    if (combatState !== 'THINKING') return;
    
    optionsContainer.style.pointerEvents = 'none';
    optionsContainer.style.opacity = '0.5';
    currentQuestion.isActive = false;
    
    actionResult.isCorrect = (selectedValue === currentQuestion.answer);
    actionResult.timeTaken = currentQuestion.timeLimit - currentQuestion.timeRemaining;
    actionResult.timer = 0;
    
    combatState = 'DASHING';
}

function handleTimeOut() {
    if (combatState !== 'THINKING') return;
    
    optionsContainer.style.pointerEvents = 'none';
    optionsContainer.style.opacity = '0.5';
    currentQuestion.isActive = false;
    
    actionResult.isCorrect = false;
    actionResult.timeTaken = currentQuestion.timeLimit;
    actionResult.timer = 0;
    
    combatState = 'DASHING';
}

function createExplosion(x, y, color) {
    for(let i=0; i<40; i++){
        particles.push(new Particle(x, y, color, 1.5));
    }
}

function showNotification(text, typeClass) {
    notification.innerText = text;
    notification.className = typeClass;
    notification.classList.add('show');
    
    setTimeout(() => {
        notification.classList.remove('show');
    }, 1200);
}

function updateHearts() {
    for (let i = 1; i <= 4; i++) {
        let h = document.getElementById(`hp-${i}`);
        if (i <= hp) {
            h.classList.remove('lost');
        } else {
            h.classList.add('lost');
        }
    }
}

function updateHUD() {
    document.getElementById('score-display').innerText = score;
    document.getElementById('combo-display').innerText = combo;
    document.getElementById('speed-display').innerText = speedMult.toFixed(1) + 'x';
    updateHearts();
    updateProgress();
}

function updateProgress() {
    document.getElementById('progress-display').innerText = `${levelCorrect}/${requiredCorrect}`;
}

// 動畫與戰鬥邏輯步進
function processCombatState(dt) {
    if (combatState === 'DASHING') {
        // 衝刺向怪物
        player.x += (MONSTER_START_X - 100 - player.x) * 15 * dt;
        
        // 接近怪物時進入結算
        if (Math.abs(player.x - (MONSTER_START_X - 100)) < 10) {
            combatState = 'RESOLVING';
            actionResult.timer = 0;
            
            if (actionResult.isCorrect) {
                // 答對特效
                createExplosion(monster.x, monster.y, '#00e5ff');
            } else {
                // 答錯特效
                createExplosion(player.x, player.y, '#ff3366');
            }
        }
    } else if (combatState === 'RESOLVING') {
        actionResult.timer += dt;
        
        if (actionResult.isCorrect) {
            // 答對：穿透怪物向右移動
            player.x += 1500 * dt;
            monster.active = false; // 怪物被擊破或甩開
            
            if (actionResult.timer > 0.5) {
                // 結算分數與狀態
                levelAttempted++;
                levelCorrect++;
                totalAttemptedAll++;
                totalCorrectAll++;
                combo++;
                
                let scoreAdd = 100;
                let addedSpeed = 1.0;
                
                if (actionResult.timeTaken <= 10) {
                    scoreAdd *= 2;
                    addedSpeed = 2.0;
                    showNotification("極速閃避! Speed+2", "speed-text");
                } else if (actionResult.timeTaken <= 20) {
                    scoreAdd *= 1.5;
                    addedSpeed = 1.5;
                    showNotification("快速閃避! Speed+1.5", "speed-text");
                } else {
                    showNotification("成功閃避! Speed+1", "combo-text");
                    addedSpeed = 1.0;
                }
                
                score += Math.floor(scoreAdd * (1 + combo * 0.1));
                speedMult += addedSpeed;
                speedLines.forEach(sl => sl.reset()); // 刷新速度線
                
                if (combo >= 3 && !isInvincible) {
                    isInvincible = true;
                    invincibleTimer = 5; 
                    showNotification("無敵星啟動!", "invincible-text");
                    combo = 0; 
                }
                
                updateHUD();
                combatState = 'RESETTING';
                actionResult.timer = 0;
            }
        } else {
            // 答錯：撞擊後退
            player.x -= 800 * dt;
            
            if (actionResult.timer > 0.5) {
                levelAttempted++;
                totalAttemptedAll++;
                combo = 0;
                
                if (isInvincible) {
                    showNotification("無敵抵擋傷害!", "invincible-text");
                    isInvincible = false;
                } else {
                    hp--;
                    player.hitTimer = 1.0;
                    speedMult = 1.0; // 速度重置
                    speedLines.forEach(sl => sl.reset());
                    showNotification("被怪物抓住!", "wrong-text");
                    
                    if (hp <= 0) {
                        gameOver();
                        return;
                    }
                }
                
                updateHUD();
                combatState = 'RESETTING';
                actionResult.timer = 0;
            }
        }
    } else if (combatState === 'RESETTING') {
        actionResult.timer += dt;
        
        // 將玩家拉回原點
        player.x += (player.baseX - player.x) * 10 * dt;
        
        if (actionResult.timer > 0.5 && Math.abs(player.x - player.baseX) < 10) {
            checkLevelProgress();
        }
    }
}

function checkLevelProgress() {
    if (levelCorrect >= requiredCorrect) {
        let acc = levelCorrect / levelAttempted;
        if (acc >= minAccuracy) {
            levelComplete(acc);
        } else {
             showNotification("準確率過低，繼續挑戰!", "wrong-text");
             setTimeout(generateNewQuestion, 1000);
        }
    } else {
        generateNewQuestion();
    }
}

function levelComplete(accuracy) {
    globalGameState = 'LEVEL_TRANSITION';
    uiHUD.classList.add('hidden');
    uiControls.classList.add('hidden');
    screenLevel.classList.remove('hidden');
    optionsContainer.style.opacity = '0';
    
    document.getElementById('accuracy-display').innerText = Math.round(accuracy * 100) + '%';
    
    setTimeout(() => {
        currentLevelIdx++;
        if (currentLevelIdx >= LEVELS.length) {
            victory();
        } else {
            screenLevel.classList.add('hidden');
            uiHUD.classList.remove('hidden');
            uiControls.classList.remove('hidden');
            startLevel();
            globalGameState = 'PLAYING';
        }
    }, 3000);
}

function gameOver() {
    globalGameState = 'GAME_OVER';
    uiHUD.classList.add('hidden');
    uiControls.classList.add('hidden');
    optionsContainer.style.opacity = '0';
    screenGameOver.classList.remove('hidden');
    
    document.getElementById('final-score').innerText = score;
    document.getElementById('final-level').innerText = LEVELS[currentLevelIdx].id;

    // 💡 回傳這次挑戰成績、依答對率發代幣
    const gbitLine = document.getElementById('final-gbit');
    gbitLine.textContent = '代幣結算中…';
    MathGameCommon.finishAttempt({
        game: '乘法極速跑酷',
        mode: '挑戰失敗',
        topic: `關卡${LEVELS[currentLevelIdx].id}(${LEVELS[currentLevelIdx].env})`,
        correct: totalCorrectAll,
        total: totalAttemptedAll,
        timeSec: gameStartedAt ? Math.round((Date.now() - gameStartedAt) / 1000) : 0
    }).then(result => {
        gbitLine.textContent = `🪙 這次獲得 ${result.gbitAwarded} 枚代幣（目前共有 ${result.newBalance} 枚）`;
    });
}

function victory() {
    globalGameState = 'VICTORY';
    screenLevel.classList.add('hidden');
    uiHUD.classList.add('hidden');
    uiControls.classList.add('hidden');
    optionsContainer.style.opacity = '0';
    screenVictory.classList.remove('hidden');
    
    document.getElementById('victory-score').innerText = score;

    // 💡 回傳這次挑戰成績、依答對率發代幣
    const gbitLine = document.getElementById('victory-gbit');
    gbitLine.textContent = '代幣結算中…';
    MathGameCommon.finishAttempt({
        game: '乘法極速跑酷',
        mode: '全破關卡',
        topic: `全${LEVELS.length}關`,
        correct: totalCorrectAll,
        total: totalAttemptedAll,
        timeSec: gameStartedAt ? Math.round((Date.now() - gameStartedAt) / 1000) : 0
    }).then(result => {
        gbitLine.textContent = `🪙 這次獲得 ${result.gbitAwarded} 枚代幣（目前共有 ${result.newBalance} 枚）`;
    });
}


// --- 輸入處理 ---
window.addEventListener('keydown', (e) => {
    if (globalGameState !== 'PLAYING' || combatState !== 'THINKING') return;
    
    // 對應數字鍵 1~5
    let num = parseInt(e.key);
    if (!isNaN(num) && num >= 1 && num <= currentQuestion.options.length) {
        selectAnswer(currentQuestion.options[num - 1]);
    }
});

// UI Buttons
document.getElementById('btn-start').addEventListener('click', initGame);
document.getElementById('btn-restart').addEventListener('click', initGame);
document.getElementById('btn-play-again').addEventListener('click', initGame);


// --- 主迴圈 ---
function gameLoop(timestamp) {
    if (!lastTime) lastTime = timestamp;
    let dt = (timestamp - lastTime) / 1000; // seconds
    lastTime = timestamp;
    
    // 上限 dt 防止卡頓後爆衝
    if (dt > 0.1) dt = 0.1;
    
    frameCount++;

    ctx.clearRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);

    if (globalGameState === 'PLAYING' || globalGameState === 'LEVEL_TRANSITION') {
        
        // 更新與繪製背景
        background.update(dt);
        background.draw(ctx);
        
        // 繪製速度線
        speedLines.forEach(sl => {
            sl.update(dt);
            sl.draw(ctx);
        });
        
        if (globalGameState === 'PLAYING') {
            
            // 處理計時器
            if (currentQuestion.isActive && combatState === 'THINKING') {
                currentQuestion.timeRemaining -= dt;
                let pct = currentQuestion.timeRemaining / currentQuestion.timeLimit;
                barTimer.style.width = `${pct * 100}%`;
                
                if (pct < 0.2) {
                    barTimer.classList.add('warning');
                } else {
                    barTimer.classList.remove('warning');
                }

                if (currentQuestion.timeRemaining <= 0) {
                    currentQuestion.timeRemaining = 0;
                    handleTimeOut();
                }
            }
            
            // 處理戰鬥狀態與動畫
            processCombatState(dt);
            
            // 更新怪物
            monster.update(dt);
        }
        
        // 繪製實體
        monster.draw(ctx);
        player.update(dt);
        player.draw(ctx);
        
        // 繪製粒子特效
        for (let i = particles.length - 1; i >= 0; i--) {
            particles[i].update(dt);
            particles[i].draw(ctx);
            if (particles[i].life <= 0) {
                particles.splice(i, 1);
            }
        }
    }

    requestAnimationFrame(gameLoop);
}

// 啟動迴圈
requestAnimationFrame(gameLoop);

</script>
