const RK=[[0,'新兵'],[8,'伍長'],[20,'校尉'],[40,'將軍'],[67,'大元帥'],[97,'兵仙'],[130,'代數宗師']]; // 與 world-map.html 相同（每關最多 5 星）
const KEY='hanxin-teacher-v1';
let S=[];
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const sid=x=>[x.who.cls,x.who.no,x.who.name].join('|');
const total=x=>IDS.reduce((a,id)=>a+((x.stages[id]&&x.stages[id].stars)||0),0);
const endTotal=x=>IDS.reduce((a,id)=>a+((x.stages[id]&&x.stages[id].eb)||0),0);
const rankOf=t=>RK.filter(r=>r[0]<=t).pop()[1];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function ingest(o){
  if(!o||o.v!==1||typeof o.stages!=='object'||o.stages===null)return false;
  const w=o.who||{},rec={who:{cls:String(w.cls||'').slice(0,20),no:String(w.no||'').slice(0,10),name:String(w.name||'').slice(0,30)},stages:{},q:{},at:String(o.at||'')};
  IDS.forEach(id=>{const s=o.stages[id];if(s&&typeof s==='object')rec.stages[id]={stars:clamp(Math.floor(+s.stars)||0,0,5),best:Math.max(0,+s.best||0),eb:Math.max(0,Math.floor(+s.eb)||0)}});
  const q=o.q&&typeof o.q==='object'?o.q:{};
  Object.keys(q).forEach(k=>{if(!LABEL[k]||!q[k])return;const n=Math.max(0,Math.floor(+q[k].n)||0),ok=clamp(Math.floor(+q[k].ok)||0,0,n);if(n)rec.q[k]={n:n,ok:ok}});
  const i=S.findIndex(x=>sid(x)==sid(rec));
  if(i>=0){if(rec.at>=S[i].at)S[i]=rec}else S.push(rec);
  return true;
}
const byClass=c=>S.filter(x=>!c||x.who.cls===c).sort((a,b)=>(a.who.cls+'|'+String(a.who.no).padStart(4,'0')).localeCompare(b.who.cls+'|'+String(b.who.no).padStart(4,'0'),'zh-Hant'));
function aggregate(list){
  const m={};list.forEach(x=>Object.keys(x.q).forEach(k=>{const r=m[k]||(m[k]={n:0,ok:0});r.n+=x.q[k].n;r.ok+=x.q[k].ok}));
  return Object.keys(m).map(k=>({k:k,label:k.split(':')[0]+' '+LABEL[k],n:m[k].n,ok:m[k].ok,acc:m[k].ok/m[k].n}));
}
const weakRows=(rows,minN)=>rows.filter(r=>r.n>=minN).sort((a,b)=>a.acc-b.acc||b.n-a.n);
const csvCell=v=>{let s=String(v);if(/^[=+\-@\t\r]/.test(s))s="'"+s;return /[",\n\r]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s};
const toCSV=rows=>'\ufeff'+rows.map(r=>r.map(csvCell).join(',')).join('\r\n');
function progressCSV(list){
  return toCSV([['班級','座號','姓名','總星數','軍階','無極限最高題數合計',...IDS.map(id=>id+' '+CH.find(c=>c[0]==id)[1])],

}
function weakCSV(rows){return toCSV([['關卡','題型','作答次數','答對次數','答對率(%)'],...rows.map(r=>[r.k.split(':')[0],LABEL[r.k],r.n,r.ok,Math.round(r.acc*100)])])}
function demoData(){

  const keys=Object.keys(LABEL),weak=new Set(keys.filter(()=>Math.random()<.12));
  names.forEach((nm,i)=>{
    const upto=Math.floor(Math.random()*17),stages={},q={};
    IDS.forEach((id,k)=>{if(k<upto){const sr=1+Math.floor(Math.random()*5);stages[id]={stars:sr,best:400+Math.floor(Math.random()*900),eb:sr>=3&&Math.random()<.5?5+Math.floor(Math.random()*25):0}}});
    keys.forEach(key=>{const k=IDS.indexOf(key.split(':')[0]);if(k<upto){const n=3+Math.floor(Math.random()*8),p=weak.has(key)?.4:.85;let ok=0;for(let j=0;j<n;j++)if(Math.random()<p)ok++;q[key]={n:n,ok:ok}}});
    ingest({v:1,who:{cls:i<6?'701':'702',no:String(i%6+1),name:'示範'+nm},stages:stages,q:q,at:new Date().toISOString()});
  });
}
/*UI*/
const $=s=>document.querySelector(s);
let tab='prog';
function load(){try{S=JSON.parse(localStorage.getItem(KEY))||[]}catch(e){S=[]}if(!Array.isArray(S))S=[];const old=S;S=[];old.forEach(x=>ingest({v:1,who:x.who,stages:x.stages,q:x.q,at:x.at}))}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function say(t){$('#msg').textContent=t}
function download(name,text,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:type||'text/csv;charset=utf-8'}));a.download=name;document.body.appendChild(a);a.click();a.remove()}
const cur=()=>$('#cls').value;
function renderCls(){const cs=[...new Set(S.map(x=>x.who.cls))].sort(),old=cur();$('#cls').innerHTML='<option value="">全部班級</option>'+cs.map(c=>`<option value="${esc(c)}">${esc(c||'（未填班級）')}</option>`).join('');if(cs.includes(old))$('#cls').value=old}
function star(n){return n?`<td class="s${n}">${'★'.repeat(n)}</td>`:'<td class="s0">—</td>'}
function bar(a){const c=a<.6?'lo':a<.8?'mid':'';return `<span class="acc ${c}" style="width:${Math.max(2,Math.round(a*100))}px"></span> ${Math.round(a*100)}%`}
function renderProg(){
  const L=byClass(cur());
  if(!L.length){$('#v-prog').innerHTML='<p>還沒有資料。請按「匯入學生進度檔」，或先按「載入示範資料」看看效果。</p>';return}
  const cleared=IDS.map(id=>L.filter(x=>x.stages[id]&&x.stages[id].stars>0).length),avg=L.reduce((a,x)=>a+total(x),0)/L.length;
  $('#v-prog').innerHTML=`<div class="bar"><b>共 ${L.length} 位學生，平均 ${avg.toFixed(1)} 顆星</b><button class="b" id="e-prog">⬇️ 匯出 Excel（CSV）</button></div><div class="tw"><table><tr><th class="l">班級</th><th>座號</th><th class="l">姓名</th><th>總星數</th><th>軍階</th><th title="各關無極限最高題數加總">♾️合計</th>${IDS.map(id=>`<th title="${esc(CH.find(c=>c[0]==id)[1])}">${id}</th>`).join('')}</tr>`+
   L.map(x=>`<tr><td class="l">${esc(x.who.cls)}</td><td>${esc(x.who.no)}</td><td class="l">${esc(x.who.name)}</td><td>${total(x)}</td><td>${rankOf(total(x))}</td><td>${endTotal(x)||'—'}</td>${IDS.map(id=>star((x.stages[id]&&x.stages[id].stars)||0)).join('')}</tr>`).join('')+
   `<tr><th class="l" colspan="6">通關率</th>${cleared.map(c=>`<th>${Math.round(c/L.length*100)}%</th>`).join('')}</tr></table></div>`;
  $('#e-prog').onclick=()=>download('班級進度表.csv',progressCSV(L));
}
function renderWeak(){
  const L=byClass(cur()),minN=+($('#minn')&&$('#minn').value)||5;
  if(!L.length){$('#v-weak').innerHTML='<p>還沒有資料。</p>';return}
  const rows=weakRows(aggregate(L),minN);
  $('#v-weak').innerHTML=`<div class="bar"><b>全班各題型答對率（由低到高）</b><label>至少作答 <input type="number" id="minn" min="1" value="${minN}" style="width:5em"> 次才列入</label><button class="b" id="e-weak">⬇️ 匯出 Excel（CSV）</button></div><div class="tw"><table><tr><th class="l">關卡與題型</th><th>作答次數</th><th class="l">答對率</th></tr>`+
   (rows.length?rows.map(r=>`<tr><td class="l">${esc(r.label)}</td><td>${r.n}</td><td class="l">${bar(r.acc)}</td></tr>`).join(''):'<tr><td colspan="3">資料還不夠，請調低「至少作答次數」。</td></tr>')+`</table></div>`;
  $('#minn').onchange=renderWeak;$('#e-weak').onclick=()=>download('題型弱點.csv',weakCSV(rows));
}
function renderOne(){
  const L=byClass(cur());
  if(!L.length){$('#v-one').innerHTML='<p>還沒有資料。</p>';return}
  const sel=$('#who')?+$('#who').value:0,i=Math.min(sel||0,L.length-1),x=L[i],rows=weakRows(Object.keys(x.q).map(k=>({k:k,label:k.split(':')[0]+' '+LABEL[k],n:x.q[k].n,ok:x.q[k].ok,acc:x.q[k].ok/x.q[k].n})),3);
  $('#v-one').innerHTML=`<div class="bar"><label>學生 <select id="who">${L.map((s,j)=>`<option value="${j}" ${j==i?'selected':''}>${esc(s.who.cls)} ${esc(s.who.no)} ${esc(s.who.name)}</option>`).join('')}</select></label><b>${total(x)} 顆星｜${rankOf(total(x))}</b></div>`+
   `<p><b>最需要加強的題型（作答 3 次以上）：</b></p>`+(rows.length?`<div class="tw"><table><tr><th class="l">關卡與題型</th><th>作答次數</th><th class="l">答對率</th></tr>${rows.slice(0,8).map(r=>`<tr><td class="l">${esc(r.label)}</td><td>${r.n}</td><td class="l">${bar(r.acc)}</td></tr>`).join('')}</table></div>`:'<p>這位同學的作答資料還不夠。</p>')+
   (()=>{const e=IDS.filter(id=>x.stages[id]&&x.stages[id].eb).sort((a,b)=>x.stages[b].eb-x.stages[a].eb);
     return `<p><b>♾️ 無極限挑戰最高紀錄：</b>${e.length?'':'尚無紀錄'}</p>`+(e.length?`<div class="tw"><table><tr><th class="l">關卡</th><th>最高題數</th></tr>${e.map(id=>`<tr><td class="l">${esc(id+' '+CH.find(c=>c[0]==id)[1])}</td><td>${x.stages[id].eb}</td></tr>`).join('')}</table></div>`:'')})();
  $('#who').onchange=renderOne;
}
function render(){renderCls();({prog:renderProg,weak:renderWeak,one:renderOne})[tab]();['prog','weak','one'].forEach(t=>$('#v-'+t).classList.toggle('hide',t!=tab));document.querySelectorAll('[data-t]').forEach(b=>b.classList.toggle('on',b.dataset.t==tab))}
document.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{tab=b.dataset.t;render()});
$('#cls').onchange=render;
$('#file').onchange=async e=>{
  let ok=0,bad=0;
  for(const f of e.target.files){try{ingest(JSON.parse(await f.text()))?ok++:bad++}catch(err){bad++}}
  e.target.value='';save();render();say(`匯入完成：成功 ${ok} 份${bad?`，${bad} 份格式不符已略過`:''}`);
};
$('#demo').onclick=()=>{demoData();save();render();say('已載入 12 位示範學生（名字前有「示範」）。')};
$('#clear').onclick=()=>{if(confirm('確定要清空後台裡所有學生資料嗎？（學生自己電腦上的進度不受影響）')){S=[];save();render();say('已清空')}};
load();render();
</script>
</body>
</html>
