<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>整數王國：數之鑰的覺醒</title>
<style>
:root{--ink:#161a2e;--ink2:#20264a;--line:#3a4270;--bronze:#d2a24c;--paper:#f1e8d2;--red:#d24a33;--jade:#43a58f;--txt:#e9e4d4}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(ellipse at top,#252c56,var(--ink) 65%);color:var(--txt);font-family:"Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;min-height:100vh}
h1,h2,.serif{font-family:"Noto Serif TC","Songti TC","PMingLiU",serif}
main{max-width:720px;margin:0 auto;padding:16px}
.hide{display:none!important}
button{font:inherit;cursor:pointer;color:inherit}
button:focus-visible{outline:3px solid var(--bronze);outline-offset:2px}
.card{background:var(--ink2);border:2px solid var(--line);border-radius:14px;padding:18px}
.btn{background:var(--bronze);color:#2a1d05;border:0;border-radius:10px;padding:12px 22px;font-weight:700;font-size:1.05rem}
.btn.ghost{background:transparent;color:var(--bronze);border:2px solid var(--bronze)}
.modes{display:grid;gap:10px;margin:16px 0}
.mode{text-align:left;background:var(--ink);border:2px solid var(--line);border-radius:12px;padding:12px 14px}
.mode.on{border-color:var(--bronze);background:#2b2a3c}
.mode b{font-size:1.1rem}.mode small{display:block;opacity:.75;margin-top:2px}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;font-weight:700}
.hearts{letter-spacing:2px}
.combo{color:var(--bronze);min-width:5em;text-align:right}
.field{position:relative;height:96px;margin:12px 0;border-radius:12px;background:linear-gradient(#1b2040,#2b3160);border:2px solid var(--line);overflow:hidden}
.field::after{content:"";position:absolute;left:0;right:0;bottom:0;height:22px;background:#3b3f2e}
.wall{position:absolute;right:0;top:0;bottom:0;width:20%;background:repeating-linear-gradient(#6a5a45 0 14px,#57493a 14px 16px);border-left:4px solid var(--bronze);display:flex;align-items:center;justify-content:center;font-size:2rem}
#enemy{position:absolute;bottom:14px;left:0;font-size:2.4rem;transition:left .15s linear,opacity .6s,transform .6s;white-space:nowrap}
#enemy.dead{opacity:0;transform:translateY(-30px) rotate(20deg) scale(1.4)}
.timebar{height:8px;background:var(--ink);border-radius:6px;overflow:hidden}
#bar{height:100%;background:var(--jade);width:100%;transition:width .1s linear}
.q{background:var(--paper);color:#2b2416;border-radius:12px;padding:18px;margin:12px 0;text-align:center}
.q .t{font-size:1.25rem;font-weight:700;line-height:1.5}
.q .hint{margin-top:8px;font-size:.95rem;color:#7a4a12}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.opt{background:var(--ink2);border:2px solid var(--bronze);border-radius:12px;padding:16px 6px;font-size:1.5rem;font-weight:700;font-variant-numeric:tabular-nums}
.opt:hover:not(:disabled){background:#33396b}
.opt.ok{background:var(--jade);border-color:var(--jade);color:#06231c}
.opt.bad{background:var(--red);border-color:var(--red)}
.opt.cut{opacity:.15;pointer-events:none}
.tools{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.tool{flex:1;min-width:100px;background:var(--ink);border:2px solid var(--line);border-radius:10px;padding:8px}
.tool:disabled{opacity:.35;cursor:not-allowed}
#say{margin-top:12px;border-left:5px solid var(--bronze);background:var(--ink);padding:12px 14px;border-radius:8px;line-height:1.7}
#say.win{border-color:var(--jade)}#say.lose{border-color:var(--red)}
.stars{font-size:2.6rem;letter-spacing:6px}
.jail{margin-top:12px;display:grid;gap:8px}
.jail div{background:var(--ink);border-radius:8px;padding:10px 12px;line-height:1.6;font-size:.95rem}
@media (max-width:480px){.opt{font-size:1.25rem}.field{height:84px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.chip{display:inline-block;min-width:2.4em;margin:2px;padding:2px 8px;border-radius:8px;font-weight:700;color:#fff}.chip.pos{background:#2b6cb0}.chip.neg{background:#d24a33}.cap{font-size:.9rem;color:#7a4a12;margin-top:4px}#vis{margin-bottom:8px}#vis:empty{display:none}</style>
</head>
<body>
<main>

<section id="s-start" class="card">
  <h1 class="serif" style="margin:0">整數王國：數之鑰的覺醒</h1>
  <h2 class="serif" id="stT" style="margin:6px 0 0;color:var(--bronze)"></h2>
  <p style="line-height:1.7" id="stD"></p>
  <div class="modes" id="modes">
    <button class="mode on" data-m="easy"><b>練兵模式</b><small>不限時，適合先熟悉規則</small></button>
    <button class="mode" data-m="real"><b>實戰模式</b><small>每波 15 秒，敵軍會逼近城牆</small></button>
    <button class="mode" data-m="hard"><b>修羅模式</b><small>每波 10 秒，數字更大、題目更刁</small></button>
  </div>
  <button class="btn" id="go">出征！</button>
</section>

<section id="s-game" class="hide">
  <div class="top">
    <span id="wave">第 1/10 波</span>
    <span class="hearts" id="hearts"></span>
    <span class="combo" id="combo"></span>
  </div>
  <div class="field"><div id="enemy">🛡️⚔️</div><div class="wall">🏯</div></div>
  <div class="timebar"><div id="bar"></div></div>
  <div style="text-align:right;font-size:.85rem;opacity:.8;margin-top:2px" id="sec"></div>
  <div class="q"><div id="vis"></div><div class="t" id="qt"></div><div class="hint hide" id="hintbox"></div></div>
  <div class="opts" id="opts"></div>
  <div class="tools">
    <button class="tool" id="t-hint">💡 提示</button>
    <button class="tool" id="t-cut">✂️ 刪去法</button>
    <button class="tool" id="t-freeze">⏳ 時間凍結</button>
  </div>
  <div id="say" class="hide"></div>
</section>

<section id="s-end" class="card hide" style="text-align:center">
  <h2 class="serif" id="e-title" style="margin:0"></h2>
  <div class="stars" id="e-stars"></div>
  <p id="e-info" style="line-height:1.8"></p>
  <div id="e-jail" class="jail" style="text-align:left"></div>
  <p style="margin-top:16px">
    <button class="btn" id="again">再戰一次</button>
    <button class="btn ghost" id="rescue">解救戰俘</button>
    <button class="btn ghost hide" id="back">返回地圖</button>
  </p>
</section>

</main>
<script src="lessons.js"></script>
<script src="game-config.js"></script>
<script src="mode-system.js"></script>
<script>
const $=s=>document.querySelector(s);
const R=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
const pick=a=>a[R(0,a.length-1)];
const sh=a=>a.map(v=>[Math.random(),v]).sort((x,y)=>x[0]-y[0]).map(x=>x[1]);
const EMB=window.parent!==window;
function log(ok){if(EMB&&!rescue)parent.postMessage({type:'wave-log',id:SID,qtype:q.type,ok:ok},'*')}
let mode='easy',qs=[],idx=0,q=null,hearts=5,combo=0,score=0,right=0,wrongs=[],lock=true,left=0,tm=0,frozenUntil=0,rescue=false,used={};
const MODES={easy:{t:0},real:{t:15},hard:{t:10}};
const SID=new URLSearchParams(location.search).get('id')||'I-1-1';
const STG={
'I-1':{t:'1-1　玉山極寒試煉',d:'寒流襲擊玉山！在數線上標定座標、分辨相反數與絕對值，撐過 10 波冰霜考驗。',en:'❄️',plan:['base','rev','dist','opp','plot','move','cmp','dist2','plot','move2']},
'I-2':{t:'番外　結界破除',d:'結界由括號與符號封印。拆括號、分配律、奇負偶正，破除 10 道結界。',en:'🔮',plan:['pl','mi','mi','dist','sign','sign','sub','mi','dist','sub']},
'I-3':{t:'1-2　中心線的拉鋸',d:'加減就是數線上的位移！看圖預判紅絲帶最後停在哪，別讓絲帶斷裂。',en:'🪢',plan:['rope','hp','opp','sub','trap','rope','mine','rev','opp','sub']},
'I-4':{t:'1-3　算籌鏡像迷宮',d:'乘以負數就是 180 度鏡像翻轉。看穿括號護盾，走出迷宮。',en:'🎋',plan:['mirror','mul','sign','pow','pow','ord','div','sign','ord','pow']},
'I-5':{t:'1-4　星際縮放之鑰',d:'用科學記號壓縮宇宙與微粒。小數點往哪移、指數是正是負，圖上看得見。',en:'☄️',plan:['sci','big','small','law','trap','big','small','law','cmp','real']}};
const SP='⁰¹²³⁴⁵⁶⁷⁸⁹',sup=n=>String(n).split('').map(c=>c=='-'?'⁻':SP[c]).join('');
const sg=n=>(n>0?'+':'')+n, H=()=>mode=='hard';
const sgn=()=>Math.random()<.5?1:-1;
function opts(c,cands,g){const s=new Set([String(c)]);for(const x of cands){if(s.size>=4)break;if(x!=null&&!s.has(String(x)))s.add(String(x))}let k=0;while(s.size<4&&k++<60)s.add(g?g():String(R(-99,99)));return sh([...s])}
const chip=n=>`<span class="chip ${n<0?'neg':'pos'}">${sg(n)}</span>`;
const chips=a=>a.map(chip).join('');
// 練兵模式「軍師拆解」的一步（mode-system.js 會一步一步出題，最後再選答案）：ok 正解、wr=[[錯的選項,為什麼錯]]、line 這一步的結論
const ST=(say,ok,wr,line,vis)=>({say,ok:String(ok),wr:wr.map(w=>[String(w[0]),w[1]]),line,vis});
const side=v=>v<0?'左邊':'右邊';
const stSide=(v,name)=>ST(`先找紅色的原點 0。${name} 在原點的左邊還是右邊？`,side(v),[[side(-v),`再看一次：${name} 在 0 的哪一邊？`]],`${name} 在原點${side(v)} → ${v<0?'負數':'正數'}`);
const stPlot=(v,name)=>[stSide(v,name),ST(`${name} 離原點幾個單位？（從 0 開始數刻度）`,Math.abs(v),[[Math.abs(v)+1,'多數了一格，要從 0 開始數。'],[Math.abs(v)-1,'少數了一格。']],`離原點 ${Math.abs(v)} 個單位`)];
const stBigRight=()=>ST('數線上，越右邊的數越___？','大',[['小','數線向右是正方向，越右邊越大。']],'越右邊越大');
// 數線：pts=[{v,t,c}] arrs=[{a,b,t,c,h}] band=[lo,hi]
function nl(lo,hi,pts,arrs,band,minor){
  const W=620,X=v=>30+(v-lo)/(hi-lo)*(W-60),sp=hi-lo,step=sp<=14?1:(()=>{const r=sp/6,p=Math.pow(10,Math.floor(Math.log10(r))),f=r/p;return p*(f<=1?1:f<=2?2:f<=5?5:10)})();
  let s=`<svg viewBox="0 0 ${W} 122" role="img" aria-label="數線圖" style="width:100%;max-width:620px"><defs><marker id="m1" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4L0 8z" fill="#d24a33"/></marker><marker id="m2" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4L0 8z" fill="#2b6cb0"/></marker></defs>`;
  if(band)s+=`<rect x="${X(band[0])}" y="62" width="${X(band[1])-X(band[0])}" height="24" fill="#43a58f" opacity=".3"/>`;
  s+=`<line x1="12" y1="74" x2="${W-12}" y2="74" stroke="#2b2416" stroke-width="3"/><path d="M${W-10} 74l-9-5v10z" fill="#2b2416"/>`;
  for(let v=Math.ceil(lo/step)*step;v<=hi;v+=step){const z=v==0,c=z?'#d24a33':'#2b2416';
    s+=`<line x1="${X(v)}" y1="66" x2="${X(v)}" y2="82" stroke="${c}" stroke-width="${z?4:2}"/><text x="${X(v)}" y="102" text-anchor="middle" font-size="14" fill="${c}" font-weight="${z?700:400}">${v}${z?'（原點）':''}</text>`}
  if(minor>1)for(let v=Math.floor(lo);v<hi;v++)for(let j=1;j<minor;j++){const u=v+j/minor;if(u<lo||u>hi)continue;s+=`<line x1="${X(u)}" y1="69" x2="${X(u)}" y2="79" stroke="#2b2416" stroke-width="1"/>`}
  (arrs||[]).forEach(a=>{const x1=X(a.a),x2=X(a.b),c=a.c||'#d24a33',h=a.h==null?-8:a.h;
    s+=`<path d="M${x1} 68Q${(x1+x2)/2} ${h} ${x2} 68" fill="none" stroke="${c}" stroke-width="3" marker-end="url(#${c=='#d24a33'?'m1':'m2'})"/><text x="${(x1+x2)/2}" y="${(68+h)/2-4}" text-anchor="middle" font-size="13" font-weight="700" fill="${c}">${a.t||''}</text>`});
  (pts||[]).forEach(p=>{s+=`<circle cx="${X(p.v)}" cy="74" r="8" fill="${p.c||'#43a58f'}" stroke="#2b2416" stroke-width="2"/><text x="${X(p.v)}" y="${p.y||120}" text-anchor="middle" font-size="15" font-weight="700" fill="${p.c||'#2b6e5e'}">${p.t}</text>`});
  return s+'</svg>'}
const rng=(...v)=>{const a=Math.min(0,...v),b=Math.max(0,...v),m=Math.max(3,Math.ceil((b-a)*.12));return[a-m,b+m]};
function shiftSVG(str,n,left){ // 小數點移動示意
  const cw=26,W=str.length*cw+40,x0=20,dot=str.indexOf('.')<0?str.length:str.indexOf('.'),
  a=x0+dot*cw, b=left?x0+cw:x0+(str.replace('.','').search(/[1-9]/)+1+(str.startsWith('0.')?1:0))*cw;
  const t=str.split('').map((c,i)=>`<text x="${x0+i*cw+cw/2}" y="62" text-anchor="middle" font-size="26" font-family="monospace" fill="#2b2416">${c}</text>`).join('');
  return `<svg viewBox="0 0 ${W} 100" style="width:100%;max-width:${W}px">${t}<path d="M${a} 30Q${(a+b)/2} 0 ${b} 30" fill="none" stroke="#d24a33" stroke-width="3" marker-end="url(#m1)"/><defs><marker id="m1" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4L0 8z" fill="#d24a33"/></marker></defs><text x="${(a+b)/2}" y="14" text-anchor="middle" font-size="13" font-weight="700" fill="#d24a33">小數點${left?'左':'右'}移 ${n} 位</text></svg>`}
function signQ(ops){ // 奇負偶正
  const m=R(3,H()?6:4),v=[];for(let i=0;i<m;i++)v.push(R(2,9)*sgn());
  const k=v.filter(x=>x<0).length,ans=k%2?'負數':'正數';
  const ex=v.map((x,i)=>(i?' '+pick(ops||['×','÷'])+' ':'')+(x<0?`(${x})`:x)).join('');
  return{text:`不必算出答案，判斷 ${ex} 的結果是正數還是負數？`,vis:`<div>${chips(v)}</div><div class="cap">負號共 <b>${k}</b> 個（${k%2?'奇數':'偶數'}個）</div>`,ans,options:sh(['正數','負數','0','無法判斷']),hint:'數一數有幾個負號：奇數個→負，偶數個→正。',explain:`共有 ${k} 個負號，${k%2?'奇數':'偶數'}個，結果為${ans}。`}}
const OLD={
'I-1':{
 base(){const c=pick([{u:'度',up:'高於基準 0 度',dn:'低於基準 0 度',k:1},{u:'公尺',up:'水位高於警戒線',dn:'水位低於警戒線',k:1},{u:'元',up:'存入',dn:'提領',k:100}]),n=R(3,H()?40:20)*c.k,l=n+(c.k>1?100:2),[lo,hi]=[-l,l];
  return{text:`${c.up} ${n} ${c.u}記為 +${n} ${c.u}，則${c.dn} ${n} ${c.u}應記為？`,vis:nl(lo,hi,[{v:n,t:'+'+n},{v:-n,t:'？',c:'#d24a33'}]),ans:`-${n} ${c.u}`,options:opts(`-${n} ${c.u}`,[`+${n} ${c.u}`,`0 ${c.u}`,`-${n*2} ${c.u}`]),hint:'相反意義的量，符號相反。',explain:`低於/提領與高於/存入方向相反，所以是 -${n} ${c.u}。`,
  steps:[ST(`「${c.up} ${n} ${c.u}」記成 <b>+${n}</b>。「${c.dn}」和它的意思是相同還是相反？`,'相反',[['相同','「高於↔低於」「存入↔提領」意思剛好相反。']],`${c.dn} 和 ${c.up} 意思相反`),ST(`意思相反，符號也要相反。+${n} 換成相反的符號是？`,`-${n}`,[[`+${n}`,'方向相反，符號也要相反。'],['0','0 是基準點，不是相反的量。']],`記為 -${n} ${c.u}`)]}},
 rev(){const n=R(3,H()?40:20);return{text:`水位高於警戒線 ${n} 公尺記為 +${n} 公尺。水位記為 -${n} 公尺，代表什麼？`,vis:nl(-n-2,n+2,[{v:0,t:'警戒線',c:'#7a4a12'},{v:-n,t:'-'+n,c:'#d24a33'}]),ans:`低於警戒線 ${n} 公尺`,options:opts(`低於警戒線 ${n} 公尺`,[`高於警戒線 ${n} 公尺`,'剛好在警戒線',`低於警戒線 ${n*2} 公尺`]),hint:'負號＝與「高於」相反的方向。',explain:`-${n} 在原點（警戒線）左邊，表示低於警戒線 ${n} 公尺。`,
  steps:[ST(`-${n} 是負數，在數線上原點（警戒線）的哪一邊？`,'左邊（比 0 小）',[['右邊（比 0 大）','負數在原點左邊。'],['剛好在原點上','只有 0 在原點上。']],`-${n} 在警戒線下方`),ST(`它離警戒線 0 有多遠？`,n,[[2*n,`數一數：從 0 到 -${n} 有幾格？`]],`離警戒線 ${n} 公尺`)]}},
 dist(){const a=-(R(2,H()?18:9)+(H()?.5:0)),l=Math.ceil(-a)+2;return{text:`數線上 A 點代表 ${a}，它與原點的距離是幾個單位長？`,vis:nl(-l,l,[{v:a,t:'A',c:'#d24a33'}],[{a:a,b:0,t:'距離',c:'#2b6cb0',h:-6}]),ans:`${-a} 個單位長`,options:opts(`${-a} 個單位長`,[`${a} 個單位長`,'0 個單位長',`${-2*a} 個單位長`]),hint:'距離不會是負的，數一數到原點幾格。',explain:`|${a}| = ${-a}，A 到原點是 ${-a} 個單位長。`,
  steps:[stSide(a,'A'),ST(`從 A（${a}）走到原點 0，要走幾個單位？`,-a,[[a,'距離是「走了幾格」，不會是負的。']],`距離 = |${a}| = ${-a}`)]}},
 opp(){const a=sgn()*(R(1,9)+(H()?.5:0)),l=Math.ceil(Math.abs(a))+2;return{text:`${a} 的相反數是？`,vis:nl(-l,l,[{v:a,t:String(a),c:'#43a58f'},{v:-a,t:'？',c:'#d24a33'}],[{a:a,b:-a,t:'對稱翻到另一邊',c:'#2b6cb0',h:-10}]),ans:String(-a),options:opts(-a,[a,-a+1,-a-1],()=>String(-a+pick([-2,2,3]))),hint:'相反數：在原點兩側，到原點一樣遠。',explain:`${a} 與 ${-a} 到原點距離相同、方向相反，相加為 0。`,
  steps:[ST(`${a} 到原點的距離是多少？`,Math.abs(a),[[-Math.abs(a),'距離不會是負的。']],`|${a}| = ${Math.abs(a)}`),ST(`相反數要翻到原點的另一邊。${a} 在原點${side(a)}，它的相反數在哪一邊？`,side(-a),[[side(a),'相反數要翻到「另一邊」。'],['原點上','只有 0 的相反數在原點上。']],`相反數在原點${side(-a)}、距離 ${Math.abs(a)}`)]}},
 plot(){const h=mode=='easy'?1:2;let v;do{v=R(-8*h,8*h)/h}while(!v);const[lo,hi]=rng(v);return{text:'圖中 P 點代表的數是多少？',vis:nl(lo,hi,[{v:v,t:'P',c:'#d24a33'}]),ans:String(v),options:opts(v,[-v,v+1,v-1],()=>String(v+pick([2,-2,.5,-.5]))),hint:'先找原點 0，再往左（負）或右（正）數格子。',explain:`P 在原點${v<0?'左':'右'}邊，代表 ${v}。`,steps:stPlot(v,'P')}},

 chain(){const B=R(2,6),C=R(2,9),q=R(2,9)*sgn();let e;if(Math.random()<.5){const b=sgn()*B,c=sgn()*C;e=ev(`${N(b*q)} / ${N(b)} * ${N(c)}`)}else{const c=sgn()*C,b=sgn()*B;e=ev(`${N(c*q)} * ${N(b)} / ${N(c)}`)}return{text:'計算 '+e.t,vis:'<div class="cap">乘除同級：由左到右</div>',ans:String(e.v),options:opts(e.v,[-e.v,e.v+q,e.v*2]),hint:'由左往右算。',explain:`結果 ${e.v}。`}},
 sign:()=>signQ(['÷'])},
'III-1-3':{
 first(){const A=R(5,20),B=R(2,9)*sgn(),C=R(2,9),D=R(3,15);return{text:`計算 ${A} + ${N(B)} × ${C} - ${D} 時，第一步應先算哪一部分？`,vis:'<div class="cap">口訣：括號優先，先乘除、後加減</div>',ans:`${N(B)} × ${C}`,options:sh([`${N(B)} × ${C}`,`${A} + ${N(B)}`,`${C} - ${D}`,`${A} + ${N(B)} × ${C}`]),hint:'乘除比加減優先。',explain:'先乘除，再加減。'}},
 ord:OLD['I-4'].ord,
 mix(){const a=R(2,9)*sgn(),b=R(2,9)*sgn(),c=R(2,6)*sgn(),e0=R(2,5)*sgn(),d=e0*R(2,6)*sgn(),e=ev(`(${a} + ${N(b)}) * ${N(c)} - ${N(d)} / ${N(e0)}`);return{text:'計算 '+e.t,vis:'<div class="cap">① 括號 ② 乘除 ③ 加減</div>',ans:String(e.v),options:opts(e.v,[-e.v,e.v+c,e.v-2]),hint:'括號→乘除→加減。',explain:`結果 ${e.v}。`}},
 abs(){const a=R(2,9)*sgn(),b=R(2,9)*sgn(),c=R(2,9)*sgn(),d=R(2,9)*sgn(),e=ev(`Math.abs(${a}) * ${N(b)} - Math.abs(${c} - ${N(d)})`,`|${a}| × ${N(b)} - |${c} - ${N(d)}|`);return{text:'計算 '+e.t,vis:'<div class="cap">絕對值也像括號：先算裡面再取絕對值</div>',ans:String(e.v),options:opts(e.v,[-e.v,e.v+2,e.v-2]),hint:'先化簡各個絕對值。',explain:`結果 ${e.v}。`}},
 brk(){const a=R(2,9)*sgn(),b=R(2,9)*sgn(),c=R(2,6)*sgn(),d=R(2,9)*sgn(),e=ev(`-(${a} - ${N(b)}) * ${N(c)} + ${N(d)}`);return{text:'計算 '+e.t,vis:'<div class="cap">外面的負號先跟括號整體相乘</div>',ans:String(e.v),options:opts(e.v,[-e.v,e.v+c,e.v-d]),hint:'先算括號內，再乘除，最後加減。',explain:`結果 ${e.v}。`}}},
'III-1-4':{
 dist:OLD['I-2'].dist,
 calc(){const a=pick([13,27,37,46,58,64,72,83]),b=100-a,s=sgn(),c=R(3,9)*sgn(),e=s*100*c;return{text:`用分配律簡算：${N(s*a)} × ${N(c)} + ${N(s*b)} × ${N(c)}`,vis:`<div class="cap">共同因數 ${N(c)}：(${N(s*a)} + ${N(s*b)}) × ${N(c)}</div>`,ans:String(e),options:opts(e,[-e,e/10,e+c]),hint:'先合併括號內的數。',explain:`(${s*a} + ${s*b}) × ${N(c)} = ${s*100} × ${N(c)} = ${e}。`}},
 near(){const n=pick([99,98,101,102,199,201]),base=Math.round(n/100)*100,k=n-base,c=R(3,9)*sgn(),o=k<0?'-':'+';return{text:`用分配律簡算 ${n} × ${N(c)}`,vis:`<div class="cap">${n} = ${base} ${o} ${Math.abs(k)}</div><div>(${base} ${o} ${Math.abs(k)}) × ${N(c)} = ${base} × ${N(c)} ${o} ${Math.abs(k)} × ${N(c)}</div>`,ans:String(n*c),options:opts(n*c,[base*c,-n*c,n*c+c]),hint:'把數拆成整百加減小數。',explain:`${n} × ${N(c)} = ${n*c}。`}},
 rev(){const a=R(2,9)*sgn(),b=R(3,15)*sgn(),c=R(3,15)*sgn(),ans=`${N(a)} × (${b} + ${N(c)})`;return{text:`逆用分配律，把 ${N(a)} × ${N(b)} + ${N(a)} × ${N(c)} 改寫成？`,vis:'<div class="cap">a×b + a×c ＝ a×(b + c)：提出共同因數</div>',ans,options:opts(ans,[`(${N(a)} + ${N(b)}) × ${N(c)}`,`${N(a)} × (${b} × ${N(c)})`,`${N(a)} × (${b} - ${N(c)})`]),hint:'找共同因數。',explain:`共同因數是 ${N(a)}。`}},
 abs(){const x=R(2,9)*sgn(),b=R(2,9)*sgn(),c=R(2,9)*sgn(),e=ev(`Math.abs(${x}) * (${b} + ${N(c)})`);return{text:'計算 '+e.t,vis:`<div class="cap">分配律：|${x}|×${N(b)} + |${x}|×${N(c)}</div>`,ans:String(e.v),options:opts(e.v,[-e.v,x*(b+c),e.v+2]),hint:'|x| 先變非負數。',explain:`結果 ${e.v}。`}},
 brk(){const a=R(2,9),b=R(2,9)*sgn(),c=R(2,9)*sgn(),e=ev(`-${a} * (-(${b}) + ${N(c)})`,`-${a} × (-(${sg(b)}) + ${N(c)})`);return{text:'計算 '+e.t,vis:`<div class="cap">先化簡 −(${sg(b)}) ＝ ${-b}，再分配</div>`,ans:String(e.v),options:opts(e.v,[-e.v,a*(b+c),e.v+a]),hint:'括號→分配律。',explain:`結果 ${e.v}。`}}},
'IV-1-1':{
 wr(){const b=pick([2,3,4,5,-2,-3,-4]),k=R(3,5),A=`${N(b)}${sup(k)}`;return{text:`把 ${Array(k).fill(N(b)).join(' × ')} 用指數簡記表示？`,vis:`<div>${chips(Array(k).fill(b))}</div><div class="cap">${k} 個 ${N(b)} 相乘：指數 ${k}；底數是負數要加括號</div>`,ans:A,options:opts(A,[`${b}${sup(k)}`,`${N(b)}${sup(k+1)}`,`${N(b)} × ${k}`,`${k}${sup(Math.abs(b))}`]),hint:'底數×次數。',explain:`${A}。`}},
 val(){const a=R(2,4),k=R(2,H()?4:3),v=R(0,2);if(v==0){const e=(-a)**k;return{text:`計算 (${-a})${sup(k)}`,vis:`<div class="cap">${Array(k).fill(N(-a)).join(' × ')}</div>`,ans:String(e),options:opts(e,[-e,-a*k,a**k+1]),hint:'括號內整個數相乘 k 次。',explain:`= ${e}。`}}
  if(v==1){const e=-(a**k);return{text:`計算 -${a}${sup(k)}`,vis:`<div class="cap">沒有括號：−(${Array(k).fill(a).join(' × ')})</div>`,ans:String(e),options:opts(e,[-e,-a*k,a**k+1]),hint:'指數只管緊鄰的數。',explain:`= ${e}。`}}
  const n=R(2,H()?99:12),e=n%2?-1:1;return{text:`計算 (-1)${sup(n)}`,vis:'<div class="cap">(−1)：奇數次方→−1；偶數次方→1</div>',ans:String(e),options:sh(['1','-1','0','-'+n]),hint:'看指數奇偶。',explain:`${n} 是${n%2?'奇':'偶'}數，結果 ${e}。`}},
 sgn(){const a=R(2,9),k=R(2,H()?99:9),v=R(0,2),t=v==0?`(-${a})${sup(k)}`:v==1?`-${a}${sup(k)}`:`-(-${a})${sup(k)}`,neg=v==0?k%2==1:v==1?true:k%2==0,ans=neg?'負數':'正數';return{text:`判斷 ${t} 是正數還是負數？`,vis:'<div class="cap">看括號護盾與指數奇偶：負底數 奇→負、偶→正</div>',ans,options:sh(['正數','負數','0','無法判斷']),hint:'先看有沒有括號，再看指數奇偶。',explain:`答案：${ans}。`}},
 pow:OLD['I-4'].pow},
'IV-1-2':{
 add(){const t=[term(),term(),term()],o=[pick(['+','-']),pick(['+','-'])],e=t[0].v+(o[0]=='+'?1:-1)*t[1].v+(o[1]=='+'?1:-1)*t[2].v;return{text:`計算 ${t[0].d} ${o[0]} ${W(t[1])} ${o[1]} ${W(t[2])}`,vis:tl(t),ans:String(e),options:opts(e,[-e,e+pick([2,4,-2]),e-t[1].v]),hint:'先把每個次方算出來。',explain:`結果 ${e}。`}},
 mul(){const a=term(),b=term(),e=a.v*b.v;return{text:`計算 ${a.d} × ${W(b)}`,vis:tl([a,b]),ans:String(e),options:opts(e,[-e,a.v+b.v,e+a.v]),hint:'先算次方再相乘。',explain:`${a.v} × ${b.v} = ${e}。`}},
 div(){let a,b,k=0;do{a=term(4);b=term(3);k++}while(!(a.v%b.v===0&&Math.abs(a.v)>=Math.abs(b.v))&&k<300);if(k>=300){a={d:'2³',v:8};b={d:'2²',v:4}}const e=a.v/b.v;return{text:`計算 ${a.d} ÷ ${W(b)}`,vis:tl([a,b]),ans:String(e),options:opts(e,[-e,e*2,a.v-b.v]),hint:'先算次方再相除。',explain:`${a.v} ÷ ${b.v} = ${e}。`}},
 mix(){const a=term(2),b=term(2),c=term(2),e=a.v+b.v*c.v;return{text:`計算 ${a.d} + ${W(b)} × ${W(c)}`,vis:tl([a,b,c]),ans:String(e),options:opts(e,[(a.v+b.v)*c.v,-e,e+2]),hint:'次方→乘除→加減。',explain:`${a.v} + ${b.v}×${c.v} = ${e}。`}},
 law:OLD['I-5'].law},
'IV-1-3':{sci:OLD['I-5'].sci,big:OLD['I-5'].big,small:OLD['I-5'].small,trap:OLD['I-5'].trap,cmp:OLD['I-5'].cmp,real:OLD['I-5'].real},
'IV-1-4':{wr:null,val:null,sgn:null,mix:null,div:null,sci:OLD['I-5'].sci,big:OLD['I-5'].big,small:OLD['I-5'].small,cmp:OLD['I-5'].cmp,trap:OLD['I-5'].trap}};
Object.assign(G['IV-1-4'],{wr:G['IV-1-1'].wr,val:G['IV-1-1'].val,sgn:G['IV-1-1'].sgn,mix:G['IV-1-2'].mix,div:G['IV-1-2'].div});
Object.assign(STG,STG2);

const PLAN=STG[SID].plan;
// ---------- 畫面 ----------
function show(id){['s-start','s-game','s-end'].forEach(s=>$('#'+s).classList.toggle('hide',s!=id))}
function drawHearts(){$('#hearts').textContent='❤️'.repeat(hearts)+'🖤'.repeat(5-hearts)}
function drawCombo(){$('#combo').textContent=combo>=2?`🔥 連擊 ×${combo}`:''}
function say(html,cls){const e=$('#say');e.className=cls||'';e.innerHTML=html}
function paint(){
  const T=MODES[mode].t;
  $('#enemy').style.left=(T?(1-left/T)*74:28)+'%';
  $('#bar').style.width=T?(left/T*100)+'%':'100%';
  $('#sec').textContent=T?Math.ceil(left)+' 秒':'不限時';
}

function start(types,isRescue){
  rescue=!!isRescue;qs=MS.begin(rescue)?[]:types.map(gen);idx=0;hearts=5;combo=0;score=0;right=0;wrongs=[];
  used={hint:0,cut:0,freeze:0};
  show('s-game');$('#enemy').textContent=STG[SID].en;drawHearts();drawCombo();next();
}
function next(){
  clearInterval(tm);
  if(MS.halt())return;
  if(MS.active()){mode=MS.prep(idx+1);if(idx>=qs.length&&hearts>0)qs.push(gen(MS.pick(PLAN)))}
  if(idx>=qs.length||hearts<=0)return finish();
  q=qs[idx++];lock=false;
  $('#wave').textContent=MS.wave(idx,qs.length,'波')+(rescue?'（解救戰俘）':'');
  // 練兵才給數線、籌碼等圖解；實戰／修羅只看算式，除非題目本身要看圖（「圖中…」「標在哪一個點」）
  const needVis=/圖|標在哪/.test(q.text);
  $('#qt').textContent=q.text;$('#vis').innerHTML=(mode==='easy'||needVis)?(q.vis||''):'';$('#enemy').textContent=STG[SID].en;
  $('#hintbox').classList.add('hide');
  say('');$('#say').classList.add('hide');
  $('#enemy').className='';
  const o=$('#opts');o.innerHTML='';
  q.options.forEach(v=>{const b=document.createElement('button');b.className='opt';b.textContent=v;b.dataset.v=v;b.onclick=()=>answer(v,b);o.appendChild(b)});
  $('#t-hint').disabled=!!used.hint;$('#t-cut').disabled=!!used.cut;
  $('#t-freeze').disabled=!!used.freeze||!MODES[mode].t;
  startTimer();
}
function startTimer(){
  const T=MODES[mode].t;left=T;frozenUntil=0;paint();if(!T)return;
  tm=setInterval(()=>{
    if(Date.now()<frozenUntil)return;
    left-=0.1;paint();
    if(left<=0){clearInterval(tm);miss(null)}
  },100);
}
function answer(v,btn){
  if(lock)return;
  if(v===q.ans){
    lock=true;clearInterval(tm);
    btn.classList.add('ok');combo++;right++;log(true);
    const gain=100+(combo-1)*20;score+=gain;drawCombo();
    $('#enemy').classList.add('dead');
    $('#say').classList.remove('hide');
    say(`⚔️ 擊退敵軍！ +${gain} 戰功`+(combo>=3?`　🔥 ${combo} 連擊！`:''),'win');
    setTimeout(next,1000);
  }else{
    btn.classList.add('bad');miss(btn);
  }
}
function miss(btn){
  if(lock)return;
  lock=true;clearInterval(tm);
  hearts=Math.max(0,hearts-((typeof mode!=='undefined'&&mode==='hard'&&window.MS&&!MS.active())?MS.stage('hardHeartLoss',2):MS.stage('normalHeartLoss',1)));combo=0;wrongs.push(q);log(false);drawHearts();drawCombo();
  document.querySelectorAll('.opt').forEach(b=>{if(b.dataset.v===q.ans)b.classList.add('ok')});
  $('#say').classList.remove('hide');
  say(`<b>${btn?'❌ 城牆受損！':'⏰ 時間到，敵軍撞上城牆！'}</b><br>🧙 軍師說：正確答案是 <b>${q.ans}</b>。${q.explain}<br><button class="btn" id="nx" style="margin-top:8px">${hearts<=0?'查看戰報':'下一波'}</button>`,'lose');
  $('#nx').onclick=next;$('#nx').focus();
}
function finish(){
  clearInterval(tm);show('s-end');
  const fail=hearts<=0,total=qs.length;
  let stars=fail?0:wrongs.length<=1?3:wrongs.length<=3?2:1;
  if(rescue){
    $('#e-title').textContent='解救戰俘行動結束';
    $('#e-stars').textContent='';
    $('#e-info').textContent=`成功救回 ${right}/${total} 位戰俘。`+(right==total?'全員歸隊！':'沒救出的，下次再來！');
  }else{
    $('#e-title').textContent=fail?'城牆倒塌了…':['','新兵','伍長','校尉'][stars]+'　凱旋！';
    $('#e-stars').textContent=fail?'💔':'⭐'.repeat(stars)+'☆'.repeat(3-stars);
    $('#e-info').textContent=`戰功 ${score}　答對 ${right}/${total}　剩餘城牆 ${hearts} 顆心`;
  }
  const j=$('#e-jail');j.innerHTML='';
  if(wrongs.length){
    const h=document.createElement('div');h.innerHTML=`<b>⛓️ 戰俘營（${wrongs.length} 題）</b>`;j.appendChild(h);
    wrongs.forEach(w=>{const d=document.createElement('div');d.innerHTML=`${w.text}<br>正解：<b>${w.ans}</b>　${w.explain}`;j.appendChild(d)});
  }
  $('#rescue').classList.toggle('hide',!wrongs.length||rescue);
  $('#back').classList.toggle('hide',!EMB);
  MS.result({sid:SID,emb:EMB,rescue:rescue,mode:mode,stars:stars,fail:fail,score:score,right:right,total:total});
}

// ---------- 事件 ----------
$('#modes').onclick=e=>{const b=e.target.closest('.mode');if(!b)return;mode=b.dataset.m;document.querySelectorAll('.mode').forEach(x=>x.classList.toggle('on',x==b))};
$('#stT').textContent=STG[SID].t;$('#stD').textContent=STG[SID].d;
$('#go').onclick=()=>start(PLAN,false);
$('#back').onclick=()=>parent.postMessage({type:'stage-exit'},'*');
$('#again').onclick=()=>show('s-start');
$('#rescue').onclick=()=>start(wrongs.map(w=>w.type),true);
$('#t-hint').onclick=()=>{if(lock||used.hint)return;used.hint=1;$('#t-hint').disabled=true;const h=$('#hintbox');h.textContent='💡 '+q.hint;h.classList.remove('hide')};
$('#t-cut').onclick=()=>{if(lock||used.cut)return;used.cut=1;$('#t-cut').disabled=true;
  sh([...document.querySelectorAll('.opt')].filter(b=>b.dataset.v!==q.ans)).slice(0,2).forEach(b=>b.classList.add('cut'))};
$('#t-freeze').onclick=()=>{if(lock||used.freeze)return;used.freeze=1;$('#t-freeze').disabled=true;frozenUntil=Date.now()+10000;
  $('#say').classList.remove('hide');say('⏳ 時間凍結 10 秒！慢慢想。')};
MS.init(MODES, SID);
</script>
