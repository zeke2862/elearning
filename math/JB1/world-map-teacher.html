<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>【教師版】國一數學戰略地圖｜韓信點兵 × 代數異世界</title>
<style>
:root{--ink:#161a2e;--ink2:#20264a;--line:#3a4270;--bronze:#d2a24c;--paper:#f1e8d2;--red:#d24a33;--jade:#43a58f;--txt:#e9e4d4}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(ellipse at top,#252c56,var(--ink) 65%);color:var(--txt);font-family:"Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;min-height:100vh}
h1,h2,h3,.serif{font-family:"Noto Serif TC","Songti TC","PMingLiU",serif}
main{max-width:860px;margin:0 auto;padding:16px 16px 60px}
button{font:inherit;cursor:pointer;color:inherit}
button:focus-visible{outline:3px solid var(--bronze);outline-offset:2px}
.hide{display:none!important}
.card{background:var(--ink2);border:2px solid var(--line);border-radius:14px;padding:16px}
.head{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.rank{font-size:2rem;color:var(--bronze);margin:0}
.grow{flex:1;min-width:200px}
.pbar{height:12px;background:var(--ink);border-radius:8px;overflow:hidden;margin:6px 0}
#rbar{height:100%;background:linear-gradient(90deg,var(--bronze),#f0cf85);width:0;transition:width .6s}
.ch{margin-top:16px}
.who{margin-top:14px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.who input{background:var(--ink);border:2px solid var(--line);border-radius:8px;padding:8px 10px;color:var(--txt);font:inherit;width:9.5em}
.who button{background:var(--ink);border:2px solid var(--bronze);border-radius:8px;padding:8px 12px}
.ch h2{margin:0;font-size:1.25rem;color:var(--bronze)}
.ch small{opacity:.75}
.nodes{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:10px}
.node{background:var(--ink);border:2px solid var(--line);border-radius:12px;padding:10px 6px;min-height:104px;text-align:center;display:flex;flex-direction:column;justify-content:center;gap:4px}
.node b{font-size:1.15rem}
.node span{font-size:.85rem;line-height:1.3}
.node:hover:not(.locked){border-color:var(--bronze);background:#2b2a3c}
.node.boss{border-color:#8a3a2c}
.node.locked{opacity:.45}
.node.done{border-color:var(--jade)}
.node.soon{border-style:dashed}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px;margin-top:10px}
.cd{background:var(--paper);color:#2b2416;border-radius:10px;padding:10px;font-size:.85rem;line-height:1.5;min-height:130px}
.cd b{font-size:1.1rem;display:block;font-family:"Noto Serif TC","Songti TC",serif}
.cd.lock{background:var(--ink);color:#8a8fb0;border:2px dashed var(--line)}
#ov{position:fixed;inset:0;background:var(--ink);z-index:50}
#fr{width:100%;height:100%;border:0}
#x{position:absolute;top:8px;right:10px;z-index:60;background:#0008;border:2px solid var(--line);border-radius:8px;padding:2px 10px}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--bronze);color:#2a1d05;padding:12px 20px;border-radius:10px;font-weight:700;z-index:130;text-align:center;max-width:90vw;line-height:1.6}
.enode{min-height:84px}
.enode.done{border-color:#c9a13b}
.rule{margin-top:12px;line-height:1.8;font-size:.92rem}
.tiny{margin-top:24px;text-align:center}
.tiny button{background:none;border:1px solid var(--line);border-radius:8px;padding:6px 14px;opacity:.7}
/* ===== 角色戰力／裝備（新增） ===== */
.hero-row{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.avatar{background:var(--ink);border:2px solid var(--bronze);border-radius:14px}
#ebar{height:100%;background:linear-gradient(90deg,var(--jade),#7be0c9);width:0;transition:width .6s}
.stat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(105px,1fr));gap:8px;margin-top:12px}
.sbox{background:var(--ink);border:2px solid var(--line);border-radius:10px;padding:8px 6px;text-align:center}
.sbox b{font-size:1.1rem;display:block}
.sbox span{font-size:.75rem;opacity:.8}
.icon-wrap{display:inline-flex;align-items:center;justify-content:center;vertical-align:middle}
.icon-wrap img{display:block;object-fit:contain;border-radius:6px}
.icon-wrap .emoji-fb{display:none;line-height:1}
.ic-eq{width:30px;height:30px}
.ic-eq img,.ic-eq .emoji-fb{width:30px;height:30px;font-size:26px}
.avatar{width:78px;height:78px;padding:0;display:flex;align-items:center;justify-content:center}
.ic-av{width:100%;height:100%}
.ic-av img,.ic-av .emoji-fb{width:100%;height:100%;font-size:2.6rem}
.cd .es{margin:6px 0;font-weight:700}
.cd .hint{font-size:.76rem;opacity:.8;margin-bottom:4px}
.cd .desc{font-size:.76rem;opacity:.85;line-height:1.5}
.q-normal{color:#5a5245}
.q-fine{color:#2f7d4f}
.q-legend{color:#2b4fc4}
.q-myth{color:#b8542c}
.avatar{cursor:pointer;position:relative}
.av-acc{position:absolute;right:-8px;bottom:-8px;font-size:1.5rem;background:var(--ink);border:2px solid var(--line);border-radius:50%;width:34px;height:34px;display:flex;align-items:center;justify-content:center;line-height:1}
.ttl{color:var(--bronze);font-weight:700}
/* ===== 🏡 大廳（玩家與休息區）===== */
.trial{position:fixed;inset:0;z-index:120;background:#0b0e22ea;display:flex;align-items:center;justify-content:center;padding:12px;overflow:auto}
.trial .tbox{width:min(96vw,720px);display:flex;flex-direction:column;gap:8px}
.trial .tt{font-weight:800;font-size:1.1rem;color:var(--bronze);text-align:center}
.trial .lb-dock,.trial .lb-gift,.trial p.tiny{display:none}
.trial .tbar{height:12px;border-radius:8px;background:#ffffff22;overflow:hidden}.trial .tbar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#ffd24a,#ff8a3d)}
.trial .tt2{text-align:center}.trial .ask{background:#1a1f3d;border:2px solid var(--bronze);border-radius:16px;padding:18px;text-align:center;max-width:420px;margin:auto}
.trial .ask .big{font-size:3rem;line-height:1.2}.trial .ask .btn{margin:4px}
.tryb{margin-left:4px}
.lobby{position:relative;width:100%;aspect-ratio:16/9;min-height:340px;border-radius:18px;overflow:hidden;border:3px solid #6b4426;box-shadow:0 6px 18px #0008;container-type:inline-size;user-select:none;
  --w1:#d9e6bd;--w2:#bcd29a;--f1:#ecb866;--f2:#c98a3e;--rail:#8a5a2b}
.lb-wall{position:absolute;left:0;right:0;top:0;height:58%;background:linear-gradient(var(--w1),var(--w2))}
.lb-wall::before,.lb-wall::after{content:'';position:absolute;top:0;bottom:0;width:7%;background:linear-gradient(90deg,#00000030,transparent),var(--rail)}
.lb-wall::before{left:0}.lb-wall::after{right:0;transform:scaleX(-1)}
.lb-rail{position:absolute;left:0;right:0;top:58%;height:3.2%;background:linear-gradient(var(--rail),#00000040),var(--rail);box-shadow:0 3px 6px #0005}
.lb-floor{position:absolute;left:0;right:0;top:61.2%;bottom:0;background:repeating-linear-gradient(90deg,#0000 0 11.2%,#0002 11.2% 11.6%),linear-gradient(var(--f1),var(--f2))}
.lb-bgimg{position:absolute;inset:0;background-size:cover;background-position:center}
.lb-d{position:absolute;transform:translateX(-50%);display:flex;align-items:flex-end;justify-content:center;filter:drop-shadow(0 4px 3px #0006);z-index:2}
.lb-d .icon-wrap,.lb-pet .icon-wrap{width:100%;height:100%}
.lb-d img,.lb-pet img{width:100%;height:100%;object-fit:contain}
.lb-d .emoji-fb,.lb-pet .emoji-fb{width:100%;height:100%;align-items:center;justify-content:center;line-height:1}
.lb-hero{position:absolute;left:30%;bottom:5%;height:56%;transform:translateX(-50%);z-index:3;cursor:pointer}
.lb-hero::after{content:'';position:absolute;left:12%;right:12%;bottom:-3%;height:7%;background:radial-gradient(ellipse,#0007,transparent 70%);z-index:-1}
/* 人物圖完整顯示（不裁切、不變形） */
.lb-hero{display:flex;align-items:flex-end;justify-content:center}
.lb-hero>img{position:relative;z-index:1;height:100%;width:auto;max-width:none;object-fit:contain;display:block;animation:lbBreath 3.2s ease-in-out infinite;transform-origin:50% 100%}
.lb-back{position:absolute;left:50%;bottom:16%;height:82%;aspect-ratio:2/1;transform:translateX(-50%);z-index:0;pointer-events:none;animation:wingFlap 3.6s ease-in-out infinite;transform-origin:50% 70%}
.lb-back.halo{height:100%;bottom:2%;aspect-ratio:1}
.lb-back.halo{bottom:auto;height:auto;width:50%;aspect-ratio:2/1;z-index:2;transform:none;margin-left:-25%;margin-top:-8.5%;animation:haloFloat 3.2s ease-in-out infinite}
.lb-back.halo .fx-img{filter:drop-shadow(0 0 10px #ffe9a0)}
.lb-back.halo .fx-halo{inset:8% 19% 26% 19%;background:none;border:.8cqw solid var(--c1);box-shadow:0 0 1.8cqw var(--c2),inset 0 0 1.2cqw var(--c2);animation:none}
@keyframes haloFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
.lb-orbit.b{z-index:0;clip-path:inset(-60% -60% 54% -60%)}
.lb-orbit.f{z-index:2;clip-path:inset(46% -60% -60% -60%)}
.lb-back .fx-svg,.lb-back .fx-img{width:100%;height:100%;display:block;object-fit:contain;filter:drop-shadow(0 3px 5px #0007)}
.fx-halo{position:absolute;inset:6% 6% 30% 6%;border-radius:50%;background:radial-gradient(circle,#0000 0 38%,var(--c1) 46%,var(--c2) 52%,#0000 72%);opacity:.8;animation:haloPulse 3s ease-in-out infinite}
@keyframes wingFlap{50%{transform:translateX(-50%) scale(1.04,.97)}}
@keyframes haloPulse{50%{opacity:.5;transform:scale(1.06)}}
.lb-feet{position:absolute;left:50%;bottom:-7%;width:140%;aspect-ratio:3.2;transform:translateX(-50%);z-index:0;pointer-events:none}
.lb-feet .fx-svg,.lb-feet .fx-img{width:100%;height:100%;display:block;object-fit:contain}
.fx-dash{animation:dashMove 6s linear infinite}@keyframes dashMove{to{stroke-dashoffset:-230}}
.lb-orbit{position:absolute;inset:0;z-index:2;pointer-events:none}
.orb-ring{position:absolute;left:50%;top:46%;width:125%;aspect-ratio:1;transform:translate(-50%,-50%) scaleY(.36)}
.orb-spin{position:absolute;inset:0;animation:orbSpin 5s linear infinite}
.orb{position:absolute;top:0;left:50%;width:7cqw;height:7cqw;animation:orbUn 5s linear infinite;animation-delay:var(--d);--sy:2.78}
.orb .icon-wrap,.orb img{width:100%;height:100%;object-fit:contain}.orb .emoji-fb{font-size:6cqw;width:100%;height:100%;align-items:center;justify-content:center;filter:drop-shadow(0 2px 3px #0008)}
@keyframes orbSpin{to{transform:rotate(360deg)}}
@keyframes orbUn{from{transform:translate(-50%,-50%) rotate(0) scaleY(2.78)}to{transform:translate(-50%,-50%) rotate(-360deg) scaleY(2.78)}}
.lb-emo2{font-size:22cqw;line-height:1}
@keyframes lbBreath{50%{transform:scaleY(1.025)}}
.lb-pet{position:absolute;left:58%;bottom:5%;width:14cqw;height:14cqw;transform:translateX(-50%);z-index:3;cursor:pointer;animation:lbHop 2.4s ease-in-out infinite}
.lb-pet .emoji-fb{font-size:11cqw}
@keyframes lbHop{0%,70%,100%{transform:translateX(-50%)}80%{transform:translateX(-50%) translateY(-8%)}90%{transform:translateX(-50%)}}
.lb-wear{position:absolute;left:calc(30% + 12cqw);bottom:58%;font-size:6cqw;line-height:1;background:#fff8e6e0;border:2px solid #b9792f;border-radius:50%;width:9cqw;height:9cqw;display:flex;align-items:center;justify-content:center;z-index:4;box-shadow:0 2px 6px #0006}
.lb-plate{position:absolute;left:2.5%;top:3%;max-width:62%;background:#1c1208c8;border:2px solid #e3b866;border-radius:12px;padding:6px 12px;font-size:clamp(12px,2.2cqw,16px);line-height:1.5;z-index:5;color:#fff6df}
.lb-plate .ttl{color:#ffd86b}
.lb-merit{position:absolute;right:2.5%;top:3%;background:#1c1208c8;border:2px solid #e3b866;border-radius:20px;padding:4px 12px;font-size:clamp(12px,2.2cqw,16px);z-index:5;color:#fff6df}
.lb-gift{position:absolute;right:2.5%;top:calc(3% + 42px);background:#d24a33;border:2px solid #ffd7c8;border-radius:14px;padding:3px 12px;font-size:clamp(11px,2cqw,14px);z-index:5;color:#fff;animation:lbPulse 1.6s infinite}
@keyframes lbPulse{50%{transform:scale(1.05)}}
.lb-say{position:absolute;left:30%;bottom:64%;transform:translateX(-50%);background:#fffaf0;color:#4a2a0c;border:3px solid #b9792f;border-radius:14px;padding:6px 12px;font-weight:700;font-size:clamp(12px,2.4cqw,16px);z-index:6;white-space:nowrap;display:none}
.lb-say.on{display:block;animation:lbPop .25s}
@keyframes lbPop{from{transform:translateX(-50%) scale(.6);opacity:0}}
.lb-dock{position:absolute;right:1.5%;top:11%;display:flex;flex-direction:column;align-items:center;gap:4px;z-index:7}
.lb-menu{display:none;flex-direction:column;align-items:center;gap:clamp(3px,.5cqw,5px)}
.lb-dock.open .lb-menu{display:flex;animation:lbMenu .22s ease-out}
@keyframes lbMenu{from{opacity:0;transform:translateY(-8px)}}
.lb-tg{position:relative;width:clamp(36px,4.9cqw,50px);height:clamp(36px,4.9cqw,50px);border-radius:50%;border:3px solid #fff3d6;background:radial-gradient(circle at 50% 30%,#fffaf0,#f4d79b);box-shadow:0 0 0 2px #b9792f,0 4px 8px #0007;color:#4a2a0c;font-weight:800;font-size:clamp(9px,1.7cqw,12px);line-height:1.1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0;cursor:pointer}
.lb-tg b{font-size:clamp(14px,2.6cqw,20px);line-height:1}
.lb-tg i{position:absolute;top:-3px;right:-3px;background:var(--red);border:2px solid #fff;border-radius:50%;width:12px;height:12px;padding:0}
.lb-dock.open .lb-tg i{display:none}
.lb-c{position:relative;width:clamp(34px,4.6cqw,48px);height:clamp(34px,4.6cqw,48px);border-radius:50%;border:2px solid #fff3d6;background:radial-gradient(circle at 50% 30%,#fffaf0,#f4d79b);box-shadow:0 0 0 2px #b9792f,0 3px 7px #0007;color:#4a2a0c;font-weight:700;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:clamp(8px,1.45cqw,11px);line-height:1.05;padding:0;cursor:pointer}
.lb-c.big{width:clamp(40px,5.3cqw,54px);height:clamp(40px,5.3cqw,54px);font-size:clamp(9px,1.6cqw,12px)}
.lb-c:hover{transform:translateX(-3px);border-color:#ffd86b}
.lb-c .ic-ui{width:clamp(16px,2.8cqw,26px);height:clamp(16px,2.8cqw,26px)}
.lb-c .big-ic .ic-ui{width:clamp(20px,3.4cqw,32px);height:clamp(20px,3.4cqw,32px)}
.ic-ui img,.ic-ui .emoji-fb{width:100%;height:100%;object-fit:contain;border-radius:0}
.ic-ui .emoji-fb{font-size:clamp(14px,2.4cqw,22px);align-items:center;justify-content:center}
.lb-c i{position:absolute;top:-2px;right:-2px;background:var(--red);color:#fff;border-radius:10px;padding:0 6px;font-style:normal;font-size:.75rem;border:2px solid #fff}
@media (max-width:640px){.lobby{aspect-ratio:4/5}.lb-hero{left:34%;height:44%}.lb-pet{left:70%;width:22cqw;height:22cqw}.lb-pet .emoji-fb{font-size:17cqw}.lb-wear{left:calc(34% + 18cqw);bottom:50%;width:12cqw;height:12cqw;font-size:8cqw}.lb-say{left:34%;bottom:56%}.lb-d{font-size:inherit}}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 4px}
.tab{background:var(--ink);border:2px solid var(--line);border-radius:12px;padding:8px 14px;font-weight:700}
.tab.on{background:var(--bronze);color:#2a1d05;border-color:var(--bronze)}
.tag-star{display:inline-block;background:var(--red);color:#fff;border-radius:8px;padding:0 6px;font-size:.75rem;margin-left:4px}
/* 護盾特效 */
.bt-shield{position:absolute;left:-6%;right:-6%;top:-4%;bottom:0;border-radius:50%;border:3px solid #8fd6ff;background:radial-gradient(circle at 35% 30%,#cdeeff66,#4aa8ff22 60%,transparent 72%);box-shadow:0 0 18px #62b8ff,inset 0 0 16px #8fd6ff88;z-index:2;pointer-events:none;display:none;animation:btShield 2s ease-in-out infinite}
.bt-shield.on{display:block}
.bt-shield i{position:absolute;right:4%;top:0;font-style:normal;background:#2a6fb8;border:2px solid #cdeeff;border-radius:12px;padding:0 6px;font-size:.8rem;color:#fff}
@keyframes btShield{50%{transform:scale(1.04);opacity:.78}}
.bt-sprite.blocked .bt-shield{animation:btBlock .5s}
@keyframes btBlock{0%{transform:scale(1);filter:brightness(1)}30%{transform:scale(1.2);filter:brightness(2.4)}100%{transform:scale(1);filter:brightness(1)}}
.shake{animation:bShake .35s}
@keyframes bShake{0%,100%{transform:translate(0)}20%{transform:translate(-5px,2px)}40%{transform:translate(5px,-2px)}60%{transform:translate(-3px,1px)}80%{transform:translate(3px,0)}}
.rkwrap{display:flex;align-items:center;gap:8px}.rkic{font-size:2rem}
.stat-grid{grid-template-columns:repeat(auto-fill,minmax(78px,1fr))!important}
.sbox{cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
.sbox .si{font-size:1.5rem;line-height:1}
.icrow{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:6px 0 12px}
.icrow .lab{font-size:1.4rem;width:34px;text-align:center}
.slot{position:relative;width:60px;height:60px;border-radius:14px;border:3px solid var(--line);background:var(--ink);display:flex;align-items:center;justify-content:center;font-size:1.7rem;padding:0}
.slot.on{border-color:var(--bronze)}
.slot i{position:absolute;right:-6px;bottom:-6px;background:var(--bronze);color:#2a1d05;border-radius:10px;padding:0 6px;font-style:normal;font-size:.7rem;font-weight:700}
.slot small{position:absolute;left:0;right:0;bottom:-18px;text-align:center;font-size:.7rem}
.eqgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:10px;margin-top:6px}
.eqs{position:relative;aspect-ratio:1;border-radius:14px;border:3px solid var(--line);background:var(--ink);display:flex;align-items:center;justify-content:center;padding:4px}
.eqs .icon-wrap{width:100%;height:100%}.eqs img{width:100%;height:100%;object-fit:contain}.eqs .emoji-fb{font-size:1.8rem;width:100%;height:100%;align-items:center;justify-content:center}
.eqs.lock{border-style:dashed;opacity:.55;filter:grayscale(1)}
.eqs.q-normal{border-color:#b9b3a3}.eqs.q-fine{border-color:#46b87a}.eqs.q-legend{border-color:#5a7dff}.eqs.q-myth{border-color:#ff8a4a;box-shadow:0 0 10px #ff8a4a88}
.eqs i{position:absolute;right:-5px;top:-7px;font-style:normal;font-size:.7rem;background:var(--bronze);color:#2a1d05;border-radius:8px;padding:0 5px;font-weight:700}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{flex:1;min-width:92px;background:var(--ink);border:2px solid var(--line);border-radius:12px;padding:8px;text-align:center;font-size:.9rem}
.chip .e{font-size:1.5rem;display:block}
.bdg{display:inline-flex;align-items:center;justify-content:center;width:42px;height:42px;font-size:1.6rem;border:2px solid var(--bronze);border-radius:50%;margin:3px;background:var(--ink)}
.popbig{font-size:3rem;text-align:center;line-height:1.2}
.mapblur{filter:blur(7px) brightness(.6);pointer-events:none}
#chsel{position:absolute;inset:0;display:flex;align-items:center;align-content:center;justify-content:center;gap:14px;flex-wrap:wrap;padding:12px;z-index:20}
.chbtn{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:170px;gap:3px;background:radial-gradient(circle at 50% 25%,#fffaf0,#f4d79b);color:#4a2a0c;border:4px solid #fff3d6;box-shadow:0 0 0 2px #b9792f,0 8px 18px #000a;border-radius:26px;padding:14px 12px;width:clamp(100px,28%,180px);font-weight:700;line-height:1.3}
.chbtn:hover{transform:translateY(-4px)}
.chbtn .no{font-size:2.4rem;line-height:1;font-family:serif}.chbtn .em{font-size:1.6rem}
.chbtn.lk{filter:grayscale(.9);opacity:.75}
.mp-bar button[data-chsel]{padding:6px 10px}
.ic-sh{width:44px;height:44px}
.ic-sh img,.ic-sh .emoji-fb{width:44px;height:44px;font-size:34px}
.ic-sh.ic-th img,.ic-sh.ic-th .emoji-fb{width:88px;height:50px;object-fit:cover;border-radius:6px;border:1px solid #fff4}

function lockCh1(ci,k){if(TEACHER)return '';const prev=k>0?CH1[ci].st[k-1][0]:ci>0?CH1[ci-1].st[CH1[ci-1].st.length-1][0]:null;return prev==null||st(prev)>0?'':`先通關 ${prev}`}

  if(TEACHER)return '';

  if(!(st(d[0])&&st(d[1])&&st(d[2])))return `先通關 ${d[0]}、${d[1]}、${d[2]}`;
  const s=b3(d[0])+b3(d[1])+b3(d[2]);
  return s>=6?'':`挑戰 Boss 需要前三關共 6 顆星（目前 ${s} 顆），回去重打拿更多星吧`;

// 第三章：每一大關內依序解鎖；下一大關需要上一大關全部完成；
// 最終 Boss 需要第三章九個試煉合計 18 顆星（滿分 27 的 2/3）
function lockCh3(ci,k){
  if(TEACHER||(ci==0&&k==0))return '';
  const g=CH3[ci];
  if(g.st.length==1){ // 最終試煉／Boss 大關
    const need=18,s=flat3.filter(id=>id!='7-3').reduce((a,id)=>a+b3(id),0);

  }
  if(k>0){const prev=g.st[k-1][0];return st(prev)>0?'':`先通關 ${prev}`;}
  const prevGroup=CH3[ci-1],allDone=prevGroup.st.every(s=>st(s[0])>0);
  return allDone?'':`先完成「${prevGroup.n.replace(/^第三章[^、]*、/,'')}」的所有試煉`;
}

/* ===== 📦 寶箱與裝備碎片 =====
   通關得 1 個寶箱（記錄當時星數）；打開時依星數對應的品質為中心抽碎片，機率不顯示。
   距離中心 0／1／2／3 階的機率 90／9／0.7／0.3（%）；同距離的機率由上下兩階平分，沒有那一階就落空 → 什麼都沒得到。
   同一品質的碎片集滿 FRAG_NEED 片，才能合成該品質的裝備（比現有品質更高才會合成）。 */
const QORD=['normal','fine','legend','myth'],FRAG_NEED=GC.chest.fragNeed,CHEST_P=GC.chest.prob;
const starTier=s=>{let t=0;GC.chest.tierMinStars.forEach((m,k)=>{if(s>=m)t=k});return t};
function qualityOf(i){ if(ITEMS[i].special)return qualityOldRule(i); return (P._eqQ&&P._eqQ[i])||null; }
function fragInit(){
  if(P._eqQ)return;
  P._eqQ={};P._frag={};P._chests=[];
  ITEMS.forEach((it,i)=>{if(!it.special){const q=qualityOldRule(i);if(q)P._eqQ[i]=q}});
  save();
}
const fragTarget=g=>ITEMS[g].special?[8,9,10][Math.floor(Math.random()*3)]:g;
function addFrag(i,t){
  P._frag=P._frag||{};const a=P._frag[i]||(P._frag[i]=[0,0,0,0]);a[t]++;
  const cur=QORD.indexOf(qualityOf(i));
  if(a[t]>=FRAG_NEED&&t>cur){a[t]-=FRAG_NEED;P._eqQ=P._eqQ||{};P._eqQ[i]=QORD[t];return {i,q:QORD[t],up:cur>=0}}
  return null;
}
function openOneChest(){
  const c=(P._chests||[]).shift();if(!c)return null;
  const c0=starTier(c.s),w=QORD.map((_,t)=>{const d=Math.abs(t-c0);return CHEST_P[d]/(d?2:1)});
  let r=Math.random()*100,t=-1;for(let k=0;k<4;k++){if(r<w[k]){t=k;break}r-=w[k]}
  const res={t,i:t<0?-1:fragTarget(c.g)};
  if(t>=0)res.synth=addFrag(res.i,t);
  dq('chest',1);save();return res;
}

function ensureRoll(i){
  P._eq=P._eq||{};
  if(P._eq[i])return;
  const it=ITEMS[i],r={};
  it.stats.forEach(([k,lo,hi])=>{r[k]=lo+Math.random()*(hi-lo);});
  P._eq[i]=r;save();
}
function effStats(i){
  const it=ITEMS[i],q=qualityOf(i);
  if(!q||it.special)return {};
  ensureRoll(i);
  const roll=P._eq[i],mul=QMUL[q]*(1+GC.equip.forgePct/100*((P._forge||{})[i]||0)),out={};
  it.stats.forEach(([k])=>{out[k]=Math.round(roll[k]*mul);});
  return out;
}

function expNeed(lv){return GC.exp.base+lv*lv*GC.exp.quad;}

  const exp=P._exp||0;let lv=1,rem=exp;

/* ===== ⚔️ 對戰基本值 =====
   基本值 ＝ 職業比例 ×（六項數值 × 等級 ＋ 裝備效果）＝ 職業比例×六項數值×等級 ＋ 職業比例×裝備效果
   六項數值：角色建立時的 HP／ATK／DEF／SPD／MATK／MDEF（含體質調整券的加成）；魔力 MP 不在六項內，維持原本算法 */
const PRO_RATIO=GC.proRatio;
const SIX={hp:'HP',atk:'ATK',def:'DEF',spd:'SPD',matk:'MATK',mdef:'MDEF'};
function totalStats(){
  const h=P._hero;if(!h||!h.stats)return totalStatsOld();
  const lv=levelInfo().level,r=PRO_RATIO[h.archetype]||{},eq={},out={};
  ITEMS.forEach((it,i)=>{const es=effStats(i);STATKEYS.forEach(k=>{if(es[k])eq[k]=(eq[k]||0)+es[k]})});
  Object.keys(SIX).forEach(k=>{out[k]=Math.max(1,Math.round((r[k]||1)*((h.stats[SIX[k]]||0)*lv+(eq[k]||0))))});
  out.mp=BASE.mp+GROWTH.mp*(lv-1)+(eq.mp||0);
  return out;
}
function totalStatsOld(){
  const li=levelInfo(),out={};
  STATKEYS.forEach(k=>out[k]=BASE[k]+GROWTH[k]*(li.level-1));
  ITEMS.forEach((it,i)=>{const es=effStats(i);STATKEYS.forEach(k=>{if(es[k])out[k]+=es[k];});});
  return out;
}

}

function applyAction0(att,def,kind,move){
  if(att.charging) kind='release';
  if(kind=='defend'){ att.defending=true; return `${att.name} 擺出防禦姿勢，防禦力 ×${GC.battle.defendMul}！`; }
  if(kind=='normal'){
    const mv=NMOVES.find(m=>m[0]==move); if(!mv) return null;
    const dmg=dealDamageLocal(att,def,att.atk*mv[2],false);
    let extra=''; if(move=='charge'){const sh=Math.round(dmg*GC.battle.chargeRecoil);att.hp-=sh;extra=`，自己也反噬 ${sh} 點血`;}
    return `${att.name} 使用「${mv[1]}」，對 ${def.name} 造成 ${dmg} 點傷害${extra}！`;
  }
  if(kind=='magic'){
    const mv=MMOVES.find(m=>m[0]==move); if(!mv) return null;

    att.mp-=mv[2];

  if(pendingChannel){ sb.removeChannel(pendingChannel); pendingChannel=null; }
  duelState={mode:'sync', battleId, room:null}; duelSub=null;
  $('#arena-setup').classList.add('hide');$('#arena-battle').classList.remove('hide');
  $('#arena-battle').innerHTML='<p>⏳ 連線中...</p>';
  loadBattleNow(battleId);
  if(battleChannel){ sb.removeChannel(battleChannel); battleChannel=null; }
  oppAbsentSince=null; proxyBusy=false;
  battleChannel = sb.channel('battle-'+battleId,{config:{presence:{key:mySid()}}})
    .on('postgres_changes',{event:'UPDATE',schema:'public',table:'duel_battles',filter:'id=eq.'+battleId}, payload=>{
      if(!duelState||duelState.battleId!==battleId) return;
      duelState.room=payload.new; renderSyncBattle();
    })
    .on('presence',{event:'sync'},()=>{ watchTick(); })
    .subscribe(status=>{
      if(status==='SUBSCRIBED'){
        // 告訴對方「我在線上」；斷線重連時也會重新進來這裡，順便抓一次最新戰況
        battleChannel.track({sid:mySid(),t:Date.now()});
        loadBattleNow(battleId);
      }
    });
  startWatchdog();
}
async function loadBattleNow(battleId){
  const {data:room}=await sb.from('duel_battles').select('*').eq('id',battleId).maybeSingle();
  if(!duelState||duelState.battleId!==battleId) return;
  if(!room){ removeStage(); $('#arena-battle').classList.remove('hide'); $('#arena-battle').innerHTML='<p>⚠️ 對戰資料不見了。</p><button class="btn" id="b-close">返回</button>'; $('#b-close').onclick=exitBattle; return; }
  duelState.room=room; renderSyncBattle();
}
function mySideOf(room){ const sid=mySid(); return room.a_id===sid?'a':(room.b_id===sid?'b':null); }
async function sendSyncAction(kind,move){
  const room=duelState.room, mine=mySideOf(room), other=mine=='a'?'b':'a';
  if(!room||room.turn!==mine) return;
  const att={...room[mine]}, def={...room[other]};
  if(kind=='item'&&!consumeItem(move)){toast('沒有這個道具了');duelSub=null;renderSyncBattle();return;}
  const logLine=applyAction(att,def,kind,move);
  duelSub=null;
  if(logLine===null){ toast('魔力不夠喔'); renderSyncBattle(); return; }
  const log=[...(room.log||[]).slice(-40),logLine];
  const over=att.hp<=0||def.hp<=0;
  const winner=over?((att.hp<=0&&def.hp<=0)?'draw':(att.hp<=0?def.name:att.name)):null;
  const patch={turn:over?room.turn:nextSide(mine=='a'?att:def,mine=='a'?def:att), log, over, winner, updated_at:new Date().toISOString()};
  patch[mine]=att; patch[other]=def;
  const {data:upd,error:upErr}=await sb.from('duel_battles').update(patch).eq('id',duelState.battleId).eq('turn',mine).eq('over',false).select('id');
  if(upErr||!upd||!upd.length){
    toast('⚠️ 戰況已經更新（可能剛剛被系統代打），正在同步最新畫面…');
    if(duelState) loadBattleNow(duelState.battleId);
    return;
  }
  if(over){
    const myId=mine=='a'?room.a_id:room.b_id, opId=mine=='a'?room.b_id:room.a_id;
    if(winner=='draw'){bumpDuelRecord(myId,'draws');bumpDuelRecord(opId,'draws');}
    else if(winner==att.name){bumpDuelRecord(myId,'wins');bumpDuelRecord(opId,'losses');}
    else{bumpDuelRecord(myId,'losses');bumpDuelRecord(opId,'wins');}
  }
  // Realtime 訊息偶爾會晚一點才到，先自己手動更新一次畫面，操作起來比較不卡頓
  duelState.room={...room,...patch};
  renderSyncBattle();
}

// ---- 模式二：單挑雲端幽靈（對方不用在線，抓他存在雲端的最新數值，由簡單 AI 操作）----
async function challengeAsync(osid){
  const sid=mySid(), li=levelInfo();
  const {data:opUser,error:opErr}=await sb.from('duel_users').select('*').eq('student_number',osid).maybeSingle();
  if(opErr){console.warn('查詢對手失敗',opErr);return toast('❗ 連線雲端失敗（'+(opErr.message||opErr.code||'未知錯誤')+'），請聯絡老師');}
  if(!opUser)return toast('❗ 找不到這位同學的資料，請他先打開遊戲、存過學號');
  const a=withRevive(mkFighterObj(sid,(P._who&&P._who.name)||sid,li.level,statsWithRank()));
  const b=mkFighterObj(osid,opUser.name||osid,opUser.level||1,opUser.stats||{hp:1000,mp:300,atk:50,matk:50,def:20,mdef:20,spd:100});
  const turn=nextSide(a,b);
  duelState={mode:'async', aId:sid, bId:osid, room:{a,b,turn,over:false,winner:null,log:[`⚔️ ${a.name} 挑戰了 ${b.name} 的雲端幽靈！`]}};
  duelSub=null;
  $('#arena-setup').classList.add('hide');$('#arena-battle').classList.remove('hide');
  renderAsyncBattle();
  if(duelState.room.turn=='b') setTimeout(aiTakeTurn,700);
}
function checkAsyncOver(){
  const room=duelState.room;
  if(room.a.hp<=0||room.b.hp<=0){
    room.over=true;
    room.winner=(room.a.hp<=0&&room.b.hp<=0)?'draw':(room.a.hp<=0?room.b.name:room.a.name);
    const myId=duelState.aId, opId=duelState.bId;
    if(room.winner=='draw'){bumpDuelRecord(myId,'draws');bumpDuelRecord(opId,'draws');}
    else if(room.winner==room.a.name){bumpDuelRecord(myId,'wins');bumpDuelRecord(opId,'losses');}
    else{bumpDuelRecord(myId,'losses');bumpDuelRecord(opId,'wins');}
  }
}
function sendAsyncAction(kind,move){
  const room=duelState.room; if(room.turn!='a')return;
  if(kind=='item'&&!consumeItem(move)){toast('沒有這個道具了');duelSub=null;renderAsyncBattle();return;}
  const logLine=applyAction(room.a,room.b,kind,move);
  duelSub=null;
  if(logLine===null){ toast('魔力不夠喔'); renderAsyncBattle(); return; }
  room.log=[...(room.log||[]).slice(-40),logLine];
  checkAsyncOver();
  if(!room.over){ room.turn=nextSide(room.a,room.b); renderAsyncBattle(); if(room.turn=='b')setTimeout(aiTakeTurn,700); }
  else renderAsyncBattle();
}
// 幽靈 AI：血量偏低時比較不會用會自傷的「衝撞」，魔力夠時有機會放魔法，其餘時候普通攻擊
function aiPickAction(att){
  let kind,move;
  const ready=(att.skills||[]).filter(x=>skillLeft(att,x)>0);
  if(!att.charging&&ready.length&&Math.random()<GC.skill.aiSkillProb)return {kind:'skill',move:ready[Math.floor(Math.random()*ready.length)].c};
  if(att.charging){ kind='release'; }
  else{
    const roll=Math.random();
    if(att.mp>=30 && roll<0.35){ kind='magic'; move= att.mp>=90&&roll<0.1 ? 'l' : (att.mp>=45&&roll<0.22 ? 'm' : 's'); }
    else if(roll<0.15){ kind='defend'; }
    else{
      kind='normal';
      const safe=att.hp>att.hpMax*0.3;
      const pool= safe? ['fist','kick','charge','slash','slash'] : ['fist','kick','slash','slash'];
      move=pool[Math.floor(Math.random()*pool.length)];
    }
  }
  return {kind,move};
}
function aiTakeTurn(){
  const room=duelState.room; if(!room||room.over||room.turn!='b')return;
  const att=room.b;
  const {kind,move}=aiPickAction(att);
  const logLine=applyAction(att,room.a,kind,move);
  room.log=[...(room.log||[]).slice(-40),logLine];
  checkAsyncOver();
  if(!room.over) room.turn=nextSide(room.a,room.b);
  renderAsyncBattle();
  if(!room.over&&room.turn=='b') setTimeout(aiTakeTurn,700);
}

// ---- 🔌 斷線處理：對手離線時「系統代打」，離線太久就判定認輸 ----
// 想調整時間，只要改這兩個數字（單位：毫秒）
const PROXY_GRACE_MS = 8000;    // 對方離線超過幾秒，就開始由系統代打
const FORFEIT_MS     = 90000;   // 對方離線超過幾秒還沒回來，就判定他認輸
const RESUME_WINDOW_MS = 300000; // 重新開啟遊戲時，只會回到 5 分鐘內還沒結束的對戰
let oppAbsentSince=null, proxyBusy=false, watchdog=null, bannerWasProxy=false;

function startWatchdog(){ stopWatchdog(); watchdog=setInterval(watchTick,1000); }
function stopWatchdog(){ if(watchdog){clearInterval(watchdog);watchdog=null;} oppAbsentSince=null; bannerWasProxy=false; }

function opponentInfo(room){
  const mine=mySideOf(room); if(!mine) return null;
  const other=mine=='a'?'b':'a';
  return {mine, other, opId: other=='a'?room.a_id:room.b_id};
}
function watchTick(){
  if(!duelState||duelState.mode!=='sync'||!battleChannel) return;
  const room=duelState.room; if(!room||!room.b||room.over) return;
  const info=opponentInfo(room); if(!info) return;
  const st=battleChannel.presenceState()||{};
  // 自己都還沒連上線時，不能判斷對方有沒有離線（避免自己斷網卻誤判對方）
  if(!st[mySid()]){ oppAbsentSince=null; updateOppBanner(); return; }
  if(st[info.opId]){
    if(oppAbsentSince!==null && (Date.now()-oppAbsentSince)>=PROXY_GRACE_MS){ toast('✅ 對方回來了，改回手動操作！'); }
    oppAbsentSince=null; updateOppBanner(); return;
  }
  if(oppAbsentSince===null) oppAbsentSince=Date.now();
  const gone=Date.now()-oppAbsentSince;
  updateOppBanner();
  if(gone>=FORFEIT_MS){ claimForfeit(); return; }
  if(gone>=PROXY_GRACE_MS && room.turn===info.other){ proxyAct(); }
}
function updateOppBanner(){
  const el=$('#opp-banner'); if(!el) return;
  if(oppAbsentSince===null||!duelState||duelState.mode!=='sync'){ el.classList.add('hide'); return; }
  const gone=Date.now()-oppAbsentSince;
  if(gone<3000){ el.classList.add('hide'); return; }
  const sec=Math.floor(gone/1000), left=Math.max(0,Math.ceil((FORFEIT_MS-gone)/1000));
  el.classList.remove('hide');
  el.innerHTML = gone>=PROXY_GRACE_MS
    ? `🤖 對方已離線 ${sec} 秒，<b>系統代打中</b>。他回來就會改回手動；${left} 秒內沒回來將判定認輸。`
    : `📡 對方連線中斷…（${sec} 秒）再等一下看看`;
}
// 系統代打：由「還在線上的這一方」替離線方出招，用跟幽靈 AI 同一套邏輯
async function proxyAct(){
  if(proxyBusy) return; proxyBusy=true;
  try{
    await new Promise(r=>setTimeout(r,900));   // 稍微停一下，看起來比較自然
    if(!duelState||duelState.mode!=='sync') return;
    const room=duelState.room; if(!room||!room.b||room.over) return;
    const info=opponentInfo(room); if(!info||room.turn!==info.other) return;
    if(oppAbsentSince===null) return;           // 這一秒對方剛好回來了，取消代打
    const {mine,other}=info;
    const att={...room[other]}, def={...room[mine]};
    const pick=aiPickAction(att);
    let line=applyAction(att,def,pick.kind,pick.move);
    if(line===null) line=applyAction(att,def,'normal','slash');
    line='🤖 系統代打｜'+line;
    const over=att.hp<=0||def.hp<=0;
    const draw=att.hp<=0&&def.hp<=0;
    const winner=over?(draw?'draw':(att.hp<=0?def.name:att.name)):null;
    const patch={turn:over?room.turn:nextSide(other=='a'?att:def,other=='a'?def:att), log:[...(room.log||[]).slice(-40),line], over, winner, updated_at:new Date().toISOString()};
    patch[other]=att; patch[mine]=def;
    // 只有「現在還是對方回合」才寫入，萬一對方剛好回來自己出招了，這次代打就會自動作廢
    const {data:upd,error}=await sb.from('duel_battles').update(patch).eq('id',duelState.battleId).eq('turn',other).eq('over',false).select('id');
    if(error||!upd||!upd.length){ loadBattleNow(duelState.battleId); return; }
    if(over){
      if(draw){bumpDuelRecord(room[mine].studentId||mySid(),'draws');bumpDuelRecord(info.opId,'draws');}
      else if(att.hp<=0){bumpDuelRecord(mySid(),'wins');bumpDuelRecord(info.opId,'losses');}
      else{bumpDuelRecord(mySid(),'losses');bumpDuelRecord(info.opId,'wins');}
    }
    duelState.room={...room,...patch}; renderSyncBattle();
  }catch(e){ console.warn('系統代打失敗',e); }
  finally{ proxyBusy=false; }
}
// 對方離線太久：判定他認輸，由還在線上的這一方寫入結果（只會寫一次）
async function claimForfeit(){
  if(proxyBusy) return; proxyBusy=true;
  try{
    const room=duelState&&duelState.room; if(!room||!room.b||room.over) return;
    const info=opponentInfo(room); if(!info) return;
    const {mine,other}=info;
    const patch={over:true, winner:room[mine].name,
      log:[...(room.log||[]).slice(-40),`🏳️ ${room[other].name} 離線超過 ${Math.round(FORFEIT_MS/1000)} 秒，判定認輸！`],
      updated_at:new Date().toISOString()};
    const {data:upd,error}=await sb.from('duel_battles').update(patch).eq('id',duelState.battleId).eq('over',false).select('id');
    if(error||!upd||!upd.length){ loadBattleNow(duelState.battleId); return; }
    bumpDuelRecord(mySid(),'wins'); bumpDuelRecord(info.opId,'losses');
    duelState.room={...room,...patch}; renderSyncBattle();
  }catch(e){ console.warn('認輸判定失敗',e); }
  finally{ proxyBusy=false; }
}
// 重新整理／重開遊戲後，自動回到還沒打完的即時對戰（變回手動操作）
async function checkResumeBattle(sid){
  if(duelState) return false;
  try{
    const since=new Date(Date.now()-RESUME_WINDOW_MS).toISOString();
    const {data,error}=await sb.from('duel_battles').select('id,b')
      .eq('mode','sync').eq('over',false).or('a_id.eq.'+sid+',b_id.eq.'+sid).gte('updated_at',since)
      .order('updated_at',{ascending:false}).limit(1);
    if(error||!data||!data.length||!data[0].b) return false;
    toast('⚔️ 偵測到還沒打完的對戰，已帶你回到戰場！');
    enterSyncBattle(data[0].id);
    return true;
  }catch(e){ console.warn('回到對戰失敗',e); return false; }
}

function bindMenuEvents(box,myTurn,sendFn){
  if(!myTurn)return;
  box.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{const m=b.dataset.m;if(m=='d'){sendFn('defend');}else{duelSub=m;renderBattleAgain();}});
  box.querySelectorAll('[data-back]').forEach(b=>b.onclick=()=>{duelSub=null;renderBattleAgain();});
  box.querySelectorAll('[data-sk]').forEach(b=>b.onclick=()=>sendFn('skill',b.dataset.sk));
  box.querySelectorAll('[data-it]').forEach(b=>b.onclick=()=>sendFn('item',b.dataset.it));
  box.querySelectorAll('[data-n]').forEach(b=>b.onclick=()=>sendFn('normal',b.dataset.n));
  box.querySelectorAll('[data-mg]').forEach(b=>b.onclick=()=>sendFn('magic',b.dataset.mg));
  const pass=box.querySelector('#b-pass'); if(pass) pass.onclick=()=>sendFn('release');
}
function renderBattleAgain(){ if(!duelState)return; duelState.mode=='sync'?renderSyncBattle():renderAsyncBattle(); }
function resultPanelHTML(room){
  return `<div class="turn-tag">🏆 ${room.winner=='draw'?'平手！':room.winner+' 獲勝！'}</div><p>想變更強嗎？回去多答題累積經驗值就能升級，通關大關累積星星還能升級裝備品質喔！</p><button class="btn" id="b-close">結束對戰</button>`;

function logHTML(room){ return `<div class="blog">${(room.log||[]).slice(-6).map(x=>'· '+x).join('<br>')}</div>`; }
function renderSyncBattle(){
  const room=duelState.room, box=$('#arena-battle');
  if(!room.b){ box.innerHTML='<p>⏳ 等待對方加入戰場...</p>'; return; }
  const mine=mySideOf(room)||'a', myTurn=room.turn===mine, meFighter=room[mine];

    `<div id="opp-banner" class="hide" style="margin:6px 0;padding:6px 10px;border-radius:8px;background:#5a3a12;font-size:.85rem"></div>`+
    `<div class="turn-tag">${myTurn?'👉 輪到你了！':'⏳ 等待對方出招...'}</div>`+renderMenu(meFighter,myTurn)+logHTML(room);

function renderAsyncBattle(){
  const room=duelState.room, myTurn=room.turn=='a';
  const panel = room.over ? resultPanelHTML(room) :
    `<div class="turn-tag">${myTurn?'👉 輪到你了！':'⏳ 幽靈思考中...'}</div>`+renderMenu(room.a,myTurn)+logHTML(room);

}

function ensureStage(room,mineSide){

function btFly(fromEl,toEl,icon,cb){

}
// 比對「上一個畫面」和「現在」，看是誰出了什麼招，播放對應動畫
function playBattleEvent(snap,room){
  const atkSide=snap.turn; if(atkSide!=='a'&&atkSide!=='b') return;
  const defSide=atkSide=='a'?'b':'a';
  const spOf=side=>$('#bt-sp-'+(side===stageMine?'bot':'top'));
  const atkSp=spOf(atkSide), defSp=spOf(defSide); if(!atkSp||!defSp) return;
  const clOf=side=>$('#bt-cl-'+(side===stageMine?'bot':'top'));
  const atkCl=clOf(atkSide), defCl=clOf(defSide);
  const line=(room.log||[]).slice(-1)[0]||'';
  const dDef=snap[defSide+'hp']-room[defSide].hp, dAtk=snap[atkSide+'hp']-room[atkSide].hp;
  if(/防禦姿勢/.test(line)){ btBurst(atkSp,'🛡️'); return; }
  if(/張開了護盾/.test(line)){ btBurst(atkSp,'🛡️'); btFloat(atkSp,'護盾展開！','#8fd6ff'); return; }
  if(/護盾擋下了攻擊/.test(line)&&dDef<=0){
    btLunge(atkSp,defSp); if(atkCl) btLunge(atkCl,defSp);
    setTimeout(()=>{ btAnim(defSp,'blocked',520); btFloat(defSp,'擋下！','#8fd6ff'); btBurst(defSp,'🛡️'); const bx=$('#arena-battle'); if(bx) btAnim(bx,'shake',360); },280);
    return; }
  if(/詠唱/.test(line)){ btAnim(atkSp,'cast',700); if(atkCl) btAnim(atkCl,'cast',700); btBurst(atkSp,'🔮'); return; }
  if(dDef<=0&&dAtk<=0) return;                      // 認輸、加入戰場等沒有出招的訊息，不播動畫
  const magic=/魔法/.test(line);
  const icon = magic ? (/大魔法/.test(line)?'☄️':/中魔法/.test(line)?'🔥':'✨')
             : (/「拳」/.test(line)?'👊':/「腳」/.test(line)?'🦶':/衝撞/.test(line)?'💥':'🗡️');
  const hit=()=>{
    if(dDef>0){ btAnim(defSp.querySelector('.bt-img'),'hurt',600); if(defCl) btAnim(defCl.querySelector('.bt-img'),'hurt',600); btFloat(defSp,'-'+dDef,magic?'#9ad0ff':'#ff6b6b'); btBurst(defSp,icon); }
    if(dAtk>0){ btAnim(atkSp.querySelector('.bt-img'),'hurt',600); if(atkCl) btAnim(atkCl.querySelector('.bt-img'),'hurt',600); btFloat(atkSp,'-'+dAtk,'#ffb35a'); }
  };
  if(magic){ btAnim(atkSp,'cast',700); if(atkCl) btAnim(atkCl,'cast',700); btFly(atkSp,defSp,icon,hit); }
  else{ btLunge(atkSp,defSp); if(atkCl) btLunge(atkCl,defSp); setTimeout(hit,280); }
}
function renderScene(room,mineSide,panelHTML,bindFn){
  const stage=ensureStage(room,mineSide);
  const top=mineSide=='a'?'b':'a';
  const key=stageKey(room);
  const acted = stageSnap && stageSnap.key!==key;
  if(acted) playBattleEvent(stageSnap,room);
  fillCard($('#bt-card-top'),room[top]); fillCard($('#bt-card-bot'),room[mineSide]);
  // 持續性的狀態：防禦、蓄力、倒下、獲勝
  const spTop=$('#bt-sp-top'), spBot=$('#bt-sp-bot');
  [[spTop,room[top],top,$('#bt-cl-top')],[spBot,room[mineSide],mineSide,$('#bt-cl-bot')]].forEach(([sp,f,side,cl])=>{
    const els=cl?[sp,cl]:[sp];
    els.forEach(e=>{ e.classList.toggle('defending',!!f.defending&&!room.over); e.classList.toggle('charging',!!f.charging&&!room.over); });
    let sh=sp.querySelector('.bt-shield');if(!sh){sh=document.createElement('div');sh.className='bt-shield';sp.appendChild(sh)}
    const sn=f.shield|0;sh.classList.toggle('on',sn>0&&!room.over);sh.innerHTML=sn>0?`<i>×${sn}</i>`:'';
    const dead=f.hp<=0, other=room[side=='a'?'b':'a'];
    const won=room.over&&room.winner!=='draw'&&!dead&&(other.hp<=0||room.winner===f.name);
    setTimeout(()=>{ els.forEach(e=>{ e.classList.toggle('ko',dead); e.classList.toggle('win',!!won); }); }, acted?650:0);
  });
  // 中間的大字幕：顯示最新一行戰況
  const cap=$('#bt-cap'), line=(room.log||[]).slice(-1)[0]||'';
  if(cap.textContent!==line){ cap.textContent=line; btAnim(cap,'pop',400); }
  const panel=$('#bt-panel'); panel.innerHTML=panelHTML; bindFn&&bindFn(panel);
  stageSnap={key,turn:room.turn,ahp:room.a.hp,bhp:room.b.hp};
}

  if(x.fx.exp){bagAdd(x.id,-1);P._exp=(P._exp||0)+x.fx.exp;save();toast(`📘 經驗值 +${x.fx.exp}`);renderHero();return bagBuild()}
  if(x.fx.body){if(!P._hero)return toast('請先建立角色');const ks=['HP','ATK','DEF','SPD','MATK','MDEF'];
    return pick('🧬 要調整哪一項天生體質？',ks.map(k=>`${k}　目前 ${P._hero.stats[k]} → ${P._hero.stats[k]+1}`),i=>{if(!consumeItem(x.id))return;P._hero.stats[ks[i]]+=1;save();toast(`🧬 ${ks[i]} +1`);render()})}
  const eq=ownedEq();if(!eq.length)return toast('你還沒有裝備，先去闖關合成裝備吧！');
  if(x.fx.forge)return pick('🔨 要鍛造哪一件裝備？',eq.map(i=>`${ITEMS[i].icon} ${ITEMS[i].name}（${QLABEL[qualityOf(i)]}）　鍛造 +${(P._forge||{})[i]||0}${((P._forge||{})[i]||0)>=GC.equip.forgeMax?'（已滿）':''}`),k=>{const i=eq[k];P._forge=P._forge||{};
    if((P._forge[i]||0)>=GC.equip.forgeMax)return toast('這件裝備已經鍛造到最高等級了');if(!consumeItem(x.id))return;P._forge[i]=(P._forge[i]||0)+1;save();
    forgeAnim({icon:ITEMS[i].icon,name:`${ITEMS[i].name} +${P._forge[i]}`,q:QLABEL[qualityOf(i)],up:true});render()});
  if(x.fx.reroll)return pick('💎 要洗鍊哪一件裝備？（結果隨機）',eq.map(i=>`${ITEMS[i].icon} ${ITEMS[i].name}（${QLABEL[qualityOf(i)]}）`),k=>{const i=eq[k];if(!consumeItem(x.id))return;
    delete P._eq[i];ensureRoll(i);const es=effStats(i);toast(`💎 ${ITEMS[i].name} 洗鍊完成：`+Object.entries(es).map(([a,v])=>a+' '+v).join('、'));render()})};
/* ===== 🪪 改名卡 ===== */
function renameDialog(x){
  const cur=(P._hero&&P._hero.name)||(P._who&&P._who.name)||'';
  $('#gp').innerHTML=`<div class="card"><h2 class="serif" style="margin:0 0 8px;color:var(--bronze)">🪪 使用改名卡</h2><p>目前的名字：<b>${cur||'（還沒取名）'}</b><br><small>最多 ${SR.nameMaxLen} 個字，不能使用不雅字眼。名字會用在對戰與排行榜，不會改變你的能力值。</small></p><input id="rn-in" maxlength="${SR.nameMaxLen}" style="width:100%;padding:8px;font:inherit;border-radius:8px;border:2px solid var(--line);background:var(--ink);color:inherit" placeholder="輸入新名字"><div style="text-align:center;margin-top:10px"><button id="rn-ok" class="btn">確定改名</button> <button id="gp-x" class="btn">取消</button></div></div>`;
  $('#gp').classList.remove('hide');
  $('#rn-ok').onclick=()=>{
    const v=$('#rn-in').value.trim();
    if(!v)return toast('請輸入新名字');
    if(v.length>SR.nameMaxLen)return toast(`名字最多 ${SR.nameMaxLen} 個字`);
    const low=v.toLowerCase();if(SR.badWords.some(w=>w&&low.includes(String(w).toLowerCase())))return toast('這個名字有不適合的字眼，換一個吧！');
    if(v===cur)return toast('跟原本的名字一樣喔');
    if(!consumeItem(x.id))return toast('沒有改名卡了');
    if(P._hero)P._hero.name=v;P._who=P._who||{};P._who.name=v;save();
    try{fillWho()}catch(e){}
    $('#gp').classList.add('hide');toast(`🪪 改名成功！新名字：<b>${v}</b>`);try{syncMyUser()}catch(e){}render();bagBuild()};
}
/* ===== 🔮 招式研發：抽到後與「同類型」現有招式交換 ===== */
function skillText(x){return `<b>${x.name}</b>・${x.rarity}　威力 ×${x.multiplier}${x.selfSpeedPenalty?`　自身速度 −${x.selfSpeedPenalty}`:''}${x.targetSpeedPenalty?`　對方速度 −${x.targetSpeedPenalty}`:''}`}
function offerSkill(sk){
  const h=P._hero,cur=(h.skills||[]).find(x=>x.category===sk.category),box=$('#gp');
  const done=(swap)=>{if(swap){h.skills=(h.skills||[]).filter(x=>x.category!==sk.category).concat(sk);toast(`🔮 已換上「${sk.name}」`)}else toast('🔮 保留原本的招式');P._pendSkill=null;save();box.classList.add('hide');render()};
  if(!cur)return done(true);
  box.innerHTML=`<div class="card"><h2 class="serif" style="margin:0 0 6px;color:var(--bronze)">🔮 研發出新的${CATL[sk.category]}招式！</h2><small>${CATL[sk.category]}招式只能和${CATL[sk.category]}招式交換。</small>
  <div class="fighter" style="margin:8px 0"><b>目前：</b>${skillText(cur)}</div><div class="fighter" style="margin:8px 0"><b>新的：</b>${skillText(sk)}</div>
  <div style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap"><button class="btn" id="sk-swap">換上新招式</button><button class="btn" id="sk-keep">保留現在的</button></div></div>`;
  box.classList.remove('hide');$('#sk-swap').onclick=()=>done(true);$('#sk-keep').onclick=()=>done(false);
}
/* ===== 🎲 第一次登入：建立角色（依 math_hero_engine） ===== */
function maybeCreate(){if(P._hero)return;const box=$('#create');box.classList.remove('hide');
  box.innerHTML=`<div class="card"><h2 class="serif" style="margin:0;color:var(--bronze)">🧙 建立你的勇者</h2>
  <div>請輸入角色名（英文名會自動計算字母值；中文名請填姓名總筆劃）</div>
  <div style="margin:6px 0;color:var(--bronze);font-weight:700">⚠️ 第一次取名免費，取好之後<u>無法自己修改</u>，想改名要在商店買「改名卡」。請想清楚再按喔！</div>
  <input id="cr-name" placeholder="角色名" maxlength="20"><input id="cr-str" class="hide" type="number" min="1" placeholder="姓名總筆劃（中文名必填）">
  <div id="cr-msg" style="color:#ff9a8a"></div><button id="cr-go">🎲 擲骰子並建立角色</button></div>`;
  $('#cr-name').oninput=e=>$('#cr-str').classList.toggle('hide',!/[^\x00-\x7F]/.test(e.target.value));
  $('#cr-go').onclick=()=>{try{const h=MathHeroEngine.createCharacter({name:$('#cr-name').value,chineseStrokeTotal:$('#cr-str').value});
    P._hero=h;P._who=P._who||{};P._who.name=h.name;save();fillWho();
    box.innerHTML=`<div class="card"><h2 class="serif" style="margin:0;color:var(--bronze)">✨ ${h.name}，你是「${h.archetype}」！</h2>
    <div>骰子：${h.dice.die1}＋${h.dice.die2}＝${h.dice.sum}　（${h.nameValue.method} ${h.nameValue.total}，餘數 ${h.remainder}）</div>
    <div class="stat-grid">${['HP','ATK','DEF','SPD','MATK','MDEF'].map(k=>`<div class="sbox"><b>${h.stats[k]}</b><span>${k}</span></div>`).join('')}</div>
    <button id="cr-ok">⚔️ 出發冒險！</button></div>`;
    $('#cr-ok').onclick=()=>{box.classList.add('hide');box.innerHTML='';render();checkGifts()}}catch(err){$('#cr-msg').textContent=err.message}}}
(()=>{const mb=$('#mutebtn'),mu=()=>{try{return localStorage.getItem('ms-mute')==='1'}catch(e){return false}};mb.textContent=mu()?'🔇':'🔊';
  mb.onclick=()=>{try{localStorage.setItem('ms-mute',mu()?'0':'1')}catch(e){}mb.textContent=mu()?'🔇':'🔊'}})();

/* ===== 🎁 老師發放的獎勵 =====
   老師在 config-editor.html 的「獎勵發放」建立禮物 → 下載 game-config.js 覆蓋 → 學生下次進遊戲就會自動收到。
   每份禮物有唯一代號（id），領過的代號記在 P._giftsGot，同一份禮物同一台裝置不會重複領。
   對象：全校 / 指定班級（比對「我的資料」的班級）/ 指定學號（比對「我的資料」的學號）。 */
const giftEsc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function giftMatch(g){
  if(!g||!g.id||g.on===false)return false;
  const now=Date.now();
  if(g.from&&Date.parse(g.from+'T00:00:00+07:00')>now)return false;
  if(g.until&&Date.parse(g.until+'T23:59:59+07:00')<now)return false;
  const to=g.to||{mode:'all'},w=P._who||{},cls=String(w.cls||'').trim(),sid=String(w.sid||'').trim();
  const list=(to.list||[]).map(x=>String(x).trim()).filter(Boolean);
  if(to.mode==='cls')return !!cls&&list.includes(cls);
  if(to.mode==='sid')return !!sid&&list.includes(sid);
  return true;
}
function giftApply(g){
  const got=[],m=g.merit|0,e=g.exp|0,ch=g.chests|0;
  if(m>0){P._merit=(P._merit||0)+m;got.push('🏅 戰功 +'+m)}
  if(e>0){P._exp=(P._exp||0)+e;got.push('📘 經驗值 +'+e)}
  if(ch>0){P._chests=P._chests||[];const cs=Math.max(1,Math.min(GC.stars.maxStar,(g.chestStars|0)||3));
    for(let k=0;k<ch;k++)P._chests.push({s:cs,g:Math.floor(Math.random()*ITEMS.length)});got.push('📦 寶箱 ×'+ch+'（到背包打開）')}
  Object.entries(g.items||{}).forEach(([id,n])=>{
    n=n|0;const x=SHOPMAP[id];if(!x||n<=0)return;
    if(x.cos){P._cos=P._cos||{};P._cos.own=P._cos.own||{};P._cos.on=P._cos.on||{};
      if(P._cos.own[id])return got.push(x.icon+' '+x.name+'（你已經有了）');
      P._cos.own[id]=1;if(!P._cos.on[x.cos.slot])P._cos.on[x.cos.slot]=id;got.push(x.icon+' '+x.name+'（已加入收藏，到背包裝備）')}
    else{bagAdd(id,n);got.push(x.icon+' '+x.name+' ×'+n)}});
  return got;
}
function checkGifts(){
  if(!P._hero)return;                       // 還沒建立角色：等建立完再發
  const L=(GC.gifts||[]).filter(g=>giftMatch(g)&&!(P._giftsGot||{})[g.id]);
  if(!L.length)return;
  P._giftsGot=P._giftsGot||{};
  const html=L.map(g=>{P._giftsGot[g.id]=Date.now();const got=giftApply(g);
    return `<div class="fighter" style="margin:8px 0"><b>${giftEsc(g.title||'老師送你的禮物')}</b>${g.msg?`<br><small>💬 ${giftEsc(g.msg)}</small>`:''}<br>${got.length?got.join('<br>'):'<small>（這份禮物沒有內容）</small>'}</div>`}).join('');
  save();
  popup(`<h2 class="serif" style="margin:0;color:var(--bronze);text-align:center">🎁 老師送來禮物了！</h2>${html}`);
  window.BGM&&BGM.clang&&BGM.clang();
  render();
}
load();meritInit();fragInit();fillWho();show('home');startPendingListen();maybeCreate();checkGifts();

/* ===== 🛠️ 教師工具（只存在於 world-map-teacher.html） ===== */
(()=>{
  const css=document.createElement('style');
  css.textContent=`#tbtn{position:fixed;left:10px;bottom:10px;z-index:60;background:#d24a33;color:#fff;border:2px solid #fff6;border-radius:24px;padding:8px 14px;font:inherit;font-weight:700;cursor:pointer;box-shadow:0 4px 14px #0008}
  #tpanel{position:fixed;inset:0;z-index:70;background:#000a;display:none;overflow:auto;padding:12px}
  #tpanel .tb{max-width:760px;margin:0 auto;background:#161a2e;border:2px solid #d24a33;border-radius:14px;padding:12px 16px;color:#e9e4d4}
  #tpanel h3{margin:14px 0 6px;color:#d2a24c}#tpanel .r{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:6px 0}
  #tpanel input,#tpanel select{background:#20264a;color:#e9e4d4;border:2px solid #3a4270;border-radius:8px;padding:5px 8px;font:inherit}
  #tpanel input[type=number]{width:100px}#tpanel button{background:#20264a;color:#e9e4d4;border:2px solid #d2a24c;border-radius:8px;padding:6px 10px;font:inherit;cursor:pointer}
  #tpanel button:hover{background:#2c3566}#tpanel .dg{border-color:#d24a33}`;
  document.head.appendChild(css);
  const btn=document.createElement('button');btn.id='tbtn';btn.textContent='🛠️ 教師工具';document.body.appendChild(btn);
  const pan=document.createElement('div');pan.id='tpanel';document.body.appendChild(pan);
  const MAXS=GC.stars.maxStar;
  const shopOpts=GC.shop.map(x=>`<option value="${x.id}">${x.icon||''} ${x.name}${x.cos?'（外觀）':''}</option>`).join('');
  const stageOpts=flatAll.map(id=>`<option>${id}</option>`).join('');
  const starOpts=(def)=>Array.from({length:MAXS+1},(_,i)=>`<option value="${i}"${i===def?' selected':''}>${i} ⭐</option>`).join('');
  const lvTotal=L=>{let s=0;for(let l=1;l<L;l++)s+=expNeed(l);return s};
  function draw(){
    const gifts=(GC.gifts||[]).map(g=>`<li>${giftEsc(g.title||g.id)}　<small>${g.on===false?'⛔停用':giftMatch(g)?'✅ 符合目前「我的資料」':'⏸ 不符合（對象／期間）'}　${(P._giftsGot||{})[g.id]?'📬 已領過':'尚未領'}</small></li>`).join('')||'<li><small>目前 game-config.js 沒有任何禮物</small></li>';
    pan.innerHTML=`<div class="tb"><div class="r"><b style="font-size:1.2rem">🛠️ 教師工具</b><span style="flex:1"></span><button id="t-x">✕ 關閉</button></div>
    <small>這是教師版：存檔與學生完全分開（只存在這個瀏覽器），所有關卡與無極限挑戰已全部解鎖。請勿把這個檔案放到學生能連到的網站。</small>
    <h3>🏅 戰功／✨ 經驗</h3>
    <div class="r">戰功 目前 <b>${P._merit||0}</b> <input type="number" id="t-m" value="1000"><button data-a="m+">增加</button><button data-a="m=">直接設為</button></div>
    <div class="r">等級 目前 <b>Lv.${levelInfo().level}</b> <input type="number" id="t-l" value="10" min="1"><button data-a="lv">設為此等級</button><input type="number" id="t-e" value="500"><button data-a="e+">增加經驗值</button></div>
    <h3>⭐ 星數／關卡</h3>
    <div class="r">全部關卡一次設為 <select id="t-as">${starOpts(MAXS)}</select><button data-a="allst">套用</button></div>
    <div class="r">單一關卡 <select id="t-sid">${stageOpts}</select><select id="t-ss">${starOpts(MAXS)}</select><button data-a="onest">套用</button></div>
    <h3>🎒 道具／外觀</h3>
    <div class="r"><select id="t-it">${shopOpts}</select>× <input type="number" id="t-n" value="5" min="1"><button data-a="give">放進背包</button></div>
    <div class="r"><button data-a="allitems">全部消耗品各 +10</button><button data-a="allcos">解鎖全部外觀（稱號／框／特效／小屋）</button></div>
    <h3>📦 寶箱／⚔️ 裝備</h3>
    <div class="r">寶箱 +<input type="number" id="t-c" value="10" min="1"> 星數 <select id="t-cs">${starOpts(3).replace('<option value="0">0 ⭐</option>','')}</select><button data-a="chest">發放寶箱</button></div>
    <div class="r">全部裝備直接設為 <select id="t-q"><option value="normal">普通</option><option value="fine">精良</option><option value="legend">傳說</option><option value="myth" selected>神話</option></select><button data-a="eq">套用</button> <small>（「分身」依 7-3 星數，請先把星數設滿）</small></div>
    <h3>🎁 測試「獎勵發放」</h3>
    <ul style="margin:4px 0;padding-left:1.2em">${gifts}</ul>
    <div class="r"><button data-a="gnow">立刻檢查並領取禮物</button><button data-a="gclr">清除禮物領取紀錄（可重測）</button></div>
    <small>想測「指定班級／學號」：先在畫面上的「👤 我的資料」填班級或學號並按儲存，再回來看上面的清單。</small>
    <h3>⚠️ 危險區</h3>
    <div class="r"><button class="dg" data-a="reset">重置教師版存檔（不影響學生）</button></div></div>`;
  }
  const num=id=>Math.max(0,Number(pan.querySelector(id).value)||0);
  const val=id=>pan.querySelector(id).value;
  const A={
    'm+':()=>{P._merit=(P._merit||0)+num('#t-m')},
    'm=':()=>{P._merit=num('#t-m')},
    'lv':()=>{P._exp=lvTotal(Math.max(1,num('#t-l')))},
    'e+':()=>{P._exp=(P._exp||0)+num('#t-e')},
    'allst':()=>{const n=+val('#t-as');flatAll.forEach(id=>{const o=P[id]||{};P[id]={...o,stars:n,best:Math.max(o.best||0,n*100),ms:n?{easy:Math.min(n,2),real:Math.min(n,4),hard:n}:{}}})},
    'onest':()=>{const id=val('#t-sid'),n=+val('#t-ss'),o=P[id]||{};P[id]={...o,stars:n,best:Math.max(o.best||0,n*100)}},
    'give':()=>{giftApply({items:{[val('#t-it')]:num('#t-n')||1}})},
    'allitems':()=>{GC.shop.filter(x=>!x.cos).forEach(x=>bagAdd(x.id,10))},
    'allcos':()=>{const it={};GC.shop.filter(x=>x.cos).forEach(x=>it[x.id]=1);giftApply({items:it})},
    'chest':()=>{giftApply({chests:num('#t-c')||1,chestStars:+val('#t-cs')||MAXS})},
    'eq':()=>{P._eqQ=P._eqQ||{};ITEMS.forEach((it,i)=>{if(!it.special)P._eqQ[i]=val('#t-q')})},
    'gnow':()=>{pan.style.display='none';checkGifts();return 'skip'},
    'gclr':()=>{P._giftsGot={}},
    'reset':()=>{if(!confirm('確定清除教師版的所有存檔？'))return 'skip';P={};}
  };
  pan.onclick=e=>{
    if(e.target.id==='t-x'||e.target===pan){pan.style.display='none';return}
    const a=e.target.dataset.a;if(!a||!A[a])return;
    const r=A[a]();if(r==='skip')return;
    save();if(a==='reset'){location.reload();return}
    render();draw();toast('✅ 已套用');
  };
  btn.onclick=()=>{if(!P._hero){toast('請先建立勇者角色，再開啟教師工具');return}draw();pan.style.display='block'};
})();

</script>
