<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>數理大陸 · 數靈召喚師總地圖</title>
<style>
:root{--ink:#161a2e;--ink2:#20264a;--line:#3a4270;--bronze:#d2a24c;--paper:#f1e8d2;--red:#d24a33;--jade:#43a58f;--txt:#e9e4d4}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:radial-gradient(ellipse at top,#252c56,var(--ink) 65%);color:var(--txt);font-family:"Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif}
h1,h2,h3{font-family:"Noto Serif TC","Songti TC","PMingLiU",serif;margin:0}
button{font:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid #fff;outline-offset:2px}
.btn{background:var(--bronze);color:#2a1d05;border:0;border-radius:10px;padding:8px 14px;font-weight:700}
.btn:hover{filter:brightness(1.1)}
.btn.ghost{background:#2b2a3c;color:#f0cf85;border:2px solid var(--bronze)}
.btn[disabled]{opacity:.45;cursor:not-allowed;filter:none}
.btn.small{padding:5px 10px;font-size:14px}
.muted{color:#b9b6a6;font-size:14px;line-height:1.6}
#hud{position:fixed;top:0;left:0;right:0;z-index:20;display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:8px 12px;background:linear-gradient(#161a2ee6,#161a2e00)}
#hud .ttl{display:flex;flex-direction:column;line-height:1.2}
#hud .ttl b{font-size:19px;color:var(--bronze);font-family:"Noto Serif TC",serif}
#hud .ttl span{font-size:13px;color:var(--paper)}
#prog{flex:1;min-width:120px;max-width:300px}
#prog .bar{height:10px;border-radius:6px;background:#0007;border:1px solid var(--line);overflow:hidden}
#prog .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--jade),var(--bronze));width:0}
#prog small{font-size:12px;color:var(--paper)}
.pill{background:#0009;border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-weight:700;white-space:nowrap}
#hud .sp{flex:1}
.badge{background:var(--red);color:#fff;border-radius:6px;padding:2px 8px;font-size:12px}
#mapwrap{position:absolute;inset:0;overflow:auto;display:flex;box-sizing:border-box;cursor:grab;touch-action:pan-x pan-y}
#mapwrap.drag{cursor:grabbing}
#map{display:block;flex:none;margin:auto}
.hit{fill:#fff;fill-opacity:0;cursor:pointer}
.hit:hover{fill-opacity:.1}
.bld{cursor:pointer}
.bld:hover{filter:brightness(1.2)}

#card{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);z-index:25;width:min(94vw,520px);background:var(--ink2);border:2px solid var(--bronze);border-radius:16px;padding:14px 16px;box-shadow:0 8px 30px #000a;display:none}
#card h3{color:var(--bronze);font-size:20px}
#card .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
#card .sub{font-size:14px;color:var(--paper);margin-top:4px;line-height:1.6}
#card .x{position:absolute;right:10px;top:6px;background:none;border:0;color:#fff;font-size:20px}
#toast{position:fixed;top:64px;left:50%;transform:translateX(-50%);z-index:80;background:#000d;border:1px solid var(--bronze);border-radius:12px;padding:10px 16px;max-width:92vw;display:none;font-size:15px;text-align:center}
#err{position:fixed;inset:0;z-index:99;display:none;align-items:center;justify-content:center;background:#000d;padding:20px;text-align:center;font-size:18px}
.ov{position:fixed;inset:0;z-index:40;background:#0a0d1ccc;display:none;align-items:center;justify-content:center;overflow:auto;padding:10px}
.ov.on{display:flex}
#pnlOv{z-index:60}
.pbox{background:var(--ink2);border:2px solid var(--bronze);border-radius:16px;width:min(96vw,760px);max-height:92vh;overflow:auto;padding:16px 18px;position:relative}
.pbox.wide{width:min(96vw,960px)}
.pbox h2{color:var(--bronze);font-size:21px;margin-bottom:8px;padding-right:40px}
.pbox .x{position:absolute;right:10px;top:8px;background:none;border:0;color:#fff;font-size:22px}
.row2{display:flex;gap:10px;align-items:center;margin:8px 0;flex-wrap:wrap}
.row2 label{width:56px;color:var(--paper)}
input[type=text],input[type=number]{background:#0b0f22;color:var(--txt);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font:inherit;width:180px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 12px}
.tab{background:#0b0f22;color:var(--txt);border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:14px}
.tab.on{background:var(--bronze);color:#2a1d05;border-color:var(--bronze);font-weight:700}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.it{background:#0b0f22;border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center;display:flex;flex-direction:column;gap:6px;align-items:center}
.it .pv{height:84px;display:flex;align-items:center;justify-content:center;font-size:52px}
.it .pv img{max-height:84px;max-width:100%}
.it b{font-size:15px}
.it small{color:#b9b6a6;font-size:12px;min-height:30px}
.mon{background:#0b0f22;border:1px solid var(--line);border-radius:10px;padding:8px;text-align:center;font-size:13px;position:relative}
.mon .em{font-size:34px;height:48px;display:flex;align-items:center;justify-content:center}
.mon img{max-width:48px;max-height:48px}
.mon.lock{opacity:.45}
.mon[data-act=monInfo]{cursor:pointer}.mon[data-act=monInfo]:hover{border-color:var(--bronze);transform:translateY(-2px)}
.mdet{display:flex;gap:16px;flex-wrap:wrap;align-items:flex-start}.mdet .big{flex:0 0 auto;width:min(100%,260px);text-align:center;font-size:120px;line-height:1.1}.mdet .big img{width:100%;max-height:300px;object-fit:contain;filter:drop-shadow(0 6px 10px #000a)}.mdet .inf{flex:1;min-width:220px}.mdet table{border-collapse:collapse;width:100%;margin:6px 0}.mdet td{border-bottom:1px solid var(--line);padding:3px 6px}.mdet td:last-child{text-align:right;font-weight:700}
.mon .lv{position:absolute;right:6px;top:4px;background:var(--bronze);color:#2a1d05;border-radius:6px;padding:0 6px;font-size:12px;font-weight:700}
.mon.boss{border-color:var(--red)}
.cat{display:flex;gap:10px;align-items:flex-start;background:#0b0f22;border:1px solid var(--line);border-radius:12px;padding:10px;margin:8px 0}
.cat .av{font-size:38px}
.mis{display:flex;justify-content:space-between;align-items:center;gap:8px;background:#0b0f22;border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin:6px 0}
table.w{width:100%;border-collapse:collapse;font-size:14px}
table.w td,table.w th{border-bottom:1px solid var(--line);padding:5px 6px;text-align:left}
#home{--u:calc(min(96vw,980px)/100)}
.room{position:relative;width:min(96vw,980px);aspect-ratio:16/10;border-radius:18px;border:4px solid #5b3d1a;overflow:hidden;background:linear-gradient(#ecd8ae 0 62%,#8a5a2b 62% 100%);background-size:cover;background-position:center;box-shadow:0 10px 40px #000a}
.room:not(.art):before{content:"";position:absolute;left:0;right:0;top:62%;bottom:0;background:repeating-linear-gradient(90deg,#0000 0 7%,#0003 7% 7.4%)}
.room .ceil{position:absolute;left:0;right:0;top:0;height:7%;background:#6b4a22}
.room.art .ceil:not(.st){display:none}
.room .ceil.st{background:linear-gradient(#0b1030,#1b2a5e);color:#ffe9a0;font-size:calc(var(--u)*3);letter-spacing:calc(var(--u)*2);overflow:hidden;white-space:nowrap}
.win{position:absolute;border:calc(var(--u)*.8) solid #5b3d1a;border-radius:6px;overflow:hidden}
.win .sun{position:absolute;right:12%;top:10%;font-size:calc(var(--u)*5)}
.win .hill{position:absolute;left:-10%;right:-10%;bottom:-20%;height:55%;border-radius:50%;background:#2f7d4a}
.win .tm{position:absolute;left:6px;bottom:4px;font-size:calc(var(--u)*1.5);background:#0008;padding:0 6px;border-radius:6px;color:#fff}
.win .cross{position:absolute;inset:0;background:linear-gradient(#5b3d1a,#5b3d1a) center/calc(var(--u)*.6) 100% no-repeat,linear-gradient(#5b3d1a,#5b3d1a) center/100% calc(var(--u)*.6) no-repeat}
.win.art{border:calc(var(--u)*1.1) solid #7a4b22;border-image:url('images/home/win_wood.jpg') 36 round;border-radius:0;box-shadow:inset 0 0 calc(var(--u)*1.6) #3b230d99,0 calc(var(--u)*.4) calc(var(--u)*1) #0004}
.win.art .cross{background:url('images/home/win_wood.jpg') center/auto 100% repeat;-webkit-mask:linear-gradient(#000,#000) center/calc(var(--u)*.7) 100% no-repeat,linear-gradient(#000,#000) center/100% calc(var(--u)*.7) no-repeat;mask:linear-gradient(#000,#000) center/calc(var(--u)*.7) 100% no-repeat,linear-gradient(#000,#000) center/100% calc(var(--u)*.7) no-repeat;filter:drop-shadow(0 1px 1px #0006)}
.win.art .tm{background:#4a2c1090;font-family:inherit}
.fur{position:absolute;background:none;border:0;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0}
.fur .e{font-size:calc(var(--u)*7);line-height:1;filter:drop-shadow(0 3px 3px #0008);display:flex;max-height:80%}
.fur .e img{max-width:100%;max-height:100%}
.fur .l{font-size:max(11px,calc(var(--u)*1.6));background:#161a2ecc;border:1px solid var(--bronze);border-radius:999px;padding:1px 8px;margin-top:2px;white-space:nowrap}
.fur:hover .e{transform:scale(1.1)}
.deco{position:absolute;display:flex;align-items:center;justify-content:center;pointer-events:none}
.deco img{max-width:100%;max-height:100%}
.rug{background:radial-gradient(ellipse,#a35bd6,#5b2d8a);border:3px solid #e2b53a;border-radius:50%}
.fish{background:linear-gradient(#7ad3ff,#2f8fc9);border:3px solid #fff8;border-radius:10px;font-size:calc(var(--u)*4)}
.shelfb{background:#7a4f22;border:3px solid #4b2f12;border-radius:6px;font-size:calc(var(--u)*5)}
.deco.img{background:none;border:0}
.heroSpot{position:absolute}
.petSpot{position:absolute;pointer-events:none}
.homeBar{position:absolute;right:10px;top:10px;z-index:3}
.mis .btn{white-space:nowrap}
@media (pointer:coarse),(max-width:600px){.btn,.btn.small,.homeBar .btn{min-height:44px;padding-top:8px;padding-bottom:8px}}
@media (max-aspect-ratio:1/1){.room{aspect-ratio:4/5}.homeBar .btn{padding:5px 9px;font-size:13px}}
@keyframes flowK{to{stroke-dashoffset:-88}}@keyframes arrowK{50%{transform:translateY(-26px)}}
#map .flow{animation:flowK 1.2s linear infinite}#map .bigArrow{animation:arrowK .9s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){#map .flow,#map .bigArrow{animation:none}}
#map{transition:opacity .4s}body.mapwait #map{opacity:0}
</style>
</head>
<body>
<header id="hud">
  <div class="ttl"><b>數理大陸 · 數靈召喚師</b><span id="rankT"></span></div>
  <div id="prog"><div class="bar"><i id="progI"></i></div><small id="progT"></small></div>
  <span class="pill" id="goldP"></span>
  <span class="sp"></span>
  <span class="badge" id="teachB" style="display:none">教師版：全章開放</span>
  <button class="btn ghost small" data-act="homeBtn">🏠 小屋</button>
  <button class="btn ghost small" data-act="shopBtn">🏪 商店</button>
  <button class="btn ghost small" data-act="teamBtn" id="teamB">🩹 隊伍</button>
  <button class="btn ghost small" data-act="dailyBtn">📅 每日</button>
  <button class="btn ghost small" data-act="arenaBtn">⚔️ 鬥技場</button>
  <button class="btn ghost small" data-act="zoneBtn">🎮 遊戲區</button>
  <button class="btn ghost small" data-act="findHero">📍 找勇者</button>
</header>
<main id="mapwrap"><svg id="map" xmlns="http://www.w3.org/2000/svg"></svg></main>
<div id="card"></div>
<div id="toast"></div>
<div id="err">找不到設定檔 game-config.js，請確認它和這個檔案放在同一個資料夾。</div>
<div class="ov" id="home"><div class="room" id="room"></div></div>
<div class="ov" id="pnlOv"><div class="pbox" id="pbox"></div></div>

<script src="game-config.js"></script>
<script src="audio/bgm.js"></script>
<script src="relax-break.bundle.js"></script>
<script src="vol2-monsters.js"></script>
<script src="report.js"></script>
<script>
(()=>{'use strict';
const GC=window.GAME_CONFIG;
if(!GC){document.getElementById('err').style.display='flex';return}
const OPEN=false; /* 學生版不含任何解鎖功能；教師版請用另一個檔 world-map-vol2-teacher.html（不上傳） */
const E=GC.economy,M=GC.map,W=M.w,HT=M.h,CH=[null].concat(GC.chapters),CUR=GC.currency.icon,CN=GC.currency.name;
const KEY='jb2-hub-v1';
const BOSSID={};CH.forEach(c=>c&&c.stages.forEach(s=>BOSSID[s[0]]=s[2]));
const TOTAL_MAX=CH.reduce((a,c)=>a+(c?c.max:0),0);
const rankOf=(r,s)=>{let t=r[0][1];for(const[a,b]of r)if(s>=a)t=b;return t};
const STAGE_NAME={};CH.forEach(c=>c&&c.stages.forEach(s=>STAGE_NAME[s[0]]=s[1]));
const BAD=GC.badWords||[];
const isBad=s=>{const t=String(s).toLowerCase().replace(/\s/g,'');return BAD.some(w=>t.includes(String(w).toLowerCase()))};
const pxX=p=>p/100*W,pxY=q=>q/100*HT;
const POS=[[pxX(M.village.x),pxY(M.village.y)]].concat(GC.chapters.map(c=>[pxX(c.island.x),pxY(c.island.y)]));
const NCH=GC.chapters.length;

/* ===== 商品 ===== */
const ITEMS=GC.shop.items,ITEM={};
const priceOf=it=>(it.price!==''&&it.price!=null)?+it.price:Math.round(E.dailyBase*it.days/E.priceRound)*E.priceRound;
ITEMS.forEach(i=>ITEM[i.id]=i);
const SLOTS=GC.shop.tabs;

/* ===== 存檔 ===== */
const chKey=n=>'monster-ch'+n+'-progress-v1';
let H;
const defH=()=>({v:1,gold:0,own:{},eq:{cloak:'cloak_blue',hat:'hat_none',staff:'staff_wood',pet:'',title:''},inv:{},seen:{},stat:{earned:0,spent:0},mon:{},sk:{},ghost:{date:'',wins:0,w:0,l:0},
 daily:{date:'',expGold:0,expDelta:0,starDelta:0,claimed:{}},buy:{date:'',n:{}},streak:{last:'',n:0},who:{cls:'',no:'',name:''},last:0,intro:false,renaming:false,boostDate:'',chal:{date:'',sid:'',n:0,claimed:0},login:{last:'',n:0}});
function load(){
  let o=null;try{o=JSON.parse(localStorage.getItem(KEY))}catch(e){}
  const base=defH();H=Object.assign(base,o||{});
  for(const k of['own','eq','inv','seen','stat','daily','buy','streak','who','mon','ghost','sk','chal','login']){H[k]=Object.assign(defH()[k],(o&&o[k])||{})}
  ITEMS.forEach(i=>{if(!i.cons&&!priceOf(i)&&!H.own[i.id])H.own[i.id]=1}); /* 價格 0 的商品視為初始擁有 */
  if(!H.who.name&&!H.who.no){for(let n=1;n<=NCH;n++){const w=readCh(n)._who;if(w&&(w.name||w.no||w.sid)){H.who={cls:'',no:w.no||w.sid||'',name:w.name||''};break}}}
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(H))}catch(e){}}
function readCh(n){try{return JSON.parse(localStorage.getItem(chKey(n)))||{}}catch(e){return{}}}
function writeCh(n,d){try{localStorage.setItem(chKey(n),JSON.stringify(d))}catch(e){}}
const S=[null];
function calcStats(){
  for(let n=1;n<=NCH;n++){
    const d=readCh(n);let stars=0,exp=0,got=0;const per={};
    for(const k in d){if(k[0]==='_')continue;const s=d[k];
      if(s&&typeof s==='object'){const st=s.stars|0;stars+=st;exp+=s.exp|0;if(st>0)got++;per[k]={stars:st,exp:s.exp|0}}}
    S[n]={stars,exp,got,per,q:d._q||{}};
  }
}
const totalStars=()=>{let t=0;for(let n=1;n<=NCH;n++)t+=S[n].stars;return t};
const needFor=i=>Math.ceil(CH[i-1].max*E.unlockRatio);
const locked=i=>!(OPEN||i===1||S[i-1].stars>=needFor(i));
const lockMsg=i=>`第 ${i} 章還沒開啟：要在第 ${i-1} 章拿到 ${needFor(i)} ⭐（目前 ${S[i-1].stars} ⭐）`;

/* ===== 工具 ===== */
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const tod=()=>{const h=new Date().getHours();return h<5?'night':h<7?'dawn':h<17?'day':h<19?'dusk':'night'};
const fill=(s,o)=>String(s).replace(/\{(\w+)\}/g,(m,k)=>o[k]!=null?o[k]:m);
let tt;function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(tt);tt=setTimeout(()=>t.style.display='none',2800)}
const OK={};
/* 白底貼紙圖自動去白底（從四邊往內填滿近白色）；若瀏覽器不允許（例如直接開檔案），就維持原圖 */
function cutout(img){
  try{const mx=512,k=Math.min(1,mx/Math.max(img.naturalWidth,img.naturalHeight)),w=Math.round(img.naturalWidth*k),h=Math.round(img.naturalHeight*k);
    const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');x.drawImage(img,0,0,w,h);
    const d=x.getImageData(0,0,w,h),a=d.data,seen=new Uint8Array(w*h),st=[];
    const white=i=>a[i*4]>236&&a[i*4+1]>236&&a[i*4+2]>236;
    const push=i=>{if(!seen[i]&&white(i)){seen[i]=1;st.push(i)}};
    for(let i=0;i<w;i++){push(i);push((h-1)*w+i)}for(let j=0;j<h;j++){push(j*w);push(j*w+w-1)}
    while(st.length){const i=st.pop(),px=i%w,py=(i/w)|0;a[i*4+3]=0;if(px>0)push(i-1);if(px<w-1)push(i+1);if(py>0)push(i-w);if(py<h-1)push(i+w)}
    x.putImageData(d,0,0);return c.toDataURL('image/png')}catch(e){return null}
}
function probe(list,done){let n=list.length;if(!n){done();return}const raw=[M.art,GC.home.wallpaper];list.forEach(p=>{const i=new Image();i.onload=()=>{OK[p]=raw.includes(p)?p:(cutout(i)||p);--n||done()};i.onerror=()=>{--n||done()};i.src=p})}
const addGold=g=>{H.gold+=g;if(g>0)H.stat.earned+=g};

/* ===== 學習獎勵 ===== */
function sync(silent){
  const t=ymd(new Date());
  if(H.daily.date!==t)H.daily={date:t,expGold:0,expDelta:0,starDelta:0,claimed:{}};
  const mult=H.boostDate===t?E.boostMult:1;
  let sg=0,eg=0;
  for(let n=1;n<=NCH;n++){
    const s=S[n],sn=H.seen[n],first=!sn,b=sn||{stars:0,exp:0};
    const ds=s.stars-b.stars,de=s.exp-b.exp;
    if(ds<0||de<0){H.seen[n]={stars:s.stars,exp:s.exp};continue}
    sg+=ds*E.starGold;
    if(!first){H.daily.starDelta+=ds;H.daily.expDelta+=de}
    const a=Math.max(0,Math.min(Math.floor(de/E.expRate)*mult,E.expCap-H.daily.expGold));
    eg+=a;H.daily.expGold+=a;
    H.seen[n]={stars:s.stars,exp:s.exp};
  }
  const g=sg+eg;
  if(g>0){addGold(g);if(!silent)toast(`學習獎勵 +${g} ${CUR}（新星星 +${sg}、練習 +${eg}）`)}
  save();
}

/* ===== 勇者圖 ===== */
function heroParts(eq){
  const c=ITEM[eq.cloak]||ITEM.cloak_blue,h=ITEM[eq.hat]||ITEM.hat_none,st=ITEM[eq.staff]||ITEM.staff_wood;
  let s=`<line x1="52" y1="30" x2="52" y2="80" stroke="${st.shaft}" stroke-width="4" stroke-linecap="round"/><circle cx="52" cy="26" r="6" fill="${st.orb}" stroke="#fff8" stroke-width="1.5"/>`;
  s+=`<path d="M32 36 C24 40 18 60 14 80 Q32 88 50 80 C46 60 40 40 32 36Z" fill="${c.color}" stroke="${c.dark}" stroke-width="2"/><path d="M22 62 Q32 67 42 62" stroke="${c.dark}" stroke-width="3" fill="none"/>`;
  s+=`<circle cx="50" cy="52" r="3.5" fill="#f7d9b5"/>`;
  s+=`<circle cx="32" cy="28" r="11" fill="#f7d9b5" stroke="#c99b6b" stroke-width="1.5"/><circle cx="28" cy="29" r="1.6" fill="#222"/><circle cx="36" cy="29" r="1.6" fill="#222"/><path d="M29 34 Q32 36.5 35 34" stroke="#a5583a" stroke-width="1.4" fill="none"/>`;

  LG.forEach((d,i)=>{const cur=i===g.day;h+=`<span class="pill" style="min-width:64px;text-align:center;${cur?'border-color:#ffd84d;color:#ffd84d;font-weight:800':i<g.day?'opacity:.5':''}">第${i+1}天<br>${CUR}${d.gold}${d.item&&ITEM[d.item]?'<br>🎟️':''}</span>`});
  h+=`</div><button class="btn" data-act="takeGift">🎁 領取今天的禮物</button>`;
  openPanel('🎁 登入小禮',h);
}
function takeGift(){
  if(!giftDue())return;const g=giftInfo(),d=LG[g.day];
  H.login={last:g.t,n:g.n};addGold(d.gold);
  let extra='';if(d.item&&ITEM[d.item]){H.inv[d.item]=(H.inv[d.item]||0)+1;extra='＋'+ITEM[d.item].name+' 1 張'}
  save();refreshHUD();closePanel();toast(`登入小禮：+${d.gold} ${CUR}${extra}（連續 ${g.n} 天）`);
}
function clearedList(){const r=[];for(let n=1;n<=NCH;n++)CH[n].stages.forEach(s=>{const p=S[n].per[s[0]];if(p&&p.stars>0)r.push({n,id:s[0],name:s[1],stars:p.stars})});return r}
function chalEnsure(){
  const t=todayS(),L=clearedList();
  if(H.chal.date===t&&(H.chal.sid?L.some(x=>x.id===H.chal.sid):!L.length))return;
  if(!L.length){H.chal={date:t,sid:'',n:0,claimed:0};save();return}
  let seed=0;const str=t+(H.who.no||'')+(H.who.name||'');for(let i=0;i<str.length;i++)seed=(seed*31+str.charCodeAt(i))>>>0;
  const pick=L[seed%L.length];H.chal={date:t,sid:pick.id,n:pick.n,claimed:0};save();
}
function pracData(){try{return JSON.parse(localStorage.getItem('jb2-practice-v1'))||{}}catch(e){return{}}}
function chalResult(){const p=pracData().daily;return(p&&p.date===todayS()&&p.sid===H.chal.sid)?p:null}
function chalClaimable(){return!!(H.chal.date===todayS()&&H.chal.sid&&chalResult()&&!H.chal.claimed)}
function goPractice(kind,n,sid,types){
  H.last=n;H.heroNode=n;save();const u=fill(GC.urls.chapter,{n});
  goTo(u+(u.includes('?')?'&':'?')+'practice='+kind+'&sid='+encodeURIComponent(sid)+(types?'&types='+encodeURIComponent(types):''));
}
function weakGroups(){
  const m={};
  weakRows().forEach(r=>{if(r.r>=0.9)return;const[sid,ty]=r.k.split(':');const o=m[sid]||(m[sid]={sid,n:0,ok:0,types:[]});o.n+=r.n;o.ok+=r.ok;if(ty)o.types.push(ty)});
  return Object.values(m).map(o=>Object.assign(o,{r:o.ok/o.n})).sort((a,b)=>a.r-b.r).slice(0,5);
}
const stageCh=sid=>{for(let n=1;n<=NCH;n++)if(CH[n].stages.some(s=>s[0]===sid))return n;return 0};
function dailyHTML(){
  chalEnsure();const t=todayS(),g=giftInfo(),res=chalResult(),pr=pracData();
  let h=`<h3 style="margin:4px 0">🎯 今日挑戰</h3>`;
  if(!H.chal.sid)h+=`<div class="cat"><div class="av">🐱</div><div>你還沒有通關任何關卡。先去地圖闖一關，明天開始就有「每日挑戰」囉！<br><span class="muted">每日挑戰只會從你<b>已經通關</b>的關卡出題，不會考你還沒學過的。</span></div></div>`;
  else{
    const nm=STAGE_NAME[H.chal.sid]||H.chal.sid;
    h+=`<div class="mis"><div><b>${esc(nm)}</b>（第 ${H.chal.n} 章 ${esc(H.chal.sid)}）<br><span class="muted">${DC.total} 題，答對 ${DC.pass} 題以上拿 ${CUR}${DC.gold}；沒達到也有 ${CUR}${DC.partial}。每天一個新關卡，只會從你通關過的關卡挑。</span>${res?`<br>今天成績：<b>${res.right}/${res.total}</b>`:''}</div>`;
    if(H.chal.claimed)h+=`<button class="btn small" disabled>已領取 ✔</button></div>`;
    else if(res)h+=`<button class="btn small" data-act="claimChal">領 ${CUR}${res.right>=DC.pass?DC.gold:DC.partial}</button></div><div style="margin:6px 0"><button class="btn ghost small" data-act="goChal">🔁 再挑戰一次（成績取最好的）</button></div>`;
    else h+=`<button class="btn small" data-act="goChal">⚔️ 開始</button></div>`;
  }
  h+=`<h3 style="margin:14px 0 4px">🧩 錯題練習</h3>`;
  const wg=weakGroups();
  if(!wg.length)h+=`<p class="muted">目前沒有需要加強的題型（同一題型至少做 3 題才會統計）。繼續闖關，系統會自動幫你記下容易錯的地方！</p>`;
  else{
    h+=`<p class="muted">這些是你最容易錯的關卡。練習是「有小老師帶著做」的，答得越多弱點越少。</p>`;
    wg.forEach(o=>{h+=`<div class="mis"><div><b>${esc(STAGE_NAME[o.sid]||o.sid)}</b>（${esc(o.sid)}）<br><span class="muted">答對率 ${Math.round(o.r*100)}%（${o.ok}/${o.n}）</span></div><button class="btn small" data-act="goWeak" data-sid="${esc(o.sid)}" data-types="${esc(o.types.join(','))}">練習 6 題</button></div>`});
  }
  const wp=pr.weak&&pr.weak.date===t?pr.weak:null;
  if(wp)h+=`<p class="muted">今天已完成錯題練習：${wp.total} 題（答對 ${wp.right}）👍</p>`;
  h+=`<h3 style="margin:14px 0 4px">🎁 登入小禮</h3><p class="muted">${g.done?`今天已領取，連續登入 ${H.login.n} 天。`:`今天還沒領！`}</p>${g.done?'':`<button class="btn small" data-act="takeGift2">領取</button>`}`;
  return h;
}
function openDaily(){hideCard();panelRender=()=>openPanel('📅 每日挑戰・錯題練習',dailyHTML(),true);panelRender()}
function claimChal(){
  const res=chalResult();if(!res||H.chal.claimed)return;
  const g=res.right>=DC.pass?DC.gold:DC.partial;H.chal.claimed=1;addGold(g);save();refreshHUD();toast(`每日挑戰獎勵 +${g} ${CUR}`);panelRender&&panelRender();
}
function dailyBadge(){
  const b=document.querySelector('[data-act="dailyBtn"]');if(!b)return;
  const hot=giftDue()||chalClaimable()||(H.chal.date!==todayS()&&clearedList().length>0)||(H.chal.sid&&!chalResult()&&!H.chal.claimed);
  b.textContent='📅 每日'+(hot?' 🔴':'');
}

/* ===== 啟動 ===== */
function refreshAll(silent){calcStats();sync(silent);drawMap();renderHero();refreshHUD();if($('#home').classList.contains('on'))renderHome();reportNow(false)}
function intro(){
  openPanel('🌍 歡迎來到數理大陸',`<div class="cat"><div class="av">🐱</div><div>我是導師智慧貓！古老的數理大陸被混沌黑霧籠罩，六大元素水晶失衡，各地的守護數靈因為「數學觀念混亂」而暴走了。<br><br>召喚師，請你帶著法杖，依序走訪六座島嶼，答對題目、封印數靈、收進圖鑑。<br><br>👉 點島嶼，勇者會走過去；點村莊的 🏠 回小屋休息、點 🏪 買裝備、點 🏟️ 去鬥技場。<br>👉 通關拿星星、練習拿經驗，都能換成 ${CUR} ${CN}喔！</div></div><button class="btn" data-act="closePanel">開始冒險！</button>`);
  H.intro=true;save();
}
function init(){
  document.body.classList.add('mapwait');setTimeout(()=>document.body.classList.remove('mapwait'),5000);
  load();buildStatic();calcStats();fit();drawMap();
  heroNode=Math.min(NCH,Math.max(0,H.heroNode!=null?H.heroNode:H.last||0));heroXY={x:POS[heroNode][0],y:POS[heroNode][1]};
  sync(false);drawMap();renderHero();refreshHUD();centerOnHero(false);
  requestAnimationFrame(loop);
  if(!H.intro)setTimeout(intro,400);else setTimeout(()=>{try{loginGift()}catch(e){}},900);
  const list=[...CH.slice(1).flatMap((c,i)=>c.stages.map(q=>`grade7-vol2-ch${i+1}/images/battle/${q[0]}.png`)),M.art,GC.home.wallpaper].concat(M.buildings.map(b=>b.img),GC.home.items.map(i=>i.img),GC.home.furniture.map(i=>i.img),ITEMS.map(i=>i.img),ITEMS.filter(i=>i.slot==='cloak').map(i=>heroPath({cloak:i.id})),ITEMS.filter(i=>i.slot==='cloak').map(i=>LAYPATH.body(i.id)),ITEMS.filter(i=>(i.slot==='hat'||i.slot==='staff')&&!/_none$/.test(i.id)).map(i=>LAYPATH.item(i.id))).filter(Boolean);
  probe(list,()=>{drawMap();renderHero();place(0);if($('#home').classList.contains('on'))renderHome();document.body.classList.remove('mapwait')});
  reportNow(false);
}
window.addEventListener('resize',()=>{fit();centerOnHero(false)});
window.addEventListener('pageshow',ev=>{if(ev.persisted){load();refreshAll(false);centerOnHero(false)}});
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&ready){load();calcStats();sync(false);drawMap();refreshHUD();reportNow(false)}});
init();
})();
</script>
<script>
/* 小貓圖示統一：把畫面上所有的 🐱 自動換成 images/home/catnest.png（智慧貓小圖）。想換圖只改 MS_CAT_URL。 */
var MS_CAT_URL = (function () { try { return 'images/home/catnest.png'; } catch (e) { return 'images/home/catnest.png'; } })();
(function () {
  function mk() { var i = document.createElement('img'); i.src = MS_CAT_URL; i.alt = '智慧貓'; i.className = 'ms-catico'; i.style.cssText = 'height:1.25em;width:1.25em;object-fit:contain;vertical-align:-.3em'; return i; }
  var busy = false;
  function fixNode(root) {
    if (!root) return;
    var w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, null), list = [], n;
    while ((n = w.nextNode())) {
      if (n.nodeValue.indexOf('\uD83D\uDC31') < 0) continue;
      var p = n.parentNode; if (!p || /^(SCRIPT|STYLE|TEXTAREA|TITLE|OPTION)$/i.test(p.nodeName) || (window.SVGElement && p instanceof SVGElement)) continue;
      list.push(n);
    }
    list.forEach(function (t) {
      var parts = t.nodeValue.split('\uD83D\uDC31'), f = document.createDocumentFragment();
      parts.forEach(function (s, k) { if (k) f.appendChild(mk()); if (s) f.appendChild(document.createTextNode(s)); });
      t.parentNode.replaceChild(f, t);
    });
  }
  function run() { if (busy) return; busy = true; try { fixNode(document.body); } finally { busy = false; } }
  var pend = false;
  function later() { if (pend) return; pend = true; (window.requestAnimationFrame || setTimeout)(function () { pend = false; run(); }); }
  function start() { run(); try { new MutationObserver(later).observe(document.body, { childList: true, subtree: true, characterData: true }); } catch (e) {} }
  if (document.body) start(); else document.addEventListener('DOMContentLoaded', start);
})();
</script>
