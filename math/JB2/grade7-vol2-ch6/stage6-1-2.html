<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>6-1-2 線對稱圖形與對稱軸｜數靈召喚師</title>
<style>
:root{--ink:#161a2e;--ink2:#20264a;--line:#3a4270;--bronze:#d2a24c;--paper:#f1e8d2;--red:#d24a33;--jade:#43a58f;--txt:#e9e4d4}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(ellipse at top,#2a2456,var(--ink) 65%);color:var(--txt);font-family:"Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;min-height:100vh}
h1,h2,.serif{font-family:"Noto Serif TC","Songti TC","PMingLiU",serif}
main{max-width:960px;margin:0 auto;padding:16px}
.hide{display:none!important}
button{font:inherit;cursor:pointer;color:inherit}
button:focus-visible{outline:3px solid var(--bronze);outline-offset:2px}
.card{background:var(--ink2);border:2px solid var(--line);border-radius:14px;padding:18px}
.btn{background:var(--bronze);color:#2a1d05;border:0;border-radius:10px;padding:12px 22px;font-weight:700;font-size:1.05rem}
.btn.ghost{background:transparent;color:var(--bronze);border:2px solid var(--bronze)}
.modes{display:grid;gap:10px;margin:16px 0}
.mode{text-align:left;background:var(--ink);border:2px solid var(--line);border-radius:12px;padding:12px 14px}
.mode.on{border-color:var(--bronze);background:#2b2a3c}
.mode b{font-size:1.1rem}.mode small{display:block;opacity:.75;margin-top:2px}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;font-weight:700}
.combo{color:var(--bronze);min-width:5em;text-align:right}
.battle-grid{display:grid;grid-template-columns:1.15fr 1fr;gap:18px;align-items:start;margin-top:10px}
@media (max-width:720px){.battle-grid{grid-template-columns:1fr}}
.battle-left{display:flex;flex-direction:column;gap:10px;min-width:0}
.battle-right{display:flex;flex-direction:column;align-items:center;gap:8px;background:var(--ink2);border:2px solid var(--line);border-radius:14px;padding:18px 12px}
.hearts-row{font-size:1.5rem;letter-spacing:4px}
.boss-ring{position:relative;width:220px;height:220px;margin:4px auto}
#mon{font-size:5.5rem;transition:transform .3s;position:absolute;top:50%;left:50%;transform:translate(-50%,-50%)}
#mon-img{width:150px;height:150px;object-fit:contain;display:block}
#mon-emoji{display:none}
#mon.hit{transform:translate(-50%,-50%) scale(1.2) rotate(-6deg)}
#mon.dead{opacity:0;transform:translate(-50%,-40%) rotate(20deg) scale(1.5)}
.seal{position:absolute;top:50%;left:50%;width:30px;height:30px;margin:-15px;border-radius:50%;background:#1b1738;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:15px;opacity:.32;transition:opacity .3s,background-color .3s,border-color .3s}
.seal.lit{opacity:1;background:var(--bronze);border-color:var(--bronze);color:#2a1d05}
.mname{font-size:1rem;opacity:.9;margin-top:2px;text-align:center}
.mhpwrap{margin:4px auto 0;width:85%;height:10px;background:#1b1738;border-radius:6px;overflow:hidden}
#mhp{height:100%;background:var(--red);width:100%;transition:width .3s}
.timebar{height:8px;background:var(--ink);border-radius:6px;overflow:hidden}
#bar{height:100%;background:var(--jade);width:100%;transition:width .1s linear}
.q{background:var(--paper);color:#2b2416;border-radius:12px;padding:18px;text-align:center;flex:1}
.q .t{font-size:1.2rem;font-weight:700;line-height:1.6}
.q .hint{margin-top:8px;font-size:.95rem;color:#7a4a12}
.qsvg{margin:10px auto 0}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.opt{background:var(--ink2);border:2px solid var(--bronze);border-radius:12px;padding:14px 6px;font-size:1.05rem;font-weight:700}
.opt:hover:not(:disabled){background:#33396b}
.opt.ok{background:var(--jade);border-color:var(--jade);color:#06231c}
.opt.bad{background:var(--red);border-color:var(--red)}
.opt.cut{opacity:.15;pointer-events:none}
.tools{display:flex;gap:8px;flex-wrap:wrap}
.tool{flex:1;min-width:100px;background:var(--ink);border:2px solid var(--line);border-radius:10px;padding:8px}
.tool:disabled{opacity:.35;cursor:not-allowed}
#say{border-left:5px solid var(--bronze);background:var(--ink);padding:12px 14px;border-radius:8px;line-height:1.7}
#say.win{border-color:var(--jade)}#say.lose{border-color:var(--red)}
.stars{font-size:2.6rem;letter-spacing:6px}
.jail{margin-top:12px;display:grid;gap:8px}
.jail div{background:var(--ink);border-radius:8px;padding:10px 12px;line-height:1.6;font-size:.95rem}
@media (max-width:480px){.opt{font-size:.95rem}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<body>
<main>
<section id="s-start" class="card">
<h1 class="serif" style="margin:0">數靈召喚師：生活中的幾何圖形</h1>
<h2 class="serif" style="margin:6px 0 0;color:var(--bronze)">6-1 觀念二：線對稱圖形與對稱軸</h2>
<p style="line-height:1.7">【鏡像對稱蝶】展開翅膀，考驗召喚師找出對稱點！關於 y 軸對稱：x 變號；關於 x 軸對稱：y 變號；關於原點對稱：x、y 都變號。算出正確的對稱點坐標，就能複製對稱蝶的翅膀紋路！</p>
<div class="modes" id="modes">
<button class="mode on" data-m="easy"><b>練兵模式</b><small>不限時，數字較小</small></button>
<button class="mode" data-m="real"><b>實戰模式</b><small>每題 15 秒，數字稍微變大</small></button>
<button class="mode" data-m="hard"><b>修羅模式</b><small>每題 10 秒，出現鉛垂線對稱軸</small></button>
</div>
<button class="btn" id="go">迎戰鏡像對稱蝶！</button>
</section>

<section id="s-game" class="hide">
<div class="top"><span id="wave">第 1/10 回合</span><span class="combo" id="combo"></span></div>
<div class="battle-grid">
  <div class="battle-left">
    <div class="timebar"><div id="bar"></div></div>
    <div style="text-align:right;font-size:.85rem;opacity:.8" id="sec"></div>
    <div class="q"><div class="t" id="qt"></div><div class="hint hide" id="hintbox"></div></div>
    <div class="opts" id="opts"></div>
    <div class="tools">
      <button class="tool" id="t-hint">💡 提示</button>
      <button class="tool" id="t-cut">✂️ 刪去法</button>
      <button class="tool" id="t-freeze">⏳ 時間凍結</button>
    </div>
    <div id="say" class="hide"></div>
  </div>
  <div class="battle-right">
    <div class="hearts-row" id="hearts"></div>
    <div class="boss-ring" id="boss-ring">
      <div id="mon"><img id="mon-img" src="images/battle/6-1-2.png" alt="鏡像對稱蝶" onerror="this.style.display='none';document.getElementById('mon-emoji').style.display='';"><span id="mon-emoji">🦋</span></div>
    </div>
    <div class="mname">鏡像對稱蝶</div>
    <div class="mhpwrap"><div id="mhp"></div></div>
  </div>
</div>
</section>

<section id="s-end" class="card hide" style="text-align:center">
<h2 class="serif" id="e-title" style="margin:0"></h2>
<div class="stars" id="e-stars"></div>
<p id="e-info" style="line-height:1.8"></p>
<div id="e-jail" class="jail" style="text-align:left"></div>
<p style="margin-top:16px">
<button class="btn" id="again">再戰一次</button>
<button class="btn ghost" id="rescue">重練錯題</button>
<button class="btn ghost hide" id="back">返回地圖</button>
</p>
</section>

</main>
<script src="lessons2.js"></script>
<script src="mode-system.js"></script>
<script>
const $=s=>document.querySelector(s);
const R=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
const pick=a=>a[R(0,a.length-1)];
const sh=a=>a.map(v=>[Math.random(),v]).sort((x,y)=>x[0]-y[0]).map(x=>x[1]);
function ensure4(ans,cands){
  const s=new Set([ans]);
  for(const c of cands){const cs=String(c);if(s.size<4&&cs!==ans&&cs.trim()!=='')s.add(cs);}
  let g=1;
  while(s.size<4){const v=(Number(ans)||0)+(g%2===0?g/2+5:-(Math.ceil(g/2)+4));const vs=String(v);if(!s.has(vs))s.add(vs);g++;}
  return sh([...s]);
}
function gcd(a,b){a=Math.abs(a);b=Math.abs(b);return b?gcd(b,a%b):(a||1)}
function lcm(a,b){return Math.abs(a*b)/gcd(a,b)}
/* 坐標平面 SVG 繪圖工具：points 畫點、lines 畫 ax+by=c 直線、dashedTo 畫到兩軸的虛線 */
function lineSegPoints(a,b,c,R2){
  const pts=[];
  if(b!==0){[-R2,R2].forEach(x=>{const y=(c-a*x)/b;if(y>=-R2-0.0001&&y<=R2+0.0001)pts.push([x,y]);});}
  if(a!==0){[-R2,R2].forEach(y=>{const x=(c-b*y)/a;if(x>=-R2-0.0001&&x<=R2+0.0001)pts.push([x,y]);});}
  if(pts.length<2)return null;
  pts.sort((p,q)=>p[0]-q[0]||p[1]-q[1]);
  return [pts[0],pts[pts.length-1]];
}
function svgGrid(opts){
  const RG=opts.range||7,S=260,C=S/2,U=(S-36)/(2*RG);
  const toX=x=>C+x*U,toY=y=>C-y*U;
  let g=`<div class="qsvg"><svg viewBox="0 0 ${S} ${S}" style="width:100%;max-width:260px;background:#fff;border-radius:8px" xmlns="http://www.w3.org/2000/svg">`;
  for(let i=-RG;i<=RG;i++){
    g+=`<line x1="${toX(i)}" y1="${toY(-RG)}" x2="${toX(i)}" y2="${toY(RG)}" stroke="#e3e3e3" stroke-width="1"/>`;
    g+=`<line x1="${toX(-RG)}" y1="${toY(i)}" x2="${toX(RG)}" y2="${toY(i)}" stroke="#e3e3e3" stroke-width="1"/>`;
  }
  g+=`<line x1="${toX(-RG)}" y1="${toY(0)}" x2="${toX(RG)}" y2="${toY(0)}" stroke="#333" stroke-width="2"/>`;
  g+=`<line x1="${toX(0)}" y1="${toY(-RG)}" x2="${toX(0)}" y2="${toY(RG)}" stroke="#333" stroke-width="2"/>`;
  g+=`<text x="${toX(RG)-10}" y="${toY(0)-6}" font-size="12" fill="#333">x</text><text x="${toX(0)+6}" y="${toY(RG)+12}" font-size="12" fill="#333">y</text>`;
  (opts.lines||[]).forEach(ln=>{
    const pts=lineSegPoints(ln.a,ln.b,ln.c,RG);
    if(pts)g+=`<line x1="${toX(pts[0][0])}" y1="${toY(pts[0][1])}" x2="${toX(pts[1][0])}" y2="${toY(pts[1][1])}" stroke="${ln.color||'#d24a33'}" stroke-width="2.5"/>`;
  });
  (opts.dashedTo||[]).forEach(p=>{
    g+=`<line x1="${toX(p.x)}" y1="${toY(p.y)}" x2="${toX(p.x)}" y2="${toY(0)}" stroke="#999" stroke-width="1.3" stroke-dasharray="4,3"/>`;
    g+=`<line x1="${toX(p.x)}" y1="${toY(p.y)}" x2="${toX(0)}" y2="${toY(p.y)}" stroke="#999" stroke-width="1.3" stroke-dasharray="4,3"/>`;
  });
  (opts.points||[]).forEach(p=>{
    g+=`<circle cx="${toX(p.x)}" cy="${toY(p.y)}" r="4.5" fill="${p.color||'#d24a33'}"/>`;
    if(p.label)g+=`<text x="${toX(p.x)+6}" y="${toY(p.y)-6}" font-size="12" font-weight="700" fill="${p.color||'#d24a33'}">${p.label}</text>`;
  });
  g+='</svg></div>';
  return g;
}
function fmtEq(a,b,c){
  return (a===1?'':a)+'x + '+(b===1?'':b)+'y = '+c;
}
function fmtEqGen(a,b,c){
  let s=(a===1?'':a===-1?'-':a)+'x';
  s+=b>=0?' + '+(b===1?'':b)+'y':' - '+(Math.abs(b)===1?'':Math.abs(b))+'y';
  s+=' = '+c;
  return s;
}
const QUADS=['第一象限','第二象限','第三象限','第四象限'];
function quadName(x,y){
  if(x===0&&y===0)return '原點（不屬於任何象限）';
  if(x===0)return 'y 軸上（不屬於任何象限）';
  if(y===0)return 'x 軸上（不屬於任何象限）';
  if(x>0&&y>0)return '第一象限';
  if(x<0&&y>0)return '第二象限';
  if(x<0&&y<0)return '第三象限';
  return '第四象限';
}
function fmtNum(n){
  if(Number.isInteger(n))return String(n);
  return String(Math.round(n*100)/100);
}
function cubeGrid(grid){
  let html='<div class="qsvg"><table style="margin:8px auto;border-collapse:collapse;font-family:monospace;font-size:1.15rem">';
  html+='<caption style="caption-side:top;font-size:.78rem;color:#555;margin-bottom:4px">（鳥瞰圖／數字＝該位置堆疊的正方體個數・上排＝後排，下排＝前排）</caption>';
  for(let r=0;r<grid.length;r++){
    html+='<tr>';
    for(let c=0;c<grid[r].length;c++){
      html+=`<td style="border:2px solid #333;width:38px;height:38px;text-align:center;background:#fff;color:#2b2416">${grid[r][c]}</td>`;
    }
    html+='</tr>';
  }
  html+='</table></div>';
  return html;
}
const MODES={easy:{t:0,max:5},real:{t:15,max:7},hard:{t:10,max:9}};
const PLAN=['reflectYAxis','reflectXAxis','identifyAxis','reflectVLine','reflectYAxis','reflectXAxis','identifyAxis','reflectVLine','reflectYAxis','reflectXAxis'];

function genReflectYAxis(M){
  const x=R(1,M.max)*(Math.random()<0.5?1:-1);
  const y=R(1,M.max)*(Math.random()<0.5?1:-1);
  const text=`鏡像對稱蝶展開翅膀，左翅膀有棋子坐標 (${x}, ${y})，對稱軸為 y 軸，請問右翅膀相對應的對稱點坐標為何？`;
  const ans=`(${-x}, ${y})`;
  const wrong1=`(${x}, ${-y})`,wrong2=`(${-x}, ${-y})`,wrong3=`(${y}, ${x})`;
  return {text,ans,options:ensure4(ans,[wrong1,wrong2,wrong3]),
    hint:'關於 y 軸對稱：y 坐標不變，x 坐標變成相反數。',
    explain:`(${x}, ${y}) 關於 y 軸的對稱點，y 坐標不變仍是 ${y}，x 坐標變成相反數 ${-x}，所以是 (${-x}, ${y})。`};
}
function genReflectXAxis(M){
  const x=R(1,M.max)*(Math.random()<0.5?1:-1);
  const y=R(1,M.max)*(Math.random()<0.5?1:-1);
  const text=`鏡像對稱蝶展開翅膀，上翅膀有棋子坐標 (${x}, ${y})，對稱軸為 x 軸，請問下翅膀相對應的對稱點坐標為何？`;
  const ans=`(${x}, ${-y})`;
  const wrong1=`(${-x}, ${y})`,wrong2=`(${-x}, ${-y})`,wrong3=`(${y}, ${x})`;
  return {text,ans,options:ensure4(ans,[wrong1,wrong2,wrong3]),
    hint:'關於 x 軸對稱：x 坐標不變，y 坐標變成相反數。',
    explain:`(${x}, ${y}) 關於 x 軸的對稱點，x 坐標不變仍是 ${x}，y 坐標變成相反數 ${-y}，所以是 (${x}, ${-y})。`};
}
function genReflectVLine(M){
  const k=R(-M.max,M.max);
  const x=R(-M.max,M.max);
  const y=R(-M.max,M.max);
  const symX=2*k-x;
  const text=`對稱蝶把對稱軸換成了鉛垂線 x = ${k}，已知一點坐標 (${x}, ${y})，請問它的對稱點坐標為何？`;
  const ans=`(${symX}, ${y})`;
  const wrong1=`(${x}, ${y})`,wrong2=`(${-x}, ${y})`,wrong3=`(${symX}, ${-y})`;
  return {text,ans,options:ensure4(ans,[wrong1,wrong2,wrong3]),
    hint:'關於直線 x=k 對稱：y 坐標不變，可用公式「對稱點 x 坐標 = 2k − 原 x 坐標」。',
    explain:`對稱點的 x 坐標 = 2×${k} − ${x} = ${symX}，y 坐標不變，所以對稱點為 (${symX}, ${y})。`};
}
function genIdentifyAxis(M){
  const x=R(1,M.max),y=R(1,M.max);
  const type=pick(['y','x','origin']);
  let symX,symY,desc;
  if(type==='y'){symX=-x;symY=y;desc='y 軸';}
  else if(type==='x'){symX=x;symY=-y;desc='x 軸';}
  else{symX=-x;symY=-y;desc='原點（中心對稱）';}
  const text=`已知一點 (${x}, ${y}) 與它的對稱點 (${symX}, ${symY})，這是關於什麼對稱？`;
  const ans=desc;
  return {text,ans,options:['y 軸','x 軸','原點（中心對稱）','無法判斷'],
    hint:'y 坐標不變、x 變號 → 關於 y 軸；x 坐標不變、y 變號 → 關於 x 軸；兩個坐標都變號 → 關於原點。',
    explain:`(${x},${y}) 變成 (${symX},${symY})，${type==='y'?'y 坐標沒變、x 變號，所以是關於 y 軸對稱':type==='x'?'x 坐標沒變、y 變號，所以是關於 x 軸對稱':'x、y 坐標都變號，所以是關於原點對稱'}。`};
}
function gen(t){
  const M=MODES[mode];
  if(t==='reflectYAxis')return genReflectYAxis(M);
  if(t==='reflectXAxis')return genReflectXAxis(M);
  if(t==='identifyAxis')return genIdentifyAxis(M);
  return genReflectVLine(M);
}
const EMB=window.parent!==window,SID='6-1-2';
function log(ok){if(EMB&&!rescue)parent.postMessage({type:'wave-log',id:SID,qtype:q.type,ok:ok},'*')}
let mode='easy',qs=[],idx=0,q=null,hearts=5,combo=0,score=0,right=0,wrongs=[],lock=true,left=0,tm=0,frozenUntil=0,rescue=false,used={},showRing=false,sealsLit=0;

function show(id){['s-start','s-game','s-end'].forEach(s=>$('#'+s).classList.toggle('hide',s!=id))}
function drawHearts(){$('#hearts').textContent='❤️'.repeat(hearts)+'🖤'.repeat(5-hearts)}
function drawCombo(){$('#combo').textContent=combo>=2?`🔥 連擊 ×${combo}`:''}
function say(html,cls){const e=$('#say');e.className=cls||'';e.innerHTML=html}
function buildSeals(n){
  const ring=$('#boss-ring');
  ring.querySelectorAll('.seal').forEach(s=>s.remove());
  for(let i=0;i<n;i++){
    const ang=i*(360/n);
    const s=document.createElement('div');
    s.className='seal';s.dataset.i=i;s.textContent='🔒';
    s.style.transform=`rotate(${ang}deg) translate(105px) rotate(${-ang}deg)`;
    ring.appendChild(s);
  }
}
function lightSeal(k){
  const s=$('#boss-ring .seal[data-i="'+(k-1)+'"]');
  if(s){s.textContent='🔓';s.classList.add('lit');}
}
function paint(){
  const T=MODES[mode].t;
  $('#bar').style.width=T?(left/T*100)+'%':'100%';
  $('#sec').textContent=T?Math.ceil(left)+' 秒':'不限時';
  $('#mhp').style.width=MS.hp(right,qs.length)+'%';
}

function start(types,isRescue){
  rescue=!!isRescue;qs=MS.begin(rescue)?[]:types.map(x=>Object.assign(gen(x),{type:x}));idx=0;hearts=5;combo=0;score=0;right=0;wrongs=[];
  used={hint:0,cut:0,freeze:0};
  $('#mon').className='';
  showRing=!rescue&&!MS.active();sealsLit=0;
  if(showRing){buildSeals(qs.length||PLAN.length);}else{$('#boss-ring').querySelectorAll('.seal').forEach(s=>s.remove());}
  show('s-game');drawHearts();drawCombo();next();
}
function next(){
  clearInterval(tm);
  if(MS.halt())return;
  if(MS.active()){mode=MS.prep(idx+1);if(idx>=qs.length&&hearts>0){const ty=MS.pick(PLAN);qs.push(Object.assign(gen(ty),{type:ty}));}}
  if(idx>=qs.length||hearts<=0)return finish();
  q=qs[idx++];lock=false;
  $('#wave').textContent=MS.wave(idx,qs.length,'回合')+(rescue?'（重練錯題）':'');
  $('#qt').innerHTML=q.text+(q.svg||'');
  $('#hintbox').classList.add('hide');
  say('');$('#say').classList.add('hide');
  const o=$('#opts');o.innerHTML='';
  q.options.forEach(v=>{const b=document.createElement('button');b.className='opt';b.textContent=v;b.dataset.v=v;b.onclick=()=>answer(v,b);o.appendChild(b)});
  $('#t-hint').disabled=!!used.hint;$('#t-cut').disabled=!!used.cut;
  $('#t-freeze').disabled=!!used.freeze||!MODES[mode].t;
  startTimer();paint();
}
function startTimer(){
  const T=MODES[mode].t;left=T;frozenUntil=0;paint();if(!T)return;
  tm=setInterval(()=>{
    if(Date.now()<frozenUntil)return;
    left-=0.1;paint();
    if(left<=0){clearInterval(tm);miss(null)}
  },100);
}
function answer(v,btn){
  if(lock)return;
  if(v===q.ans){
    lock=true;clearInterval(tm);
    btn.classList.add('ok');combo++;right++;log(true);
    if(showRing){sealsLit++;lightSeal(sealsLit);}
    const gain=100+(combo-1)*20;score+=gain;drawCombo();
    $('#mon').classList.add('hit');setTimeout(()=>$('#mon').classList.remove('hit'),300);
    paint();
    $('#say').classList.remove('hide');
    const last=idx>=qs.length;
    say((last?'🔮 鏡像複製術命中要害，對稱蝶被淨化捕獲！':'⚔️ 鏡像複製術命中！')+` +${gain} 靈力`+(combo>=3?`　🔥 ${combo} 連擊！`:''),'win');
    if(last)$('#mon').classList.add('dead');
    setTimeout(next,1000);
  }else{
    btn.classList.add('bad');miss(btn);
  }
}
function miss(btn){
  if(lock)return;
  lock=true;clearInterval(tm);
  hearts--;combo=0;wrongs.push(q);log(false);drawHearts();drawCombo();
  document.querySelectorAll('.opt').forEach(b=>{if(b.dataset.v===q.ans)b.classList.add('ok')});
  $('#say').classList.remove('hide');
  say(`<b>${btn?'💥 對稱蝶反擊，召喚師受到傷害！':'⏰ 時間到，對稱蝶逃脫了一波！'}</b><br>🐱 導師智慧貓：正確答案是 <b>${q.ans}</b>。${q.explain}<br><button class="btn" id="nx" style="margin-top:8px">${hearts<=0?'查看戰報':'下一回合'}</button>`,'lose');
  $('#nx').onclick=next;$('#nx').focus();
}
function finish(){
  clearInterval(tm);show('s-end');
  const fail=hearts<=0,total=qs.length;
  let stars=fail?0:wrongs.length<=1?3:wrongs.length<=3?2:1;
  if(rescue){
    $('#e-title').textContent='重練錯題結束';
    $('#e-stars').textContent='';
    $('#e-info').textContent=`成功答對 ${right}/${total} 題。`+(right==total?'全部融會貫通！':'再接再厲！');
  }else{
    $('#e-title').textContent=fail?'💔 收服失敗':'🎉 收服成功';
    $('#e-stars').textContent=fail?'':'⭐'.repeat(stars)+'☆'.repeat(3-stars);
    const rankName=fail?'':['','見習召喚師','中階召喚師','菁英召喚師'][stars];
    $('#e-info').textContent=(rankName?rankName+'　':'')+`靈力 ${score}　答對 ${right}/${total}　剩餘生命 ${hearts} 顆心`;
  }
  const j=$('#e-jail');j.innerHTML='';
  if(wrongs.length){
    const h=document.createElement('div');h.innerHTML=`<b>📖 數靈觀察日誌（${wrongs.length} 題）</b>`;j.appendChild(h);
    wrongs.forEach(w=>{const d=document.createElement('div');d.innerHTML=`${w.text}<br>正解：<b>${w.ans}</b>　${w.explain}`;j.appendChild(d)});
  }
  $('#rescue').classList.toggle('hide',!wrongs.length||rescue);
  $('#back').classList.toggle('hide',!EMB);
  MS.result({sid:SID,emb:EMB,rescue:rescue,mode:mode,stars:stars,fail:fail,score:score,right:right,total:total});
}

$('#modes').onclick=e=>{const b=e.target.closest('.mode');if(!b)return;mode=b.dataset.m;document.querySelectorAll('.mode').forEach(x=>x.classList.toggle('on',x==b))};
$('#go').onclick=()=>start(PLAN,false);
$('#back').onclick=()=>parent.postMessage({type:'stage-exit'},'*');
$('#again').onclick=()=>show('s-start');
$('#rescue').onclick=()=>start(wrongs.map(w=>w.type),true);
$('#t-hint').onclick=()=>{if(lock||used.hint)return;used.hint=1;$('#t-hint').disabled=true;const h=$('#hintbox');h.textContent='💡 '+q.hint;h.classList.remove('hide')};
$('#t-cut').onclick=()=>{if(lock||used.cut)return;used.cut=1;$('#t-cut').disabled=true;
  sh([...document.querySelectorAll('.opt')].filter(b=>b.dataset.v!==q.ans)).slice(0,2).forEach(b=>b.classList.add('cut'))};
$('#t-freeze').onclick=()=>{if(lock||used.freeze)return;used.freeze=1;$('#t-freeze').disabled=true;frozenUntil=Date.now()+10000;
  $('#say').classList.remove('hide');say('⏳ 時間凍結 10 秒！慢慢想。')};
MS.init(MODES, SID);
</script>
</body>
</html>
