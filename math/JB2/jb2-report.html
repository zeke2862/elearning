<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>國一下數學戰略地圖｜教師後台</title>
<style>
:root{--ink:#161a2e;--ink2:#20264a;--line:#3a4270;--bronze:#d2a24c;--paper:#f1e8d2;--red:#d24a33;--jade:#43a58f;--txt:#e9e4d4}
*{box-sizing:border-box}
body{margin:0;background:var(--ink);color:var(--txt);font-family:"Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif}
main{max-width:1280px;margin:0 auto;padding:16px 16px 60px}
h1{margin:0 0 4px;font-family:"Noto Serif TC","Songti TC",serif}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--bronze);outline-offset:2px}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:12px 0}
.b{background:var(--ink2);border:2px solid var(--bronze);border-radius:8px;padding:8px 14px}
.b.on{background:var(--bronze);color:#2a1d05;font-weight:700}
.b.ghost{border-color:var(--line)}
select,input[type=number],input[type=text],input[type=password]{background:var(--ink2);border:2px solid var(--line);border-radius:8px;padding:7px 10px}
input[type=text],input[type=password]{flex:1 1 260px;min-width:0}
.card{background:var(--ink2);border:2px solid var(--line);border-radius:12px;padding:14px;margin-top:12px}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.9rem}
th,td{border:1px solid var(--line);padding:6px 8px;text-align:center;white-space:nowrap}
th{background:#252c56;position:sticky;top:0}
td.l,th.l{text-align:left}
.s0{color:#6b7090}.s1{background:#5a4a1e}.s2{background:#33553d}.s3{background:#2f7a5b;font-weight:700}.s4{background:#2a6f8f;font-weight:700}.s5{background:#8a6d1c;font-weight:700;color:#fff3c4}
.a0{color:#6b7090}.alo{background:#6a2a22;font-weight:700}.amid{background:#5a4a1e}.ahi{background:#2f7a5b}
.t1{background:#2a3a66}.t2{background:#2a4f7a}.t3{background:#2a6f8f;font-weight:700}
.acc{display:inline-block;height:10px;border-radius:5px;background:var(--jade);vertical-align:middle}
.acc.lo{background:var(--red)}.acc.mid{background:var(--bronze)}
.msg{margin:6px 0;font-size:.9rem;opacity:.9}
.hide{display:none}
small{opacity:.75}
details summary{cursor:pointer;font-weight:700}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:8px 0}
.row label{min-width:6em;opacity:.85}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 8px}
.chip{border:1px solid var(--line);border-radius:999px;padding:3px 12px;font-size:.85rem}
tr.rw{cursor:pointer}tr.rw:hover td{filter:brightness(1.25)}
td.sub{font-size:.75rem;opacity:.8}
</style>
</head>
<body>
<main>
<h1>教師後台</h1>
<small>國一下「數靈召喚師（JB2）」　學生進度、各關答對率與練習時間、題型弱點、個別診斷（資料直接來自 Google 試算表）</small>

<div class="card">
<details id="set">
<summary>⚙️ 設定（第一次使用要填）</summary>
<div class="row"><label>接收網址</label><input type="text" id="url" placeholder="https://script.google.com/macros/s/…/exec"></div>
<div class="row"><label>老師密碼</label><input type="password" id="tok" placeholder="你在 Apps Script 設定的 JB2_TOKEN" autocomplete="off"></div>
<div class="row"><label>班級名單</label><input type="file" id="rost" accept=".xlsx,.xls,.csv"><span id="rostInfo" class="msg"></span></div>
<div class="msg">名單欄位：班級、座號、學號、姓名。名單與密碼只存在「這台電腦的這個瀏覽器」，不會上傳到網路；換電腦要再匯入一次。</div>
<div class="row"><button class="b" id="save">儲存並載入</button><button class="b ghost" id="clr">清除這台電腦存的名單與密碼</button></div>
</details>
</div>

<div class="bar">
  <label>班級 <select id="cls"></select></label>
  <button class="b on" data-t="prog">班級進度表</button>
  <button class="b" data-t="weak">題型弱點</button>
  <button class="b" data-t="one">個別學生</button>
  <button class="b ghost" id="reload">🔄 重新載入</button>
  <span class="msg" id="msg"></span>
</div>

<section id="v-prog" class="card"></section>
<section id="v-weak" class="card hide"></section>
<section id="v-one" class="card hide"></section>
<p class="msg">「練習時間」只算<b>做完一次</b>的時間：中途跳開（切到別的程式／分頁）的時間不算，中途直接關閉的那一次整次不算；單次最多算 30 分鐘。「答對率」是這一關所有作答題目的答對比例。</p>
</main>

<script src="game-config.js"></script>
<script src="jb2-labels.js"></script>
<script src="xlsx.full.min.js"></script>
<script>
const GC = window.GAME_CONFIG || {chapters: []};
const LS = {url: 'jb2rep-url', tok: 'jb2rep-token', rost: 'jb2rep-roster'};
const DEFAULT_URL = '';
const LAB = window.JB2_LABELS || {};
const MODE = {easy: '練兵', real: '實戰', hard: '修羅', end: '無極限'};
const STAGES = GC.chapters.flatMap(c => c.stages.map(s => ({id: s[0], name: s[1], boss: !!s[2], ch: c.n})));
const SNAME = {}; STAGES.forEach(s => SNAME[s.id] = s.name);

let ROSTER = [], DATA = {}, ROWS = [], tab = 'prog', view = 'acc', oneNo = '', loaded = false;
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const get = k => { try { return localStorage.getItem(k) || ''; } catch (e) { return ''; } };
const put = (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} };
const say = t => { $('#msg').textContent = t; };
const secsOf = j => j ? (j.pSecs || 0) : 0;
const fmtSecs = s => { s = Math.round(s || 0); if (s < 60) return s + ' 秒'; const m = Math.floor(s / 60); return m < 60 ? m + ' 分' : Math.floor(m / 60) + ' 小時 ' + (m % 60) + ' 分'; };
const fmtShort = s => { s = Math.round(s || 0); if (!s) return '—'; if (s < 60) return s + '秒'; if (s < 3600) return Math.round(s / 60) + '分'; return (s / 3600).toFixed(1) + '時'; };
const fmtAt = t => { if (!t) return '—'; const d = new Date(t), p = n => String(n).padStart(2, '0'); return `${p(d.getMonth()+1)}/${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`; };
const typeLabel = k => { const [sid, ty] = String(k).split(':'); return LAB[k] || ty || ''; };
const qLabel = k => { const sid = String(k).split(':')[0]; return `${sid} ${SNAME[sid] || ''}・${typeLabel(k)}`; };
const stageAcc = s => (s && s.totalQ > 0) ? s.totalOk / s.totalQ : null;
const accCls = a => a == null ? 'a0' : a < .6 ? 'alo' : a < .8 ? 'amid' : 'ahi';
function download(name, text) { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text], {type: 'text/csv;charset=utf-8'})); a.download = name; document.body.appendChild(a); a.click(); a.remove(); }
const csvCell = v => { let s = String(v == null ? '' : v); if (/^[=+\-@\t\r]/.test(s)) s = "'" + s; return /[",\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
const toCSV = rows => '﻿' + rows.map(r => r.map(csvCell).join(',')).join('\r\n');

/* ===== 名單 ===== */
function loadRoster() { try { ROSTER = JSON.parse(get(LS.rost)) || []; } catch (e) { ROSTER = []; } rostInfo(); }
function rostInfo() { $('#rostInfo').textContent = ROSTER.length ? `已匯入 ${ROSTER.length} 位` : '尚未匯入'; }
function parseRosterRows(rows) {
  const head = rows[0].map(x => String(x).trim()), ix = n => head.indexOf(n);
  const ic = ix('班級'), is = ix('座號'), ino = ix('學號'), ina = ix('姓名');
  if (ic < 0 || ino < 0 || ina < 0) throw new Error('名單第一列要有「班級、座號、學號、姓名」');
  return rows.slice(1).filter(r => r[ino] != null && String(r[ino]).trim()).map(r => ({cls: String(r[ic] || '').trim(), seat: is >= 0 ? Number(r[is]) || 0 : 0, no: String(r[ino]).trim(), name: String(r[ina] || '').trim()}));
}
$('#rost').addEventListener('change', async e => {
  const f = e.target.files[0]; if (!f) return;
  try {
    let rows;
    if (/\.csv$/i.test(f.name)) rows = (await f.text()).replace(/^﻿/, '').split(/\r?\n/).filter(Boolean).map(l => l.split(','));
    else { const wb = XLSX.read(await f.arrayBuffer(), {type: 'array'}); rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], {header: 1, raw: false}); }
    ROSTER = parseRosterRows(rows); put(LS.rost, JSON.stringify(ROSTER)); rostInfo(); build(); render(); say(`名單已匯入 ${ROSTER.length} 位`);
  } catch (err) { alert('名單讀取失敗：' + err.message); }
});

/* ===== 讀取資料 ===== */
async function loadData() {
  const url = $('#url').value.trim(), tok = $('#tok').value.trim();
  if (!url || !tok) { $('#set').open = true; say('請先填入接收網址與老師密碼'); return; }
  say('載入中…');
  try {
    const res = await fetch(url + (url.includes('?') ? '&' : '?') + 'action=jb2&token=' + encodeURIComponent(tok));
    const data = await res.json();
    if (!data.success) throw new Error(data.message === 'forbidden' ? '老師密碼不對，或 Apps Script 還沒設定 JB2_TOKEN' : (data.message || '回應錯誤'));
    DATA = {}; data.students.forEach(s => DATA[String(s.studentNumber)] = s.jb2);
    loaded = true; build(); render(); say(`已載入 ${Object.keys(DATA).length} 位學生的紀錄`);
  } catch (err) { say('❌ 讀取失敗：' + err.message + '（請確認 Apps Script 已重新部署為「新版本」，存取權限是「所有人」）'); }
}

/* ===== 組表 ===== */
function mk(r, j) {
  const st = j ? j.stages || {} : {};
  let q = 0, ok = 0; Object.keys(st).forEach(k => { q += st[k].totalQ || 0; ok += st[k].totalOk || 0; });
  return {cls: r.cls, seat: r.seat, no: r.no, name: r.name, hero: j ? (j.hero || '') : '', played: !!j, j, st,
    stars: j ? (j.totalStars || 0) : 0, plays: j ? (j.totalPlays || 0) : 0, secs: secsOf(j), acc: q ? ok / q : null, at: j ? (j._at || 0) : 0};
}
function build() {
  const seen = new Set(), rows = [];
  ROSTER.forEach(r => { seen.add(r.no); rows.push(mk(r, DATA[r.no])); });
  Object.keys(DATA).forEach(no => { if (!seen.has(no)) rows.push(mk({cls: '名單外', seat: 0, no, name: ''}, DATA[no])); });
  rows.sort((a, b) => (a.cls > b.cls ? 1 : a.cls < b.cls ? -1 : 0) || a.seat - b.seat || (a.no > b.no ? 1 : -1));
  ROWS = rows;
  const cs = [...new Set(rows.map(r => r.cls))], cur = $('#cls').value;
  $('#cls').innerHTML = '<option value="">全部班級</option>' + cs.map(c => `<option value="${esc(c)}">${esc(c)}</option>`).join('');
  if (cs.includes(cur)) $('#cls').value = cur;
}
const list = () => ROWS.filter(r => !$('#cls').value || r.cls === $('#cls').value);

/* ===== 班級進度表 ===== */
function cell(r, s) {
  const x = r.st[s.id];
  if (view === 'stars') { const n = x ? x.bestStars || 0 : 0; return n ? `<td class="s${n}">${'★'.repeat(n)}</td>` : '<td class="s0">—</td>'; }
  if (view === 'acc') { const a = stageAcc(x); return a == null ? '<td class="a0">—</td>' : `<td class="${accCls(a)}" title="${x.totalOk}/${x.totalQ} 題">${Math.round(a * 100)}%</td>`; }
  if (view === 'time') { const t = x ? x.pSecs || 0 : 0; return t ? `<td class="t${t < 300 ? 1 : t < 900 ? 2 : 3}" title="${fmtSecs(t)}">${fmtShort(t)}</td>` : '<td class="s0">—</td>'; }
  const p = x ? x.plays || 0 : 0; return p ? `<td class="t${p < 3 ? 1 : p < 6 ? 2 : 3}">${p}</td>` : '<td class="s0">—</td>';
}
/* 最下面兩列：各關「累積作答總題數」的答對率（所有人、所有次數的題目加總）＋總題數；再依目前顯示補一列（時間／次數） */
function footAcc(L) {
  return STAGES.map(s => { let q = 0, ok = 0; L.forEach(r => { const x = r.st[s.id]; if (x) { q += x.totalQ || 0; ok += x.totalOk || 0; } });
    return q ? `<th class="${accCls(ok / q)}" title="${ok}/${q} 題">${Math.round(ok / q * 100)}%</th>` : '<th class="a0">—</th>'; }).join('');
}
function footQ(L) {
  return STAGES.map(s => { let q = 0; L.forEach(r => { const x = r.st[s.id]; if (x) q += x.totalQ || 0; }); return `<th>${q || '—'}</th>`; }).join('');
}
function footExtra(L) {
  return STAGES.map(s => {
    if (view === 'time') { const ts = L.map(r => (r.st[s.id] || {}).pSecs || 0).filter(Boolean); return `<th>${ts.length ? fmtShort(ts.reduce((a, b) => a + b, 0) / ts.length) : '—'}</th>`; }
    return `<th>${L.reduce((a, r) => a + ((r.st[s.id] || {}).plays || 0), 0) || '—'}</th>`;
  }).join('');
}
const FOOT_EXTRA = {time: '平均練習時間（有練的人）', plays: '練習次數合計'};
function renderProg() {
  const L = list().filter(r => ($('#st') ? $('#st').value : '') === 'p' ? r.played : ($('#st') && $('#st').value === 'n' ? !r.played : true))
    .filter(r => { const q = ($('#q') ? $('#q').value.trim().toLowerCase() : ''); return !q || (r.name + r.no + r.hero).toLowerCase().includes(q); });
  const keep = {st: $('#st') ? $('#st').value : '', q: $('#q') ? $('#q').value : ''};
  const all = list(), played = all.filter(r => r.played), avg = played.length ? played.reduce((a, r) => a + r.stars, 0) / played.length : 0;
  if (!all.length) { $('#v-prog').innerHTML = '<p>還沒有資料。請先到上方「設定」填入網址與密碼、匯入名單，再按「儲存並載入」。</p>'; return; }
  $('#v-prog').innerHTML = `<div class="chips"><span class="chip">共 <b>${all.length}</b> 位</span><span class="chip">已玩 <b>${played.length}</b></span><span class="chip">還沒玩 <b>${all.length - played.length}</b></span><span class="chip">已玩者平均 <b>${avg.toFixed(1)}</b> 顆星</span></div>
  <div class="bar"><label>每格顯示 <select id="vw"><option value="stars">⭐ 星數</option><option value="acc">🎯 答對率</option><option value="time">⏱️ 練習時間</option><option value="plays">🔁 練習次數</option></select></label>
  <label>狀態 <select id="st"><option value="">全部</option><option value="p">已玩</option><option value="n">還沒玩</option></select></label>
  <input type="text" id="q" placeholder="搜尋姓名／學號／勇者名" style="flex:0 1 220px"><button class="b" id="e-prog">⬇️ 匯出 Excel（CSV）</button></div>
  <div class="tw"><table><tr><th class="l">班級</th><th>座號</th><th class="l">姓名</th><th>總星數</th><th>練習次數</th><th>練習時間</th><th>整體答對率</th>${STAGES.map(s => `<th title="${esc(s.id + ' ' + s.name)}">${s.id}${s.boss ? '👹' : ''}</th>`).join('')}</tr>` +
    L.map(r => `<tr class="rw" data-no="${esc(r.no)}"><td class="l">${esc(r.cls)}</td><td>${r.seat || ''}</td><td class="l">${esc(r.name || '（' + r.no + '）')}</td><td>${r.played ? r.stars : '—'}</td><td>${r.played ? r.plays : '—'}</td><td>${r.played ? fmtShort(r.secs) : '—'}</td><td>${r.acc == null ? '—' : Math.round(r.acc * 100) + '%'}</td>${STAGES.map(s => cell(r, s)).join('')}</tr>`).join('') +
    `<tr><th class="l" colspan="7">各關累積答對率（全班所有作答題目）</th>${footAcc(played)}</tr><tr><th class="l" colspan="7">各關累積作答總題數</th>${footQ(played)}</tr>${FOOT_EXTRA[view] ? `<tr><th class="l" colspan="7">${FOOT_EXTRA[view]}</th>${footExtra(played)}</tr>` : ''}</table></div>`;
  $('#vw').value = view; $('#st').value = keep.st; $('#q').value = keep.q;
  $('#vw').onchange = () => { view = $('#vw').value; renderProg(); };
  $('#st').onchange = renderProg; $('#q').oninput = () => { renderProg(); const q = $('#q'); q.focus(); q.setSelectionRange(q.value.length, q.value.length); };
  $('#v-prog').querySelectorAll('tr.rw').forEach(tr => tr.onclick = () => { oneNo = tr.dataset.no; tab = 'one'; render(); });
  $('#e-prog').onclick = () => download('JB2班級進度表.csv', toCSV([['班級', '座號', '學號', '姓名', '勇者名', '總星數', '練習次數', '練習秒數', '整體答對率(%)', '最後一關', '最後更新'].concat(...STAGES.map(s => [s.id + ' 星', s.id + ' 次數', s.id + ' 答對率(%)', s.id + ' 練習秒數'])),
    ...L.map(r => [r.cls, r.seat || '', r.no, r.name, r.hero, r.played ? r.stars : '', r.played ? r.plays : '', r.played ? r.secs : '', r.acc == null ? '' : Math.round(r.acc * 100), r.j ? (r.j.lastId || '') + ' ' + (r.j.lastName || '') : '', r.at ? new Date(r.at).toLocaleString('zh-TW', {hour12: false}) : ''].concat(...STAGES.map(s => { const x = r.st[s.id]; const a = stageAcc(x); return x ? [x.bestStars || 0, x.plays || 0, a == null ? '' : Math.round(a * 100), x.pSecs || 0] : ['', '', '', '']; })))]));
}

/* ===== 題型弱點（全班） ===== */
function aggregate(L) {
  const m = {}; L.forEach(r => { const q = r.j && r.j.q || {}; Object.keys(q).forEach(k => { const o = m[k] || (m[k] = {n: 0, ok: 0}); o.n += q[k].n; o.ok += q[k].ok; }); });
  return Object.keys(m).map(k => ({k, label: qLabel(k), n: m[k].n, ok: m[k].ok, acc: m[k].ok / m[k].n}));
}
const weakRows = (rows, minN) => rows.filter(r => r.n >= minN).sort((a, b) => a.acc - b.acc || b.n - a.n);
const bar = a => { const c = a < .6 ? 'lo' : a < .8 ? 'mid' : ''; return `<span class="acc ${c}" style="width:${Math.max(2, Math.round(a * 100))}px"></span> ${Math.round(a * 100)}%`; };
function renderWeak() {
  const L = list().filter(r => r.played), minN = +($('#minn') && $('#minn').value) || 5;
  if (!L.length) { $('#v-weak').innerHTML = '<p>還沒有資料。</p>'; return; }
  const rows = weakRows(aggregate(L), minN);
  $('#v-weak').innerHTML = `<div class="bar"><b>全班各題型答對率（由低到高）</b><label>至少作答 <input type="number" id="minn" min="1" value="${minN}" style="width:5em"> 次才列入</label><button class="b" id="e-weak">⬇️ 匯出 Excel（CSV）</button></div><div class="tw"><table><tr><th class="l">關卡與題型</th><th>作答次數</th><th class="l">答對率</th></tr>` +
    (rows.length ? rows.map(r => `<tr><td class="l">${esc(r.label)}</td><td>${r.n}</td><td class="l">${bar(r.acc)}</td></tr>`).join('') : '<tr><td colspan="3">資料還不夠，請調低「至少作答次數」。</td></tr>') + '</table></div>';
  $('#minn').onchange = renderWeak;
  $('#e-weak').onclick = () => download('JB2題型弱點.csv', toCSV([['關卡', '題型', '作答次數', '答對次數', '答對率(%)'], ...rows.map(r => [r.k.split(':')[0], typeLabel(r.k), r.n, r.ok, Math.round(r.acc * 100)])]));
}

/* ===== 個別學生 ===== */
function renderOne() {
  const L = list();
  if (!L.length) { $('#v-one').innerHTML = '<p>還沒有資料。</p>'; return; }
  let i = L.findIndex(r => r.no === oneNo); if (i < 0) i = 0; const r = L[i]; oneNo = r.no; const j = r.j;
  let h = `<div class="bar"><label>學生 <select id="who">${L.map((s, k) => `<option value="${k}" ${k === i ? 'selected' : ''}>${esc(s.cls)} ${s.seat || ''} ${esc(s.name || s.no)}${s.played ? '' : '（還沒玩）'}</option>`).join('')}</select></label>`;
  if (!j) return $('#v-one').innerHTML = h + '</div><p>這位同學還沒有任何 JB2 紀錄。</p>', bindWho(L);
  h += `<b>${r.stars} 顆星｜練習 ${r.plays} 次｜共 ${fmtSecs(r.secs)}｜整體答對率 ${r.acc == null ? '—' : Math.round(r.acc * 100) + '%'}</b></div>`;
  h += `<p>勇者名：${esc(j.hero) || '—'}　學號：${esc(r.no)}　最後一關：${j.lastId ? esc(j.lastId + ' ' + (j.lastName || '')) + `（${esc(MODE[j.lastMode] || '')} 本次 ${j.lastStars == null ? '—' : j.lastStars + '★'}／最高 ${j.lastBest || 0}★）` : '—'}　最後更新：${fmtAt(j._at)}</p>`;
  h += '<p><b>各關狀況</b></p><div class="tw"><table><tr><th class="l">關卡</th><th>最高星</th><th>練習次數</th><th>答對率</th><th>練習時間</th><th>最近一次</th></tr>';
  STAGES.forEach(s => { const x = r.st[s.id]; if (!x) { h += `<tr><td class="l s0">${s.id} ${esc(s.name)}</td><td class="s0">—</td><td class="s0">—</td><td class="s0">—</td><td class="s0">—</td><td class="s0">—</td></tr>`; return; }
    const a = stageAcc(x); h += `<tr><td class="l">${s.id} ${esc(s.name)}</td>${(x.bestStars || 0) ? `<td class="s${x.bestStars}">${'★'.repeat(x.bestStars)}</td>` : '<td class="s0">—</td>'}<td>${x.plays || 0}</td><td class="${accCls(a)}">${a == null ? '—' : Math.round(a * 100) + '%（' + x.totalOk + '/' + x.totalQ + '）'}</td><td>${(x.pSecs || 0) ? fmtSecs(x.pSecs) : '—'}</td><td>${x.lastStars == null ? '—' : x.lastStars + '★'} ${esc(MODE[x.lastMode] || '')}</td></tr>`; });
  h += '</table></div>';
  const wr = weakRows(Object.keys(j.q || {}).map(k => ({k, label: qLabel(k), n: j.q[k].n, ok: j.q[k].ok, acc: j.q[k].ok / j.q[k].n})), 3).slice(0, 8);
  h += '<p><b>最需要加強的題型（作答 3 次以上）：</b></p>' + (wr.length ? `<div class="tw"><table><tr><th class="l">關卡與題型</th><th>作答次數</th><th class="l">答對率</th></tr>${wr.map(x => `<tr><td class="l">${esc(x.label)}</td><td>${x.n}</td><td class="l">${bar(x.acc)}</td></tr>`).join('')}</table></div>` : '<p>這位同學的作答資料還不夠。</p>');
  $('#v-one').innerHTML = h; bindWho(L);
}
function bindWho(L) { const w = $('#who'); if (w) w.onchange = () => { oneNo = L[+w.value].no; renderOne(); }; }

/* ===== 切換、事件 ===== */
function render() {
  ({prog: renderProg, weak: renderWeak, one: renderOne})[tab]();
  ['prog', 'weak', 'one'].forEach(t => $('#v-' + t).classList.toggle('hide', t !== tab));
  document.querySelectorAll('[data-t]').forEach(b => b.classList.toggle('on', b.dataset.t === tab));
}
document.querySelectorAll('[data-t]').forEach(b => b.onclick = () => { tab = b.dataset.t; render(); });
$('#cls').onchange = render;
$('#save').onclick = () => { put(LS.url, $('#url').value.trim()); put(LS.tok, $('#tok').value.trim()); $('#set').open = false; loadData(); };
$('#reload').onclick = loadData;
$('#clr').onclick = () => { if (!confirm('確定清除這台電腦存的名單、網址和密碼嗎？')) return; [LS.url, LS.tok, LS.rost].forEach(k => { try { localStorage.removeItem(k); } catch (e) {} }); location.reload(); };

$('#url').value = get(LS.url) || DEFAULT_URL; $('#tok').value = get(LS.tok);
loadRoster(); build(); render();
if ($('#url').value && $('#tok').value) loadData(); else $('#set').open = true;
</script>
</body>
</html>
