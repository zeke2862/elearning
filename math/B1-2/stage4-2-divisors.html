<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>4-2 找因數行動｜韓信點兵：數字戰線</title>
<style>
:root{--ink:#161a2e;--ink2:#20264a;--line:#3a4270;--bronze:#d2a24c;--paper:#f1e8d2;--red:#d24a33;--jade:#43a58f;--txt:#e9e4d4}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(ellipse at top,#252c56,var(--ink) 65%);color:var(--txt);font-family:"Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;min-height:100vh}
h1,h2,.serif{font-family:"Noto Serif TC","Songti TC","PMingLiU",serif}
main{max-width:720px;margin:0 auto;padding:16px}
.hide{display:none!important}
button{font:inherit;cursor:pointer;color:inherit}
button:focus-visible{outline:3px solid var(--bronze);outline-offset:2px}
.card{background:var(--ink2);border:2px solid var(--line);border-radius:14px;padding:18px}
.btn{background:var(--bronze);color:#2a1d05;border:0;border-radius:10px;padding:12px 22px;font-weight:700;font-size:1.05rem}
.btn.ghost{background:transparent;color:var(--bronze);border:2px solid var(--bronze)}
.modes{display:grid;gap:10px;margin:16px 0}
.mode{text-align:left;background:var(--ink);border:2px solid var(--line);border-radius:12px;padding:12px 14px}
.mode.on{border-color:var(--bronze);background:#2b2a3c}
.mode b{font-size:1.1rem}.mode small{display:block;opacity:.75;margin-top:2px}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;font-weight:700}
.hearts{letter-spacing:2px}
.combo{color:var(--bronze);min-width:5em;text-align:right}
.field{position:relative;height:96px;margin:12px 0;border-radius:12px;background:linear-gradient(#1b2040,#2b3160);border:2px solid var(--line);overflow:hidden}
.field::after{content:"";position:absolute;left:0;right:0;bottom:0;height:22px;background:#3b3f2e}
.wall{position:absolute;right:0;top:0;bottom:0;width:20%;background:repeating-linear-gradient(#6a5a45 0 14px,#57493a 14px 16px);border-left:4px solid var(--bronze);display:flex;align-items:center;justify-content:center;font-size:2rem}
#enemy{position:absolute;bottom:14px;left:0;font-size:2.4rem;transition:left .15s linear,opacity .6s,transform .6s;white-space:nowrap}
#enemy.dead{opacity:0;transform:translateY(-30px) rotate(20deg) scale(1.4)}
.timebar{height:8px;background:var(--ink);border-radius:6px;overflow:hidden}
#bar{height:100%;background:var(--jade);width:100%;transition:width .1s linear}
.q{background:var(--paper);color:#2b2416;border-radius:12px;padding:18px;margin:12px 0;text-align:center}
.q .t{font-size:1.25rem;font-weight:700;line-height:1.5}
.q .hint{margin-top:8px;font-size:.95rem;color:#7a4a12}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.opt{background:var(--ink2);border:2px solid var(--bronze);border-radius:12px;padding:16px 6px;font-size:1.5rem;font-weight:700;font-variant-numeric:tabular-nums}
.opt:hover:not(:disabled){background:#33396b}
.opt.ok{background:var(--jade);border-color:var(--jade);color:#06231c}
.opt.bad{background:var(--red);border-color:var(--red)}
.opt.cut{opacity:.15;pointer-events:none}
.tools{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.tool{flex:1;min-width:100px;background:var(--ink);border:2px solid var(--line);border-radius:10px;padding:8px}
.tool:disabled{opacity:.35;cursor:not-allowed}
#say{margin-top:12px;border-left:5px solid var(--bronze);background:var(--ink);padding:12px 14px;border-radius:8px;line-height:1.7}
#say.win{border-color:var(--jade)}#say.lose{border-color:var(--red)}
.bp{grid-column:1/-1;background:var(--ink2);border:2px solid var(--bronze);border-radius:12px;padding:12px;text-align:center}
.tg{display:grid;gap:2px;justify-content:center;max-height:150px;overflow:auto;margin-bottom:8px;padding:4px}
.tg i{width:16px;height:16px;border-radius:3px;display:block}
.tg i.g{background:var(--jade)}.tg i.y{background:var(--bronze)}.tg i.r{background:var(--red)}
.bi{min-height:1.6em;margin-bottom:8px;line-height:1.5}
.stp{display:flex;gap:10px;align-items:center;justify-content:center;font-size:1.1rem;margin-bottom:10px}
.stp input{width:4.2em;font:inherit;font-size:1.2rem;text-align:center;border-radius:8px;border:2px solid var(--bronze);background:var(--ink);color:var(--txt);padding:6px}
.bb{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.sq{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:10px}
.sh{background:var(--ink);border:2px solid var(--bronze);border-radius:10px;padding:14px 4px;font-size:1.4rem;font-weight:700;font-variant-numeric:tabular-nums}
.sh.on{background:var(--jade);border-color:var(--jade);color:#06231c}
.sh.pk{outline:3px solid var(--jade)}
.sh.wr{background:var(--red);border-color:var(--red);color:#fff}
.lad{background:var(--paper);color:#2b2416;border-radius:10px;padding:10px;margin:8px 0;min-height:56px;font-size:1.25rem;font-weight:700;font-variant-numeric:tabular-nums}
.lr{display:flex;justify-content:center;align-items:stretch}
.lr .d{min-width:2.2em;text-align:right;padding-right:.5em;border-right:3px solid #2b2416}
.lr .v{min-width:4.2em;text-align:left;padding-left:.6em;border-bottom:2px solid #2b2416}
#tray{gap:8px}#tray .sh{min-width:64px}
.cols{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-bottom:8px}
.pc{background:var(--ink);border:2px solid var(--line);border-radius:10px;padding:8px 10px;text-align:center;min-width:68px}
.stk{display:flex;flex-direction:column-reverse;align-items:center;gap:2px;height:170px;justify-content:flex-start;margin-bottom:6px}
.stk i{display:block;width:34px;height:14px;background:var(--bronze);border-radius:3px}
.pc:nth-child(2) .stk i{background:var(--jade)}.pc:nth-child(3) .stk i{background:#6fb7ff}
.pc:nth-child(4) .stk i{background:var(--red)}.pc:nth-child(5) .stk i{background:#b58cf0}.pc:nth-child(6) .stk i{background:#f0cf85}
.sm{width:36px;height:36px;font-size:1.2rem;border-radius:8px;border:2px solid var(--bronze);background:var(--ink2);margin:2px}
.boxes{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;margin:8px 0;max-height:96px;overflow:auto}
.boxes i{font-style:normal;font-size:1.3rem}
.cr{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;background:var(--ink);border:2px solid var(--line);border-radius:10px;padding:8px 10px;margin-bottom:6px;text-align:left;line-height:1.5}
.cr.wr{border-color:var(--red)}
.ct{flex:1;min-width:180px}.cbs{display:flex;gap:6px}
.cb{border:2px solid var(--bronze);background:var(--ink2);border-radius:8px;padding:6px 10px;font-size:.95rem}
.cb.on{background:var(--jade);border-color:var(--jade);color:#06231c}
.stars{font-size:2.6rem;letter-spacing:6px}
.jail{margin-top:12px;display:grid;gap:8px}
.jail div{background:var(--ink);border-radius:8px;padding:10px 12px;line-height:1.6;font-size:.95rem}
@media (max-width:480px){.opt{font-size:1.25rem}.field{height:84px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<main>

<section id="s-start" class="card">
  <h1 class="serif" style="margin:0">韓信點兵：數字戰線</h1>
  <h2 class="serif" style="margin:6px 0 0;color:var(--bronze)">4-2　找因數行動</h2>
  <p style="line-height:1.7">戰術已經選好了，現在開始行動！分裝、剪裁這類「找因數」的任務，要先處理餘數，化成整除，才能用最大公因數。擊退 10 波敵軍，守住有 5 顆心的城牆！</p>
  <div class="modes" id="modes">
    <button class="mode on" data-m="easy"><b>練兵模式</b><small>不限時，適合先熟悉規則</small></button>
    <button class="mode" data-m="real"><b>實戰模式</b><small>每波 35 秒，敵軍會逼近城牆</small></button>
    <button class="mode" data-m="hard"><b>修羅模式</b><small>每波 25 秒，情報更刁鑽</small></button>
  </div>
  <button class="btn" id="go">出征！</button>
</section>

<section id="s-game" class="hide">
  <div class="top">
    <span id="wave">第 1/10 波</span>
    <span class="hearts" id="hearts"></span>
    <span class="combo" id="combo"></span>
  </div>
  <div class="field"><div id="enemy">🔪🛡️</div><div class="wall">🏯</div></div>
  <div class="timebar"><div id="bar"></div></div>
  <div style="text-align:right;font-size:.85rem;opacity:.8;margin-top:2px" id="sec"></div>
  <div class="q"><div class="t" id="qt"></div><div class="hint hide" id="hintbox"></div></div>
  <div class="opts" id="opts"></div>
  <div class="tools">
    <button class="tool" id="t-hint">💡 提示</button>
    <button class="tool" id="t-cut">✂️ 刪去法</button>
    <button class="tool" id="t-freeze">⏳ 時間凍結</button>
  </div>
  <div id="say" class="hide"></div>
</section>

<section id="s-end" class="card hide" style="text-align:center">
  <h2 class="serif" id="e-title" style="margin:0"></h2>
  <div class="stars" id="e-stars"></div>
  <p id="e-info" style="line-height:1.8"></p>
  <div id="e-jail" class="jail" style="text-align:left"></div>
  <p style="margin-top:16px">
    <button class="btn" id="again">再戰一次</button>
    <button class="btn ghost" id="rescue">解救戰俘</button>
    <button class="btn ghost hide" id="back">返回地圖</button>
  </p>
</section>

</main>
<script>
const $=s=>document.querySelector(s);
const R=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
const pick=a=>a[R(0,a.length-1)];
const sh=a=>a.map(v=>[Math.random(),v]).sort((x,y)=>x[0]-y[0]).map(x=>x[1]);
const MODES={easy:{t:0},real:{t:35},hard:{t:25}};
const PLAN=['act','calc','act','gt','act','calc','act','calc','gt','act'];
const EMB=window.parent!==window,SID='4-2';
let mode='easy',qs=[],idx=0,q=null,hearts=5,combo=0,score=0,right=0,wrongs=[],lock=true,left=0,tm=0,frozenUntil=0,rescue=false,used={};

const gcd=(a,b)=>b?gcd(b,a%b):a,G=a=>a.reduce(gcd),LC=a=>a.reduce((x,y)=>x/gcd(x,y)*y);
const ITEMS=[['橘子','個'],['蘋果','個'],['芒果','個']];
function pkN(n){let ks;do{ks=Array.from({length:n},()=>R(2,8))}while(G(ks)!=1||new Set(ks).size<n);return ks}
const adjOf=st=>st.f=='gr'?st.arr.map(v=>v-st.r):st.f=='gs'?st.arr.map(v=>v+st.s):st.arr;
function story(f){
  const n=mode=='hard'?3:2,ks=pkN(n);let g,r,s,arr,text;
  const list=a=>a.map((v,i)=>`<b>${v}</b> ${ITEMS[i][1]}${ITEMS[i][0]}`).join('、');
  if(f=='gcd'){g=R(2,9);arr=ks.map(k=>g*k);text=`有 ${list(arr)}，要分裝成每盒內容完全一樣、而且不剩下，最多可以裝幾盒？`}
  else if(f=='gr'){r=R(1,4);g=R(r+1,r+8);arr=ks.map(k=>r+g*k);text=`有 ${list(arr)}，分給同一批小朋友，每人分到每一種水果的數量都一樣，結果每一種水果都<b>剩 ${r} 個</b>。最多有幾個小朋友？`}
  else{s=R(1,4);g=R(s+1,s+8);arr=ks.map(k=>g*k-s);text=`有 ${list(arr)}，分給同一批小朋友，每人分到每一種水果的數量都一樣，結果每一種水果都<b>還差 ${s} 個</b>才夠分。最多有幾個小朋友？`}
  return {f:f,g:g,r:r,s:s,arr:arr,text:text};
}
function pick3(ans,c){
  const ok=x=>x!=ans&&x>0&&Number.isInteger(x),w=[...new Set(c)].filter(ok);
  const f=[ans+1,ans*2,ans+2,ans*3,ans-1].filter(x=>ok(x)&&!w.includes(x));
  return [...sh(w),...sh(f)].slice(0,3);
}
const HOW={gcd:'不用處理，直接求最大公因數',gr:'先減掉餘數，再求最大公因數',gs:'先加上不足，再求最大公因數'};
function explain(st){
  const ad=adjOf(st);
  if(st.f=='gcd')return `不剩下，直接求最大公因數：(${st.arr.join(', ')}) = ${st.g}。`;
  if(st.f=='gr')return `每一種都剩 ${st.r} 個，先減掉餘數：${st.arr.map((v,i)=>`${v}−${st.r}=${ad[i]}`).join('、')}，再求最大公因數 (${ad.join(', ')}) = ${st.g}。${st.g} 比餘數 ${st.r} 大，合理！`;
  return `每一種都還差 ${st.s} 個，先加上不足：${st.arr.map((v,i)=>`${v}+${st.s}=${ad[i]}`).join('、')}，再求最大公因數 (${ad.join(', ')}) = ${st.g}。${st.g} 比不足的數 ${st.s} 大，合理！`;
}
function gen(t){
  let o;
  if(t=='calc'){
    const st=story(pick(['gcd','gr','gs'])),ad=adjOf(st),g=st.g;
    const c=[G(st.arr),LC(ad),g*2,st.f=='gr'?G(st.arr.map(v=>v+st.r)):st.f=='gs'?G(st.arr.map(v=>v-st.s)):g+1];
    o={ans:g,fam:st.f,r:st.r,s:st.s,arr:st.arr,options:sh([g,...pick3(g,c)]),text:st.text+'（請算出答案）',
       hint:'先處理餘數（剩下要減、不足要加），化成整除後，再求最大公因數。',explain:explain(st)};
  }else if(t=='act'){
    const st=story(pick(['gcd','gr','gs']));
    o={kind:'squad',layout:'act',fam:st.f,g:st.g,r:st.r,s:st.s,arr:st.arr,ans:1,options:[],text:st.text+'（兩步驟：先決定怎麼處理數字，再算出答案）',
       hint:'剩下的要減、不足的要加，化成整除後再求最大公因數。答案一定要比餘數（或不足）大。',
       ansText:`${st.g}（${HOW[st.f]}）`,explain:explain(st)};
  }else{
    const r=R(1,6),X=r+R(2,9)*R(2,9),bad=R(1,r),goods=sh([...Array(9)].map((_,i)=>r+1+i)).slice(0,3);
    o={ans:bad,options:sh([bad,...goods]),text:`某個數去除 ${X}，餘數是 ${r}。下列哪一個數「不可能」是這個除數？`,
       hint:'想想看：餘數可以比除數大嗎？',explain:`餘數一定比除數小。所以除數一定要大於 ${r}，而 ${bad} 不大於 ${r}，不可能。`};
  }
  o.type=t;return o;
}
function buildPanel(){
  const box=document.createElement('div');box.className='bp';
  box.innerHTML=`<div id="s1"><div class="bi">第一步：這份情報的數字要怎麼處理？</div><div class="bb"><button class="btn ghost sb" data-v="gcd">不用處理</button><button class="btn ghost sb" data-v="gr">減掉餘數</button><button class="btn ghost sb" data-v="gs">加上不足</button></div></div><div id="s2" class="hide"><div class="bi" id="adj" style="text-align:left"></div><div class="stp"><label>最後答案 <input type="number" id="av" min="1"></label></div><div class="bb"><button class="btn" id="go2">✅ 確認</button></div></div><div class="bi" id="bi"></div>`;
  $('#opts').appendChild(box);
  let wrong=0;const dummy=()=>document.createElement('button');
  const strike=msg=>{wrong++;combo=0;drawCombo();$('#bi').textContent=`${msg}（${wrong}/3）`;if(wrong>=3)answer(0,dummy())};
  const st={f:q.fam,r:q.r,s:q.s,arr:q.arr,g:q.g};
  $('#s1').onclick=e=>{
    const b=e.target.closest('.sb');if(!b||lock)return;
    if(b.dataset.v!==q.fam){strike('❌ 這不是正確的處理方式，再讀一次情報有沒有「剩下」或「還差」！');return}
    const ad=adjOf(st);
    $('#adj').innerHTML=(q.fam=='gcd'?`✅ 不用處理：(${q.arr.join(', ')})`:q.fam=='gr'?`✅ 減掉餘數 ${q.r}：`+q.arr.map((v,i)=>`${v}−${q.r}=${ad[i]}`).join('、'):`✅ 加上不足 ${q.s}：`+q.arr.map((v,i)=>`${v}+${q.s}=${ad[i]}`).join('、'))+`<br>第二步：用短除法求 (${ad.join(', ')}) 的最大公因數。`;
    $('#s1').classList.add('hide');$('#s2').classList.remove('hide');$('#bi').textContent='';
  };
  $('#go2').onclick=()=>{
    if(lock)return;const v=$('#av').value;
    if(v===''){$('#bi').textContent='⚠️ 先填入答案喔！';return}
    if(+v===q.g){answer(1,dummy());return}
    strike('❌ 算出來不是這個數，再檢查一次短除法！');
  };
}

// ---------- 畫面 ----------
function show(id){['s-start','s-game','s-end'].forEach(s=>$('#'+s).classList.toggle('hide',s!=id))}
function drawHearts(){$('#hearts').textContent='❤️'.repeat(hearts)+'🖤'.repeat(5-hearts)}
function drawCombo(){$('#combo').textContent=combo>=2?`🔥 連擊 ×${combo}`:''}
function say(html,cls){const e=$('#say');e.className=cls||'';e.innerHTML=html}
function paint(){
  const T=MODES[mode].t;
  $('#enemy').style.left=(T?(1-left/T)*74:28)+'%';
  $('#bar').style.width=T?(left/T*100)+'%':'100%';
  $('#sec').textContent=T?Math.ceil(left)+' 秒':'不限時';
}

function start(types,isRescue){
  rescue=!!isRescue;qs=types.map(gen);idx=0;hearts=5;combo=0;score=0;right=0;wrongs=[];
  used={hint:0,cut:0,freeze:0};
  show('s-game');drawHearts();drawCombo();next();
}
function next(){
  clearInterval(tm);
  if(idx>=qs.length||hearts<=0)return finish();
  q=qs[idx++];lock=false;
  $('#wave').textContent=`第 ${idx}/${qs.length} 波`+(rescue?'（解救戰俘）':'');
  $('#qt').innerHTML=q.text;
  $('#hintbox').classList.add('hide');
  say('');$('#say').classList.add('hide');
  $('#enemy').className='';
  const o=$('#opts');o.innerHTML='';
  q.options.forEach(v=>{const b=document.createElement('button');b.className='opt';b.textContent=v;b.dataset.v=v;b.onclick=()=>answer(v,b);o.appendChild(b)});
  if(q.kind=='squad')buildPanel();
  $('#t-hint').disabled=!!used.hint;$('#t-cut').disabled=!!used.cut||q.kind=='squad';
  $('#t-freeze').disabled=!!used.freeze||!MODES[mode].t;
  startTimer();
}
function startTimer(){
  const T=MODES[mode].t;left=T;frozenUntil=0;paint();if(!T)return;
  tm=setInterval(()=>{
    if(Date.now()<frozenUntil)return;
    left-=0.1;paint();
    if(left<=0){clearInterval(tm);miss(null)}
  },100);
}
function answer(v,btn){
  if(lock)return;
  if(v===q.ans){
    lock=true;clearInterval(tm);
    btn.classList.add('ok');combo++;right++;
    const gain=100+(combo-1)*20;score+=gain;drawCombo();
    $('#enemy').classList.add('dead');
    $('#say').classList.remove('hide');
    say(`⚔️ 擊退敵軍！ +${gain} 戰功`+(combo>=3?`　🔥 ${combo} 連擊！`:''),'win');
    setTimeout(next,1000);
  }else{
    btn.classList.add('bad');miss(btn);
  }
}
function miss(btn){
  if(lock)return;
  lock=true;clearInterval(tm);
  hearts--;combo=0;wrongs.push(q);drawHearts();drawCombo();
  document.querySelectorAll('.opt').forEach(b=>{if(b.dataset.v===String(q.ans))b.classList.add('ok')});
  $('#say').classList.remove('hide');
  say(`<b>${btn?'❌ 城牆受損！':'⏰ 時間到，敵軍撞上城牆！'}</b><br>🧙 軍師說：正確答案是 <b>${q.ansText!==undefined?q.ansText:q.ans}</b>。${q.explain}<br><button class="btn" id="nx" style="margin-top:8px">${hearts<=0?'查看戰報':'下一波'}</button>`,'lose');
  $('#nx').onclick=next;$('#nx').focus();
}
function finish(){
  clearInterval(tm);show('s-end');
  const fail=hearts<=0,total=qs.length;
  let stars=fail?0:wrongs.length<=1?3:wrongs.length<=3?2:1;
  if(rescue){
    $('#e-title').textContent='解救戰俘行動結束';
    $('#e-stars').textContent='';
    $('#e-info').textContent=`成功救回 ${right}/${total} 位戰俘。`+(right==total?'全員歸隊！':'沒救出的，下次再來！');
  }else{
    $('#e-title').textContent=fail?'城牆倒塌了…':['','新兵','伍長','校尉'][stars]+'　凱旋！';
    $('#e-stars').textContent=fail?'💔':'⭐'.repeat(stars)+'☆'.repeat(3-stars);
    $('#e-info').textContent=`戰功 ${score}　答對 ${right}/${total}　剩餘城牆 ${hearts} 顆心`;
  }
  const j=$('#e-jail');j.innerHTML='';
  if(wrongs.length){
    const h=document.createElement('div');h.innerHTML=`<b>⛓️ 戰俘營（${wrongs.length} 題）</b>`;j.appendChild(h);
    wrongs.forEach(w=>{const d=document.createElement('div');d.innerHTML=`${w.text}<br>正解：<b>${w.ansText!==undefined?w.ansText:w.ans}</b>　${w.explain}`;j.appendChild(d)});
  }
  $('#rescue').classList.toggle('hide',!wrongs.length||rescue);
  $('#back').classList.toggle('hide',!EMB);
  if(EMB&&!rescue)parent.postMessage({type:'stage-result',id:SID,stars:stars,fail:fail,score:score,right:right,total:total},'*');
}

// ---------- 事件 ----------
$('#modes').onclick=e=>{const b=e.target.closest('.mode');if(!b)return;mode=b.dataset.m;document.querySelectorAll('.mode').forEach(x=>x.classList.toggle('on',x==b))};
$('#go').onclick=()=>start(PLAN,false);
$('#back').onclick=()=>parent.postMessage({type:'stage-exit'},'*');
$('#again').onclick=()=>show('s-start');
$('#rescue').onclick=()=>start(wrongs.map(w=>w.type),true);
$('#t-hint').onclick=()=>{if(lock||used.hint)return;used.hint=1;$('#t-hint').disabled=true;const h=$('#hintbox');h.textContent='💡 '+q.hint;h.classList.remove('hide')};
$('#t-cut').onclick=()=>{if(lock||used.cut)return;used.cut=1;$('#t-cut').disabled=true;
  sh([...document.querySelectorAll('.opt')].filter(b=>+b.dataset.v!==q.ans)).slice(0,2).forEach(b=>b.classList.add('cut'))};
$('#t-freeze').onclick=()=>{if(lock||used.freeze)return;used.freeze=1;$('#t-freeze').disabled=true;frozenUntil=Date.now()+10000;
  $('#say').classList.remove('hide');say('⏳ 時間凍結 10 秒！慢慢想。')};
</script>
</body>
</html>
