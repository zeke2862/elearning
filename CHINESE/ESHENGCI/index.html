<!DOCTYPE html>
<html lang="zh-TW"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>生詞大挑戰｜簡單版・進階版</title>
<style>
:root{--bg1:#fff7e0;--bg2:#e3f4ff;--ink:#2b3a55;--pri:#4f8cff;--ok:#2fbf71;--bad:#f0525b;--on:#ffd23f}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;color:var(--ink);background:linear-gradient(135deg,var(--bg1),var(--bg2))}
.screen{display:none;max-width:860px;margin:0 auto;padding:18px}.screen.on{display:block}
h1{text-align:center;font-size:2rem;margin:.3em 0}.sub{text-align:center;margin:0 0 14px;opacity:.75}
.card{background:#fff;border-radius:18px;padding:16px;margin:12px 0;box-shadow:0 4px 14px #0001}
.card h3{margin:0 0 10px;font-size:1.05rem}
.row{display:flex;gap:10px;flex-wrap:wrap}
.opt,.btn,.bk{font:inherit;border:2px solid #c9d6ee;background:#fff;border-radius:14px;padding:10px 16px;cursor:pointer;color:var(--ink)}
.opt{flex:1;min-width:150px;font-size:1.05rem}.opt.sel,.bk.sel{background:var(--pri);border-color:var(--pri);color:#fff}
.bk{padding:6px 12px;font-size:.95rem}
.btn{background:var(--ok);border-color:var(--ok);color:#fff;font-size:1.2rem;font-weight:700;padding:12px 28px}
.btn:disabled{background:#c8ced8;border-color:#c8ced8;cursor:not-allowed}
.lock{opacity:.35;pointer-events:none;filter:grayscale(.6)}
#lessons{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:6px;margin-top:10px}
#lessons label{background:#f3f7ff;border-radius:10px;padding:6px 10px;cursor:pointer;font-size:.95rem}
.mini{font:inherit;font-size:.85rem;border:1px solid #c9d6ee;background:#fff;border-radius:8px;padding:3px 10px;cursor:pointer}
.hud{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;background:#fff;border-radius:14px;padding:8px 14px;box-shadow:0 3px 10px #0001;font-weight:700}
#board{position:relative;margin:14px 0}
#board.simple{display:flex;justify-content:space-between;gap:34%}
#board.simple .col{display:flex;flex-direction:column;gap:10px;flex:1}
#board.adv{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;max-width:520px;margin:14px auto}
#ln{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.tile{font:inherit;font-weight:700;font-size:1.9rem;min-height:66px;border:3px solid #c9d6ee;background:#fff;border-radius:16px;cursor:pointer;color:var(--ink);transition:.15s}
.adv .tile{aspect-ratio:1;font-size:2.2rem;border-radius:50%}
.tile.p{font-size:1.5rem}.adv .tile.p{font-size:1.35rem}
.tile.on{background:var(--on);border-color:#f0a800;box-shadow:0 0 20px 6px #ffd23f99;transform:scale(1.06)}
.tile.ok{background:#d6f7e4;border-color:var(--ok);color:#137a45;cursor:default}
.tile.bad{background:#ffe0e2;border-color:var(--bad);animation:sh .4s}
@keyframes sh{25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
#msg{min-height:2em;text-align:center;font-size:1.15rem;font-weight:700}
#done{text-align:center}#done .w{display:inline-block;margin:4px;padding:4px 12px;border-radius:10px;background:#d6f7e4}
.stat{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px dashed #d5deee}
.stat:last-child{border:0}
ul.weak{margin:6px 0;padding-left:20px}
.center{text-align:center}
</style></head><body>

<div id="home" class="screen on">
 <h1>🎯 生詞大挑戰</h1><p class="sub">華文泰北版 N2・一年級到六年級</p>
 <div class="card"><h3>① 選擇難度</h3><div class="row" id="dRow">
  <button class="opt sel" data-d="s">🌱 簡單版<br><small>五個詞・左右連線</small></button>
  <button class="opt" data-d="a">🔥 進階版<br><small>八個詞・4×4 燈格</small></button></div></div>
 <div class="card"><h3>② 選擇玩法</h3><div class="row" id="kRow">
  <button class="opt" data-k="c">📖 看國字造詞</button>
  <button class="opt" data-k="p">🔤 看拼音造詞</button></div></div>
 <div class="card lock" id="range"><h3>③ 選擇練習範圍（先選好玩法才會亮起）</h3>
  <div class="row" id="books"></div>
  <div style="margin-top:10px"><button class="mini" id="all">全選課文</button> <button class="mini" id="none">取消全選</button></div>
  <div id="lessons"></div></div>
 <div class="center"><button class="btn" id="go" disabled>開始遊戲</button></div>
</div>

<div id="game" class="screen">
 <div class="hud"><span id="hLv"></span><span id="hPr"></span><span id="hLife"></span><button class="mini" id="quit">🏠 主選單</button></div>
 <div id="board"></div><div id="msg"></div>
 <div id="done"></div>
 <div class="center"><button class="btn" id="next" hidden>下一關 →</button></div>
</div>

<div id="over" class="screen">
 <h1>GAME OVER</h1><p class="sub" id="oTip"></p>
 <div class="card" id="oStat"></div>
 <div class="card"><h3>📋 這些詞要多練習</h3><div id="oWeak"></div></div>
 <div class="card"><h3>❌ 你按錯的組合</h3><div id="oTry"></div></div>
 <div class="center"><button class="btn" id="again">再玩一次</button> <button class="opt" id="home2">🏠 回主選單</button></div>
</div>

function start(){Object.assign(S,{lives:5,lv:0,clear:0,ok:0,bad:0,used:new Set(),miss:{},tries:[],t0:Date.now(),busy:false});show('game');nextLevel()}

function pickItems(N){
 const seen=new Set(),pool=ALL.filter(x=>x.bi==S.book&&S.ls.has(x.li)&&!seen.has(x.w)&&seen.add(x.w));
 let fresh=pool.filter(x=>!S.used.has(x.w));
 if(fresh.length<Math.min(N,pool.length)){pool.forEach(x=>S.used.delete(x.w));fresh=pool}
 const inP=new Set(pool.map(x=>x.w));
 const ex=ALL.filter(x=>!inP.has(x.w));
 const ex1=ex.filter(x=>x.bi==S.book),ex2=ex.filter(x=>x.bi!=S.book);
 const order=shuf(fresh).concat(shuf(ex1),shuf(ex2)),pk=[],u=new Set();
 for(const c of order){if(pk.length>=N)break;if(!u.has(c.w)&&clean(pk.concat([c]))){pk.push(c);u.add(c.w)}}
 return pk;
}
function tilesOf(items){const T=[];items.forEach((it,i)=>T.push({id:i*2,c:it.w[0],p:it.py[0],tgt:i,pos:0},{id:i*2+1,c:it.w[1],p:it.py[1],tgt:i,pos:1}));return T}
function clean(pk){ // 確保除了正確配對，不會意外組成別的課本詞語
 const T=tilesOf(pk);
 for(const a of T)for(const b of T){if(a==b)continue;
  if(a.tgt==b.tgt&&a.pos==0&&b.pos==1)continue;
  if(S.diff=='s'&&!(a.pos==0&&b.pos==1))continue;
  if(valid(a,b))return false}
 return true}

function nextLevel(){
 S.lv++;const N=S.diff=='s'?5:8;
 S.items=pickItems(N);S.T=tilesOf(S.items);S.done=0;S.sel=null;S.conn=[];S.busy=false;
 $('#next').hidden=true;$('#msg').textContent='';$('#done').innerHTML='';
 const B=$('#board');B.className=S.diff=='s'?'simple':'adv';
 const mk=t=>`<button class="tile${S.kind=='p'?' p':''}" data-id="${t.id}">${lab(t)}</button>`;
 B.innerHTML=S.diff=='s'
  ?`<svg id="ln"></svg><div class="col">${shuf(S.T.filter(t=>!t.pos)).map(mk).join('')}</div><div class="col">${shuf(S.T.filter(t=>t.pos)).map(mk).join('')}</div>`
  :shuf(S.T).map(mk).join('');
 B.onclick=e=>{const b=e.target.closest('.tile');if(b&&!S.busy&&!b.classList.contains('ok'))clickTile(+b.dataset.id)};
 hud();
}
const el=id=>$(`#board [data-id="${id}"]`);
function hud(){$('#hLv').textContent='第 '+S.lv+' 關';$('#hPr').textContent='進度 '+S.done+' / '+S.items.length;$('#hLife').textContent='❤️'.repeat(S.lives)+'🤍'.repeat(5-S.lives)}

function clickTile(id){
 const t=S.T[id];
 if(!S.sel){S.sel=t;el(id).classList.add('on');return}
 if(S.sel==t){el(id).classList.remove('on');S.sel=null;return}
 if(S.diff=='s'&&S.sel.pos==t.pos){el(S.sel.id).classList.remove('on');S.sel=t;el(id).classList.add('on');return}
 const a=S.sel;S.sel=null;
 const x=S.diff=='s'&&a.pos?t:a,y=S.diff=='s'&&a.pos?a:t; // 簡單版：左邊當前字、右邊當後字
 attempt(x,y,a,t);
}
function attempt(x,y,a,b){
 if(valid(x,y)){
  const it=S.items[x.tgt];S.ok++;S.done++;
  [x,y].forEach(t=>{const e=el(t.id);e.classList.remove('on');e.classList.add('ok')});
  if(S.diff=='s'){S.conn.push([x.id,y.id,S.conn.length]);lines()}
  $('#msg').innerHTML='✅ '+it.w+'（'+it.p+'）';hud();
  if(S.done==S.items.length)levelDone();return}
 // 錯誤
 S.bad++;S.lives--;S.busy=true;
 [x.tgt,y.tgt].filter((v,i,r)=>r.indexOf(v)==i).forEach(g=>{const w=S.items[g].w;S.miss[w]=(S.miss[w]||0)+1});
 const s=txt(x,y);if(!S.tries.includes(s))S.tries.push(s);
 const rev=S.diff=='a'&&valid(y,x);
 $('#msg').innerHTML=rev?'⚠️ 順序顛倒囉！要先點前面的字':'❌ 課本中沒有「'+s+'」這個詞';
 [a,b].forEach(t=>{const e=el(t.id);e.classList.add('bad');e.classList.remove('on')});hud();
 setTimeout(()=>{[a,b].forEach(t=>el(t.id)&&el(t.id).classList.remove('bad'));S.busy=false;if(S.lives<=0)over()},650);
}
function lines(){
 const B=$('#board'),svg=$('#ln');if(!svg)return;const R=B.getBoundingClientRect();
 svg.innerHTML=S.conn.map(([a,b,i])=>{const r1=el(a).getBoundingClientRect(),r2=el(b).getBoundingClientRect();
  return `<line x1="${r1.right-R.left}" y1="${r1.top+r1.height/2-R.top}" x2="${r2.left-R.left}" y2="${r2.top+r2.height/2-R.top}" stroke="hsl(${i*67+120},65%,45%)" stroke-width="6" stroke-linecap="round"/>`}).join('');
}
addEventListener('resize',lines);
function levelDone(){
 S.clear++;S.items.forEach(x=>S.used.add(x.w));
 $('#msg').textContent='🎉 全部完成，過關！';
 $('#done').innerHTML=S.items.map(x=>`<span class="w">${x.w} <small>${x.p}</small></span>`).join('');
 $('#next').hidden=false;
}
function over(){
 const n=S.ok+S.bad,acc=n?Math.round(S.ok/n*100):0,sec=Math.round((Date.now()-S.t0)/1000);
 $('#oTip').textContent=acc>=90?'太厲害了！幾乎沒有失誤 🌟':acc>=70?'表現不錯，再把錯的詞複習一下 👍':'別灰心，看看下面的詞再挑戰一次 💪';
 const st=[['練習範圍',rangeLabel()],['玩法',(S.diff=='s'?'簡單版':'進階版')+'・'+(S.kind=='c'?'看國字造詞':'看拼音造詞')],['通過關卡',S.clear+' 關'],['拼對詞語',S.ok+' 個'],['按錯次數',S.bad+' 次'],['作答正確率',acc+'%'],['遊戲時長',Math.floor(sec/60)+' 分 '+String(sec%60).padStart(2,'0')+' 秒'],['結束時間',new Date().toLocaleString('zh-TW')]];
 $('#oStat').innerHTML=st.map(([a,b])=>`<div class="stat"><span>${a}</span><b>${b}</b></div>`).join('');
 const wk=Object.entries(S.miss).sort((a,b)=>b[1]-a[1]);
 $('#oWeak').innerHTML=wk.length?'<ul class="weak">'+wk.map(([w,c])=>`<li><b>${w}</b> ${(ALL.find(x=>x.w==w)||{}).p||''}　錯 ${c} 次</li>`).join('')+'</ul>':'沒有錯的詞，太棒了！';
 $('#oTry').innerHTML=S.tries.length?S.tries.map(s=>`<span class="w" style="display:inline-block;margin:3px;padding:3px 10px;border-radius:10px;background:#ffe0e2">${s}</span>`).join(''):'沒有';
 show('over');
}
</script></body></html>
