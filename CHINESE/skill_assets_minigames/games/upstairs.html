<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>上樓梯大對決</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;background:#1b2238;color:#fff;font-family:"Microsoft JhengHei","PingFang TC","Noto Sans TC",sans-serif;display:flex;flex-direction:column;align-items:center;min-height:100vh;user-select:none}
  h1{margin:10px 0 4px;font-size:24px;letter-spacing:2px}
  #bar{display:flex;gap:10px;align-items:center;margin-bottom:8px;flex-wrap:wrap;justify-content:center;font-size:15px}
  select,button{font:inherit;padding:6px 14px;border-radius:8px;border:0;cursor:pointer}
  button{background:#ffb703;color:#222;font-weight:bold}
  button:active{transform:scale(.96)}
  #wrap{position:relative;width:min(660px,100vw)}
  canvas{width:100%;display:block;background:#0e1325;border-radius:10px}
  #overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(10,14,30,.72);border-radius:10px;text-align:center;padding:20px}
  #overlay h2{font-size:34px;margin:0 0 8px}
  #overlay p{margin:4px 0 14px;font-size:16px;line-height:1.6}
  #pad{display:flex;gap:16px;margin:10px 0 16px;width:min(660px,100vw);justify-content:center}
  #pad button{flex:1;max-width:200px;font-size:28px;padding:14px;background:#3a86ff;color:#fff}
  .hint{font-size:13px;opacity:.75;margin-bottom:6px}
html.rb h1,html.rb #bar,html.rb .hint{display:none!important}
html.rb #pad{margin:6px 0}
html.rb canvas{max-height:calc(100vh - 80px);width:auto;max-width:100%;margin:0 auto}
</style>
</head>
<body>
<h1>⬆ 上樓梯大對決</h1>
<div id="bar">
  <span>難度：</span>
  <select id="level">
    <option value="easy">簡單</option>
    <option value="normal" selected>普通</option>
    <option value="hard">困難</option>
  </select>
  <span>補血：</span>
  <select id="heal">
    <option value="off" selected>不會補血</option>
    <option value="on">踩一般樓梯補血</option>
  </select>
  <button id="restart">重新開始</button>
</div>
<div class="hint">鍵盤：← → 或 A D 移動（落到樓梯上會自動彈起）　｜　手機：按下方按鈕</div>
<div id="wrap">
  <canvas id="c" width="660" height="520"></canvas>
  <div id="overlay">
    <h2 id="ovTitle">準備好了嗎？</h2>
    <p id="ovMsg">你（藍色）和電腦（紅色）從同一組樓梯往上爬。<br>踩到樓梯會自動彈起來，下面的岩漿會一直往上追！<br>誰先血量歸零或掉進岩漿，就輸了！</p>
    <button id="startBtn">開始遊戲</button>
  </div>
</div>
<div id="pad">
  <button id="bL">◀</button>
  <button id="bR">▶</button>
</div>

<script>
/* ===== 休息小遊戲「嵌入模式」（relax-break 協定 v1）=====
   由 relax-break.js 以 iframe 載入，設定放在 iframe 的 name（RB:xxx）或網址 ?embed=1&v=&lv=&err=&id=。
   embed=1：略過選單、直接開一局、結束時 postMessage({source:'relax',type:'result',result:'win|lose|draw'})
   v=玩法代號  lv=easy|normal|hard  err=0~1（電腦隨機亂走的機率，連續平手時由外面調高）   */
var RB=(function(){var q;try{if(location.search.indexOf('embed=1')>=0)q=new URLSearchParams(location.search);else if(String(window.name).indexOf('RB:')===0)q=new URLSearchParams(String(window.name).slice(3));}catch(e){}
if(!q)q=new URLSearchParams('');var on=q.get('embed')==='1';if(on)document.documentElement.classList.add('rb');var sent=false;
return{embed:on,v:q.get('v')||'',lv:q.get('lv')||'normal',err:Math.max(0,Math.min(1,parseFloat(q.get('err'))||0)),id:q.get('id')||'',
done:function(r,info){if(!on||sent)return;sent=true;try{parent.postMessage({source:'relax',type:'result',id:q.get('id')||'',result:r,info:info||''},'*')}catch(e){}}};})();
(() => {
"use strict";
const SOLO = RB.embed && RB.v==="solo";
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const W = 320, H = 520, GAP = 20, PW = 84, PH = 12, ROW = 70, BASE = 440;
const PLAYER_W = 18, PLAYER_H = 26, MAXLIFE = 12;
const JUMP = 620, SPRING = 960, FOLLOW = 200;
const FONT = '"Microsoft JhengHei","PingFang TC","Noto Sans TC",sans-serif';

// ---------- 隨機數（固定種子，讓雙方樓梯一模一樣） ----------
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

// 移動樓梯的位置（隨時間左右滑動）
function platX(p, t){ return p.type==='move' ? p.x + Math.sin(t*1.8 + p.i)*55 : p.x; }

class Track {
  constructor(seed){ this.rng = mulberry32(seed); this.list = []; this.prevCx = W/2; }
  get(i){
    while(this.list.length <= i){
      const n = this.list.length;
      let type = 'normal', cx;
      if(n === 0){ cx = W/2; }
      else {
        cx = this.prevCx + (this.rng()*2-1)*140;
        cx = Math.max(PW/2+8, Math.min(W-PW/2-8, cx));
        if(n >= 3){
          const r = this.rng();
          const spike = Math.min(0.10 + n*0.002, 0.18);
          if(r < spike) type = 'spike';
          else if(r < spike+0.08) type = 'spring';
          else if(r < spike+0.22) type = 'fake';
          else if(r < spike+0.36) type = 'move';
        } else this.rng();
        if(type==='move') cx = Math.max(PW/2+62, Math.min(W-PW/2-62, cx));
      }
      // 保證不會連續兩層都是壞樓梯（否則跳不上去，這樣對雙方都不公平）
      if(this.prevType==='spike' || this.prevType==='fake'){ type = 'normal'; }
      this.prevType = type;
      this.prevCx = cx;
      this.list.push({i:n, x:cx-PW/2, y:BASE-n*ROW, type});
    }
    return this.list[i];
  }
  // 取出世界座標 y0（上）到 y1（下）之間的樓梯
  range(y0,y1){
    const a = Math.max(0, Math.ceil((BASE-y1)/ROW)), b = Math.floor((BASE-y0)/ROW);
    const out=[]; for(let i=a;i<=b;i++) out.push(this.get(i)); return out;
  }
}

// ---------- 角色 ----------
class Side {
  constructor(track, color, name, ox, isAI){
    this.track = track; this.color = color; this.name = name; this.ox = ox; this.isAI = isAI;
    this.reset();
  }
  reset(){
    this.cam = 0; this.x = W/2; this.y = BASE; this.vy = -JUMP; this.life = MAXLIFE;
    this.hurtCd = 0; this.dead = false; this.minY = BASE; this.dir = 0; this.face = 1;
    this.goneSet = new Set(); this.t = 0; this.planT = 0; this.planDir = 0;
  }
  get floor(){ return Math.max(0, Math.floor((BASE - this.minY)/ROW)); }
  speed(){ return SOLO ? Math.min(30 + this.floor*2.5, 150) : Math.min(30 + this.floor*1.0, 90); }
  hurt(n){ if(this.hurtCd>0) return; this.life -= n; this.hurtCd = 0.8; }
  update(dt, dir){
    if(this.dead) return;
    this.t += dt;
    this.cam -= this.speed()*dt;
    this.hurtCd -= dt;
    this.x += dir*170*dt; if(dir) this.face = dir;
    this.x = Math.max(PLAYER_W/2, Math.min(W-PLAYER_W/2, this.x));
    this.vy = Math.min(this.vy + 1000*dt, 520);
    const prev = this.y; this.y += this.vy*dt;
    if(this.vy >= 0){
      for(const p of this.track.range(prev-4, this.y+4)){
        if(this.goneSet.has(p.i)) continue;
        const px = platX(p, this.t);
        if(prev <= p.y+1 && this.y >= p.y && this.x+PLAYER_W/2-2 > px && this.x-PLAYER_W/2+2 < px+PW){
          if(p.type==='fake'){ this.goneSet.add(p.i); break; }      // 假樓梯：直接碎掉，沒有彈力
          this.y = p.y; this.vy = -JUMP;
          if(p.type==='spring') this.vy = -SPRING;
          else if(p.type==='spike'){ this.hurtCd = 0; this.hurt(4); }
          else if(document.getElementById('heal').value==='on') this.life = Math.min(MAXLIFE, this.life+1);
          break;
        }
      }
    }
    if(this.y < this.minY) this.minY = this.y;
    if(this.y < this.cam + FOLLOW) this.cam = this.y - FOLLOW;   // 爬得高，畫面跟著上去
    if(this.life <= 0 || this.y - PLAYER_H > this.cam + H + 10){ this.life = Math.max(0,this.life); this.dead = true; }
  }
  // ---- 電腦的大腦：在腦中「預演未來約 1 秒」，挑出最安全的走法 ----
  think(level){
    this.planT = (this.planT||0) - 1;
    if(this.planT > 0) return this.planDir||0;
    this.planT = level==='hard' ? 2 : 3;
    if(RB.err>0 && Math.random()<RB.err){ this.planDir = [-1,0,1][(Math.random()*3)|0]; return this.planDir; }               // 多久重新想一次（幀）
    const depth = level==='easy' ? 4 : level==='normal' ? 5 : 6; // 想多遠
    const noise = level==='easy' ? 0.2 : level==='normal' ? 0.1 : 0; // 手滑機率
    if(Math.random() < noise){ this.planDir = [-1,0,1][(Math.random()*3)|0]; return this.planDir; }
    const track = this.track, speed = this.speed();
    const step = (st, dir, dt) => {
      st.t += dt; st.cam -= speed*dt; st.cd -= dt;
      st.x = Math.max(PLAYER_W/2, Math.min(W-PLAYER_W/2, st.x + dir*170*dt));
      st.vy = Math.min(st.vy + 1000*dt, 520);
      const prev = st.y; st.y += st.vy*dt;
      if(st.vy >= 0){
        for(const p of track.range(prev-4, st.y+4)){
          if(this.goneSet.has(p.i) || st.gone.indexOf(p.i)>=0) continue;
          const px = platX(p, st.t);
          if(prev <= p.y+1 && st.y >= p.y && st.x+PLAYER_W/2-2 > px && st.x-PLAYER_W/2+2 < px+PW){
            if(p.type==='fake'){ st.gone.push(p.i); st.score -= 60; break; }
            st.y = p.y; st.vy = -JUMP;
            if(p.type==='spring'){ st.vy = -SPRING; st.score += 20; }
            else if(p.type==='spike'){ st.life -= 4; st.cd = 0.8; st.score -= 150; }
            else st.score += 10;
            break;
          }
        }
      }
      if(st.y < st.minY){ st.score += (st.minY-st.y)*0.4; st.minY = st.y; }
      if(st.y < st.cam + FOLLOW) st.cam = st.y - FOLLOW;
      if(st.life <= 0 || st.y - PLAYER_H > st.cam + H + 10){ st.dead = true; st.score -= 1000; }
    };
    const evalState = st => {
      const sy = st.y - st.cam;
      let v = st.score;
      if(sy > H-120) v -= (sy-(H-120))*2;      // 太靠近岩漿
      return v;
    };
    const search = (st, d) => {
      if(st.dead || d===0) return {v: evalState(st), dir: 0};
      let best = {v:-1e9, dir:0};
      for(const dir of [0,-1,1]){
        const n = Object.assign({}, st, {gone: st.gone.slice()});
        for(let k=0;k<6;k++){ step(n, dir, 1/30); if(n.dead) break; }
        if(dir) n.score -= 0.3;
        const r = search(n, d-1);
        if(r.v > best.v) best = {v: r.v, dir};
      }
      return best;
    };
    const st0 = {x:this.x, y:this.y, vy:this.vy, cam:this.cam, t:this.t, life:this.life, cd:this.hurtCd,
                 minY:this.minY, score:0, dead:false, gone:[]};
    this.planDir = search(st0, depth).dir;
    return this.planDir;
  }
}

// ---------- 繪圖 ----------
function drawSide(s){
  ctx.save();
  ctx.translate(s.ox, 0);
  ctx.beginPath(); ctx.rect(0,0,W,H); ctx.clip();
  const g = ctx.createLinearGradient(0,0,0,H); g.addColorStop(0,'#1a2550'); g.addColorStop(1,'#2a1f3d');
  ctx.fillStyle = g; ctx.fillRect(0,0,W,H);
  // 牆上格線（會跟著捲動）
  ctx.strokeStyle = 'rgba(255,255,255,.05)'; ctx.lineWidth = 1;
  const off = ((s.cam % 40)+40) % 40;
  for(let yy=-off; yy<H; yy+=40){ ctx.beginPath(); ctx.moveTo(0,yy); ctx.lineTo(W,yy); ctx.stroke(); }
  // 樓梯
  for(const p of s.track.range(s.cam-30, s.cam+H+30)){
    if(s.goneSet.has(p.i)) continue;
    drawPlat(p, platX(p, s.t), p.y - s.cam, s.t);
  }
  drawHero(s);
  // 岩漿
  const ly = H-16;
  ctx.fillStyle = '#ff5a1f'; ctx.beginPath(); ctx.moveTo(0,H);
  for(let xx=0; xx<=W; xx+=10) ctx.lineTo(xx, ly + Math.sin(xx*0.08 + s.t*4)*3);
  ctx.lineTo(W,H); ctx.fill();
  ctx.fillStyle = '#ffd166'; ctx.fillRect(0,H-6,W,6);
  // 資訊列
  ctx.fillStyle = 'rgba(0,0,0,.45)'; ctx.fillRect(0,0,W,26);
  ctx.font = 'bold 14px '+FONT; ctx.textBaseline='middle'; ctx.textAlign='left';
  ctx.fillStyle = s.color; ctx.fillText(s.name, 8, 13);
  ctx.fillStyle = '#fff'; ctx.textAlign='right'; ctx.fillText('第 '+s.floor+' 層', W-8, 13);
  for(let i=0;i<MAXLIFE;i++){
    ctx.fillStyle = i < s.life ? '#ff4d6d' : 'rgba(255,255,255,.18)';
    ctx.fillRect(70+i*11, 7, 9, 12);
  }
  if(s.dead){ ctx.fillStyle='rgba(0,0,0,.55)'; ctx.fillRect(0,0,W,H); ctx.fillStyle='#fff'; ctx.textAlign='center'; ctx.font='bold 36px '+FONT; ctx.fillText('出局',W/2,H/2); }
  ctx.restore();
}
function drawPlat(p, x, y, t){
  const r = 4;
  const rect = (c)=>{ ctx.fillStyle=c; ctx.beginPath(); ctx.roundRect(x,y,PW,PH,r); ctx.fill(); };
  if(p.type==='normal'){ rect('#4ade80'); ctx.fillStyle='#22c55e'; ctx.fillRect(x+3,y+PH-4,PW-6,3); }
  else if(p.type==='spike'){
    rect('#94a3b8'); ctx.fillStyle='#e2e8f0';
    for(let i=0;i<PW;i+=12){ ctx.beginPath(); ctx.moveTo(x+i,y); ctx.lineTo(x+i+6,y-11); ctx.lineTo(x+i+12,y); ctx.fill(); }
  }
  else if(p.type==='move'){
    rect('#38bdf8'); ctx.fillStyle='#075985';
    ctx.beginPath(); ctx.moveTo(x+8,y+PH/2); ctx.lineTo(x+16,y+2); ctx.lineTo(x+16,y+PH-2); ctx.fill();
    ctx.beginPath(); ctx.moveTo(x+PW-8,y+PH/2); ctx.lineTo(x+PW-16,y+2); ctx.lineTo(x+PW-16,y+PH-2); ctx.fill();
  }
  else if(p.type==='spring'){
    rect('#f472b6');
    const by = y+PH+9;
    ctx.fillStyle='#be185d'; ctx.beginPath(); ctx.roundRect(x+6,by,PW-12,PH-4,3); ctx.fill();
    ctx.strokeStyle='#9d174d'; ctx.lineWidth=2.5; ctx.lineCap='round';
    const cx=x+PW/2;
    for(let k=-1;k<=1;k+=2){
      ctx.beginPath();
      for(let i=0;i<=12;i++){
        const yy = y+PH + (by-(y+PH))*i/12;
        const xx = cx + k*20 + Math.sin(i*Math.PI/1.5)*6;
        i===0 ? ctx.moveTo(xx,yy) : ctx.lineTo(xx,yy);
      }
      ctx.stroke();
    }
    ctx.fillStyle='#fbcfe8'; ctx.fillRect(x+4,y+2,PW-8,3);
  }
  else if(p.type==='fake'){
    ctx.fillStyle='#c4b5fd'; ctx.beginPath(); ctx.roundRect(x,y,PW,PH,r); ctx.fill();
    ctx.strokeStyle='#7c3aed'; ctx.lineWidth=1.5;
    for(let i=10;i<PW;i+=18){ ctx.beginPath(); ctx.moveTo(x+i,y); ctx.lineTo(x+i-5,y+PH); ctx.stroke(); }
  }
}
function drawHero(s){
  const x = s.x, y = s.y - s.cam;
  if(s.hurtCd>0 && Math.floor(s.t*20)%2===0) return;
  ctx.save(); ctx.translate(x,y);
  ctx.fillStyle = '#222';
  const tuck = s.vy<0 ? -3 : 0;
  ctx.fillRect(-6,-5+tuck,5,5); ctx.fillRect(1,-5+tuck,5,5);
  ctx.fillStyle = s.color; ctx.beginPath(); ctx.roundRect(-9,-19,18,15,5); ctx.fill();
  ctx.fillStyle = '#ffdcb4'; ctx.beginPath(); ctx.arc(0,-22,8,0,7); ctx.fill();
  ctx.fillStyle = s.color; ctx.beginPath(); ctx.arc(0,-25,8,Math.PI,0); ctx.fill();
  ctx.fillStyle = '#111'; ctx.fillRect(-4+s.face*1.5,-23,2,3); ctx.fillRect(2+s.face*1.5,-23,2,3);
  if(s.vy<0){ ctx.strokeStyle=s.color; ctx.lineWidth=3; ctx.beginPath(); ctx.moveTo(-9,-16); ctx.lineTo(-14,-26); ctx.moveTo(9,-16); ctx.lineTo(14,-26); ctx.stroke(); }
  ctx.restore();
}

// ---------- 遊戲流程 ----------
const keys = {L:false,R:false}, touch = {L:false,R:false};
let me, cpu, track, state='menu', countdown=0, last=0;
const ov = document.getElementById('overlay'), ovTitle = document.getElementById('ovTitle'), ovMsg = document.getElementById('ovMsg');
const startBtn = document.getElementById('startBtn'), levelSel = document.getElementById('level');

function newGame(){
  track = new Track((Math.random()*1e9)|0);
  me  = new Side(track,'#3a86ff','你',SOLO?(cv.width-W)/2:0,false);
  cpu = SOLO ? null : new Side(track,'#ff5d5d','電腦',W+GAP,true);
  state='count'; countdown=3; ov.style.display='none';
}
function endGame(){
  state='over';
  if(SOLO){ const a=me.floor; ovTitle.textContent='挑戰結束'; ovMsg.innerHTML='你爬到了 '+'第 '+a+' 層'+'！'; ov.style.display='none'; setTimeout(()=>RB.done('score',String(a)),1300); return; }
  const a = me.floor, b = cpu.floor;
  let title, msg;
  if(me.dead && !cpu.dead){ title='😢 你輸了'; msg='電腦活到最後！'; }
  else if(cpu.dead && !me.dead){ title='🎉 你贏了！'; msg='電腦先出局了！'; }
  else if(a>b){ title='🎉 你贏了！'; msg='同時出局，但你爬得比較高！'; }
  else if(b>a){ title='😢 你輸了'; msg='同時出局，電腦爬得比較高。'; }
  else { title='🤝 平手'; msg='勢均力敵！'; }
  ovTitle.textContent = title;
  ovMsg.innerHTML = msg + '<br>你：第 '+a+' 層　電腦：第 '+b+' 層';
  if(RB.embed){ ov.style.display='none'; setTimeout(()=>RB.done(title.indexOf('贏')>=0?'win':(title.indexOf('輸')>=0?'lose':'draw'),a+':'+b),1300); return; }
  startBtn.textContent = '再玩一次'; ov.style.display='flex';
}
function loop(ts){
  const dt = Math.min(0.033, (ts-last)/1000 || 0); last = ts;
  ctx.clearRect(0,0,cv.width,cv.height);
  if(me){
    if(state==='play'){
      const d = (keys.R||touch.R?1:0) - (keys.L||touch.L?1:0);
      me.dir = d; me.update(dt, d);
      if(cpu){ cpu.dir = cpu.think(levelSel.value); cpu.update(dt, cpu.dir); }
      if(me.dead || (cpu && cpu.dead)) endGame();
    } else if(state==='count'){
      countdown -= dt; if(countdown<=0) state='play';
    }
    drawSide(me); if(cpu) drawSide(cpu);
    if(cpu){ ctx.fillStyle='rgba(255,255,255,.15)'; ctx.fillRect(W,0,GAP,H); }
    if(state==='count'){
      ctx.fillStyle='#fff'; ctx.font='bold 80px '+FONT; ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.fillText(Math.ceil(countdown), cv.width/2, H/2);
    }
  }
  requestAnimationFrame(loop);
}
startBtn.onclick = newGame;
document.getElementById('restart').onclick = newGame;
addEventListener('keydown',e=>{
  if(e.key==='ArrowLeft'||e.key==='a'||e.key==='A'){keys.L=true;e.preventDefault();}
  if(e.key==='ArrowRight'||e.key==='d'||e.key==='D'){keys.R=true;e.preventDefault();}
  if(e.key==='Enter' && !RB.embed && (state==='menu'||state==='over')) newGame();
});
addEventListener('keyup',e=>{
  if(e.key==='ArrowLeft'||e.key==='a'||e.key==='A') keys.L=false;
  if(e.key==='ArrowRight'||e.key==='d'||e.key==='D') keys.R=false;
});
function hold(id,k){
  const b=document.getElementById(id);
  const on=e=>{touch[k]=true;e.preventDefault();}, off=e=>{touch[k]=false;e.preventDefault();};
  b.addEventListener('pointerdown',on); b.addEventListener('pointerup',off);
  b.addEventListener('pointerleave',off); b.addEventListener('pointercancel',off);
}
hold('bL','L'); hold('bR','R');
cv.addEventListener('pointerdown',e=>{
  const r=cv.getBoundingClientRect(), px=(e.clientX-r.left)/r.width*cv.width;
  if(SOLO){ if(px<cv.width/2) touch.L=true; else touch.R=true; } else if(px<W){ if(px<W/2) touch.L=true; else touch.R=true; }
});
const rel=()=>{touch.L=false;touch.R=false;};
cv.addEventListener('pointerup',rel); cv.addEventListener('pointerleave',rel);
if(RB.embed){ levelSel.value=({easy:'easy',normal:'normal',hard:'hard'})[RB.lv]||'normal'; document.getElementById('heal').value=(RB.v==='heal')?'on':'off'; newGame(); }
requestAnimationFrame(loop);
})();
</script>
</body>
