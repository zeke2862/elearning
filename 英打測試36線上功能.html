<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ETP 檢定</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Baloo+2:wght@500;600;700;800&display=swap" rel="stylesheet">
  <style>
    /* ===== DESIGN TOKENS ===== */
    :root {
      --bg:       #080b11;
      --panel:    rgba(22,27,34,0.75);
      --border:   rgba(48,54,61,0.7);
      --text:     #c9d1d9;
      --p1:       #00f2fe;
      --p2:       #ff5e62;
      --green:    #00ff87;
      --gold:     #ffd700;
      --key-bg:   #1f2430;
      --key-txt:  #8b949e;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: "Fredoka", "Baloo 2", system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      height: 100vh;
      overflow: hidden;
      user-select: none;
      background-image:
        radial-gradient(at 0% 0%, rgba(0,242,254,.07) 0, transparent 50%),
        radial-gradient(at 100% 0%, rgba(255,94,98,.06) 0, transparent 50%),
        radial-gradient(at 50% 100%, rgba(0,255,135,.05) 0, transparent 55%);
      background-attachment: fixed;
    }

    /* Aurora drift */
    body::before {
      content: "";
      position: fixed;
      inset: -20%;
      z-index: 0;
      pointer-events: none;
      background:
        radial-gradient(circle at 20% 30%, rgba(0,242,254,.08), transparent 40%),
        radial-gradient(circle at 80% 70%, rgba(255,94,98,.07), transparent 40%);
      filter: blur(30px);
      animation: auroraDrift 22s ease-in-out infinite alternate;
    }
    @keyframes auroraDrift {
      0%   { transform: translate3d(0,0,0) scale(1); }
      50%  { transform: translate3d(3%,-2%,0) scale(1.08); }
      100% { transform: translate3d(-3%,2%,0) scale(1.04); }
    }

    /* ===== CONTROL PANEL ===== */
    #control-panel {
      position: relative; z-index: 5;
      width: 95%;
      background: var(--panel);
      backdrop-filter: blur(10px);
      border: 1px solid var(--border);
      padding: 10px 22px;
      margin-top: 10px;
      border-radius: 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      box-shadow: 0 8px 32px rgba(0,0,0,.4);
      flex-shrink: 0;
    }

    .logo-dot {
      width: 9px; height: 9px; border-radius: 50%;
      background: var(--p1); box-shadow: 0 0 8px var(--p1);
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0%,100% { transform: scale(.9); opacity:.6; }
      50% { transform: scale(1.25); opacity:1; box-shadow: 0 0 14px var(--p1); }
    }

    #game-logo { font-size: 1.15rem; color: var(--p1); font-weight: 700; }

    /* ===== BUTTONS ===== */
    .btn {
      background: var(--key-bg);
      color: var(--key-txt);
      border: 1px solid var(--border);
      padding: 7px 15px;
      border-radius: 10px;
      cursor: pointer;
      font-weight: 700;
      font-family: inherit;
      font-size: .9rem;
      transition: all .18s;
    }
    .btn:hover { border-color: #8b949e; color: #fff; transform: translateY(-1px); }
    .btn.active { background: var(--green); color: #000; border-color: var(--green); box-shadow: 0 0 12px rgba(0,255,135,.4); }
    .btn.danger { border-color: #f85149; color: #ffb4ab; background: #3a1f1f; }
    .btn.locked { pointer-events: none; opacity: .5; }

    /* ===== OVERLAY ===== */
    #overlay {
      position: absolute; top: 0; left: 0;
      width: 100%; height: 100%;
      background: radial-gradient(ellipse at top, rgba(20,26,38,.93), rgba(8,11,17,.97));
      backdrop-filter: blur(6px);
      display: flex; flex-direction: column;
      justify-content: center; align-items: center;
      z-index: 20;
      overflow-y: auto;
      padding: 20px 0;
    }
    #overlay-title {
      font-size: 2.2rem; font-weight: 800; margin-bottom: 6px;
      background: linear-gradient(90deg, #00f2fe, #7af5c8, #ffd77a);
      -webkit-background-clip: text; background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: titleGlow 4s ease-in-out infinite;
    }
    @keyframes titleGlow {
      0%,100% { filter: drop-shadow(0 0 10px rgba(0,242,254,.25)); }
      50%      { filter: drop-shadow(0 0 18px rgba(122,245,200,.35)); }
    }
    #overlay-desc { color: #8b949e; font-size: .95rem; margin-bottom: 0; }

    .menu-grid {
      display: flex; flex-wrap: wrap; justify-content: center;
      gap: 18px; margin-top: 18px;
      max-width: 980px; padding: 0 20px;
    }
    .mode-card {
      background: linear-gradient(180deg, rgba(33,40,54,.9), rgba(20,25,34,.9));
      border: 1px solid rgba(255,255,255,.08);
      border-radius: 18px; padding: 20px;
      width: 250px; cursor: pointer;
      box-shadow: 0 10px 30px rgba(0,0,0,.35);
      transition: transform .22s cubic-bezier(.2,.8,.2,1), box-shadow .22s, border-color .22s;
      position: relative; overflow: hidden;
    }
    .mode-card::before {
      content: ""; position: absolute; top: 0; left: 0; right: 0; height: 3px;
      background: var(--accent, var(--p1)); opacity: .85;
    }
    .mode-card:hover { transform: translateY(-6px) scale(1.015); border-color: var(--accent, var(--p1)); box-shadow: 0 18px 40px rgba(0,0,0,.45); }
    .mode-card h3 { font-size: 1.2rem; margin-bottom: 8px; }
    .mode-card p  { color: #8b949e; font-size: .83rem; line-height: 1.55; }

    .row-card { width: 160px; }
    .row-card h3 { font-size: 1.05rem; }
    .row-card p  { text-align: center; }
    .row-card code { color: var(--gold); font-family: monospace; font-size: .78rem; }

    /* card accent colours */
    #btn-solo      { --accent: var(--green); }
    #btn-solo h3   { color: var(--green); }
    #btn-twoplayer { --accent: var(--p1); }
    #btn-twoplayer h3 { color: var(--p1); }
    #btn-etp       { --accent: #d29922; }
    #btn-etp h3    { color: #d29922; }
    #btn-pvp h3    { color: var(--p2); }
    #btn-pvp       { --accent: var(--p2); }
    #btn-coop h3   { color: var(--p1); }
    #btn-coop      { --accent: var(--p1); }

    /* screens */
    .screen { display: none; flex-direction: column; align-items: center; gap: 18px; width: 100%; }

    /* ===== ETP ARENA ===== */
    #etp-arena {
      display: none; flex-direction: column; align-items: center;
      width: 92%; flex: 1; gap: 16px; margin: 12px 0;
      position: relative; z-index: 1; min-height: 0; overflow-y: auto;
    }
    .etp-hud {
      display: flex; justify-content: space-between; width: 100%; max-width: 900px;
      font-size: .95rem; background: var(--panel); border: 1px solid var(--border);
      border-radius: 12px; padding: 10px 20px; flex-wrap: wrap; gap: 8px;
      flex-shrink: 0;
    }
    #etp-race-track {
      width: 100%; max-width: 900px;
      background: var(--panel); border: 1px solid var(--border);
      border-radius: 14px; padding: 32px 20px 14px;
      flex-shrink: 0;
    }
    #etp-race-bar-bg {
      position: relative; height: 8px; background: #21262d;
      border-radius: 4px; border: 1px solid #30363d; overflow: visible;
    }
    #etp-race-fill {
      position: absolute; left: 0; top: 0; height: 100%; width: 0%;
      background: linear-gradient(90deg, #58a6ff, #00ff87, #ffd77a);
      background-size: 200% 100%;
      animation: raceFlow 2.5s linear infinite;
      border-radius: 4px; transition: width .25s ease;
      box-shadow: 0 0 12px rgba(0,255,135,.5);
    }
    @keyframes raceFlow { to { background-position: 200% 0; } }
    #etp-race-runner {
      position: absolute; left: 0%; top: -32px;
      transform: translateX(-50%);
      font-size: 2rem; line-height: 1; transition: left .25s ease;
      text-align: center; animation: runnerHop .9s ease-in-out infinite;
    }
    @keyframes runnerHop { 0%,100%{margin-top:0} 50%{margin-top:-6px} }
    #etp-race-finish {
      position: absolute; right: -2px; top: -16px; font-size: 1.5rem;
      animation: flagWave 1.4s ease-in-out infinite; transform-origin: bottom left;
    }
    @keyframes flagWave { 0%,100%{transform:rotate(-5deg)} 50%{transform:rotate(8deg)} }

    #etp-text {
      font-family: 'Courier New', monospace; font-size: 1.4rem;
      line-height: 2.1; letter-spacing: 1.5px;
      background: #0d1117; padding: 24px 28px;
      border-radius: 14px; max-width: 900px; width: 100%;
      border: 1px solid #30363d;
    }
    .etp-char { color: #6e7681; }
    .etp-char.correct { color: var(--green); }
    .etp-char.current { color: #000; background: #d29922; border-radius: 3px; animation: caretBeat 1s ease-in-out infinite; }
    .etp-char.wrong   { background: var(--p2); color: #fff; border-radius: 3px; }
    @keyframes caretBeat {
      0%,100%{ box-shadow: 0 0 0 rgba(210,153,34,0); }
      50%    { box-shadow: 0 0 10px rgba(210,153,34,.8); }
    }

    #etp-result-overlay {
      display: none; position: absolute; inset: 0;
      background: rgba(8,11,17,.97); backdrop-filter: blur(6px);
      flex-direction: column; justify-content: center; align-items: center;
      z-index: 200; border-radius: 12px; padding: 20px;
    }
    #etp-result-title { animation: popIn .5s cubic-bezier(.2,1.4,.4,1) both; }
    @keyframes popIn { from{transform:scale(.6);opacity:0} to{transform:scale(1);opacity:1} }

    /* ===== GAME TIMER ===== */
    #game-timer { font-family: monospace; font-weight: 700; font-size: 1.05rem; }

    @media (max-width: 900px) {
      body { height: auto; min-height: 100vh; overflow-y: auto; }
      .row-card   { width: 90%; max-width: 340px; }
      #overlay { justify-content: flex-start; padding-top: 24px; padding-bottom: 36px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .001ms !important; }
    }
  </style>
</head>
<body>

<!-- ====== CONTROL PANEL ====== -->
<div id="control-panel">
  <div style="display:flex;align-items:center;gap:8px">
    <div class="logo-dot"></div>
    <span id="game-logo">ETP 檢定</span>
  </div>
  <div id="game-timer">時間：00:00</div>
</div>

<!-- ====== ETP ARENA ====== -->
<div id="etp-arena">
  <div class="etp-hud">
    <span>📋 <b id="etp-title">ETP 測驗</b></span>
    <span>進度：<b id="etp-progress">0/0</b></span>
    <span>速度：<b id="etp-wpm" style="color:#d29922">0</b> WPM</span>
    <span>錯誤：<b id="etp-wrong" style="color:var(--p2)">0</b></span>
    <span>正確率：<b id="etp-acc" style="color:var(--green)">100%</b></span>
  </div>
  <div id="etp-race-track">
    <div id="etp-race-bar-bg">
      <div id="etp-race-fill"></div>
      <div id="etp-race-finish">🏁</div>
      <div id="etp-race-runner"><div id="etp-race-emoji">🐢</div></div>
    </div>
    <div style="display:flex;justify-content:space-between;margin-top:6px;font-size:.8rem;color:#8b949e">
      <span id="etp-race-label">烏龜 Turtle</span>
      <span id="etp-race-pct">0%</span>
    </div>
  </div>
  <div id="etp-text"></div>
  <button class="btn danger" onclick="exitETP()">🏠 中止測驗，返回選單</button>
  <div id="etp-result-overlay">
    <h1 id="etp-result-title" style="color:var(--green);margin-bottom:10px">🎉 測驗完成！</h1>
    <div id="etp-result-body" style="font-size:1.2rem;line-height:2;text-align:center;margin-bottom:22px"></div>
    <div style="display:flex;gap:14px">
      <button class="btn" onclick="retryETP()">🔄 重試同一篇</button>
      <button class="btn" style="background:#21262d;border-color:#30363d" onclick="exitETP()">⬅ 返回 ETP 選單</button>
    </div>
  </div>
</div>

<!-- ====== OVERLAY / MENU（直接進入選擇範圍） ====== -->
<div id="overlay">
  <h1 id="overlay-title">ETP 檢定：選擇範圍</h1>
  <p id="overlay-desc">固定內容測驗，適合前後測比較</p>
  <div class="screen" id="etp-row-screen" style="display:flex">
    <div class="menu-grid" style="margin-top:0">
      <div class="mode-card row-card" onclick="startETP('top')"><h3>⬆ 上列</h3><p>固定文章測驗</p></div>
      <div class="mode-card row-card" onclick="startETP('home')"><h3>➖ 中列</h3><p>固定文章測驗</p></div>
      <div class="mode-card row-card" onclick="startETP('bottom')"><h3>⬇ 下列</h3><p>固定文章測驗</p></div>
      <div class="mode-card row-card" onclick="startETP('all')"><h3>🔤 綜合</h3><p>固定文章測驗</p></div>
    </div>
    <a class="btn" style="background:#21262d;border-color:#30363d;text-decoration:none" href="./index.html">🏠 回到學習中心</a>
  </div>
</div>

<script>

const ETP_TEXTS = {
  top:    "yweoq tytpi ioqoy ieuuo wurpt rqrpr iqepw tweyu qriri ryoty ewuwo wwque yqero oupqt ipupy tpite ryppu errtt ewwpe etury otioi yyiou oqwiq wupqq wurro trwit oyiuy eqewp pewqi uruyt tppqq iooey",
  home:   "shdgs kflg; kh;hl kl;dd jajdj gssal gffa; jfahk ghfld akhgl jhjkj hdaka sgf;d ;jsf; l;slf gsdka sdakf kldkg ;sf;a lhsjl ;hggj ;sfgj hfddh ajlak fh;jf gsdkl ksgsf hd;;j lkada kfhgg ;slad jalhj",
  bottom: "bc.zc .v/vn x,mb/ mx,/z ,cn.n ,nzc/ zbbvx .mvxm xc/,/ m..xz cxmx. nbzbc cvnv/ .nbnm vb,/, ,mzvz x/bzv vnm/c vcm.. bnzc. ,n.v, zb/n, bxm,x /zcmx x/mb. vbm,c nv.bz cb/,c m.cvz nv,zx nxm/x /nz.,",
  all:    "timbg psna/ /adzw znxub ef,l/ wke/l daiqc g,vjs xmwhy .uhid oktlq rq,gl xoud; rzhp. yshpj eq;zj sf;cf nmye, kr.pj fvvgi caotv tnwbo xbmry kcu.; cpxdv utk,b suw/; grqfv lx/.k ls.ho engar ;znpj cwafb oimdi qyy,m ztjeh"
};

const ETP_SPEED_TIERS = [
  {min:0, max:19, emoji:'🐢', label:'烏龜 Turtle'},
  {min:20,max:39, emoji:'🐌', label:'蝸牛 Snail'},
  {min:40,max:59, emoji:'🐇', label:'兔子 Rabbit'},
  {min:60,max:79, emoji:'🐎', label:'馬 Horse'},
  {min:80,max:Infinity, emoji:'🐆', label:'獵豹 Cheetah'}
];

/* ============================================================
   ETP MODULE
   ============================================================ */
let etpState = null;
let etpActive = false;
let etpTimerID = null;

function startETP(rowKey) {
  document.getElementById('overlay').style.display='none';
  document.getElementById('etp-arena').style.display='flex';
  document.getElementById('etp-result-overlay').style.display='none';

  const raw = ETP_TEXTS[rowKey].replace(/\s+/g,' ').trim();
  const words = raw.split(' ');
  let text = '';
  words.forEach((w,i)=>{ text+=w; text += ((i+1)%8===0 && i!==words.length-1) ? '\n' : (i!==words.length-1 ? ' ' : ''); });

  etpState = { rowKey, text, index:0, wrongCount:0, totalKeys:0, startTime:null, spans:[] };
  document.getElementById('etp-title').innerText = `ETP：${['top','home','bottom','all'].map(k=>['上列','中列','下列','綜合'])[['top','home','bottom','all'].indexOf(rowKey)]}`;
  renderEtpText(); updateEtpStats(); updateEtpRace(0);
  etpActive = true;
  clearInterval(etpTimerID);
  etpTimerID = setInterval(()=>{ if(!etpActive){clearInterval(etpTimerID);return;} if(etpState?.startTime) updateEtpStats(); },1000);
}

function renderEtpText() {
  const c = document.getElementById('etp-text');
  c.innerHTML=''; etpState.spans=[];
  for(let i=0;i<etpState.text.length;i++){
    const sp=document.createElement('span');
    const ch=etpState.text[i];
    if(ch==='\n'){sp.textContent='↵';sp.style.cssText='color:#58a6ff;font-weight:bold';}
    else if(ch===' ')sp.textContent='\u00A0';
    else sp.textContent=ch;
    sp.className='etp-char'+(i===0?' current':'');
    c.appendChild(sp);
    if(ch==='\n') c.appendChild(document.createElement('br'));
    etpState.spans.push(sp);
  }
}

function handleEtpKey(key) {
  if (!etpState) return;
  if (!etpState.startTime) etpState.startTime=Date.now();
  etpState.totalKeys++;
  const expected=etpState.text[etpState.index];
  const ok=(key===expected)||(expected==='\n'&&key==='Enter');
  if (ok) {
    etpState.spans[etpState.index].classList.replace('current','correct');
    etpState.index++;
    if(etpState.index<etpState.text.length) etpState.spans[etpState.index].classList.add('current');
    else finishETP();
  } else {
    etpState.wrongCount++;
    const el=etpState.spans[etpState.index];
    el.classList.add('wrong'); setTimeout(()=>el.classList.remove('wrong'),150);
  }
  updateEtpStats();
}

function updateEtpStats() {
  if(!etpState)return;
  document.getElementById('etp-wrong').innerText=etpState.wrongCount;
  document.getElementById('etp-progress').innerText=`${etpState.index}/${etpState.text.length}`;
  const acc=etpState.totalKeys>0?Math.max(0,Math.round((etpState.totalKeys-etpState.wrongCount)/etpState.totalKeys*100)):100;
  document.getElementById('etp-acc').innerText=acc+'%';
  let wpm=0;
  if(etpState.startTime){ const em=(Date.now()-etpState.startTime)/1000/60; if(em>0) wpm=Math.round((etpState.index/5)/em); }
  document.getElementById('etp-wpm').innerText=wpm;
  updateEtpRace(wpm);
  const m=Math.floor((Date.now()-etpState.startTime)/1000/60);
  const s=Math.floor((Date.now()-etpState.startTime)/1000)%60;
  if(etpState.startTime) document.getElementById('game-timer').innerText=`時間：${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
}

function updateEtpRace(wpm) {
  if(!etpState)return;
  const tier = ETP_SPEED_TIERS.find(t=>wpm>=t.min&&wpm<=t.max)||ETP_SPEED_TIERS[0];
  const pct  = etpState.text.length>0 ? Math.round(etpState.index/etpState.text.length*100) : 0;
  document.getElementById('etp-race-fill').style.width=pct+'%';
  document.getElementById('etp-race-runner').style.left=pct+'%';
  document.getElementById('etp-race-emoji').innerText=tier.emoji;
  document.getElementById('etp-race-label').innerText=tier.label;
  document.getElementById('etp-race-pct').innerText=pct+'%';
}

function finishETP() {
  etpActive=false; clearInterval(etpTimerID);
  const elapsed=etpState.startTime?Math.floor((Date.now()-etpState.startTime)/1000):0;
  const m=Math.floor(elapsed/60),s=elapsed%60;
  const timeStr=`${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
  const acc=etpState.totalKeys>0?Math.max(0,Math.round((etpState.totalKeys-etpState.wrongCount)/etpState.totalKeys*100)):100;
  const wpm=elapsed>0?Math.round((etpState.index/5)/(elapsed/60)):0;

  document.getElementById('etp-result-overlay').style.display='flex';
  document.getElementById('etp-result-title').innerText='🎉 測驗完成！';
  document.getElementById('etp-result-body').innerHTML=`
    <p>⏱️ 時間：<b>${timeStr}</b></p>
    <p>⚡ 速度：<b>${wpm} WPM</b></p>
    <p>🎯 正確率：<b>${acc}%</b></p>
    <p>❌ 錯誤：<b>${etpState.wrongCount} 次</b></p>
  `;
}

function retryETP() {
  const rk=etpState.rowKey;
  document.getElementById('etp-result-overlay').style.display='none';
  startETP(rk);
}

function exitETP() {
  etpActive=false; clearInterval(etpTimerID); etpState=null;
  document.getElementById('etp-arena').style.display='none';
  document.getElementById('overlay').style.display='flex';
  document.getElementById('game-timer').innerText='時間：00:00';
}

// ETP key capture
window.addEventListener('keydown', e => {
  if (!etpActive) return;
  if (e.key==='Escape') { exitETP(); return; }
  if (e.key==='Enter') { e.preventDefault(); e.stopPropagation(); handleEtpKey('Enter'); return; }
  if (e.key.length===1) { e.preventDefault(); handleEtpKey(e.key); }
}, true);

</script>
</body>
</html>
