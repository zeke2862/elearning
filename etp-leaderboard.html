<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>華雲學校ETP英打測驗大會戰 - 即時排行榜</title>
    <style>
        body {
            background-color: #0d1117;
            color: #c9d1d9;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
        }
        h1 {
            text-align: center;
            color: #58a6ff;
            margin-bottom: 5px;
            font-size: 2.5rem;
            text-shadow: 0 0 10px rgba(88,166,255,0.3);
        }
        .subtitle {
            text-align: center;
            color: #8b949e;
            margin-bottom: 30px;
        }
        .board-container {
            display: flex;
            gap: 15px;
            justify-content: center;
            align-items: flex-start;
            flex-wrap: wrap;
        }
        .category-column {
            flex: 1;
            min-width: 280px;
            max-width: 380px;
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 8px;
            padding: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        .category-title {
            text-align: center;
            font-size: 1.3rem;
            font-weight: bold;
            padding: 8px 0;
            margin: -10px -10px 10px -10px;
            border-top-left-radius: 8px;
            border-top-right-radius: 8px;
            color: #ffffff;
        }
        .title-upper   { background-color: #0052cc; }
        .title-middle  { background-color: #00875a; }
        .title-lower   { background-color: #de350b; }
        .title-mix     { background-color: #6554c0; }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.95rem;
        }
        th, td {
            padding: 8px 6px;
            text-align: center;
            border-bottom: 1px solid #21262d;
        }
        th {
            background-color: #21262d;
            color: #58a6ff;
            font-weight: 600;
        }
        tr:hover {
            background-color: #262c36;
        }
        .rank-1 { color: #ffd700; font-weight: bold; }
        .rank-2 { color: #c0c0c0; font-weight: bold; }
        .rank-3 { color: #cd7f32; font-weight: bold; }
        .highlight-time { color: #58a6ff; font-weight: bold; }
        .highlight-acc { color: #57ab5a; font-weight: bold; }

        /* 💡 歷次最強 王者榜 */
        .champion-box {
            border-radius: 6px;
            padding: 8px 10px;
            margin-bottom: 10px;
            font-size: 0.85rem;
            line-height: 1.5;
        }
        .champion-box.all-time {
            background: linear-gradient(135deg, #4a3200, #2b1d00);
            border: 1px solid #ffd700;
        }
        .champion-box.this-round {
            background: linear-gradient(135deg, #12324a, #0b1f2e);
            border: 1px solid #58a6ff;
            margin-top: -4px;
        }
        .champion-label {
            font-weight: bold;
            font-size: 0.78rem;
            display: block;
            margin-bottom: 3px;
        }
        .champion-box.all-time .champion-label { color: #ffd700; }
        .champion-box.this-round .champion-label { color: #58a6ff; }
        .champion-name {
            font-weight: bold;
            color: #fff;
        }
        .champion-empty {
            color: #6e7681;
            font-style: italic;
        }
        .champion-stats {
            color: #8b949e;
        }
        .champion-stats .v { color: #57ab5a; font-weight: bold; }
    </style>
</head>
<body>

    <h1>🏆 華雲學校 ETP 測驗即時排行榜 🏆</h1>
    <div class="subtitle" id="subtitle">每 5 秒自動重新整理 · 專注精準度與極速極限</div>
    <div style="text-align:center; margin-bottom:10px;">
        <select id="dateSelect" style="background:#161b22; color:#c9d1d9; border:1px solid #30363d; border-radius:6px; padding:6px 12px; font-size:1rem;"></select>
    </div>

    <div class="board-container">
        <div class="category-column">
            <div class="category-title title-upper">▲ 上列文字區</div>
            <div id="champion-upper"></div>
            <table>
                <thead>
                    <tr><th>名次</th><th>座號</th><th>WPM</th><th>時間</th><th>錯誤</th><th>正確率</th><th>分數</th><th>IP</th><th>日期</th></tr>
                </thead>
                <tbody id="body-upper"></tbody>
            </table>
        </div>

        <div class="category-column">
            <div class="category-title title-middle">■ 中列文字區</div>
            <div id="champion-middle"></div>
            <table>
                <thead>
                    <tr><th>名次</th><th>座號</th><th>WPM</th><th>時間</th><th>錯誤</th><th>正確率</th><th>分數</th><th>IP</th><th>日期</th></tr>
                </thead>
                <tbody id="body-middle"></tbody>
            </table>
        </div>

        <div class="category-column">
            <div class="category-title title-lower">▼ 下列文字區</div>
            <div id="champion-lower"></div>
            <table>
                <thead>
                    <tr><th>名次</th><th>座號</th><th>WPM</th><th>時間</th><th>錯誤</th><th>正確率</th><th>分數</th><th>IP</th><th>日期</th></tr>
                </thead>
                <tbody id="body-lower"></tbody>
            </table>
        </div>

        <div class="category-column">
            <div class="category-title title-mix">★ 綜合挑戰區</div>
            <div id="champion-mix"></div>
            <table>
                <thead>
                    <tr><th>名次</th><th>座號</th><th>WPM</th><th>時間</th><th>錯誤</th><th>正確率</th><th>分數</th><th>IP</th><th>日期</th></tr>
                </thead>
                <tbody id="body-mix"></tbody>
            </table>
        </div>
    </div>

    <script>
        // 💡 從自己的網址讀取 year / className（不寫死），這樣從 admin.html 點過來才會對到正確的班級
        const params = new URLSearchParams(window.location.search);
        const year = params.get('year') || '2026';
        const className = params.get('className') || '';

        document.getElementById('subtitle').innerText = className
            ? `${year} 年度 ／ ${className}　每 5 秒自動重新整理 · 專注精準度與極速極限`
            : '⚠️ 網址缺少班級參數，請從 admin.html 的「開啟排行榜」按鈕進入';

        // 💡 目前選的日期（預設今天；只列出真的有資料的日期）
        let currentDate = null;

        function loadAvailableDates() {
            if (!className) return;
            fetch(`/etp-scores-dates?year=${encodeURIComponent(year)}&className=${encodeURIComponent(className)}`)
                .then(res => res.json())
                .then(dates => {
                    const select = document.getElementById('dateSelect');
                    const today = new Date().toISOString().slice(0, 10);
                    if (!Array.isArray(dates) || dates.length === 0) {
                        select.innerHTML = `<option value="${today}">${today}（尚無資料）</option>`;
                        currentDate = today;
                    } else {
                        select.innerHTML = dates.map(d => `<option value="${d}">${d}${d === today ? '（今天）' : ''}</option>`).join('');
                        currentDate = dates.includes(currentDate) ? currentDate : dates[0];
                        select.value = currentDate;
                    }
                    fetchScores();
                })
                .catch(err => console.warn('無法取得日期清單:', err));
        }
        document.getElementById('dateSelect').addEventListener('change', (e) => {
            currentDate = e.target.value;
            fetchScores();
        });

        function fetchScores() {
            if (!className || !currentDate) return;
            const url = `/etp-scores?year=${encodeURIComponent(year)}&className=${encodeURIComponent(className)}&date=${encodeURIComponent(currentDate)}`;
            fetch(url)
                .then(res => res.json())
                .then(data => {
                    document.getElementById('body-upper').innerHTML = '';
                    document.getElementById('body-middle').innerHTML = '';
                    document.getElementById('body-lower').innerHTML = '';
                    document.getElementById('body-mix').innerHTML = '';

                    let upperList  = data.filter(item => item.rowKey.includes('上'));
                    let middleList = data.filter(item => item.rowKey.includes('中'));
                    let lowerList  = data.filter(item => item.rowKey.includes('下'));
                    let mixList    = data.filter(item => item.rowKey.includes('綜') || item.rowKey.includes('全'));

                    const sortRule = (a, b) => {
                        let scoreA = a.score || 0;
                        let scoreB = b.score || 0;
                        if (scoreB !== scoreA) return scoreB - scoreA;
                        return (a.timeStr || '').localeCompare(b.timeStr || '');
                    };

                    upperList.sort(sortRule);
                    middleList.sort(sortRule);
                    lowerList.sort(sortRule);
                    mixList.sort(sortRule);

                    renderTable(upperList, 'body-upper');
                    renderTable(middleList, 'body-middle');
                    renderTable(lowerList, 'body-lower');
                    renderTable(mixList, 'body-mix');
                })
                .catch(err => console.error("無法取得排行榜資料:", err));
        }

        // 💡 歷次最強 王者榜：分別顯示「史上最強」(all-time，永久保留直到被打破)
        // 與「本次競賽最強」(thisRound，只算這次班際競賽開始之後的成績)
        const CHAMPION_CATEGORY_TO_ELEMENT = {
            '上': 'champion-upper',
            '中': 'champion-middle',
            '下': 'champion-lower',
            '綜': 'champion-mix'
        };

        function renderChampionEntry(label, entry, cssClass) {
            if (!entry) {
                return `<div class="champion-box ${cssClass}">
                    <span class="champion-label">${label}</span>
                    <span class="champion-empty">尚無紀錄</span>
                </div>`;
            }
            return `<div class="champion-box ${cssClass}">
                <span class="champion-label">${label}</span>
                <span class="champion-name">${entry.seatNumber}</span>
                <span class="champion-stats">
                    · ${entry.timeStr} · 錯${entry.wrongCount} · <span class="v">${entry.accuracy}</span> · <span class="v">${entry.score}分</span>
                </span>
            </div>`;
        }

        function fetchHallOfFame() {
            fetch('/etp-hall-of-fame')
                .then(res => res.json())
                .then(data => {
                    for (const [shortKey, elementId] of Object.entries(CHAMPION_CATEGORY_TO_ELEMENT)) {
                        const container = document.getElementById(elementId);
                        if (!container) continue;

                        const allTimeEntry = data.allTime ? data.allTime[shortKey] : null;
                        const thisRoundEntry = data.thisRound ? data.thisRound[shortKey] : null;

                        let html = renderChampionEntry('👑 史上最強', allTimeEntry, 'all-time');
                        html += renderChampionEntry('🏆 本次競賽最強', thisRoundEntry, 'this-round');
                        container.innerHTML = html;
                    }
                })
                .catch(err => console.error("無法取得歷次最強資料:", err));
        }

        function renderTable(list, elementId) {
            const tbody = document.getElementById(elementId);
            if (list.length === 0) {
                tbody.innerHTML = `<tr><td colspan="9" style="color:#8b949e; font-style:italic;">暫無資料</td></tr>`;
                return;
            }

            const displayLimit = Math.min(list.length, 50);
            for (let i = 0; i < displayLimit; i++) {
                const item = list[i];
                const tr = document.createElement('tr');

                let rankClass = '';
                if (i === 0) rankClass = 'class="rank-1"';
                else if (i === 1) rankClass = 'class="rank-2"';
                else if (i === 2) rankClass = 'class="rank-3"';

                tr.innerHTML = `
                    <td ${rankClass}>${i + 1}</td>
                    <td style="font-weight:bold; color:#fff;">${item.seatNumber}</td>
                    <td style="color:#39ff9d;">${item.wpm || 0}</td>
                    <td class="highlight-time">${item.timeStr}</td>
                    <td style="color:#ff8b8b;">${item.wrongCount}</td>
                    <td class="highlight-acc">${item.accuracy}</td>
                    <td style="color:#ffd700; font-weight:bold;">${item.score || 0}</td>
                    <td style="color:#8b949e; font-size:0.8rem;">${item.ip || '-'}</td>
                    <td style="color:#8b949e; font-size:0.8rem;">${item.date || '-'}</td>
                `;
                tbody.appendChild(tr);
            }
        }

        loadAvailableDates();
        fetchHallOfFame();
        setInterval(fetchScores, 5000);
        setInterval(fetchHallOfFame, 5000);
    </script>
</body>
</html>
