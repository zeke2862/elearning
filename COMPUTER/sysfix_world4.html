<!DOCTYPE html>
<html lang="zh-Hant"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>系統修復師：考題訓練場（世界4）</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark;--bg:#0b1220;--panel:#111c33;--ink:#e6f1ff;--neon:#39ff9c;--gold:#ffd166}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif}
#app{position:relative;height:100%;display:flex;flex-direction:column;max-width:960px;margin:0 auto;user-select:none;-webkit-user-select:none}
#hud{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;font-size:18px;background:var(--panel)}
#brief{padding:10px 12px;font-size:clamp(14px,3.6vw,19px);font-weight:700;color:var(--neon);text-align:center;background:#0d2a22;min-height:50px}
#timer{height:6px;background:#1c2b4a}#tb{height:100%;width:0;background:var(--gold)}
#stage{position:relative;flex:1;min-height:0;overflow:hidden;background:linear-gradient(160deg,#12305a,#0b1a33);transition:box-shadow .2s}
#layer{position:absolute;inset:0;display:flex;flex-direction:column}
#top{flex:1;display:flex;padding:12px;overflow:auto}
#bot{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;padding:8px;background:#0006}
.qc{width:100%;margin:auto;text-align:center;padding:6px}
.qc>div:first-child{font-size:clamp(17px,4.2vw,25px);line-height:1.7}
.qc p{min-height:24px;font-size:15px;line-height:1.5;color:var(--gold)}
.qi{max-width:92%;max-height:150px;margin:8px auto;display:block;border-radius:6px;background:#fff}
.op{width:calc(50% - 6px);margin:4px 0!important;background:#22355c!important;color:var(--ink)!important;font-size:15px!important;display:flex!important;align-items:center;justify-content:center;min-height:52px}
.op:has(img){background:#e2e8f0!important}
.mg{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin-top:10px}
.cell{width:min(210px,44%);text-align:center;font-size:14px}
.cell img{width:100%;max-height:110px;object-fit:contain;background:#fff;border-radius:6px;display:block;margin-bottom:6px}
.bl{display:inline-block;min-width:96px;min-height:36px;padding:4px 8px;margin:2px 4px;border-bottom:3px solid var(--gold);background:#0b1220;border-radius:6px;vertical-align:middle;font-size:16px;line-height:1.6}
.bl.ok{color:var(--neon);border-color:var(--neon)}
.chip{padding:9px 13px;margin:3px;background:var(--gold);color:#000;font-weight:700;border-radius:8px;cursor:grab;touch-action:none;font-size:15px}
.ghost{position:fixed;pointer-events:none;z-index:9999;opacity:.85;transform:translate(-50%,-50%)}
.kbw{width:100%;max-width:900px;margin:auto 0}
.kbr{display:flex;gap:4px;margin-bottom:5px}
.kbc{min-width:0;position:relative}
.kbc input{width:100%;height:44px;font-size:14px;text-align:center;border:2px solid #4b6a9b;border-radius:5px;background:#f8fafc;color:#111;padding:0 2px;font-family:inherit}
.kbc input.pre{background:#cbd5e1;color:#334155;font-weight:700}
.kbc input.ok{background:#bbf7d0;border-color:#16a34a}
.kbc input.no{background:#fecaca;border-color:#dc2626}
.kbc small{position:absolute;left:0;right:0;bottom:-3px;font-size:10px;color:#fca5a5;text-align:center;background:#0b1220cc}
#bar{height:34px;background:#0a0f1c;display:flex;align-items:center;justify-content:space-between;padding:0 12px;font-size:13px;color:#8ba3c7}
#ov{position:absolute;inset:0;background:#000c;display:none;align-items:center;justify-content:center;z-index:9998;padding:16px}
.card{background:var(--panel);border:2px solid var(--neon);border-radius:14px;padding:20px;max-width:440px;width:100%;text-align:center;box-shadow:0 0 30px #39ff9c44;max-height:100%;overflow:auto}
.card h2{margin:0 0 8px}.card p{line-height:1.6;margin:8px 0;font-size:15px}
button.b{display:block;width:100%;margin:8px 0;padding:12px;font-size:16px;border:0;border-radius:10px;background:var(--neon);color:#062;font-weight:700;cursor:pointer;font-family:inherit}
button.b.g{background:#22355c;color:var(--ink)}
</style></head>
<body>
<div id="app">
  <div id="hud"><span id="hp"></span><span id="cb"></span><span id="sc"></span></div>
  <div id="brief">考題訓練場</div>
  <div id="timer"><div id="tb"></div></div>
  <div id="stage"><div id="layer"></div></div>
  <div id="bar"><span>📝 世界4：考題訓練場 v0.1</span><span>題目來自期中、期末考與圖示表</span></div>
  <div id="ov"></div>
</div>

const $=s=>document.querySelector(s),R=(a,b)=>Math.floor(Math.random()*(b-a+1))+a,shuf=a=>[...a].sort(()=>Math.random()-.5),pick=(a,n)=>shuf(a).slice(0,n);
const layer=$('#layer'),ov=$('#ov'),brief=$('#brief'),tb=$('#tb'),stage=$('#stage');
let G={t:[],over:true},best={};
const T=(f,ms)=>{const id=setTimeout(f,ms);G.t.push(id);return id};
const clr=()=>{G.t.forEach(clearTimeout);G.t=[]};
const hide=()=>{ov.style.display='none'};
function hud(){const h=Math.max(G.hearts||0,0);$('#hp').textContent='❤️'.repeat(h)+'🖤'.repeat(3-h);$('#sc').textContent='分數 '+(G.score||0);$('#cb').textContent=G.combo>1?'🔥連擊 x'+G.combo:''}
function card(h){ov.innerHTML='<div class="card">'+h+'</div>';ov.style.display='flex'}
function setBar(p,ms){tb.style.transition='none';tb.style.width=p+'%';if(ms){void tb.offsetWidth;tb.style.transition='width '+ms+'ms linear';tb.style.width='0%'}}
function flash(){stage.style.boxShadow='inset 0 0 60px #ff2d55';setTimeout(()=>stage.style.boxShadow='none',250)}
function base(t){G.b=t;brief.textContent=t}
function hint(m){brief.textContent=m;T(()=>brief.textContent=G.b,1600)}
function bad(m){G.hearts--;G.combo=0;hud();flash();hint('❌ '+m);if(G.hearts<=0)T(()=>finish(false,'愛心用完了！'),500)}
function setup(){layer.innerHTML='<div id="top"></div><div id="bot"></div>';G.lock=false;return[$('#top'),$('#bot')]}

function nextQ(){

 if(G.qi>=G.qs.length){if(G.end){G.qs=buildEnd();G.qi=0}else return finish(true,'全部答完了！')}
 G.round++;base(G.end?`第 ${G.round} 題`:`第 ${G.qi+1}/${G.qs.length} 題`);askQ(G.qs[G.qi]);
}
function askQ(x){
 const[top,bot]=setup();
 top.innerHTML=`<div class="qc"><div>${x.q}</div>${x.img?`<img class="qi" src="${x.img}">`:''}<p id="ex"></p></div>`;
 x.opts.forEach(o=>{
  const b=document.createElement('button');b.className='b op';
  b.innerHTML=o.i!=null?`<img src="${IC[o.i]}" style="height:34px">`:o.t;
  b.onclick=()=>{
   if(G.lock||G.over)return;G.lock=true;clearTimeout(G.to);
   [...bot.children].forEach((c,j)=>{if(x.opts[j].ok)c.style.cssText+='background:#16a34a!important'});
   $('#ex').textContent=(o.ok?'✅ ':'❌ ')+(x.e||'');
   if(o.ok){G.combo++;G.score+=100+G.combo*10;hud()}else bad(x.e||'再想想看');
   G.qi++;T(nextQ,o.ok?1100:2200);
  };
  bot.appendChild(b);
 });
 if(G.end){G.lim=Math.max(3500,10000-G.round*150);setBar(100,G.lim);G.to=T(()=>{if(G.lock||G.over)return;G.lock=true;bad('時間到！');G.qi++;T(nextQ,1500)},G.lim)}
}

 rd('在中文輸入法下，可以按「{0}」切換成英文模式。',['Shift'],['Enter','Tab','Ctrl']),

FL.push(
 rd('滑鼠的基本操作有：單擊、「{0}」、「{1}」、「{2}」。',['雙擊','拖曳','右鍵'],['關機','複製'],1),

 rd('主機是電腦的「{0}」，螢幕是電腦的「{1}」，鍵盤和滑鼠是電腦的「{2}」。',['大腦','臉','手和腳'],['耳朵','眼鏡']),
 rd('好的密碼要有大寫、小寫、「{0}」，而且要「{1}」。',['數字','夠長'],['生日','123456']),
 rd('不能在網路上公開：真實姓名、電話、「{0}」、「{1}」。',['住址','學校名稱'],['喜歡的遊戲','電影心得'],1),
 rd('鍵盤上的基準鍵是「{0}」和「{1}」，食指放在上面。',['F','J'],['A','L'],1),
 rd('副檔名 doc／docx 是「{0}」，xlsx 是「{1}」，pptx 是「{2}」。',['WORD','EXCEL','簡報'],['記事本','網頁']),
 rd('關機的順序：開始功能表 → 「{0}」 → 「{1}」。',['電源','關機'],['登出','重新整理']));
FL.push(...CUSTOM.fill.map(f=>rd(f.q,f.c,f.x||[],f.grp)));
/* ===== 自動出題：每次玩都會產生不同的題目 ===== */
const NM=['作業','照片','報告','歌曲','123','成績','簡報','筆記','旅行','課表'];
const EXT=[['jpg','圖片'],['jpeg','圖片'],['png','圖片'],['gif','圖片'],['mp3','音樂'],['wav','音樂'],['mp4','影片'],['doc','WORD 文件'],['docx','WORD 文件'],['xls','EXCEL 表格'],['xlsx','EXCEL 表格'],['ppt','簡報'],['pptx','簡報'],['txt','記事本文字檔'],['html','網頁'],['zip','壓縮檔'],['pdf','PDF 文件']];
const SC=[['Ctrl+C','複製'],['Ctrl+V','貼上'],['Ctrl+X','剪下'],['Ctrl+Z','復原上一步'],['Ctrl+A','全選'],['Ctrl+S','存檔'],['F2','重新命名'],['Delete','刪除（丟進資源回收桶）'],['Alt+F4','關閉視窗'],['Win+D','顯示桌面'],['Win+Space','切換輸入法']];
const TYPES=[...new Set(EXT.map(x=>x[1]))],DG='1234567890';
const opt4=(ok,ds)=>shuf([{t:ok,ok:true}].concat(ds.map(t=>({t,ok:false}))));
const rnd=a=>a[R(0,a.length-1)];
function genItem(){
 const k=R(0,4);
 if(k===0){const[e,t]=rnd(EXT);return{q:`看到檔案【${rnd(NM)}.${e}】，代表它是？`,opts:opt4(t,pick(TYPES.filter(x=>x!==t),3)),e:`.${e} 是${t}。`}}
 if(k===1){const t=rnd(TYPES),e=rnd(EXT.filter(x=>x[1]===t))[0];const ds=[...new Set(EXT.filter(x=>x[1]!==t).map(x=>'.'+x[0]))];return{q:`下列哪一個是「${t}」的副檔名？`,opts:opt4('.'+e,pick(ds,3)),e:`.${e} 是${t}。`}}
 if(k===2){const[a,f]=rnd(SC);return{q:`按 ${a} 可以做什麼？`,opts:opt4(f,pick(SC.filter(x=>x[1]!==f).map(x=>x[1]),3)),e:`${a}＝${f}。`}}
 if(k===3){const[a,f]=rnd(SC);return{q:`想要「${f}」，可以按哪一組按鍵？`,opts:opt4(a,pick(SC.filter(x=>x[0]!==a).map(x=>x[0]),3)),e:`${f}＝${a}。`}}
 const d=rnd([...DG]),s=SH[d];return{q:`在英文模式下，按著 Shift 再按數字「${d}」，會打出哪個符號？`,opts:opt4(s,pick([...DG].filter(x=>x!==d).map(x=>SH[x]),3)),e:`Shift＋${d}＝${s}。`}
}
function genTF(){
 const k=R(0,2),y=R(0,1);
 if(k===0){const[e,t]=rnd(EXT),w=rnd(TYPES.filter(x=>x!==t)),n=rnd(NM);return[`檔名【${n}.${e}】是${y?t:w}。`,y,`.${e} 是${t}。`]}
 if(k===1){const[a,f]=rnd(SC),w=rnd(SC.filter(x=>x[1]!==f))[1];return[`按 ${a} 可以「${y?f:w}」。`,y,`${a}＝${f}。`]}
 const d=rnd([...DG]),s=SH[d],w=SH[rnd([...DG].filter(x=>x!==d))];return[`英文模式下，Shift＋數字 ${d} 會打出「${y?s:w}」。`,y,`Shift＋${d}＝${s}。`]
}
function importCard(){
 card(`<h2>📥 匯入老師題庫</h2><p>選擇 .json 檔，題目只加入這一次遊戲。<br>（"a" 是第幾個選項，第一個是 0）</p><input type="file" id="jf" accept=".json,application/json"><p id="jr" style="color:var(--gold)"></p><pre style="text-align:left;font-size:12px;white-space:pre-wrap;background:#0b1220;padding:8px;border-radius:6px">{"mc":[{"q":"題目","o":["甲","乙","丙","丁"],"a":1,"e":"說明"}],\n"tf":[["句子",true,"說明"]],\n"fill":[{"q":"電腦要有{0}和{1}","c":["硬體","軟體"],"x":["網路"],"grp":0}]}</pre><button class="b g" onclick="menu()">返回</button>`);
 $('#jf').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{$('#jr').textContent=importBank(r.result)};r.readAsText(f,'utf-8')};
}
function importBank(txt){
 let j;try{j=JSON.parse(txt)}catch(e){return'不是正確的 JSON 格式'}
 const esc=s=>String(s).replace(/[&<>"]/g,c=>'&#'+c.charCodeAt(0)+';'),n=[0,0,0];
 (j.mc||[]).forEach(m=>{if(m&&m.q&&Array.isArray(m.o)&&m.o.length>=2&&Number.isInteger(m.a)&&m.a>=0&&m.a<m.o.length){MC.push({q:esc(m.q),o:m.o.map(esc),a:m.a,e:esc(m.e||'')});n[0]++}});
 (j.tf||[]).forEach(t=>{if(Array.isArray(t)&&t.length>=2){TF.push([esc(t[0]),t[1]?1:0,esc(t[2]||'')]);n[1]++}});
 (j.fill||[]).forEach(f=>{if(f&&f.q&&Array.isArray(f.c)&&f.c.length&&(String(f.q).match(/\{\d+\}/g)||[]).length===f.c.length){FL.push(rd(esc(f.q).replace(/&#123;/g,'{'),f.c.map(esc),(f.x||[]).map(esc),f.grp?1:0));n[2]++}});
 return`已加入：選擇題 ${n[0]}、是非題 ${n[1]}、填充題 ${n[2]} 題`;
}
const mr=(t,it,x)=>({q:`<div>${t}</div><div class="mg">`+it.map((z,i)=>`<div class="cell"><img src="${z[0]}"><span class="bl" data-i="${i}"></span></div>`).join('')+'</div>',c:it.map(z=>z[1]),x,b:it.map(z=>[z[1]])});
function matchRounds(){
 const cs=shuf(CAB),M=[],L=i=>ICONS.find(x=>x[0]===i)[1];
 [cs.slice(0,3),cs.slice(3)].forEach((g,j)=>M.push(mr('配合題：請寫出各功能線的名稱',g.map(([k,n])=>[CB[k],n]),cs.slice(j?0:3).slice(0,2).map(z=>z[1]))));
 const gs=[[5,6,7,8],[14,16,17,20],[12,18,13,24],[28,29,30,31],[32,33,10,11]];
 M.push(mr('視窗右上角的按鈕，各是什麼？',[0,1,3,2].map(i=>[IC[i],L(i)]),[]));
 pick(gs,2).forEach(g=>M.push(mr('這些圖示各代表什麼？',g.map(i=>[IC[i],L(i)]),[])));
 return M}
function dragify(f,sel,onDrop){
 f.onpointerdown=e=>{
  if(G.over)return;e.preventDefault();
  const g=f.cloneNode(true);g.classList.add('ghost');document.body.appendChild(g);f.style.opacity=.3;
  const mv=ev=>{g.style.left=ev.clientX+'px';g.style.top=ev.clientY+'px'};mv(e);
  const up=ev=>{document.removeEventListener('pointermove',mv);document.removeEventListener('pointerup',up);g.remove();f.style.opacity=1;
   if(G.over)return;const d=document.elementFromPoint(ev.clientX,ev.clientY),t=d&&d.closest(sel);if(t)onDrop(t)};
  document.addEventListener('pointermove',mv);document.addEventListener('pointerup',up);
 };
}
function nextFill(){
 if(G.over)return;if(G.rd>=G.rs.length)return finish(true,'全部拖對了！');
 base(`第 ${G.rd+1}/${G.rs.length} 題｜把答案拖進空格`);
 const r=G.rs[G.rd],[top,bot]=setup();G.nb=r.b.length;G.nf=0;
 top.innerHTML=`<div class="qc">${r.q.replace(/\{(\d+)\}/g,(m,i)=>`<span class="bl" data-i="${i}"></span>`)}</div>`;
 shuf(r.c.concat(r.x)).forEach(t=>{
  const c=document.createElement('div');c.className='chip';c.textContent=t;bot.appendChild(c);
  dragify(c,'.bl',bl=>{
   if(bl.textContent)return;
   if(r.b[+bl.dataset.i].includes(t)){bl.textContent=t;bl.classList.add('ok');c.remove();G.combo++;G.score+=100+G.combo*10;hud();
    if(++G.nf===G.nb){G.rd++;base('✅ 這題完成！');T(nextFill,900)}}
   else bad('「'+t+'」不是這裡的答案');
  });
 });
}

/* ===== 鍵盤默寫（格子像 EXCEL）===== */
const KB=[
 [...'`1234567890-='].map(k=>[k,1]).concat([['Backspace',2]]),
 [['Tab',1.5]].concat([...'QWERTYUIOP[]'].map(k=>[k,1]),[['\\',1.5]]),
 [['Caps Lock',1.75]].concat([...'ASDFGHJKL;\''].map(k=>[k,1]),[['Enter',2.25]]),
 [['Shift',2.25]].concat([...'ZXCVBNM,./'].map(k=>[k,1]),[['Shift',2.75]]),
 [['Ctrl',1.25],['Win',1.25],['Alt',1.25],['Space',6.25],['Alt',1.25],['Win',1.25,'fn'],['Menu',1.25],['Ctrl',1.25]]];
const SH={'`':'~','1':'!','2':'@','3':'#','4':'$','5':'%','6':'^','7':'&','8':'*','9':'(','0':')','-':'_','=':'+','[':'{',']':'}','\\':'|',';':':',"'":'"',',':'<','.':'>','/':'?'};
const AL={backspace:['backspace','back','退格','退格鍵','倒退'],tab:['tab','跳格'],capslock:['capslock','caps','大寫鎖定','大寫鎖定鍵'],enter:['enter','return','輸入','換行'],shift:['shift','上檔'],ctrl:['ctrl','control'],alt:['alt'],space:['space','spacebar','空白','空白鍵'],win:['win','windows','window','視窗鍵'],menu:['menu','選單','選單鍵']};
function chk(c,val){
 const v=val.trim().toLowerCase().replace(/\s+/g,'');
 if(c.fn){const key=c.k.toLowerCase().replace(/\s+/g,'');return(AL[key]||[key]).includes(v)||(c.alt&&v===c.alt)||(key==='space'&&val!==''&&val.trim()==='')}
 return v===c.k.toLowerCase()||(!!SH[c.k]&&val.trim()===SH[c.k]);
}
function kb(lv){
 const[top,bot]=setup();top.style.overflow='auto';
 const w=document.createElement('div');w.className='kbw';G.rows=[];G.cs=[];
 KB.forEach((row,ri)=>{
  const r=document.createElement('div');r.className='kbr';const rr=[];
  row.forEach(([k,u,alt])=>{
   const fn=k.length>1,pre=(lv===1&&!fn)||(lv===2&&fn);
   const d=document.createElement('div');d.className='kbc';d.style.flex=u+' 1 0';
   const i=document.createElement('input');i.autocomplete='off';i.spellcheck=false;
   if(pre){i.value=k;i.readOnly=true;i.className='pre';i.tabIndex=-1}
   const c={k,fn,alt,i,pre,d};rr.push(c);if(!pre)G.cs.push(c);
   i.onkeydown=e=>nav(e,c);i.oninput=cnt;d.appendChild(i);r.appendChild(d);
  });
  G.rows.push(rr);w.appendChild(r);
 });
 top.appendChild(w);
 bot.innerHTML='<button class="b" id="sb">📝 交卷</button>';$('#sb').onclick=submit;
 G.tot=G.cs.length;cnt();
 const secs=[0,150,240,300][lv];setBar(100,secs*1000);T(submit,secs*1000);
 if(G.cs[0])G.cs[0].i.focus();
}
function cnt(){if(!G.sub)base(`⌨️ 把每個鍵的名稱打進格子（Enter 跳下一格）｜已填 ${G.cs.filter(c=>c.i.value.trim()!=='').length}/${G.tot}`)}
function nav(e,c){
 const flat=[].concat(...G.rows),cur=flat.indexOf(c),k=e.key;let t=null;
 const mv=d=>{let j=cur+d;while(flat[j]&&flat[j].pre)j+=d;return flat[j]};
 const ri=G.rows.findIndex(r=>r.includes(c)),ci=G.rows[ri].indexOf(c);
 if(k==='Enter'||k==='ArrowRight')t=mv(1);
 else if(k==='ArrowLeft')t=mv(-1);
 else if(k==='ArrowDown'||k==='ArrowUp'){const rr=G.rows[ri+(k==='ArrowDown'?1:-1)];if(rr)t=rr[Math.min(ci,rr.length-1)]}
 if(k==='Enter'||k.startsWith('Arrow')){e.preventDefault();if(t)t.i.focus()}
}
function submit(){
 if(G.over||G.sub)return;G.sub=true;clearTimeout(G.to);setBar(0);let ok=0;
 G.cs.forEach(c=>{const g=chk(c,c.i.value);c.i.classList.add(g?'ok':'no');c.i.readOnly=true;if(g)ok++;else{const s=document.createElement('small');s.textContent=c.k;c.d.appendChild(s)}});
 const acc=ok/G.tot,st=acc>=.95?3:acc>=.8?2:acc>=.6?1:0;G.score=ok*10;hud();
 $('#bot').innerHTML=`<button class="b" onclick="go('${G.mode}')">再玩一次</button><button class="b g" onclick="menu()">主選單</button>`;
 finish(st>0,`答對 ${ok} / ${G.tot} 格（${Math.round(acc*100)}%）`,st,1);
}

/* ===== 選單與流程 ===== */
function menu(){clr();G={t:[],over:true,hearts:3,score:0,combo:0};layer.innerHTML='';hud();base('選擇任務');setBar(0);
card(`<h2>📝 考題訓練場</h2><p>把課本和考卷的內容，練成你的必殺技！</p>
<button class="b" onclick="intro('mc')">① 選擇題</button>
<button class="b" onclick="intro('tf')">② 是非題</button>
<button class="b" onclick="intro('fill')">③ 填充題（拖曳答案）</button>
<button class="b" onclick="intro('match')">④ 配合題（看圖拖曳）</button>
<button class="b" onclick="intro('kb1')">⑤ 鍵盤默寫：功能鍵</button>
<button class="b" onclick="intro('kb2')">⑥ 鍵盤默寫：字母數字符號</button>
<button class="b" onclick="intro('kb3')">⑦ 鍵盤默寫：全部（期末考版）</button>
<button class="b g" onclick="intro('end')">♾️ 無盡題庫</button>
<button class="b g" onclick="importCard()">📥 匯入老師題庫（JSON）</button>`)}
const INFO={
mc:['① 選擇題','<b>題目來自期中、期末考卷和圖示表。</b><br>選出正確答案，共 11 題，答錯會扣愛心。'],
tf:['② 是非題','判斷句子是⭕對還是❌錯，共 12 題。答錯會告訴你為什麼。'],
fill:['③ 填充題','把下面的答案<b>按住拖曳</b>到句子的空格裡，共 6 題。<br>拖錯位置會扣愛心。'],
match:['④ 配合題','看圖片，把正確的名稱<b>拖曳</b>到圖片下面的空格，共 5 題（含轉接線和電腦圖示）。'],
kb1:['⑤ 鍵盤：功能鍵','鍵盤上灰色的字母鍵已經給你了，請在空白格子打出 <b>Tab、Caps Lock、Enter、Shift、Ctrl、Alt、Space、Backspace、Win、Menu</b> 的名稱。<br>按 Enter 可以跳到下一格。限時 2.5 分鐘。'],
kb2:['⑥ 鍵盤：字母數字符號','功能鍵已經給你了，請在空白格子打出<b>每個鍵上的字母、數字或符號</b>。<br>符號鍵打上面或下面的符號都算對。限時 4 分鐘。'],
kb3:['⑦ 鍵盤：全部默寫','和期末考一樣，整個鍵盤都是空白！<br>把每一個鍵的名稱打進格子，限時 5 分鐘，答對 95% 以上拿 3 顆星。'],
end:['♾️ 無盡題庫','選擇題、是非題、圖示題混在一起一直出現，越來越快。<br>3 條命，看你能撐幾題！']};
function intro(m){card(`<h2>${INFO[m][0]}</h2><p>${INFO[m][1]}</p><button class="b" onclick="go('${m}')">開始任務</button><button class="b g" onclick="menu()">返回</button>`)}
function go(m){
 clr();hide();layer.innerHTML='';G={t:[],mode:m,hearts:3,score:0,combo:0,round:0,qi:0,rd:0,over:false};hud();setBar(0);
 if(m==='mc'){G.qs=buildMC();nextQ()}
 else if(m==='tf'){G.qs=shuf(pick(TF,8).map(tfItem).concat(Array.from({length:4},genTF).map(tfItem)));nextQ()}
 else if(m==='end'){G.end=true;G.qs=buildEnd();nextQ()}
 else if(m==='fill'){G.rs=pick(FL,6);nextFill()}
 else if(m==='match'){G.rs=matchRounds();nextFill()}
 else kb(+m.slice(2));
}
function finish(win,msg,st,keep){
 if(G.over)return;G.over=true;clr();
 const m=G.mode;st=st!=null?st:(win?Math.max(1,G.hearts):0);best[m]=Math.max(best[m]||0,G.score);
 const title=m==='end'?'♾️ 撐了 '+Math.max(0,G.round-1)+' 題':win?'✅ 任務成功！':'💥 任務失敗';
 card(`<h2>${title}</h2><p>${msg||''}</p>${m==='end'?'':`<div style="font-size:34px">${'⭐'.repeat(st)+'☆'.repeat(3-st)}</div>`}<p>分數 ${G.score}｜本次最高 ${best[m]}</p><button class="b" onclick="go('${m}')">再玩一次</button>${keep?'<button class="b g" onclick="hide()">👀 看標準答案</button>':''}<button class="b g" onclick="menu()">主選單</button>`);
 try{parent.postMessage({type:'sysfix-result',world:4,mode:m,win,stars:st,score:G.score},'*')}catch(e){}
}
menu();
</script>
