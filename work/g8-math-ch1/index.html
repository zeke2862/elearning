<script>
/* ========== 接上教師後台的程式（整段複製，只改最上面的 GAME_KEY） ========== */
const GAME_KEY = 'math-g8-ch1';            // 遊戲代號：小寫英文／數字／-／_，建議「科目簡碼-遊戲名」

/* 1) 學號：沒有就強迫輸入 */
function ensureStudent(done) {
  const no = keyagentGetActiveStudentNumber();
  if (no) return done(no);
  const v = (prompt('請輸入你的學號') || '').trim();
  if (!/^[A-Za-z0-9_-]{2,12}$/.test(v)) return ensureStudent(done);
  localStorage.setItem('keyagent_active_student', JSON.stringify({ studentNumber: v, verified: false }));
  done(v);
}

/* 2) 練習時間：只算「玩完一局」的時間；切到別的分頁不算；中途關掉的那一局不算 */
let T0 = 0, ACC = 0;
function tStart()  { ACC = 0; T0 = Date.now(); }
function tPause()  { if (T0) { ACC += Date.now() - T0; T0 = 0; } }
function tResume() { if (!T0 && !document.hidden) T0 = Date.now(); }
function tTake()   { tPause(); const s = Math.min(1800, Math.round(ACC / 1000)); ACC = 0; return s; }
document.addEventListener('visibilitychange', () => (document.hidden ? tPause() : tResume()));

/* 3) 一局結束時呼叫 finishRound({...})，會自動記錄並送到老師的後台 */
function finishRound(r) {
  // r = { stageId:'L1', stageName:'第一課 認字', score:80, right:8, total:10, stars:2(可省略), nick:'小勇者'(可省略),
  //       types:[{ key:'read', label:'看字讀音', right:5, total:6 }, ...](可省略) }
  const secs = tTake();
  keyagentUpdateOtherGame(GAME_KEY, prev => {
    const stages = Object.assign({}, prev.stages);
    const s = stages[r.stageId] || {};
    stages[r.stageId] = {
      n: r.stageName || r.stageId,
      bestStars: Math.max(s.bestStars || 0, r.stars || 0),
      bestScore: Math.max(s.bestScore || 0, r.score || 0),
      plays: (s.plays || 0) + 1,
      hist: (s.hist || []).concat([{ at: Date.now(), q: r.total || 0, ok: r.right || 0, s: secs, st: r.stars || 0 }]).slice(-30),   // 每一次的結果（後台點答對率可看）
      totalSecs: (s.totalSecs || 0) + secs,
      totalQ: (s.totalQ || 0) + (r.total || 0),
      totalOk: (s.totalOk || 0) + (r.right || 0)
    };
    const q = Object.assign({}, prev.q);
    (r.types || []).forEach(t => {
      const k = r.stageId + ':' + t.key, o = q[k] || { n: 0, ok: 0 };
      q[k] = { n: o.n + (t.total || 0), ok: o.ok + (t.right || 0), label: t.label || t.key };
    });
    return {
      nick: r.nick || prev.nick || '',
      totalPlays: (prev.totalPlays || 0) + 1,
      bestScore: Math.max(prev.bestScore || 0, r.score || 0),
      totalSecs: (prev.totalSecs || 0) + secs,
      totalQ: (prev.totalQ || 0) + (r.total || 0),
      totalOk: (prev.totalOk || 0) + (r.right || 0),
      lastScore: r.score || 0, lastId: r.stageId, lastName: r.stageName || r.stageId, lastAt: Date.now(),
      stages, q
    };
  });
}
keyagentInstallPageHideSync();           // 4) 離開頁面時補寄一次
/* ========== 以上整段不用改 ========== */
</script>

const cv=$('#fx'),cx=cv.getContext('2d');let W,H,mx=0,my=0;const amb=[],bs=[];

addEventListener('pointermove',e=>{mx=e.clientX/W-.5;my=e.clientY/H-.5});
function burst(x,y,n=36){for(let i=0;i<n;i++){const a=Math.random()*6.28,s=Math.random()*5+2;bs.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-2,l:1,r:Math.random()*3+1.5,c:COL[i%4]})}}
(function loop(){cx.clearRect(0,0,W,H);cx.globalCompositeOperation='lighter';
for(const p of amb){p.x+=p.vx;p.y+=p.vy;if(p.y<-10){p.y=H+10;p.x=Math.random()*W}if(p.x<-10)p.x=W+10;if(p.x>W+10)p.x=-10;
const X=p.x+mx*p.r*14,Y=p.y+my*p.r*14,g=cx.createRadialGradient(X,Y,0,X,Y,p.r*5);g.addColorStop(0,`rgba(${p.c},${p.a})`);g.addColorStop(1,`rgba(${p.c},0)`);cx.fillStyle=g;cx.beginPath();cx.arc(X,Y,p.r*5,0,6.28);cx.fill()}
for(let i=bs.length-1;i>=0;i--){const p=bs[i];p.x+=p.vx;p.y+=p.vy;p.vy+=.14;p.vx*=.985;p.l-=.016;if(p.l<=0){bs.splice(i,1);continue}cx.fillStyle=`rgba(${p.c},${p.l})`;cx.beginPath();cx.arc(p.x,p.y,p.r,0,6.28);cx.fill()}
requestAnimationFrame(loop)})();
/* ---- helpers ---- */

const geo=(i,cls='')=>`<svg class="geo ${cls}" viewBox="0 0 100 100">${SH[i].split(' M').map((d,k)=>`<path d="${k?'M':''}${d}" pathLength="1" style="animation-delay:${k*.35}s"/>`).join('')}</svg>`;
const scr=h=>{app.innerHTML='<div class="scr">'+h+'</div>';scrollTo(0,0)};
document.addEventListener('pointermove',e=>{const t=e.target.closest&&e.target.closest('.tilt');if(!t)return;const r=t.getBoundingClientRect(),x=(e.clientX-r.left)/r.width-.5,y=(e.clientY-r.top)/r.height-.5;t.style.transform=`perspective(700px) rotateY(${x*16}deg) rotateX(${-y*16}deg) translateZ(10px)`});

let cur;

let SC,SX,SM='map',px=40,tx=40,jy=0,jt=0,hurt=0,bump=[],pops=[],T=0;const BX=i=>150+i*190,GY=135,SW=360,SH2=170;

c.fillStyle='rgba(255,255,255,.92)';for(let k=0;k<9;k++)cloud(((k*180-cam*.3-T*.25)%1620+1620)%1620-120,22+(k%3)*16);
