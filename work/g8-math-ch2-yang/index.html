/* ========== 接上教師後台的程式（整段複製，只改最上面的 GAME_KEY） ========== */
const GAME_KEY = 'math-g8-ch2-yang';            // 遊戲代號：小寫英文／數字／-／_，建議「科目簡碼-遊戲名」

/* 1) 學號：沒有就強迫輸入 */
function ensureStudent(done) {
  const no = keyagentGetActiveStudentNumber();
  if (no) return done(no);
  const v = (prompt('請輸入你的學號') || '').trim();
  if (!/^[A-Za-z0-9_-]{2,12}$/.test(v)) return ensureStudent(done);
  localStorage.setItem('keyagent_active_student', JSON.stringify({ studentNumber: v, verified: false }));
  done(v);
}

/* 2) 練習時間：只算「玩完一局」的時間；切到別的分頁不算；中途關掉的那一局不算 */
let T0 = 0, ACC = 0;
function tStart()  { ACC = 0; T0 = Date.now(); }
function tPause()  { if (T0) { ACC += Date.now() - T0; T0 = 0; } }
function tResume() { if (!T0 && !document.hidden) T0 = Date.now(); }
function tTake()   { tPause(); const s = Math.min(1800, Math.round(ACC / 1000)); ACC = 0; return s; }
document.addEventListener('visibilitychange', () => (document.hidden ? tPause() : tResume()));

/* 3) 一局結束時呼叫 finishRound({...})，會自動記錄並送到老師的後台 */
function finishRound(r) {
  // r = { stageId:'L1', stageName:'第一課 認字', score:80, right:8, total:10, stars:2(可省略), nick:'小勇者'(可省略),
  //       types:[{ key:'read', label:'看字讀音', right:5, total:6 }, ...](可省略) }
  const secs = tTake();
  keyagentUpdateOtherGame(GAME_KEY, prev => {
    const stages = Object.assign({}, prev.stages);
    const s = stages[r.stageId] || {};
    stages[r.stageId] = {
      n: r.stageName || r.stageId,
      bestStars: Math.max(s.bestStars || 0, r.stars || 0),
      bestScore: Math.max(s.bestScore || 0, r.score || 0),
      plays: (s.plays || 0) + 1,
      hist: (s.hist || []).concat([{ at: Date.now(), q: r.total || 0, ok: r.right || 0, s: secs, st: r.stars || 0 }]).slice(-30),   // 每一次的結果（後台點答對率可看）
      totalSecs: (s.totalSecs || 0) + secs,
      totalQ: (s.totalQ || 0) + (r.total || 0),
      totalOk: (s.totalOk || 0) + (r.right || 0)
    };
    const q = Object.assign({}, prev.q);
    (r.types || []).forEach(t => {
      const k = r.stageId + ':' + t.key, o = q[k] || { n: 0, ok: 0 };
      q[k] = { n: o.n + (t.total || 0), ok: o.ok + (t.right || 0), label: t.label || t.key };
    });
    return {
      nick: r.nick || prev.nick || '',
      totalPlays: (prev.totalPlays || 0) + 1,
      bestScore: Math.max(prev.bestScore || 0, r.score || 0),
      totalSecs: (prev.totalSecs || 0) + secs,
      totalQ: (prev.totalQ || 0) + (r.total || 0),
      totalOk: (prev.totalOk || 0) + (r.right || 0),
      lastScore: r.score || 0, lastId: r.stageId, lastName: r.stageName || r.stageId, lastAt: Date.now(),
      stages, q
    };
  });
}
keyagentInstallPageHideSync();           // 4) 離開頁面時補寄一次
/* ========== 以上整段不用改 ========== */
</script>

 try{finishRound({stageId:win?'win':'lose',stageName:win?'打敗所有怪獸':'挑戰失敗',score:rate,right:right,total:tot,stars:win?(rate>=90?3:rate>=70?2:1):0,
  types:cats.map(k=>{const a=log.filter(x=>x.cat==k);return {key:k,label:k,right:a.filter(x=>x.ok).length,total:a.length}}).filter(t=>t.total>0)})}catch(e){}
 cats.forEach(k=>{const a=log.filter(x=>x.cat==k);if(!a.length)return;const r=a.filter(x=>x.ok).length,pc=Math.round(r/a.length*100);if(pc<60)weak.push(k);
  th+=`<div style="font-size:14px">${k}　${r}/${a.length}（${pc}%）</div><div class="bar"><i style="width:${pc}%;background:${pc>=60?'var(--ok)':'var(--no)'}"></i></div>`});
 $('topics').innerHTML=th||'<p class="tip">還沒有作答紀錄</p>';
 $('weak').textContent=weak.length?'📌 需要加強：'+weak.join('、'):(tot?'👍 每個題型都很穩，繼續保持！':'');
 $('detail').innerHTML=log.map((x,i)=>`<div class="it ${x.ok?'':'no'}"><b>第 ${i+1} 題 ${x.ok?'✅ 答對':'❌ 答錯'}</b>　<span style="color:var(--mu)">${x.cat}</span><br>${x.q}${x.ok?`<br>答案：${x.ans}`:`<br>你的答案：${x.my}　正確答案：<b>${x.ans}</b>`}</div>`).join('');
 window._rep=`【數學怪獸大作戰成績】\n姓名：${info.n}　學號：${info.id}\n結果：${win?'打敗所有怪獸':'挑戰失敗'}\n武器：${wname()} Lv${lv}　境界：${realm()}（累計修為 ${txp}）\n總題數 ${tot}，答對 ${right}，答錯 ${tot-right}，正確率 ${rate}%\n`+cats.map(k=>{const a=log.filter(x=>x.cat==k);return a.length?`${k}：${a.filter(x=>x.ok).length}/${a.length}`:''}).filter(Boolean).join('\n')+'\n\n'+log.map((x,i)=>`第${i+1}題 ${x.ok?'○':'×'} ${x.cat}｜${plain(x.q)}｜你答 ${x.my}｜正解 ${x.ans}`).join('\n');
 $('cm').textContent=''}
$('again').onclick=()=>{$('result').style.display='none';$('setup').style.display='block';build()};
$('copy').onclick=async()=>{try{await navigator.clipboard.writeText(window._rep);$('cm').textContent='已複製成績！'}catch(e){const t=document.createElement('textarea');t.value=window._rep;document.body.appendChild(t);t.select();try{document.execCommand('copy');$('cm').textContent='已複製成績！'}catch(e2){$('cm').textContent='複製失敗，請截圖保存'}t.remove()}};
const sfx=(()=>{let ac,mg,mus,nb,tm,on=true,nt=0,st=0,idx=4,pat=[];
 const P=[62,64,66,69,71,74,76,78,81],CH=[[62,66,69,74],[59,62,66,71],[55,59,62,67],[57,61,64,69]],PT=[[0,3,4,6],[0,2,4,5],[0,4,6],[0,2,3,6],[1,4,5,7]],fq=m=>440*Math.pow(2,(m-69)/12);
 function init(){if(ac)return;const A=window.AudioContext||window.webkitAudioContext;if(!A)return;ac=new A();mg=ac.createGain();mg.gain.value=on?.9:0;mg.connect(ac.destination);mus=ac.createGain();mus.gain.value=.55;mus.connect(mg);
  const dl=ac.createDelay(1),fb=ac.createGain(),wt=ac.createGain();dl.delayTime.value=.34;fb.gain.value=.32;wt.gain.value=.4;mus.connect(dl);dl.connect(fb);fb.connect(dl);dl.connect(wt);wt.connect(mg);
  nb=ac.createBuffer(1,ac.sampleRate,ac.sampleRate);const d=nb.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1}
 function tone(o){const os=ac.createOscillator(),g=ac.createGain(),a=o.a||.005;os.type=o.type||'sine';os.frequency.setValueAtTime(o.f,o.t);if(o.f2)os.frequency.exponentialRampToValueAtTime(o.f2,o.t+o.d);
  g.gain.setValueAtTime(.0001,o.t);g.gain.linearRampToValueAtTime(o.g,o.t+a);g.gain.exponentialRampToValueAtTime(.0001,o.t+o.d);
  let nd=os;if(o.lp){const f=ac.createBiquadFilter();f.type='lowpass';f.frequency.value=o.lp;os.connect(f);nd=f}
  nd.connect(g);g.connect(o.out||mg);
  if(o.vib){const l=ac.createOscillator(),lg=ac.createGain();l.frequency.value=5.2;lg.gain.value=o.f*.012;l.connect(lg);lg.connect(os.frequency);l.start(o.t);l.stop(o.t+o.d+.1)}
  os.start(o.t);os.stop(o.t+o.d+.1)}
 function noise(t,d,g,type,f1,f2,a){const s2=ac.createBufferSource(),fl=ac.createBiquadFilter(),gn=ac.createGain();s2.buffer=nb;fl.type=type;fl.frequency.setValueAtTime(f1,t);if(f2)fl.frequency.exponentialRampToValueAtTime(f2,t+d);fl.Q.value=type=='bandpass'?1.2:.7;
  gn.gain.setValueAtTime(.0001,t);gn.gain.linearRampToValueAtTime(g,t+d*(a||.3));gn.gain.exponentialRampToValueAtTime(.0001,t+d);s2.connect(fl);fl.connect(gn);gn.connect(mg);s2.start(t);s2.stop(t+d+.05)}
 function sched(){const L=typeof mi=='number'?Math.min(3,Math.max(0,mi)):0,sh=[0,2,-2,3][L],sd=.4*[1,.95,.92,.88][L];
  while(nt<ac.currentTime+.6){const bar=Math.floor(st/8)%4,k=st%8,c=CH[bar];
   tone({f:fq(c[[0,1,2,3,2,1,2,1][k]]+sh),t:nt,d:1.3,type:'triangle',g:k==0?.11:.07,out:mus,lp:2600});
   if(k==0){tone({f:fq(c[0]+sh-12),t:nt,d:sd*8,type:'sine',g:.16,out:mus,a:.05});c.forEach(m=>tone({f:fq(m+sh),t:nt,d:sd*8,type:'triangle',g:.03,out:mus,a:.9,lp:900}));pat=Math.random()<.2?[]:PT[Math.floor(Math.random()*PT.length)]}
   if(pat.indexOf(k)>=0){idx=Math.max(0,Math.min(P.length-1,idx+[-2,-1,-1,1,1,2][Math.floor(Math.random()*6)]));const nx=pat.find(q=>q>k),dur=((nx===undefined?8:nx)-k)*sd,f=fq(P[idx]+sh);
    tone({f,t:nt,d:Math.min(dur*1.1,1.8),type:'sine',g:.12,out:mus,a:.06,vib:1});tone({f:f*2,t:nt,d:Math.min(dur,1.2),type:'triangle',g:.025,out:mus,a:.06})}
   nt+=sd;st++}}
 const R={
  start(){init();if(!ac)return;ac.resume();if(!tm){nt=ac.currentTime+.1;st=0;tm=setInterval(sched,120)}},
  stopMusic(){clearInterval(tm);tm=0},
  toggle(){on=!on;if(mg)mg.gain.value=on?.9:0;return on},
  atk(){if(!ac||!on)return;const t=ac.currentTime,w=ch.w;
   if(ch.a=='hero'){tone({f:300,f2:1100,t,d:.55,type:'sawtooth',g:.12,lp:2500,a:.1});noise(t,.5,.15,'bandpass',600,3000)}
   else if(w=='gun'){noise(t+.15,.12,.5,'highpass',1500,800,.01);tone({f:140,f2:45,t:t+.15,d:.15,type:'sine',g:.5,a:.003})}
   else if(w=='knife')noise(t,.22,.3,'bandpass',900,3800);
   else if(w=='ge')noise(t,.3,.32,'bandpass',500,2200);
   else noise(t,.22,.28,'bandpass',500,1800)},
  hit(big){if(!ac||!on)return;const t=ac.currentTime;tone({f:180,f2:50,t,d:.2,type:'sine',g:big?.7:.5,a:.003});noise(t,.1,.45,'lowpass',2500,300,.01);
   if(ch.a!='hero'&&ch.w!='gun')tone({f:1100,t,d:.25,type:'triangle',g:.12,a:.003});if(big)tone({f:1568,t:t+.03,d:.3,type:'triangle',g:.08})},
  mon(){if(!ac||!on)return;const t=ac.currentTime;tone({f:160,f2:70,t,d:.4,type:'sawtooth',g:.15,lp:700,a:.08});noise(t,.35,.18,'bandpass',400,1500)},
  hurt(){if(!ac||!on)return;const t=ac.currentTime;tone({f:200,f2:60,t,d:.25,type:'sine',g:.6,a:.003});noise(t,.12,.4,'lowpass',1800,300,.01);tone({f:420,f2:210,t:t+.02,d:.3,type:'triangle',g:.18,lp:1500})},
  win(){if(!ac||!on)return;const t=ac.currentTime;[74,78,81,86].forEach((m,i)=>tone({f:fq(m),t:t+i*.09,d:.6,type:'triangle',g:.13}))},
  up(){if(!ac||!on)return;const t=ac.currentTime;[81,86].forEach((m,i)=>tone({f:fq(m),t:t+i*.1,d:.5,type:'triangle',g:.14}))},
  end(w){R.stopMusic();if(!ac||!on)return;const t=ac.currentTime;(w?[69,74,78,81,86]:[69,66,62,57]).forEach((m,i)=>tone({f:fq(m),t:t+i*.16,d:.9,type:w?'triangle':'sine',g:w?.14:.1}))},
  _t:()=>sched()};
 document.addEventListener('visibilitychange',()=>{if(ac)document.hidden?ac.suspend():ac.resume()});
 return R})();
$('snd').onclick=()=>{$('snd').textContent=sfx.toggle()?'🔊':'🔇'};
init3D();initPv();build();loop();
</script>
