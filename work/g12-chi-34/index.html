/* ========== 接上教師後台的程式（整段複製，只改最上面的 GAME_KEY） ========== */
const GAME_KEY = 'chi-g12-34';            // 遊戲代號：小寫英文／數字／-／_，建議「科目簡碼-遊戲名」

/* 1) 學號：沒有就強迫輸入 */
function ensureStudent(done) {
  const no = keyagentGetActiveStudentNumber();
  if (no) return done(no);
  const v = (prompt('請輸入你的學號') || '').trim();
  if (!/^[A-Za-z0-9_-]{2,12}$/.test(v)) return ensureStudent(done);
  localStorage.setItem('keyagent_active_student', JSON.stringify({ studentNumber: v, verified: false }));
  done(v);
}

/* 2) 練習時間：只算「玩完一局」的時間；切到別的分頁不算；中途關掉的那一局不算 */
let T0 = 0, ACC = 0;
function tStart()  { ACC = 0; T0 = Date.now(); }
function tPause()  { if (T0) { ACC += Date.now() - T0; T0 = 0; } }
function tResume() { if (!T0 && !document.hidden) T0 = Date.now(); }
function tTake()   { tPause(); const s = Math.min(1800, Math.round(ACC / 1000)); ACC = 0; return s; }
document.addEventListener('visibilitychange', () => (document.hidden ? tPause() : tResume()));

/* 3) 一局結束時呼叫 finishRound({...})，會自動記錄並送到老師的後台 */
function finishRound(r) {
  // r = { stageId:'L1', stageName:'第一課 認字', score:80, right:8, total:10, stars:2(可省略), nick:'小勇者'(可省略),
  //       types:[{ key:'read', label:'看字讀音', right:5, total:6 }, ...](可省略) }
  const secs = tTake();
  keyagentUpdateOtherGame(GAME_KEY, prev => {
    const stages = Object.assign({}, prev.stages);
    const s = stages[r.stageId] || {};
    stages[r.stageId] = {
      n: r.stageName || r.stageId,
      bestStars: Math.max(s.bestStars || 0, r.stars || 0),
      bestScore: Math.max(s.bestScore || 0, r.score || 0),
      plays: (s.plays || 0) + 1,
      hist: (s.hist || []).concat([{ at: Date.now(), q: r.total || 0, ok: r.right || 0, s: secs, st: r.stars || 0 }]).slice(-30),   // 每一次的結果（後台點答對率可看）
      totalSecs: (s.totalSecs || 0) + secs,
      totalQ: (s.totalQ || 0) + (r.total || 0),
      totalOk: (s.totalOk || 0) + (r.right || 0)
    };
    const q = Object.assign({}, prev.q);
    (r.types || []).forEach(t => {
      const k = r.stageId + ':' + t.key, o = q[k] || { n: 0, ok: 0 };
      q[k] = { n: o.n + (t.total || 0), ok: o.ok + (t.right || 0), label: t.label || t.key };
    });
    return {
      nick: r.nick || prev.nick || '',
      totalPlays: (prev.totalPlays || 0) + 1,
      bestScore: Math.max(prev.bestScore || 0, r.score || 0),
      totalSecs: (prev.totalSecs || 0) + secs,
      totalQ: (prev.totalQ || 0) + (r.total || 0),
      totalOk: (prev.totalOk || 0) + (r.right || 0),
      lastScore: r.score || 0, lastId: r.stageId, lastName: r.stageName || r.stageId, lastAt: Date.now(),
      stages, q
    };
  });
}
keyagentInstallPageHideSync();           // 4) 離開頁面時補寄一次
/* ========== 以上整段不用改 ========== */
</script>

const tiers=['簡單','中級','高級'];
let xp=0,coins=0,level=1,score=0,answered=0,activeIsland=null,questions=[],qi=0,correct=0,questionScore=0,studentId='';
const panelWrap=document.getElementById('panelWrap'),panel=document.getElementById('panel');
function show(s){panel.innerHTML=s;panelWrap.style.display='flex'}function close(){panelWrap.style.display='none'}
function stats(){level=1+Math.floor(xp/100);document.getElementById('level').textContent=level;document.getElementById('xp').textContent=xp;document.getElementById('coins').textContent=coins}
function nearest(){let best=null,d0=1e9;for(const i of islands){let d=Math.hypot(player.position.x-i.x,player.position.z-i.z);if(d<d0){d0=d;best=i}}return d0<7?best:null}
function openIsland(i){activeIsland=i;show(`<h2>✦ ${i.label}</h2><p>${i.sub}</p><p>เลือกความยาก แล้วเริ่มการทดสอบทีละข้อ เมื่อเลือกคำตอบจะเห็นเฉลยภาษาจีนและคำอธิบายภาษาไทย</p><div class="pills">${tiers.map((t,n)=>`<button class="pill ${n===0?'active':''}" data-tier="${t}">${t}</button>`).join('')}</div><p class="muted">คะแนน: ตอบถูก +10 คะแนน, +20 EXP และ +5 เหรียญ</p><button class="mainbtn" id="start">เริ่มเล่น</button><button class="secondary" id="back">กลับไปสำรวจ</button>`);
let tier='簡單';panel.querySelectorAll('[data-tier]').forEach(b=>b.onclick=()=>{tier=b.dataset.tier;panel.querySelectorAll('[data-tier]').forEach(x=>x.classList.toggle('active',x===b))});
document.getElementById('start').onclick=()=>{let pool=bank.filter(q=>(i===islands[0]?q.u===3:i===islands[1]?q.u===4:i===islands[2]?q.u===0:true)&&q.t===tier);if(i===islands[3])pool=bank.filter(q=>q.t===tier);if(!pool.length){show(`<h2>ยังไม่มีคำถามระดับนี้</h2><p>ลองเลือกระดับอื่นได้เลย</p><button class="mainbtn" id="back2">กลับ</button>`);document.getElementById('back2').onclick=()=>openIsland(i);return}questions=[...pool].sort(()=>Math.random()-.5);qi=0;correct=0;score=0;tStart();ask()};document.getElementById('back').onclick=close}
function ask(){if(qi>=questions.length){finish();return}let q=questions[qi];show(`<div class="muted">${activeIsland.label}・${q.t}・第 ${qi+1}/${questions.length} 題</div><div class="bar"><i style="width:${qi/questions.length*100}%"></i></div><h2>⚔️ 國文知識對決</h2><p><b>${q.q}</b></p><div class="options">${q.o.map((v,n)=>`<button class="opt" data-a="${n}">${'ＡＢＣＤ'[n]}．${v}</button>`).join('')}</div><div id="feedback"></div><button class="secondary" id="pause">暫停返回地圖</button>`);
panel.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>{if(panel.dataset.done==='1')return;panel.dataset.done='1';let ok=+b.dataset.a===q.a;let f=document.getElementById('feedback');if(ok){correct++;score+=10;xp+=20;coins+=5;f.innerHTML=`<span style="color:#9ce7c5">答對了！+10 分、+20 EXP、+5 金幣</span><br>正確答案：${'ＡＢＣＤ'[q.a]}．${q.o[q.a]}<br><b>中文解析：</b>${q.e}<br><b>คำอธิบายภาษาไทย：</b>${q.th}`}else{f.innerHTML=`<span style="color:#ffb2b2">再加油！這題答錯了。</span><br>正確答案：${'ＡＢＣＤ'[q.a]}．${q.o[q.a]}<br><b>中文解析：</b>${q.e}<br><b>คำอธิบายภาษาไทย：</b>${q.th}`}answered++;stats();panel.querySelectorAll('[data-a]').forEach(x=>x.disabled=true);let n=document.createElement('button');n.className='mainbtn';n.textContent=qi===questions.length-1?'查看成績':'下一題';n.onclick=()=>{qi++;ask()};panel.appendChild(n)});
document.getElementById('pause').onclick=close}
function finish(){try{const ix=islands.indexOf(activeIsland),tr=questions[0].t,pc=Math.round(correct/questions.length*100);finishRound({stageId:'I'+ix+'-'+tr,stageName:activeIsland.label+'・'+tr,score:pc,right:correct,total:questions.length,stars:pc>=90?3:pc>=70?2:pc>=50?1:0,types:[{key:'q',label:activeIsland.label+'・'+tr,right:correct,total:questions.length}]})}catch(e){}let pct=Math.round(correct/questions.length*100),title=pct>=90?'國文大師':pct>=75?'閱讀高手':pct>=60?'闖關達人':pct>=40?'努力學習者':'再接再厲勇者';show(`<h2>🏆 試煉完成！</h2><p>學號：<b>${escapeHTML(studentId)}</b></p><p>答對 <b>${correct}</b> / ${questions.length} 題（${pct}%）</p><p>本關得分：<b>${score}</b></p><h2 style="text-align:center">${title}</h2><p class="muted">目前等級 ${level}・EXP ${xp}・金幣 ${coins}</p><hr style="border-color:#ffffff33;margin:16px 0"><h2>遊戲滿意度調查</h2><p><b>請問你對這次遊戲的滿意程度？</b></p><div class="stars" id="starChoices">${[1,2,3,4,5].map(n=>`<button type="button" class="star" data-star="${n}" aria-label="${n}顆星">★</button>`).join('')}</div><p id="ratingText" style="text-align:center">請選擇星級</p><p><b>請寫下你的評價理由：</b></p><textarea class="field" id="ratingReason" rows="3" placeholder="請輸入你的想法與建議……"></textarea><button class="mainbtn" id="submitRating" disabled>提交評價</button><button class="secondary" id="again">再挑戰一次</button><button class="secondary" id="map">返回學院地圖</button>`);let rating=0;const choices=panel.querySelectorAll('[data-star]'),reason= document.getElementById('ratingReason'),submit=document.getElementById('submitRating');function validate(){submit.disabled=!(rating>0&&reason.value.trim())}choices.forEach(b=>b.onclick=()=>{rating=Number(b.dataset.star);choices.forEach(x=>x.classList.toggle('selected',Number(x.dataset.star)<=rating));document.getElementById('ratingText').textContent=`${rating} 顆星`;validate()});reason.addEventListener('input',validate);submit.onclick=()=>{const record={studentId,rating,reason:reason.value.trim(),score,correct,total:questions.length,submittedAt:new Date().toISOString()};try{const all=JSON.parse(localStorage.getItem('guowenSurveyRecords')||'[]');all.push(record);localStorage.setItem('guowenSurveyRecords',JSON.stringify(all))}catch(e){}show(`<h2>感謝你的回饋！</h2><p>學號：${escapeHTML(studentId)}</p><p>滿意度：${rating} / 5 顆星</p><p>評價理由：${escapeHTML(reason.value.trim())}</p><p>你的評價已儲存在此裝置的瀏覽器中。</p><button class="mainbtn" id="again2">再挑戰一次</button><button class="secondary" id="map2">返回學院地圖</button>`);document.getElementById('again2').onclick=()=>openIsland(activeIsland);document.getElementById('map2').onclick=close};document.getElementById('again').onclick=()=>openIsland(activeIsland);document.getElementById('map').onclick=close}
function escapeHTML(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function welcome(){show(`<h2 style="text-align:center">歡迎來到國文勇者學院！</h2><p style="text-align:center">第一次進入遊戲，請先輸入你的學號。</p><label for="studentInput"><b>請輸入你的學號：</b></label><input class="field" id="studentInput" inputmode="numeric" autocomplete="off" maxlength="20" placeholder="請輸入學號"><button class="mainbtn" id="enterGame" disabled>確認學號，開始遊戲</button>`);const input=document.getElementById('studentInput'),btn=document.getElementById('enterGame');input.addEventListener('input',()=>btn.disabled=!input.value.trim());btn.onclick=()=>{studentId=input.value.trim();document.getElementById('studentTag').textContent=`學號：${studentId}`;close()}}

document.getElementById('action').onclick=()=>{let i=nearest();if(i)openIsland(i);else show(`<h2>尚未接近傳送門</h2><p>使用左下角方向鍵移動角色，靠近浮空島上的光門，再按右下角「互動」。</p><button class="mainbtn" id="ok">知道了</button>`),document.getElementById('ok').onclick=close};
function bind(id,key){let el=document.getElementById(id);el.addEventListener('pointerdown',e=>{e.preventDefault();keys[key]=true});['pointerup','pointercancel','pointerleave'].forEach(ev=>el.addEventListener(ev,e=>{e.preventDefault();keys[key]=false}))}
const keys={};bind('up','up');bind('down','down');bind('left','left');bind('right','right');
addEventListener('keydown',e=>{if(e.key==='ArrowUp'||e.key==='w')keys.up=true;if(e.key==='ArrowDown'||e.key==='s')keys.down=true;if(e.key==='ArrowLeft'||e.key==='a')keys.left=true;if(e.key==='ArrowRight'||e.key==='d')keys.right=true});
addEventListener('keyup',e=>{if(['ArrowUp','w'].includes(e.key))keys.up=false;if(['ArrowDown','s'].includes(e.key))keys.down=false;if(['ArrowLeft','a'].includes(e.key))keys.left=false;if(['ArrowRight','d'].includes(e.key))keys.right=false});
function resize(){camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)}addEventListener('resize',resize);
const clock=new THREE.Clock();function animate(){requestAnimationFrame(animate);let dt=Math.min(clock.getDelta(),.04);let dx=(keys.right?1:0)-(keys.left?1:0),dz=(keys.down?1:0)-(keys.up?1:0);if(dx||dz){let l=Math.hypot(dx,dz);dx/=l;dz/=l;player.position.x+=dx*5*dt;player.position.z+=dz*5*dt;player.rotation.y=Math.atan2(dx,dz)}player.position.x=THREE.MathUtils.clamp(player.position.x,-22,22);player.position.z=THREE.MathUtils.clamp(player.position.z,-22,22);player.position.y=.06+Math.sin(performance.now()*.004)*.05;let target=new THREE.Vector3(player.position.x+10,10,player.position.z+13);camera.position.lerp(target,.06);camera.lookAt(player.position.x,0,player.position.z);islands.forEach((i,n)=>i.group.position.y=Math.sin(performance.now()*.0007+n)*.17);let near=nearest();document.getElementById('hint').textContent=near?`ใกล้เกาะ「${near.label}」แล้ว กดปุ่ม互動เพื่อเริ่ม`: 'ใช้ปุ่มลูกศรสำรวจเกาะลอยฟ้า';renderer.render(scene,camera)}animate();stats();ensureStudent(no=>{studentId=no;document.getElementById('studentTag').textContent=`學號：${studentId}`});
</script>
