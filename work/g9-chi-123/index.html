<script>
/* ========== 接上教師後台的程式（整段複製，只改最上面的 GAME_KEY） ========== */
const GAME_KEY = 'chi-g9-123';            // 遊戲代號：小寫英文／數字／-／_，建議「科目簡碼-遊戲名」

/* 1) 學號：沒有就強迫輸入 */
function ensureStudent(done) {
  const no = keyagentGetActiveStudentNumber();
  if (no) return done(no);
  const v = (prompt('請輸入你的學號') || '').trim();
  if (!/^[A-Za-z0-9_-]{2,12}$/.test(v)) return ensureStudent(done);
  localStorage.setItem('keyagent_active_student', JSON.stringify({ studentNumber: v, verified: false }));
  done(v);
}

/* 2) 練習時間：只算「玩完一局」的時間；切到別的分頁不算；中途關掉的那一局不算 */
let T0 = 0, ACC = 0;
function tStart()  { ACC = 0; T0 = Date.now(); }
function tPause()  { if (T0) { ACC += Date.now() - T0; T0 = 0; } }
function tResume() { if (!T0 && !document.hidden) T0 = Date.now(); }
function tTake()   { tPause(); const s = Math.min(1800, Math.round(ACC / 1000)); ACC = 0; return s; }
document.addEventListener('visibilitychange', () => (document.hidden ? tPause() : tResume()));

/* 3) 一局結束時呼叫 finishRound({...})，會自動記錄並送到老師的後台 */
function finishRound(r) {
  // r = { stageId:'L1', stageName:'第一課 認字', score:80, right:8, total:10, stars:2(可省略), nick:'小勇者'(可省略),
  //       types:[{ key:'read', label:'看字讀音', right:5, total:6 }, ...](可省略) }
  const secs = tTake();
  keyagentUpdateOtherGame(GAME_KEY, prev => {
    const stages = Object.assign({}, prev.stages);
    const s = stages[r.stageId] || {};
    stages[r.stageId] = {
      n: r.stageName || r.stageId,
      bestStars: Math.max(s.bestStars || 0, r.stars || 0),
      bestScore: Math.max(s.bestScore || 0, r.score || 0),
      plays: (s.plays || 0) + 1,
      hist: (s.hist || []).concat([{ at: Date.now(), q: r.total || 0, ok: r.right || 0, s: secs, st: r.stars || 0 }]).slice(-30),   // 每一次的結果（後台點答對率可看）
      totalSecs: (s.totalSecs || 0) + secs,
      totalQ: (s.totalQ || 0) + (r.total || 0),
      totalOk: (s.totalOk || 0) + (r.right || 0)
    };
    const q = Object.assign({}, prev.q);
    (r.types || []).forEach(t => {
      const k = r.stageId + ':' + t.key, o = q[k] || { n: 0, ok: 0 };
      q[k] = { n: o.n + (t.total || 0), ok: o.ok + (t.right || 0), label: t.label || t.key };
    });
    return {
      nick: r.nick || prev.nick || '',
      totalPlays: (prev.totalPlays || 0) + 1,
      bestScore: Math.max(prev.bestScore || 0, r.score || 0),
      totalSecs: (prev.totalSecs || 0) + secs,
      totalQ: (prev.totalQ || 0) + (r.total || 0),
      totalOk: (prev.totalOk || 0) + (r.right || 0),
      lastScore: r.score || 0, lastId: r.stageId, lastName: r.stageName || r.stageId, lastAt: Date.now(),
      stages, q
    };
  });
}
keyagentInstallPageHideSync();           // 4) 離開頁面時補寄一次
/* ========== 以上整段不用改 ========== */
</script>

function pick(j){if(G.lock)return;G.lock=1;const s=dd(G.i).stages[G.k],q=s.qs[G.q],ok=j==q.a;
document.getElementById("o"+q.a).classList.add("ok");
if(ok){G.combo++;let x=10+(G.combo>=3?5:0);if(G.used)x=Math.floor(x/2);G.gain+=x;S.xp+=x}
else{document.getElementById("o"+j).classList.add("no");G.hp--;G.combo=0;G.miss++;if(!S.wrong.some(w=>w.q==q.q))S.wrong.push({q:q.q,a:q.o[q.a],e:q.e})}
save();const last=G.q==s.qs.length-1||G.hp==0;
document.getElementById("fb").innerHTML=`<div class="ex">${ok?"✅ 答對了！":"❌ 落了一片花瓣。"}${q.e}</div><button class="p" onclick="${last?"fin()":"nxt()"}">${last?"查看結果":"下一題 →"}</button>`}
function nxt(){G.q++;ask()}
function fin(){const d=dd(G.i),s=d.stages[G.k];let h=head();let bonus=0,starsEarned=0;
if(G.hp<=0){h+=`<div class="card"><h2>🥀 落花了……</h2><p>花瓣用完，本關失敗。看看錯題本再來一次吧！</p></div>`}
else{const mx=G.i<0,st=mx?(G.miss<=5?3:G.miss<=12?2:1):(G.miss<=1?3:G.miss<=3?2:1),key=d.id+"-"+G.k;let b=0;if(mx)b=50;else if(G.miss==0)b=30;bonus=b;starsEarned=st;S.xp+=b;S.done[key]=Math.max(S.done[key]||0,st);save();
h+=`<div class="card"><h2>🎉 通關！${"⭐".repeat(st)}</h2><p>本關 +${G.gain} XP${b?"，全對獎勵 +"+b+" XP":""}<br>答錯 ${G.miss} 題，剩餘花瓣 ${G.hp}</p></div>`}
{ // 送到教師後台：只在「玩完、拿到結果」時記一次
  const ans=Math.min(G.q+1,s.qs.length),rt=Math.max(0,ans-G.miss),clean=x=>String(x||"").replace(/^[^\u4E00-\u9FFFA-Za-z0-9]+/,"");
  const sid=G.i<0?"mix":d.id+"-"+G.k,sname=G.i<0?"全課混合":clean(d.name.split("　")[0])+" "+clean(s.n);
  try{finishRound({stageId:sid,stageName:sname,score:G.gain+bonus,right:rt,total:ans,stars:starsEarned,types:[{key:"t"+sid,label:G.i<0?"全課混合":clean(d.name.split("　")[0])+"・"+s.t,right:rt,total:ans}]})}catch(e){}}
h+=`<button class="p" onclick="${G.i<0?"mix()":"start("+G.i+","+G.k+")"}">再玩一次</button>${G.i<0?"":`<button onclick="dun(${G.i})">返回關卡</button>`}<button onclick="home()">回首頁</button>`;$(h)}
function book(){let h=head()+`<button onclick="home()">← 返回</button><h2>📕 錯題本</h2>`;
if(!S.wrong.length)h+=`<p class="mu">還沒有錯題，繼續保持！</p>`;
S.wrong.forEach((w,i)=>h+=`<div class="card"><b>${w.q}</b><div class="ex">正解：${w.a}<br>${w.e}</div><button onclick="rm(${i})">✔ 我記住了，移除</button></div>`);$(h)}
function rm(i){S.wrong.splice(i,1);save();book()}
ensureStudent(()=>home());
</script>
<script src="../../home-fab.js"></script></body></html>
