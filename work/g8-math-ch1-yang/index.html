/* ========== 接上教師後台的程式（整段複製，只改最上面的 GAME_KEY） ========== */
const GAME_KEY = 'math-g8-ch1-yang';            // 遊戲代號：小寫英文／數字／-／_，建議「科目簡碼-遊戲名」

/* 1) 學號：沒有就強迫輸入 */
function ensureStudent(done) {
  const no = keyagentGetActiveStudentNumber();
  if (no) return done(no);
  const v = (prompt('請輸入你的學號') || '').trim();
  if (!/^[A-Za-z0-9_-]{2,12}$/.test(v)) return ensureStudent(done);
  localStorage.setItem('keyagent_active_student', JSON.stringify({ studentNumber: v, verified: false }));
  done(v);
}

/* 2) 練習時間：只算「玩完一局」的時間；切到別的分頁不算；中途關掉的那一局不算 */
let T0 = 0, TACC_ = 0;
function tStart()  { TACC_ = 0; T0 = Date.now(); }
function tPause()  { if (T0) { TACC_ += Date.now() - T0; T0 = 0; } }
function tResume() { if (!T0 && !document.hidden) T0 = Date.now(); }
function tTake()   { tPause(); const s = Math.min(1800, Math.round(TACC_ / 1000)); TACC_ = 0; return s; }
document.addEventListener('visibilitychange', () => (document.hidden ? tPause() : tResume()));

/* 3) 一局結束時呼叫 finishRound({...})，會自動記錄並送到老師的後台 */
function finishRound(r) {
  // r = { stageId:'L1', stageName:'第一課 認字', score:80, right:8, total:10, stars:2(可省略), nick:'小勇者'(可省略),
  //       types:[{ key:'read', label:'看字讀音', right:5, total:6 }, ...](可省略) }
  const secs = tTake();
  keyagentUpdateOtherGame(GAME_KEY, prev => {
    const stages = Object.assign({}, prev.stages);
    const s = stages[r.stageId] || {};
    stages[r.stageId] = {
      n: r.stageName || r.stageId,
      bestStars: Math.max(s.bestStars || 0, r.stars || 0),
      bestScore: Math.max(s.bestScore || 0, r.score || 0),
      plays: (s.plays || 0) + 1,
      hist: (s.hist || []).concat([{ at: Date.now(), q: r.total || 0, ok: r.right || 0, s: secs, st: r.stars || 0 }]).slice(-30),   // 每一次的結果（後台點答對率可看）
      totalSecs: (s.totalSecs || 0) + secs,
      totalQ: (s.totalQ || 0) + (r.total || 0),
      totalOk: (s.totalOk || 0) + (r.right || 0)
    };
    const q = Object.assign({}, prev.q);
    (r.types || []).forEach(t => {
      const k = r.stageId + ':' + t.key, o = q[k] || { n: 0, ok: 0 };
      q[k] = { n: o.n + (t.total || 0), ok: o.ok + (t.right || 0), label: t.label || t.key };
    });
    return {
      nick: r.nick || prev.nick || '',
      totalPlays: (prev.totalPlays || 0) + 1,
      bestScore: Math.max(prev.bestScore || 0, r.score || 0),
      totalSecs: (prev.totalSecs || 0) + secs,
      totalQ: (prev.totalQ || 0) + (r.total || 0),
      totalOk: (prev.totalOk || 0) + (r.right || 0),
      lastScore: r.score || 0, lastId: r.stageId, lastName: r.stageName || r.stageId, lastAt: Date.now(),
      stages, q
    };
  });
}
keyagentInstallPageHideSync();           // 4) 離開頁面時補寄一次
/* ========== 以上整段不用改 ========== */

<script>
const rn=(a,b)=>a+Math.floor(Math.random()*(b-a+1)),pk=a=>a[rn(0,a.length-1)],sh=a=>a.map(x=>[Math.random(),x]).sort((x,y)=>x[0]-y[0]).map(x=>x[1]);
const fm=n=>typeof n=='number'&&n<0?'−'+(-n):String(n),sb=n=>String(n).replace(/\d/g,d=>'₀₁₂₃₄₅₆₇₈₉'[d]);
const A=n=>'a'+sb(n),seq=(a,d,n)=>Array.from({length:n},(_,i)=>fm(a+i*d)).join(', '),sm=(a,d,n)=>n*(2*a+(n-1)*d)/2;
function mc(q,c,ds,exp){const o=[fm(c)];for(const d of ds){const s=fm(d);if(!o.includes(s)&&o.length<4)o.push(s)}let t=0;while(o.length<4&&t++<60){const s=fm(Number(c)+rn(-9,9));if(!o.includes(s))o.push(s)}return{q,o:sh(o),a:fm(c),exp}}

e1(){const a=rn(1,20),d=pk([2,3,4,5,-2,-3,-4]),x=a+4*d;return mc(`观察数列:${seq(a,d,4)}, ?  问号应填入?`,x,[x+d,x+1,a+3*d],`相邻两项的差都是 ${fm(d)},所以下一项 = ${fm(a+3*d)} + (${fm(d)}) = ${fm(x)}。`)},
e2(){const a=rn(1,20),d=pk([2,3,4,5,-2,-3,-4]);return mc(`求等差数列 ${seq(a,d,5)}, … 的公差 d。`,d,[-d,d+1,d-1,2*d],`公差 d = 后项 − 前项 = ${fm(a+d)} − (${fm(a)}) = ${fm(d)}。`)},
e3(){const a=rn(1,9),d=pk([2,3,4,5]),g=pk([1,2,3]),r=pk([2,3]),s=rn(1,3),ar=seq(a,d,5);return mc('下列哪一个数列是等差数列?',ar,[Array.from({length:5},(_,i)=>g*r**i).join(', '),Array.from({length:5},(_,i)=>(s+i)**2).join(', '),`${a}, ${a+d}, ${a}, ${a+d}, ${a}`],`等差数列的「后项−前项」都相同:${ar} 每次都加 ${d}。其余数列的差不固定。`)},
e4(){const a=rn(1,20),c=a+2*rn(1,15),x=(a+c)/2;return mc(`若 x 为 ${a}、${c} 的等差中项,求 x。`,x,[a+c,(c-a)/2,x+1],`x = (a+c)/2 = (${a}+${c})/2 = ${x}。`)},
e5(){const cy=pk(['234','142857','56']),L=cy.length,n=rn(20,60),r=n%L,x=cy[r?r-1:L-1];return mc(`小数 0.${cy}${cy}${cy}…(「${cy}」循环出现),小数点后第 ${n} 位数字是?`,x,[...cy.split(''),..."0123456789"],`每 ${L} 位循环一次。${n}÷${L} 余 ${r},${r?`取循环中第 ${r} 位`:'整除则取循环最后一位'},答案 ${x}。`)},
e6(){const a=pk([1,2,3,5]),r=pk([2,3,-2]),t=i=>a*r**i;return mc(`观察数列:${[0,1,2,3].map(i=>fm(t(i))).join(', ')}, ?  问号应填入?`,t(4),[t(3)+t(3)-t(2),t(4)+1,t(3)*(r+1)],`后项÷前项 = ${fm(r)}(等比),所以下一项 = ${fm(t(3))}×(${fm(r)}) = ${fm(t(4))}。`)},
m1(){const a=rn(2,20),d=pk([2,3,4,5,6,-2,-3]),n=rn(8,20),x=a+(n-1)*d;return mc(`等差数列首项 ${A(1)}=${a},公差 d=${fm(d)},求 ${A(n)}。`,x,[a+n*d,a+(n-2)*d,(n-1)*d],`${A(n)} = ${A(1)}+(n−1)d = ${a}+(${n}−1)×(${fm(d)}) = ${fm(x)}。`)},
m2(){const d=pk([2,3,4,5,-2,-3]),a=rn(1,30),k=rn(6,15),x=a+(k-1)*d;return mc(`等差数列 ${A(1)}=${a},${A(k)}=${fm(x)},求公差 d。`,d,[d+1,d-1,-d],`${fm(x)} = ${a}+(${k}−1)d ⇒ ${fm(x-a)} = ${k-1}d ⇒ d = ${fm(d)}。`)},
m3(){const a=rn(1,20),d=pk([2,3,4,5]),n=rn(10,40),x=a+(n-1)*d;return mc(`等差数列首项 ${a},公差 ${d},则 ${x} 是第几项?`,n,[n+1,n-1,n+2],`${x} = ${a}+(n−1)×${d} ⇒ n−1 = ${(x-a)/d} ⇒ n = ${n}。`)},
m4(){const a=rn(-20,20),d=pk([3,4,5,-2]),k=rn(15,40),x=a+(k-1)*d;return mc(`等差数列公差 d=${fm(d)},${A(k)}=${fm(x)},求首项 ${A(1)}。`,a,[x-k*d,x+(k-1)*d,x-(k-2)*d],`${fm(x)} = ${A(1)}+(${k}−1)×(${fm(d)}) ⇒ ${A(1)} = ${fm(x)} − (${fm((k-1)*d)}) = ${fm(a)}。`)},
m6(){const a=pk([1,2,3,5]),r=pk([2,3]),n=rn(4,7),x=a*r**(n-1);return mc(`等比数列首项 ${A(1)}=${a},公比 r=${r},求 ${A(n)}。`,x,[a*r**n,a*r**(n-2),a*r*n],`${A(n)} = ${A(1)}×r^(n−1) = ${a}×${r}^${n-1} = ${x}。`)},
m7(){const a=pk([1,2,3]),r=pk([2,3]),n=rn(5,8),x=a*r**(n-1);return mc(`等比数列首项 ${a},公比 ${r},则 ${x} 是第几项?`,n,[n+1,n-1,n+2],`${x} = ${a}×${r}^(n−1) ⇒ ${r}^(n−1) = ${x/a} = ${r}^${n-1} ⇒ n = ${n}。`)},
m8(){const k=pk([2,3,5]),r=pk([2,3,4]),a=k,c=k*r*r,b=k*r;return mc(`a、b、c 成等比数列且 b>0,a=${a},c=${c},求 b。`,b,[(a+c)/2,b+1,b-1,c-a],`b² = ac = ${a}×${c} = ${a*c} ⇒ b = ${b}(b>0)。`)},
m9(){const a=pk([2,3,5]),n=rn(5,8),x=a*2**(n-1);return mc(`魔豆发芽后第 1 天高 ${a} 公尺,之后每天都是前一天的 2 倍,第 ${n} 天高几公尺?`,x,[a*2**n,a*2**(n-2),a*2*n],`等比数列 a₁=${a}, r=2 ⇒ ${A(n)} = ${a}×2^${n-1} = ${x}。`)},
h1(){const a=rn(1,15),d=pk([2,3,4,5]),n=rn(10,30),S=sm(a,d,n);return mc(`等差级数首项 ${a},公差 ${d},求前 ${n} 项的和 S${sb(n)}。`,S,[n*(2*a+(n-1)*d),S+n,S-a],`S = n[2a₁+(n−1)d]/2 = ${n}×[${2*a}+${(n-1)*d}]/2 = ${S}。`)},
h2(){if(Math.random()<.5){const d=pk([3,4,5,6,7,9]),m=rn(8,14),S=d*m*(m+1)/2;return mc(`求 ${d} + ${2*d} + ${3*d} + … + ${m*d} 的和。`,S,[S+d,S-d,m*(d+m*d)],`共 ${m} 项,S = ${m}×(${d}+${m*d})/2 = ${S}。`)}const k=rn(20,60);return mc(`求 1 + 3 + 5 + … + ${2*k-1} 的和。`,k*k,[k*(k+1),(k+1)**2,k*k-k],`共 ${k} 项,S = ${k}×(1+${2*k-1})/2 = ${k*k}。`)},
h3(){const a=rn(1,10),n=pk([9,11,13,15,17]),d=pk([2,3,4,5]),x=a+(n-1)*d,S=n*(a+x)/2;return mc(`已知 ${A(1)}=${a},${A(n)}=${x},求前 ${n} 项的和 S${sb(n)}。`,S,[2*S,S+n,S-n],`S = n(a₁+aₙ)/2 = ${n}×(${a}+${x})/2 = ${S}。`)},
h4(){const f=rn(10,30),d=pk([2,3,4]),n=rn(8,16),l=f+(n-1)*d;return mc(`某剧场第 1 排有 ${f} 个座位,最后一排有 ${l} 个,每排都比前一排多 ${d} 个,共有几排?`,n,[n+1,n-1,n+2],`${l} = ${f}+(n−1)×${d} ⇒ n−1 = ${(l-f)/d} ⇒ n = ${n} 排。`)},
h5(){const f=rn(10,30),d=pk([2,3,4]),n=rn(8,16),l=f+(n-1)*d,S=n*(f+l)/2;return mc(`某剧场共 ${n} 排,第 1 排 ${f} 个座位,最后一排 ${l} 个,每排递增 ${d} 个,总共有多少座位?`,S,[S+n,S-n,n*(f+l)],`S = n(首项+末项)/2 = ${n}×(${f}+${l})/2 = ${S}。`)},
h6(){const a=rn(1,10),d=pk([2,3,4,5,6]),n=rn(8,14),S=sm(a,d,n);return mc(`等差级数首项 ${a},前 ${n} 项和 S${sb(n)}=${S},求公差 d。`,d,[d+1,d-1,d+2],`${S} = ${n}[2×${a}+(${n}−1)d]/2 ⇒ ${2*S/n} = ${2*a}+${n-1}d ⇒ d = ${d}。`)},
h8(){const m=rn(6,10);return mc(`A0 纸面积 1 平方公尺,每对折一次面积变一半。面积约 1/${2**m} 平方公尺的纸,编号是?`,'A'+m,['A'+(m+1),'A'+(m-1),'A'+(m+2)],`面积 = 1/2^k 2^${m} = ${2**m},故编号为 A${m}。`)},
h9(){const D=pk([100,200,500]),T=pk([2,3]);let n=1;while(3**(n-1)/D<=T)n++;return mc(`等比数列首项 1/${D},公比 3,从第几项起的数会大于 ${T}?`,n,[n+1,n-1,n+2],`${A('n')}=3^(n−1)/${D} > ${T} ⇒ 3^(n−1) > ${D*T}。3^${n-2}=${3**(n-2)} 不够,3^${n-1}=${3**(n-1)} 够大,故从第 ${n} 项起。`)},
h10(){const m=rn(5,15),e=rn(1,4);return mc(`x、y 的等差中项为 ${m},且 x−y=${2*e},求 x、y 的乘积 xy。`,m*m-e*e,[m*m,m*m+e*e,2*m*e],`x+y = ${2*m},x−y = ${2*e} ⇒ x=${m+e}, y=${m-e},xy = ${m*m-e*e}。`)}};

<div class="bar" style="height:8px;background:#8883;border-radius:6px;margin:6px 0"><i style="display:block;height:100%;width:${(p.n||0)/9*100}%;background:var(--ac);border-radius:6px"></i></div>
${LV.map((l,i)=>`<div class="mu">${i+1}. ${l.n} ${'⭐'.repeat((p.cl||{})[i]||0)||'—'}</div>`).join('')}
<div style="margin-top:6px"><b>近期错题(${(p.wr||[]).length})</b></div>${(p.wr||[]).map(w=>`<div class="mu">• ${esc(w.q)} → 答${esc(w.m)}(正确 ${esc(w.a)})</div>`).join('')||'<div class="mu">无</div>'}</details>`).join(''):`<div class="cd mu">${esc(PLm||'读取中…(暂无玩家数据)')}</div>`}
<button class="pr w" onclick="go('home')">返回</button>`}
else{const acc=P.all?Math.round(P.ok/P.all*100):0,g=acc>=90?'S':acc>=75?'A':acc>=60?'B':'C';
h=`<h1>📜 修炼结算</h1><div class="cd" style="text-align:center"><div class="big go">${g}</div><b>${rank()}</b><div>正确率 ${acc}%(${P.ok}/${P.all}) · 灵石 ${P.sc} · 通关 ${nC()}/9</div>${nC()==9?'<div class="go"><b>🐉 九关皆破,飞升成仙!</b></div>':''}</div>
<div class="cd"><b>🎒 获得物品</b><div>${its().map(x=>`<span class="ch">${x[0]} ${x[1]}</span>`).join('')||'<span class="mu">暂无</span>'}</div></div>
<h3>📝 错题题解(${P.wr.length})</h3>${P.wr.map(w=>`<div class="cd"><div class="mu">${w.lv}</div><div><b>${w.q}</b></div><div><span class="bad">你的答案:${w.m}</span> · <span class="ok">正确答案:${w.a}</span></div><div>💡 ${w.exp}</div></div>`).join('')||'<div class="cd ok">暂无错题,道心通明!</div>'}
<button class="pr w" onclick="go('home')">返回山门</button><button class="w" onclick="if(rs){P={seen:1,cl:{},sc:0,ok:0,all:0,wr:[]};sv();rs=0;go('home')}else{rs=1;draw()}">${rs?'再点一次确认:清空存档':'重置存档'}</button>`}
$.innerHTML=h;window.scrollTo(0,0)}
let DB=null,UID=null,ADM=0,CS='💾 本机存档',PL=[],PLm='',ex=0,nick='',tmr;
const stat=()=>({nick,seen:P.seen,cl:P.cl,sc:P.sc,ok:P.ok,all:P.all,wr:P.wr.slice(-20),n:nC(),rk:rank(),ch:P.ch||0,upd:Date.now()});
function push(){if(!DB||!UID)return;clearTimeout(tmr);tmr=setTimeout(async()=>{try{await DB.doc('players/'+UID).set(stat());CS='☁️ 已同步到账号'}catch(e){CS='⚠️ 云同步失败(本机已存)'}if(scr=='home')draw()},800)}
function adm(){go('adm');if(ex)return;ex=1;const t=setTimeout(()=>{if(!PL.length){PLm='暂无数据或读取超时';if(scr=='adm')draw()}},10000);
DB.collection('players').onSnapshot(s=>{clearTimeout(t);PL=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(b.upd||0)-(a.upd||0));if(scr=='adm')draw()},e=>{PLm='无权限读取:请用管理员(编辑者)账号打开';if(scr=='adm')draw()})}
(async()=>{try{const c=window.claude;if(!c)return;const[d,u]=await Promise.all([c.use('db'),c.use('user')]);if(!d||!u)return;UID=await u.id();if(!UID)return;DB=d;nick=(await u.me()).name||'';
const s=await DB.doc('players/'+UID).get();if(s.exists){const x=s.data();nick=x.nick||nick;if((x.sc||0)>=P.sc){P.cl=JSON.parse(JSON.stringify(x.cl||{}));P.sc=x.sc||0;P.ok=x.ok||0;P.all=x.all||0;P.wr=JSON.parse(JSON.stringify(x.wr||[]));P.seen=x.seen||P.seen;P.ch=x.ch||0}}
CS='☁️ 已同步到账号';ADM=await u.canEdit();sv();draw()}catch(e){}})();
ensureStudent(()=>draw());
window.onerror=(m)=>{const d=document.createElement('div');d.style.cssText='background:#c1121f;color:#fff;padding:8px;font-size:12px';d.textContent='出错:'+m;document.body.prepend(d)};
</script><script src="../../home-fab.js"></script>
</body></html>
