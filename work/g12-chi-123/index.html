<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><style>:root{color-scheme:light}body{margin:0}[hidden]{display:none!important}</style><title>高三123忽銀財（國文三關）</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;900&display=swap">
<style>
/* Layout: one 720px column. Home = vertical title beside a short intro, lesson picker, facet chips.
   Play = one question per screen with a 10-step progress strip and a 30s timer.
   Result = rank, per-facet accuracy bars, wrong-answer review. */
:root {
  --bg: #EAEFEE;
  --surface: #F7F9F8;
  --fg: #13201E;
  --muted: #566664;
  --line: #C6D2CF;
  --accent: #0E6A5F;
  --accent-fg: #FFFFFF;
  --good: #176F42;
  --good-bg: #DCF0E4;
  --bad: #B42318;
  --bad-bg: #FBE3E0;
  --serif: "Noto Serif TC", "Songti TC", "PMingLiU", "Source Han Serif TC", serif;
  --sans: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0F1716; --surface: #172220; --fg: #E6EFED; --muted: #94A8A5; --line: #2B3A38;
    --accent: #4FC3B2; --accent-fg: #06201C; --good: #5ED08E; --good-bg: #12301F;
    --bad: #FF8B7E; --bad-bg: #3A1A17; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0F1716; --surface: #172220; --fg: #E6EFED; --muted: #94A8A5; --line: #2B3A38;
  --accent: #4FC3B2; --accent-fg: #06201C; --good: #5ED08E; --good-bg: #12301F;
  --bad: #FF8B7E; --bad-bg: #3A1A17; color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--fg);
  font-family: var(--sans); font-size: 16px; line-height: 1.65;
  padding-block: 22px 44px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.wrap { max-width: 720px; margin: 0 auto; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
h1, h2, h3, p, ul { margin: 0; }

/* shared */
.eyebrow { font-size: 13px; letter-spacing: .12em; color: var(--muted); }
.sec-h { font-family: var(--serif); font-weight: 900; font-size: 19px; margin-bottom: 12px; text-wrap: balance; }
.primary {
  display: block; width: 100%; padding: 14px 18px; border: 0; border-radius: 8px;
  background: var(--accent); color: var(--accent-fg); font-weight: 700; font-size: 17px; cursor: pointer;
}
.primary:hover { filter: brightness(1.06); }
.secondary {
  padding: 12px 18px; border: 1.5px solid var(--line); border-radius: 8px;
  background: var(--surface); font-weight: 500; cursor: pointer;
}
.secondary:hover { border-color: var(--accent); }
.link { background: none; border: 0; color: var(--muted); cursor: pointer; padding: 6px 0; }
.link:hover { color: var(--fg); }

/* login */
.form { max-width: 420px; }
.fields { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 120px); gap: 12px; margin-bottom: 16px; }
.form label { display: block; font-weight: 700; margin-bottom: 4px; }
.form input { width: 100%; padding: 12px 14px; border: 1.5px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--fg); font: inherit; }
.form input:focus { border-color: var(--accent); }
.err { color: var(--bad); font-size: 15px; margin-bottom: 12px; }
.hint { font-size: 13px; color: var(--muted); margin-bottom: 16px; }
.who { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 14px; margin-bottom: 22px; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; }
.who .link { padding: 0; color: var(--accent); font-weight: 700; }

/* home */
.hero { display: flex; gap: 20px; margin-bottom: 30px; }
.vtitle {
  writing-mode: vertical-rl; text-orientation: upright;
  font-family: var(--serif); font-weight: 900; line-height: 1;
  font-size: clamp(54px, 16vw, 96px); letter-spacing: .1em;
}
.hero-side {
  display: flex; flex-direction: column; justify-content: space-between; gap: 20px;
  min-width: 0; padding-left: 20px; border-left: 1px solid var(--line);
}
.facts { list-style: none; padding: 0; margin-top: 10px; display: grid; gap: 4px; }
.quote { font-family: var(--serif); font-weight: 600; font-size: 15px; line-height: 1.8; color: var(--muted); }
.quote span { display: block; font-family: var(--sans); font-weight: 400; font-size: 12px; letter-spacing: .08em; margin-top: 4px; }

.lessons { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr)); gap: 12px; }
.lesson {
  display: grid; grid-template-columns: 44px minmax(0, 1fr); gap: 14px; align-items: center;
  text-align: left; padding: 14px; background: var(--surface);
  border: 1.5px solid var(--line); border-radius: 8px; cursor: pointer;
}
.lesson:hover { border-color: var(--accent); }
.lesson[aria-pressed="true"] { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 11%, var(--surface)); }
.lesson svg { width: 44px; height: 44px; color: var(--accent); }
.lesson .no { font-size: 12px; letter-spacing: .1em; color: var(--muted); }
.lesson .nm { font-family: var(--serif); font-weight: 900; font-size: 20px; line-height: 1.3; }
.lesson .meta { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }

.chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 22px; }
.chip {
  padding: 6px 14px; border: 1.5px solid var(--line); border-radius: 999px;
  background: var(--surface); cursor: pointer; font-size: 15px;
}
.chip:hover { border-color: var(--accent); }
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); font-weight: 700; }

/* play */
.topbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 12px; }
.hud { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 4px 16px; font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; }
.hud b { color: var(--fg); font-weight: 700; }
.segs { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 4px; margin-bottom: 10px; }
.seg { height: 6px; background: var(--line); }
.seg.ok { background: var(--good); }
.seg.no { background: var(--bad); }
.seg.now { background: var(--accent); }
.timer { height: 4px; background: var(--line); margin-bottom: 16px; overflow: hidden; }
.timer i { display: block; height: 100%; width: 100%; background: var(--accent); }
.timer.low i { background: var(--bad); }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 20px; }
.tags { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 13px; letter-spacing: .06em; color: var(--muted); margin-bottom: 12px; }
.tags b { color: var(--accent); font-weight: 700; }
.qtext { font-family: var(--serif); font-weight: 600; font-size: clamp(18px, 4.8vw, 21px); line-height: 1.75; margin-bottom: 18px; text-wrap: pretty; }
.opts { display: grid; gap: 10px; }
.opt {
  display: grid; grid-template-columns: 26px minmax(0, 1fr); gap: 10px; align-items: start;
  width: 100%; text-align: left; padding: 12px 14px; border: 1.5px solid var(--line);
  border-radius: 8px; background: var(--bg); color: var(--fg); cursor: pointer; overflow-wrap: anywhere;
}
.opt:hover:not(:disabled) { border-color: var(--accent); }
.opt:disabled { cursor: default; color: var(--fg); }
.ltr { font-weight: 700; color: var(--accent); }
.opt.correct { border-color: var(--good); background: var(--good-bg); }
.opt.correct .ltr { color: var(--good); }
.opt.wrong { border-color: var(--bad); background: var(--bad-bg); }
.opt.wrong .ltr { color: var(--bad); }
.fb { margin-top: 16px; padding: 14px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); }
.fb h3 { font-size: 16px; margin-bottom: 4px; }
.fb.ok h3 { color: var(--good); }
.fb.no h3 { color: var(--bad); }
.fb p { font-size: 15px; }
#next { margin-top: 14px; }

/* result */
.rank { font-family: var(--serif); font-weight: 900; font-size: clamp(40px, 11vw, 64px); line-height: 1.15; margin: 4px 0 6px; }
.rank-sub { color: var(--muted); margin-bottom: 20px; }
.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; margin-bottom: 28px; }
.stat { padding: 12px; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; }
.stat b { display: block; font-family: var(--serif); font-weight: 900; font-size: 28px; line-height: 1.2; font-variant-numeric: tabular-nums; }
.stat span { font-size: 13px; color: var(--muted); }
.newbest { color: var(--good); font-weight: 700; font-size: 13px; }
.bars { display: grid; gap: 10px; margin-bottom: 28px; }
.bar { display: grid; grid-template-columns: 7em minmax(0, 1fr) 3em; gap: 10px; align-items: center; font-size: 14px; }
.bar .track { height: 10px; background: var(--line); }
.bar .fill { height: 100%; background: var(--accent); }
.bar .n { text-align: right; color: var(--muted); font-variant-numeric: tabular-nums; }
.wrong-list { display: grid; gap: 10px; margin-bottom: 28px; }
.wrong-list details { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; }
.wrong-list summary { cursor: pointer; font-weight: 500; }
.wrong-list .ans { margin-top: 10px; font-size: 15px; display: grid; gap: 6px; }
.wrong-list .yours { color: var(--bad); }
.wrong-list .right { color: var(--good); }
.actions { display: flex; flex-wrap: wrap; gap: 10px; }
.actions .primary { width: auto; flex: 1 1 200px; }
.actions .secondary { flex: 1 1 140px; }

@media (max-width: 420px) {
  .bar { grid-template-columns: 5.6em minmax(0, 1fr) 2.6em; }
  .card { padding: 16px; }
}
@media (prefers-reduced-motion: no-preference) {
  .timer i { transition: width .2s linear; }
  .opt, .lesson, .chip { transition: border-color .15s, background-color .15s; }
}

@media print {
  html:root, html:root:not([data-theme="light"]), html:root[data-theme="dark"] {
    --bg: #fff; --surface: #fff; --fg: #111; --muted: #444; --line: #bbb; --accent: #0E6A5F;
    --accent-fg: #fff; --good: #176F42; --good-bg: #fff; --bad: #B42318; --bad-bg: #fff; color-scheme: light;
  }
  * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  body { padding: 0; }
  .actions { display: none !important; }
  .wrong-list details { break-inside: avoid; }
}
</style>

<script>
/* ========== 接上教師後台的程式（整段複製，只改最上面的 GAME_KEY） ========== */
const GAME_KEY = 'chi-g12-123';            // 遊戲代號：小寫英文／數字／-／_，建議「科目簡碼-遊戲名」

/* 1) 學號：沒有就強迫輸入 */
function ensureStudent(done) {
  const no = keyagentGetActiveStudentNumber();
  if (no) return done(no);
  const v = (prompt('請輸入你的學號') || '').trim();
  if (!/^[A-Za-z0-9_-]{2,12}$/.test(v)) return ensureStudent(done);
  localStorage.setItem('keyagent_active_student', JSON.stringify({ studentNumber: v, verified: false }));
  done(v);
}

/* 2) 練習時間：只算「玩完一局」的時間；切到別的分頁不算；中途關掉的那一局不算 */
let T0 = 0, ACC = 0;
function tStart()  { ACC = 0; T0 = Date.now(); }
function tPause()  { if (T0) { ACC += Date.now() - T0; T0 = 0; } }
function tResume() { if (!T0 && !document.hidden) T0 = Date.now(); }
function tTake()   { tPause(); const s = Math.min(1800, Math.round(ACC / 1000)); ACC = 0; return s; }
document.addEventListener('visibilitychange', () => (document.hidden ? tPause() : tResume()));

/* 3) 一局結束時呼叫 finishRound({...})，會自動記錄並送到老師的後台 */
function finishRound(r) {
  // r = { stageId:'L1', stageName:'第一課 認字', score:80, right:8, total:10, stars:2(可省略), nick:'小勇者'(可省略),
  //       types:[{ key:'read', label:'看字讀音', right:5, total:6 }, ...](可省略) }
  const secs = tTake();
  keyagentUpdateOtherGame(GAME_KEY, prev => {
    const stages = Object.assign({}, prev.stages);
    const s = stages[r.stageId] || {};
    stages[r.stageId] = {
      n: r.stageName || r.stageId,
      bestStars: Math.max(s.bestStars || 0, r.stars || 0),
      bestScore: Math.max(s.bestScore || 0, r.score || 0),
      plays: (s.plays || 0) + 1,
      hist: (s.hist || []).concat([{ at: Date.now(), q: r.total || 0, ok: r.right || 0, s: secs, st: r.stars || 0 }]).slice(-30),   // 每一次的結果（後台點答對率可看）
      totalSecs: (s.totalSecs || 0) + secs,
      totalQ: (s.totalQ || 0) + (r.total || 0),
      totalOk: (s.totalOk || 0) + (r.right || 0)
    };
    const q = Object.assign({}, prev.q);
    (r.types || []).forEach(t => {
      const k = r.stageId + ':' + t.key, o = q[k] || { n: 0, ok: 0 };
      q[k] = { n: o.n + (t.total || 0), ok: o.ok + (t.right || 0), label: t.label || t.key };
    });
    return {
      nick: r.nick || prev.nick || '',
      totalPlays: (prev.totalPlays || 0) + 1,
      bestScore: Math.max(prev.bestScore || 0, r.score || 0),
      totalSecs: (prev.totalSecs || 0) + secs,
      totalQ: (prev.totalQ || 0) + (r.total || 0),
      totalOk: (prev.totalOk || 0) + (r.right || 0),
      lastScore: r.score || 0, lastId: r.stageId, lastName: r.stageName || r.stageId, lastAt: Date.now(),
      stages, q
    };
  });
}
keyagentInstallPageHideSync();           // 4) 離開頁面時補寄一次
/* ========== 以上整段不用改 ========== */
</script>
<script>
(function () {
  var Q = [{"id": 1, "lesson": 1, "facet": "A", "level": "基礎", "question": "下列〈庖丁解牛〉詞語的注音,何者正確?", "options": ["膝之所踦(ㄑㄧˊ)", "砉(ㄏㄨㄛˋ)然嚮然", "批大郤(ㄑㄩˋ)", "技經肯綮(ㄑㄧㄥˇ)"], "answer": "B", "explanation": "「踦」讀ㄧˇ(抵住),「郤」讀ㄒㄧˋ(空隙),「綮」讀ㄑㄧㄥˋ(筋骨結合處);「砉」讀ㄏㄨㄛˋ,形容皮肉與骨相離的聲音。"}, {"id": 2, "lesson": 1, "facet": "A", "level": "進階", "question": "下列哪一句使用「游刃有餘」最恰當?", "options": ["小傑剛學會游泳,一下水就游刃有餘地橫渡深潭。", "這道數學題連老師也解了半天,同學們個個游刃有餘。", "他對新工作十分生疏,卻游刃有餘地忙到深夜仍做不完。", "資深客服面對各式客訴,依然從容應對、游刃有餘。"], "answer": "D", "explanation": "「游刃有餘」出自「恢恢乎其於游刃必有餘地矣」,比喻技術純熟、處事從容。其餘三句的情境都是生疏或吃力,與詞義相反。"}, {"id": 3, "lesson": 1, "facet": "B", "level": "基礎", "question": "關於莊子與《莊子》的敘述,何者正確?", "options": ["《莊子》現存三十三篇,一般認為〈內篇〉為莊子所作", "莊子為戰國時期魯國人,與孔子同時", "莊子接受楚威王重金禮聘,出任宰相,推行無為而治", "莊子與孟子並稱「孟莊」,是儒家的代表人物"], "answer": "A", "explanation": "《莊子》分〈內篇〉〈外篇〉〈雜篇〉,一般認為〈內篇〉為莊子所作。莊子是宋國人,與孟子同時,婉拒楚威王聘相,與老子並稱「老莊」,屬道家。"}, {"id": 4, "lesson": 1, "facet": "B", "level": "進階", "question": "關於〈庖丁解牛〉的出處與題解,何者正確?", "options": ["出自《莊子·逍遙遊》,標題為莊子自訂", "出自《莊子·養生主》,「庖丁」指名叫「庖」的廚師", "出自《莊子·養生主》,標題為後人所訂,藉庖丁解牛說明「依乎天理」「因其固然」的養生之道", "出自《莊子·養生主》,主旨在鼓勵人積極進取、改變環境"], "answer": "C", "explanation": "〈養生主〉闡釋莊子的養生哲學,標題為後人所訂;「庖丁」是名叫「丁」的廚師,「庖」指廚師。重點在順應自然,而不是積極改變環境。"}, {"id": 5, "lesson": 1, "facet": "C", "level": "進階", "question": "〈庖丁解牛〉中「刀」與「牛」的象徵意義,何者最恰當?", "options": ["刀象徵君王的權力,牛象徵天下百姓", "刀象徵戰爭武力,牛象徵敵人的軍隊", "刀象徵技藝的精進,牛象徵庖丁過去的失敗", "刀象徵人自身,牛象徵複雜的世事與人際,順著肌理縫隙才能游刃有餘"], "answer": "D", "explanation": "學習重點要求思考刀與牛的象徵:刀是人自己,牛是繁雜的世事與人際。刀刃無厚而能入有間,比喻順著事物的自然規律處事,便能游刃有餘。"}, {"id": 6, "lesson": 1, "facet": "C", "level": "進階", "question": "庖丁說「始臣之解牛之時,所見無非牛者;三年之後,未嘗見全牛也;方今之時,臣以神遇而不以目視」,最主要的涵義是什麼?", "options": ["技藝隨歷練累積,由只見表象,進到洞悉內在規律、以精神領會的境界", "庖丁年事已高、視力衰退,只好閉眼憑感覺解牛", "解牛愈快愈好,看得愈少表示愈有自信", "三年之後庖丁換了更精良的刀,所以不必再看整頭牛"], "answer": "A", "explanation": "由「所見無非牛」到「未嘗見全牛」,再到「以神遇而不以目視」,是技藝逐步深化的歷程:從只看表面,到看透結構與規律,再到以精神領會。"}, {"id": 7, "lesson": 1, "facet": "D", "level": "基礎", "question": "「砉然嚮然,奏刀騞然,莫不中音」藉哪一種修辭,讓讀者彷彿「聽見」解牛的聲響?", "options": ["排比", "映襯", "摹寫(聽覺)", "轉化"], "answer": "C", "explanation": "「砉然」「嚮然」「騞然」都是模擬聲音的詞,屬聽覺摹寫。前一句「手之所觸,肩之所倚……」才是排比。"}, {"id": 8, "lesson": 1, "facet": "D", "level": "進階", "question": "庖丁拿「良庖歲更刀」「族庖月更刀」和自己「十九年」的刀相比,主要的寫作手法是什麼?", "options": ["層遞,由小到大說明刀具的種類", "對比襯托,以良庖、族庖頻繁換刀,襯出庖丁刀刃如新的技藝", "借代,以刀代指庖丁本人", "雙關,歲、月暗指君王的壽命"], "answer": "B", "explanation": "良庖「歲更刀」、族庖「月更刀」是一般廚師的情形,庖丁的刀卻十九年如新。以他人的頻繁損耗襯托庖丁順理而行、技藝高超,是對比襯托。"}, {"id": 9, "lesson": 1, "facet": "E", "level": "素養", "question": "小宇剛進公司,面對錯綜複雜的專案與人際,常手忙腳亂。依〈庖丁解牛〉的啟示,他最適合怎麼做?", "options": ["加快速度、硬碰硬,哪裡卡住就用力砍過去", "避開所有困難,只接簡單的工作", "先觀察事情的脈絡與關鍵縫隙,順理處理,遇到難處更要放慢、謹慎", "完全照抄前輩的流程,不必理解背後的道理"], "answer": "C", "explanation": "庖丁遇到筋骨交錯處「吾見其難為,怵然為戒,視為止,行為遲」,是遇難放慢、謹慎;「族庖月更刀,折也」則是硬砍的下場。"}, {"id": 10, "lesson": 1, "facet": "E", "level": "素養", "question": "〈庖丁解牛〉與〈蜘蛛之絲〉都藉故事傳達處世之理。兩篇的比較,何者最恰當?", "options": ["兩篇都以第一人稱,抒發作者親身遭遇", "前者藉庖丁之技說明順應自然的養生之道,後者藉蜘蛛絲呈現善念的可貴與脆弱,皆以故事寄寓哲理", "前者強調人性的自私,後者強調技藝的精進", "兩篇皆以歷史事件為主,目的在紀實"], "answer": "B", "explanation": "〈庖丁解牛〉藉庖丁之口說明依乎天理的養生之道;〈蜘蛛之絲〉藉蜘蛛絲說明善念的珍貴與脆弱。兩篇都以故事寄寓哲理,並非作者自述或紀實。"}, {"id": 11, "lesson": 2, "facet": "A", "level": "基礎", "question": "下列〈神鵰重劍〉詞語的注音,何者正確?", "options": ["軟泥迸(ㄅㄥˋ)出", "本名查(ㄔㄚˊ)良鏞", "閱讀及研究其創作的風氣日熾(ㄔㄨˋ)", "但賸(ㄕㄥˇ)下獨臂"], "answer": "A", "explanation": "「迸」讀ㄅㄥˋ。「查」作姓氏讀ㄓㄚ;「熾」讀ㄔˋ;「賸」讀ㄕㄥˋ。"}, {"id": 12, "lesson": 2, "facet": "A", "level": "進階", "question": "「行了里許,來到一座峭壁之前」的「里許」,意思最接近下列何者?", "options": ["許可行走的里程", "大約一里", "許多里", "不到一里"], "answer": "B", "explanation": "「里許」指大約一里,「許」表示約略、左右。同段的「信步」則是隨意漫步。"}, {"id": 13, "lesson": 2, "facet": "B", "level": "基礎", "question": "關於金庸的敘述,何者正確?", "options": ["本名金庸,筆名查良鏞", "一生居住於上海,專事武俠小說創作", "八十一歲赴英國劍橋大學,取得法學博士", "本名查良鏞,浙江海寧人,曾在香港創辦《明報》系列報刊,並以筆名「金庸」創作武俠小說"], "answer": "D", "explanation": "金庸本名查良鏞,浙江海寧人,在香港創辦《明報》系列報刊,並以筆名「金庸」創作武俠小說。他八十一歲赴劍橋大學深造,取得的是歷史碩士與博士。"}, {"id": 14, "lesson": 2, "facet": "B", "level": "進階", "question": "關於〈神鵰重劍〉的選文背景,何者正確?", "options": ["選自《射鵰英雄傳》,寫郭靖習得降龍十八掌", "選自《倚天屠龍記》,寫張無忌學成乾坤大挪移", "選自《神鵰俠侶》第二十六回,寫楊過發現獨孤求敗的劍塚,並在神鵰引導下掌握玄鐵重劍的訣竅", "選自《神鵰俠侶》,寫楊過與郭芙結為夫妻"], "answer": "C", "explanation": "題解說明選文出自《神鵰俠侶》第二十六回,寫楊過發現「劍魔」獨孤求敗的劍塚,並在神鵰引導下掌握玄鐵重劍的訣竅。《射鵰英雄傳》《倚天屠龍記》是金庸的其他作品。"}, {"id": 15, "lesson": 2, "facet": "C", "level": "進階", "question": "楊過見到「劍塚」二字,先生好奇,又在斷臂不便下仍決定攀上峭壁。他的心理轉折,何者最合理?", "options": ["由恐懼轉為憤怒,想藉攀登向郭芙報復", "由好奇驅動,進而不顧斷臂不便、不懼旁人笑話,展現不服輸的堅毅", "由絕望轉為放棄,認為攀登只是為了尋死", "由驕傲轉為謙卑,打算向獨孤求敗學習做人道理"], "answer": "B", "explanation": "課文中楊過想「爬不上便爬不上,難道還有旁人來笑話不成」,可見他不顧斷臂不便,也不在意旁人眼光,由好奇走向堅毅嘗試。"}, {"id": 16, "lesson": 2, "facet": "C", "level": "進階", "question": "依題解與學習重點,文中「劍」除了是武器,更深一層的意涵是什麼?", "options": ["象徵朝廷對江湖的控制", "只是增加戰鬥場面的道具,沒有其他意涵", "象徵楊過與郭芙之間未解的仇恨", "象徵人在不同階段的武學與生命體會,「人與劍」的關係映照出人的處境與成長"], "answer": "D", "explanation": "題解指出文中以獨孤求敗一生所用的劍,呈現不同階段的武學與生命體會;學習重點也要求思索人與劍的關係,反省自身處境並展望未來。"}, {"id": 17, "lesson": 2, "facet": "D", "level": "基礎", "question": "「那峭壁便如一座極大的屏風」「便似一個平臺」二句,主要運用的修辭是什麼?", "options": ["譬喻(明喻)", "轉化(擬人)", "設問", "借代"], "answer": "A", "explanation": "「便如」「便似」是明喻的喻詞。屏風、平臺是喻依,峭壁與巨石是喻體。"}, {"id": 18, "lesson": 2, "facet": "D", "level": "進階", "question": "課文第二至四段寫楊過觀察青苔、探手摸泥、攀爬受挫、調息再試,最後登上平臺。這樣的安排,最能呈現什麼?", "options": ["以倒敘交代楊過的身世與斷臂的原因", "以多重視角輪流敘述峭壁與神鵰的想法", "依「觀察、推斷、嘗試、受挫、調整、成功」的順序,展現細心觀察與持續修正的過程", "以景物變化象徵季節的更迭"], "answer": "C", "explanation": "這幾段依序寫觀察青苔、探手摸泥、決定攀爬、第一次力氣不加而溜下、調息後再試、終於登上平臺,呈現觀察與持續調整的過程。"}, {"id": 19, "lesson": 2, "facet": "E", "level": "素養", "question": "小璇練習倒立屢次失敗,朋友在社群貼文留言說她「手臂力量不夠,不如放棄」。若學習楊過攀峭壁的精神,她最適當的做法是什麼?", "options": ["先找出可以著力的支點,第一次受挫後記下經驗、調整體力與方法,再重新挑戰", "發文反擊朋友,證明自己不需要任何人的意見", "從此不再練習,避免再被取笑", "一次用盡全力衝到極限,失敗就代表天份不足"], "answer": "A", "explanation": "楊過先找到可以著力的小洞,第一次受挫後調息養力,再展開輕功重新攀爬。把「支點」「調整」「再試」用在練習上,比反擊或放棄更有幫助。"}, {"id": 20, "lesson": 2, "facet": "E", "level": "素養", "question": "〈庖丁解牛〉與〈神鵰重劍〉都談到「人」與「工具」的關係。下列比較,何者最恰當?", "options": ["兩篇都主張丟棄工具,回歸原始生活", "庖丁主張刀越新越好,楊過主張劍越重越好", "兩篇皆以譏諷沉迷武力的人為主旨", "庖丁由「技」進於「道」而游刃有餘,楊過由用劍生疏到得心應手,皆強調技藝須與自身領悟融合"], "answer": "D", "explanation": "庖丁說「進乎技矣」,由道引領技藝而游刃有餘;楊過從用劍生疏到得心應手,進而領悟劍術至理。兩篇都不是要人丟棄工具,也不是追求更新或更重的工具。"}, {"id": 21, "lesson": 3, "facet": "A", "level": "基礎", "question": "下列〈蜘蛛之絲〉詞語的注音,何者正確?", "options": ["犍(ㄑㄧㄢˊ)陀多", "日本文壇巨擘(ㄅㄧˋ)", "釋迦(ㄐㄧㄚ)佛", "蓮花漾(ㄧㄤˊ)出芳香"], "answer": "C", "explanation": "「犍」讀ㄐㄧㄢ,「擘」讀ㄅㄛˋ,「漾」讀ㄧㄤˋ,「釋迦」的「迦」讀ㄐㄧㄚ。"}, {"id": 22, "lesson": 3, "facet": "A", "level": "進階", "question": "下列詞語的解釋,何者正確?", "options": ["「一線生機」:極其微小、僅存的一點生存希望", "「信步漫行」:沿固定路線快步行走", "「酬報」:收取報酬", "「無緣無故」:有緣分的原因"], "answer": "A", "explanation": "「一線生機」指極微小的一點活命希望。「信步」是隨意走動;「酬報」是以行動回報;「無緣無故」是沒有任何原因。"}, {"id": 23, "lesson": 3, "facet": "B", "level": "基礎", "question": "關於芥川龍之介的敘述,何者正確?", "options": ["就讀京都大學法學部,師事森鷗外", "以長篇歷史小說聞名,「芥川賞」是他生前親自設立", "在文壇有「鬼才」之稱,作品以浪漫抒情的長詩為主", "本姓新原,後為舅父收養而改姓芥川,就讀東京帝國大學英文科,師事夏目漱石"], "answer": "D", "explanation": "芥川龍之介本姓新原,後為舅父收養改姓芥川;就讀東京帝國大學英文科,師事夏目漱石。他以短篇小說為主,有「鬼才」之稱;「芥川賞」是他逝世後文壇為紀念他而設立。"}, {"id": 24, "lesson": 3, "facet": "B", "level": "進階", "question": "關於〈蜘蛛之絲〉的出處與旨趣,何者正確?", "options": ["作者為賴祥雲,選自《芥川龍之介全集》,主旨在歌頌慈悲必得善報", "譯者為賴祥雲,選自《芥川龍之介的世界》,藉蜘蛛絲凸顯善念的珍貴與脆弱,具警示人心的作用", "譯者為夏目漱石,選自《芥川龍之介的世界》,主旨在批判宗教迷信", "作者與譯者皆為芥川龍之介,選自《芥川龍之介全集》"], "answer": "B", "explanation": "譯者是賴祥雲,選文出自《芥川龍之介的世界》。題解指出蜘蛛絲凸顯善念的珍貴與脆弱,具警示人心的作用。"}, {"id": 25, "lesson": 3, "facet": "C", "level": "進階", "question": "〈蜘蛛之絲〉中「蜘蛛絲」的象徵意義,何者最恰當?", "options": ["惡人必受懲罰的刑具", "釋迦佛炫耀神力的工具", "希望與救贖的象徵,同時考驗人心能否放下私心", "隔開地獄與極樂世界、無法跨越的界線"], "answer": "C", "explanation": "題解稱蜘蛛絲是希望與救贖的象徵;它始於犍陀多對蜘蛛的悲憫,卻斷裂於他不願分享的私心,因此也考驗人心能否放下私心。"}, {"id": 26, "lesson": 3, "facet": "C", "level": "基礎", "question": "釋迦佛決定垂下蜘蛛絲的原因,何者正確?", "options": ["想起犍陀多曾因一念之仁而沒有踩死蜘蛛,打算酬報他的善行", "看見犍陀多正虔誠念佛,想給予獎勵", "蓮池下方的地獄過於擁擠,需要把罪人送走", "受到眾罪人的哀求而心生憐憫"], "answer": "A", "explanation": "課文第四段寫釋迦佛想起犍陀多曾救過蜘蛛,「想要酬報他的善行」,才拿起蜘蛛絲垂入地獄。"}, {"id": 27, "lesson": 3, "facet": "D", "level": "基礎", "question": "課文先寫極樂世界蓮池的潔白與芳香,再寫地獄底層罪人的蠢動,主要的寫作效果是什麼?", "options": ["前後形成因果關係,說明蓮池造成了地獄", "由遠而近的空間推移,呈現旅行見聞", "由古至今的時間推移,交代歷史變遷", "以清淨極樂與污濁地獄形成強烈對比,為後文的救贖與抉擇鋪墊"], "answer": "D", "explanation": "課文先以玉般潔白的蓮花與芳香寫極樂,再寫地獄底層的罪人蠢動。兩處上下相對、氣氛強烈對比,為後文的救贖與抉擇鋪墊。"}, {"id": 28, "lesson": 3, "facet": "D", "level": "進階", "question": "本文以第三人稱敘事,視線多由釋迦佛透過蓮池向下俯望地獄。這種視角的效果是什麼?", "options": ["讓讀者站在犍陀多的立場,直接體會他的恐懼", "讓讀者與釋迦佛同處高處,冷靜俯瞰犍陀多的抉擇,凸顯人性在救贖面前的考驗", "讓作者以第一人稱抒發自己的懺悔", "讓眾罪人輪流說出內心話"], "answer": "B", "explanation": "敘事視線從蓮池俯望地獄,讀者跟著釋迦佛居高觀看,犍陀多的選擇便像在檢驗人性。這是第三人稱視角,並非第一人稱,也不是由犍陀多或罪人的立場出發。"}, {"id": 29, "lesson": 3, "facet": "E", "level": "素養", "question": "班級群組有同學分享限量的免費學習資源連結,小綺擔心朋友多了自己搶不到,打算隱瞞不說。依〈蜘蛛之絲〉的啟示,最恰當的想法是什麼?", "options": ["一己的私心可能讓來之不易的機會落空,懂得分享才能守住善念與希望", "機會有限,先確保自己成功,別人自己想辦法", "無論如何都要把機會讓給別人,自己不必得到", "機會是否出現全靠運氣,與心態無關"], "answer": "A", "explanation": "題解指出蜘蛛絲「斷裂於他不願分享的私心」。把機會藏起來,可能讓共同的希望一起落空;分享才守得住善念。"}, {"id": 30, "lesson": 3, "facet": "E", "level": "素養", "question": "三課主角面對關鍵時刻的選擇各不相同。下列對應,何者最恰當?", "options": ["庖丁:遇難處硬砍;楊過:決定放棄;犍陀多:樂於分享", "庖丁:靠運氣成功;楊過:靠旁人代勞;犍陀多:靠自己救自己", "庖丁:遇難處放慢謹慎、順理而行;楊過:面對險峻不輕言放棄、持續調整;犍陀多:危急時被私心蒙蔽而失去生機", "三人皆以智謀取勝,不受情緒影響"], "answer": "C", "explanation": "庖丁遇難處放慢謹慎、順理而行;楊過面對險峻不輕言放棄、不斷調整;犍陀多在關鍵時刻被私心蒙蔽,失去逃出地獄的一線生機。"}];

  var RANKS = [
    [0.9, '游刃有餘', '刀刃十九年如新發於硎,這一輪你也幾乎沒有失手。'],
    [0.7, '得心應手', '大部分要領都掌握了,補上錯題的細節會更穩。'],
    [0.5, '初試鋒芒', '已經摸到門路,先看錯題回顧,再挑戰一次。'],
    [0, '再磨一磨', '先讀解析,再重打一輪,分數會進步得很快。']
  ];

  function $(s) { return document.querySelector(s); }
  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  }
  function shuffle(a) {
    a = a.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }
  function getBest(k) { try { var v = localStorage.getItem('gw3:best:' + pid() + ':' + k); return v ? +v : 0; } catch (e) { return 0; } }
  function setBest(k, v) { try { localStorage.setItem('gw3:best:' + pid() + ':' + k, String(v)); } catch (e) {} }

  var sel = { lesson: '1', facet: 'all' };
  var run = null;

  function show(id) {
    ['login', 'home', 'play', 'result'].forEach(function (v) { $('#' + v).hidden = v !== id; });
    window.scrollTo(0, 0);
  }

  function pickQuestions() {
    if (sel.lesson === 'all') {
      if (sel.facet !== 'all') return Q.filter(function (q) { return q.facet === sel.facet; });
      var out = [];
      Object.keys(FACETS).forEach(function (f) {
        out = out.concat(shuffle(Q.filter(function (q) { return q.facet === f; })).slice(0, 3));
      });
      return out;
    }
    return Q.filter(function (q) {
      return String(q.lesson) === sel.lesson && (sel.facet === 'all' || q.facet === sel.facet);
    });
  }
  function countFor(lesson) {
    var save = sel.lesson; sel.lesson = lesson;
    var n = pickQuestions().length;
    sel.lesson = save;
    return n;
  }

  /* ---------- home ---------- */
  function renderHome() {
    var facts = $('#facts');
    facts.textContent = '';
    [Q.length + ' 題,五大面向', '每題 30 秒,連對加分', '答完立刻看解析'].forEach(function (t) {
      facts.appendChild(el('li', null, t));
    });

    var box = $('#lessons');
    box.textContent = '';
    ['1', '2', '3', 'all'].forEach(function (k) {
      var L = LESSONS[k];
      var b = el('button', 'lesson');
      b.type = 'button';
      b.setAttribute('aria-pressed', String(sel.lesson === k));
      var icon = el('div');
      icon.innerHTML = EMBLEM[k];
      var body = el('div');
      body.style.minWidth = '0';
      body.appendChild(el('div', 'no', L.no + ' · ' + L.who));
      body.appendChild(el('div', 'nm', L.name));
      var best = getBest(k);
      body.appendChild(el('div', 'meta', countFor(k) + ' 題 · ' + (best ? '最高 ' + best + ' 分' : '尚未挑戰')));
      b.appendChild(icon.firstChild);
      b.appendChild(body);
      b.addEventListener('click', function () { sel.lesson = k; renderHome(); });
      box.appendChild(b);
    });

    var chips = $('#chips');
    chips.textContent = '';
    [['all', '全部面向']].concat(Object.keys(FACETS).map(function (f) { return [f, f + ' ' + FACETS[f]]; })).forEach(function (p) {
      var c = el('button', 'chip', p[1]);
      c.type = 'button';
      c.setAttribute('aria-pressed', String(sel.facet === p[0]));
      c.addEventListener('click', function () { sel.facet = p[0]; renderHome(); });
      chips.appendChild(c);
    });

    var n = pickQuestions().length;
    var s = $('#start');
    s.textContent = n ? '開始闖關 · ' + n + ' 題' : '這個組合沒有題目';
    s.disabled = !n;
  }

  /* ---------- play ---------- */
  function startRun(list, practice) {
    run = {
      list: shuffle(list).map(function (q) {
        var ci = LET.indexOf(q.answer);
        return { q: q, opts: shuffle(q.options.map(function (t, i) { return { t: t, ok: i === ci }; })) };
      }),
      i: 0, score: 0, combo: 0, maxCombo: 0, results: [], locked: false,
      t0: 0, raf: 0, practice: !!practice
    };
    tStart();
    show('play');
    renderQ();
  }

  function renderSegs() {
    var s = $('#segs');
    s.textContent = '';
    run.list.forEach(function (_, i) {
      var d = el('i', 'seg');
      var r = run.results[i];
      if (r) d.classList.add(r.ok ? 'ok' : 'no');
      else if (i === run.i) d.classList.add('now');
      s.appendChild(d);
    });
  }

  function renderQ() {
    var item = run.list[run.i], q = item.q;
    run.locked = false;
    renderSegs();
    $('#score').textContent = run.score;
    $('#combo').textContent = run.combo;
    var tags = $('#tags');
    tags.textContent = '';
    tags.appendChild(el('span', null, '第 ' + (run.i + 1) + ' / ' + run.list.length + ' 題'));
    var fb = el('span'); fb.appendChild(el('b', null, q.facet)); fb.appendChild(document.createTextNode(' ' + FACET_FULL[q.facet]));
    tags.appendChild(fb);
    tags.appendChild(el('span', null, q.level));
    tags.appendChild(el('span', null, LESSONS[q.lesson].no + ' ' + LESSONS[q.lesson].name));
    $('#qtext').textContent = q.question;
    var box = $('#opts');
    box.textContent = '';
    item.opts.forEach(function (o, i) {
      var b = el('button', 'opt');
      b.type = 'button';
      b.appendChild(el('span', 'ltr', LET[i]));
      b.appendChild(el('span', null, o.t));
      b.addEventListener('click', function () { answer(i); });
      box.appendChild(b);
    });
    $('#fb').hidden = true;
    $('#next').hidden = true;
    startTimer();
  }

  function startTimer() {
    cancelAnimationFrame(run.raf);
    run.t0 = performance.now();
    tick();
  }
  function timeLeft() { return Math.max(0, TIME - (performance.now() - run.t0) / 1000); }
  function tick() {
    if (!run || run.locked) return;
    var left = timeLeft();
    $('#timerBar').style.width = (left / TIME * 100) + '%';
    $('#timer').classList.toggle('low', left <= 8);
    $('#tleft').textContent = Math.ceil(left);
    if (left <= 0) { answer(-1); return; }
    run.raf = requestAnimationFrame(tick);
  }
  var hiddenAt = 0;
  document.addEventListener('visibilitychange', function () {
    if (!run || run.locked || $('#play').hidden) return;
    if (document.hidden) { hiddenAt = performance.now(); }
    else if (hiddenAt) { run.t0 += performance.now() - hiddenAt; hiddenAt = 0; }
  });

  function answer(i) {
    if (!run || run.locked) return;
    run.locked = true;
    cancelAnimationFrame(run.raf);
    var item = run.list[run.i];
    var left = timeLeft();
    var ci = item.opts.findIndex(function (o) { return o.ok; });
    var ok = i === ci, gain = 0;
    if (ok) {
      run.combo++;
      run.maxCombo = Math.max(run.maxCombo, run.combo);
      gain = 100 + Math.round(left / TIME * 50) + Math.min(50, (run.combo - 1) * 10);
      run.score += gain;
    } else {
      run.combo = 0;
    }
    run.results.push({ item: item, pick: i, ok: ok, gain: gain });

    var btns = document.querySelectorAll('#opts .opt');
    btns.forEach(function (b, k) {
      b.disabled = true;
      if (k === ci) b.classList.add('correct');
      else if (k === i) b.classList.add('wrong');
    });
    $('#score').textContent = run.score;
    $('#combo').textContent = run.combo;
    $('#tleft').textContent = Math.ceil(left);
    renderSegs();

    var fb = $('#fb');
    fb.className = 'fb ' + (ok ? 'ok' : 'no');
    $('#fbT').textContent = ok ? '答對了,+' + gain + ' 分' : (i < 0 ? '時間到' : '答錯了');
    $('#fbP').textContent = '正確答案是 ' + LET[ci] + '。' + item.q.explanation;
    fb.hidden = false;
    var nx = $('#next');
    nx.textContent = run.i + 1 >= run.list.length ? '查看結果' : '下一題';
    nx.hidden = false;
    nx.focus();
  }

  function next() {
    run.i++;
    if (run.i >= run.list.length) showResult(); else renderQ();
  }

  document.addEventListener('keydown', function (e) {
    if (!run || $('#play').hidden || e.ctrlKey || e.metaKey || e.altKey) return;
    var k = e.key.toLowerCase(), idx = -1;
    if ('abcd'.indexOf(k) > -1 && k.length === 1) idx = 'abcd'.indexOf(k);
    else if ('1234'.indexOf(k) > -1 && k.length === 1) idx = +k - 1;
    if (!run.locked && idx > -1) { answer(idx); return; }
    if (run.locked && e.key === 'ArrowRight') next();
  });

  /* ---------- result ---------- */
  function showResult() {
    var total = run.list.length;
    var right = run.results.filter(function (r) { return r.ok; }).length;
    var pct = right / total;
    var rk = RANKS.find(function (r) { return pct >= r[0]; });
    $('#rLabel').textContent = run.practice ? '錯題重練' : (LESSONS[sel.lesson].no + ' ' + LESSONS[sel.lesson].name + (sel.facet === 'all' ? '' : ' · ' + FACETS[sel.facet]));
    $('#rLabel').textContent = playerLabel() + ' · ' + $('#rLabel').textContent;
    $('#rLabel').textContent += ' · ' + new Date().toLocaleDateString('zh-TW');
    $('#rank').textContent = rk[1];
    $('#rankSub').textContent = rk[2];
    $('#rScore').textContent = run.score;
    $('#rRight').textContent = right + ' / ' + total;
    $('#rCombo').textContent = run.maxCombo;

    var nb = $('#rBest');
    nb.hidden = true;
    if (!run.practice && sel.facet === 'all') {
      var prev = getBest(sel.lesson);
      if (run.score > prev) { setBest(sel.lesson, run.score); nb.hidden = false; }
    }

    var stat = {};
    run.results.forEach(function (r) {
      var f = r.item.q.facet;
      stat[f] = stat[f] || { n: 0, ok: 0 };
      stat[f].n++;
      if (r.ok) stat[f].ok++;
    });
    var bars = $('#bars');
    bars.textContent = '';
    Object.keys(FACETS).forEach(function (f) {
      if (!stat[f]) return;
      var row = el('div', 'bar');
      row.appendChild(el('span', null, f + ' ' + FACETS[f]));
      var tr = el('div', 'track');
      var fill = el('div', 'fill');
      fill.style.width = (stat[f].ok / stat[f].n * 100) + '%';
      tr.appendChild(fill);
      row.appendChild(tr);
      row.appendChild(el('span', 'n', stat[f].ok + '/' + stat[f].n));
      bars.appendChild(row);
    });

    var wrong = run.results.filter(function (r) { return !r.ok; });
    $('#wrongWrap').hidden = wrong.length === 0;
    $('#practice').hidden = wrong.length === 0;
    var wl = $('#wrong');
    wl.textContent = '';
    wrong.forEach(function (r) {
      var q = r.item.q;
      var d = el('details');
      d.appendChild(el('summary', null, q.question));
      var a = el('div', 'ans');
      var mine = r.pick < 0 ? '未作答(時間到)' : r.item.opts[r.pick].t;
      var correct = r.item.opts.find(function (o) { return o.ok; }).t;
      a.appendChild(el('div', 'yours', '你的答案:' + mine));
      a.appendChild(el('div', 'right', '正確答案:' + correct));
      a.appendChild(el('div', null, q.explanation));
      d.appendChild(a);
      wl.appendChild(d);
    });
    run.wrongQs = wrong.map(function (r) { return r.item.q; });
    try {
      var lbl = run.practice ? '錯題重練' : (LESSONS[sel.lesson].no + ' ' + LESSONS[sel.lesson].name + (sel.facet === 'all' ? '' : ' · ' + FACETS[sel.facet]));
      finishRound({ stageId: run.practice ? 'practice' : ('L' + sel.lesson + (sel.facet === 'all' ? '' : '-' + sel.facet)), stageName: lbl,
        score: Math.round(pct * 100), right: right, total: total, stars: pct >= 0.9 ? 3 : pct >= 0.7 ? 2 : pct >= 0.5 ? 1 : 0,
        types: Object.keys(stat).map(function (f) { return { key: f, label: FACETS[f], right: stat[f].ok, total: stat[f].n }; }) });
    } catch (e) {}
    show('result');
  }

  /* ---------- wiring ---------- */
  $('#start').addEventListener('click', function () { startRun(pickQuestions(), false); });
  $('#next').addEventListener('click', next);
  $('#quit').addEventListener('click', function () { if (run) cancelAnimationFrame(run.raf); renderHome(); show('home'); });
  $('#again').addEventListener('click', function () {
    var list = pickQuestions();
    if (run && run.practice) list = run.list.map(function (it) { return it.q; });
    startRun(list, run && run.practice);
  });
  $('#practice').addEventListener('click', function () { startRun(run.wrongQs, true); });
  $('#home2').addEventListener('click', function () { renderHome(); show('home'); });

  /* ---------- player ---------- */
  var player = null;
  function pid() { return player ? player.cls + '-' + player.seat : ''; }
  function playerLabel() { return player ? player.cls + ' ' + player.seat + ' 號' : ''; }

  try {
    var saved = JSON.parse(localStorage.getItem('gw3:player') || 'null');
    if (saved) { $('#cls').value = saved.cls || ''; $('#seat').value = saved.seat || ''; }
  } catch (e) {}

  $('#loginForm').addEventListener('submit', function (e) {
    e.preventDefault();
    var cls = $('#cls').value.trim();
    var seat = parseInt($('#seat').value, 10);
    var err = $('#err');
    if (!cls) { err.textContent = '請輸入班級,例如:高三甲班'; err.hidden = false; $('#cls').focus(); return; }
    if (!(seat >= 1 && seat <= 99)) { err.textContent = '座號請輸入 1 到 99 的數字'; err.hidden = false; $('#seat').focus(); return; }
    err.hidden = true;
    player = { cls: cls, seat: seat };
    try { localStorage.setItem('gw3:player', JSON.stringify(player)); } catch (x) {}
    $('#whoText').textContent = '玩家:' + playerLabel();
    renderHome();
    show('home');
  });
  $('#change').addEventListener('click', function () { show('login'); });

  /* ---------- save as PDF ---------- */
  var opened = [];
  window.addEventListener('beforeprint', function () {
    opened = [];
    document.querySelectorAll('#wrong details').forEach(function (d) { opened.push(d.open); d.open = true; });
  });
  window.addEventListener('afterprint', function () {
    document.querySelectorAll('#wrong details').forEach(function (d, i) { d.open = !!opened[i]; });
  });
  $('#savepdf').addEventListener('click', function () { window.print(); });

  renderHome();
  ensureStudent(function () {});
})();
</script>
<script src="../../home-fab.js"></script>
</html>
