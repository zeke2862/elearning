<script>
/* ========== 接上教師後台的程式（整段複製，只改最上面的 GAME_KEY） ========== */
const GAME_KEY = 'chi-g10-123-3d';            // 遊戲代號：小寫英文／數字／-／_，建議「科目簡碼-遊戲名」

/* 1) 學號：沒有就強迫輸入 */
function ensureStudent(done) {
  const no = keyagentGetActiveStudentNumber();
  if (no) return done(no);
  const v = (prompt('請輸入你的學號') || '').trim();
  if (!/^[A-Za-z0-9_-]{2,12}$/.test(v)) return ensureStudent(done);
  localStorage.setItem('keyagent_active_student', JSON.stringify({ studentNumber: v, verified: false }));
  done(v);
}

/* 2) 練習時間：只算「玩完一局」的時間；切到別的分頁不算；中途關掉的那一局不算 */
let T0 = 0, ACC = 0;
function tStart()  { ACC = 0; T0 = Date.now(); }
function tPause()  { if (T0) { ACC += Date.now() - T0; T0 = 0; } }
function tResume() { if (!T0 && !document.hidden) T0 = Date.now(); }
function tTake()   { tPause(); const s = Math.min(1800, Math.round(ACC / 1000)); ACC = 0; return s; }
document.addEventListener('visibilitychange', () => (document.hidden ? tPause() : tResume()));

/* 3) 一局結束時呼叫 finishRound({...})，會自動記錄並送到老師的後台 */
function finishRound(r) {
  // r = { stageId:'L1', stageName:'第一課 認字', score:80, right:8, total:10, stars:2(可省略), nick:'小勇者'(可省略),
  //       types:[{ key:'read', label:'看字讀音', right:5, total:6 }, ...](可省略) }
  const secs = tTake();
  keyagentUpdateOtherGame(GAME_KEY, prev => {
    const stages = Object.assign({}, prev.stages);
    const s = stages[r.stageId] || {};
    stages[r.stageId] = {
      n: r.stageName || r.stageId,
      bestStars: Math.max(s.bestStars || 0, r.stars || 0),
      bestScore: Math.max(s.bestScore || 0, r.score || 0),
      plays: (s.plays || 0) + 1,
      hist: (s.hist || []).concat([{ at: Date.now(), q: r.total || 0, ok: r.right || 0, s: secs, st: r.stars || 0 }]).slice(-30),   // 每一次的結果（後台點答對率可看）
      totalSecs: (s.totalSecs || 0) + secs,
      totalQ: (s.totalQ || 0) + (r.total || 0),
      totalOk: (s.totalOk || 0) + (r.right || 0)
    };
    const q = Object.assign({}, prev.q);
    (r.types || []).forEach(t => {
      const k = r.stageId + ':' + t.key, o = q[k] || { n: 0, ok: 0 };
      q[k] = { n: o.n + (t.total || 0), ok: o.ok + (t.right || 0), label: t.label || t.key };
    });
    return {
      nick: r.nick || prev.nick || '',
      totalPlays: (prev.totalPlays || 0) + 1,
      bestScore: Math.max(prev.bestScore || 0, r.score || 0),
      totalSecs: (prev.totalSecs || 0) + secs,
      totalQ: (prev.totalQ || 0) + (r.total || 0),
      totalOk: (prev.totalOk || 0) + (r.right || 0),
      lastScore: r.score || 0, lastId: r.stageId, lastName: r.stageName || r.stageId, lastAt: Date.now(),
      stages, q
    };
  });
}
keyagentInstallPageHideSync();           // 4) 離開頁面時補寄一次
/* ========== 以上整段不用改 ========== */
</script>

 const t=new THREE.Group();t.add(mesh(new THREE.CylinderGeometry(.22,.28,1.2,8),0x9b6b43,0,.6,0));t.add(mesh(new THREE.ConeGeometry(1.1,2.4,8),c,0,2.2,0));t.add(mesh(new THREE.ConeGeometry(.8,1.8,8),c,0,3.3,0));

 gems.forEach((g,i)=>{if(!g.visible)return;if(g.pop<1){g.pop=Math.min(1,g.pop+dt*2.2);const u=g.pop-1;g.scale.setScalar(Math.max(.01,1+2.70158*u*u*u+1.70158*u*u))}
  g.cr.rotation.y+=dt*1.6;g.cr.position.y=1.3+Math.sin(T*2.2+i)*.2;if(lock&&opts[i]&&opts[i].ok)g.cr.scale.setScalar(1+.25*Math.sin(T*12))});
 let mx=0,mz=0;
 if(state=='play'&&!lock){mx=(keys.arrowright||keys.d?1:0)-(keys.arrowleft||keys.a?1:0);mz=(keys.arrowdown||keys.s?1:0)-(keys.arrowup||keys.w?1:0);if(js){mx+=js.dx;mz+=js.dy}}
 const len=Math.hypot(mx,mz);

  let d=Math.atan2(mx,mz)-P.rotation.y;d=Math.atan2(Math.sin(d),Math.cos(d));P.rotation.y+=d*Math.min(1,dt*12);body.position.y=Math.abs(Math.sin(T*13))*.18;body.rotation.z=Math.sin(T*13)*.08}
 else{body.position.y=Math.sin(T*3)*.03;if(!anim)body.rotation.z*=.8}
 if(state=='play'&&!lock)gems.forEach((g,i)=>{if(g.visible&&g.pop>=1&&Math.hypot(g.position.x-P.position.x,g.position.z-P.position.z)<1.3&&!lock)pick(i)});
 if(anim){anim.t+=dt;if(anim.k=='jump'){const u=Math.min(anim.t/.8,1);P.position.y=Math.sin(u*Math.PI)*1.6;body.rotation.y=u*Math.PI*2;if(u>=1){anim=null;P.position.y=0;body.rotation.y=0}}
  else{body.rotation.z=Math.sin(anim.t*20)*.3;body.rotation.y+=dt*10;if(anim.t>1){anim=null;body.rotation.y=0;body.rotation.z=0}}}
 for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.l-=dt;p.vy-=12*dt;p.m.position.x+=p.vx*dt;p.m.position.y+=p.vy*dt;p.m.position.z+=p.vz*dt;if(p.l<=0){sc.remove(p.m);p.m.material.dispose();parts.splice(i,1)}}
 const ar=cam.aspect,kk=ar<1?Math.min(1.9,.75/ar):1;let tp;
 if(state=='play')tp=new THREE.Vector3(P.position.x*.8,8*kk,P.position.z*.8+10.5*kk);else tp=new THREE.Vector3(Math.sin(T*.2)*17*kk,8.5*kk,Math.cos(T*.2)*17*kk);
 camPos.lerp(tp,1-Math.pow(.002,dt));cam.position.copy(camPos);look.set(state=='play'?P.position.x*.8:0,1,state=='play'?P.position.z*.8:0);cam.lookAt(look);
