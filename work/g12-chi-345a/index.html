/* ========== 接上教師後台的程式（整段複製，只改最上面的 GAME_KEY） ========== */
const GAME_KEY = 'chi-g12-345a';            // 遊戲代號：小寫英文／數字／-／_，建議「科目簡碼-遊戲名」

/* 1) 學號：沒有就強迫輸入 */
function ensureStudent(done) {
  const no = keyagentGetActiveStudentNumber();
  if (no) return done(no);
  const v = (prompt('請輸入你的學號') || '').trim();
  if (!/^[A-Za-z0-9_-]{2,12}$/.test(v)) return ensureStudent(done);
  localStorage.setItem('keyagent_active_student', JSON.stringify({ studentNumber: v, verified: false }));
  done(v);
}

/* 2) 練習時間：只算「玩完一局」的時間；切到別的分頁不算；中途關掉的那一局不算 */
let T0 = 0, ACC = 0;
function tStart()  { ACC = 0; T0 = Date.now(); }
function tPause()  { if (T0) { ACC += Date.now() - T0; T0 = 0; } }
function tResume() { if (!T0 && !document.hidden) T0 = Date.now(); }
function tTake()   { tPause(); const s = Math.min(1800, Math.round(ACC / 1000)); ACC = 0; return s; }
document.addEventListener('visibilitychange', () => (document.hidden ? tPause() : tResume()));

/* 3) 一局結束時呼叫 finishRound({...})，會自動記錄並送到老師的後台 */
function finishRound(r) {
  // r = { stageId:'L1', stageName:'第一課 認字', score:80, right:8, total:10, stars:2(可省略), nick:'小勇者'(可省略),
  //       types:[{ key:'read', label:'看字讀音', right:5, total:6 }, ...](可省略) }
  const secs = tTake();
  keyagentUpdateOtherGame(GAME_KEY, prev => {
    const stages = Object.assign({}, prev.stages);
    const s = stages[r.stageId] || {};
    stages[r.stageId] = {
      n: r.stageName || r.stageId,
      bestStars: Math.max(s.bestStars || 0, r.stars || 0),
      bestScore: Math.max(s.bestScore || 0, r.score || 0),
      plays: (s.plays || 0) + 1,
      hist: (s.hist || []).concat([{ at: Date.now(), q: r.total || 0, ok: r.right || 0, s: secs, st: r.stars || 0 }]).slice(-30),   // 每一次的結果（後台點答對率可看）
      totalSecs: (s.totalSecs || 0) + secs,
      totalQ: (s.totalQ || 0) + (r.total || 0),
      totalOk: (s.totalOk || 0) + (r.right || 0)
    };
    const q = Object.assign({}, prev.q);
    (r.types || []).forEach(t => {
      const k = r.stageId + ':' + t.key, o = q[k] || { n: 0, ok: 0 };
      q[k] = { n: o.n + (t.total || 0), ok: o.ok + (t.right || 0), label: t.label || t.key };
    });
    return {
      nick: r.nick || prev.nick || '',
      totalPlays: (prev.totalPlays || 0) + 1,
      bestScore: Math.max(prev.bestScore || 0, r.score || 0),
      totalSecs: (prev.totalSecs || 0) + secs,
      totalQ: (prev.totalQ || 0) + (r.total || 0),
      totalOk: (prev.totalOk || 0) + (r.right || 0),
      lastScore: r.score || 0, lastId: r.stageId, lastName: r.stageName || r.stageId, lastAt: Date.now(),
      stages, q
    };
  });
}
keyagentInstallPageHideSync();           // 4) 離開頁面時補寄一次
/* ========== 以上整段不用改 ========== */
</script>

function map(){const bl=Object.keys(S.done).filter(k=>k!=="b").length<4;
let h='<path d="M0 270 Q90 250 180 270 T360 270" fill="none" stroke="#ffffff55" stroke-width="3"/>';
[...I.map((o,i)=>[o,i]),[B,"b"]].forEach(([o,i])=>{const lock=i==="b"&&bl;h+=`<g class="isl" onclick="go('${i}')" opacity="${lock?.55:1}"><ellipse class="land" cx="${o.x}" cy="${o.y+8}" rx="${i==="b"?52:46}" ry="${i==="b"?36:32}" fill="${o.c}" stroke="#fff" stroke-width="3"/><text x="${o.x}" y="${o.y+4}" style="font-size:26px">${lock?"🔒":S.done[i]?"✅":o.e}</text><text x="${o.x}" y="${o.y+30}">${o.n}</text></g>`});
$("map").innerHTML=h}
function go(i){if(!S.lv){lvPick();return}const o=i==="b"?B:I[i];
if(i==="b"&&Object.keys(S.done).filter(k=>k!=="b").length<4){$("box").innerHTML='<b>🔒 中央島尚未開放</b><p class="note">集滿 4 枚島章,才能挑戰最終 Boss。</p>';return}
S.cur=i;S.qi=0;S.hit=0;tStart();
$("box").innerHTML=`<b>${o.e} ${o.n}</b><p class="npc">🧑‍🏫 ${o.npc}:「旅人,${o.t}」</p><button class="main" onclick="ask()">開始挑戰</button>`}
function ask(){const o=S.cur==="b"?B:I[S.cur],q=gq()[S.qi];
const op=sh(q[1].map((t,k)=>({t,k})));
$("box").innerHTML=`<p class="note">${o.n}・第 ${S.qi+1}/3 題</p><b>${q[0]}</b>`+op.map((p,j)=>`<button data-k="${p.k}" onclick="pick(this)">${p.t}</button>`).join("")}
function pick(b){const o=S.cur==="b"?B:I[S.cur],q=gq()[S.qi],ok=b.dataset.k==="0";
document.querySelectorAll("#box button").forEach(x=>{x.disabled=true;if(x.dataset.k==="0")x.classList.add("ok")});
if(!ok)b.classList.add("no");else{S.hit++;S.xp+=XP[S.lv]}
hud();
const last=S.qi===2;
$("box").insertAdjacentHTML("beforeend",`<p>${ok?"✅ 答對,+${XP[S.lv]} EXP!":"❌ 再接再厲。"} ${q[2]}</p><button class="main" onclick="${last?"fin()":"S.qi++;ask()"}">${last?"看結果":"下一題"}</button>`)}
function fin(){const o=S.cur==="b"?B:I[S.cur],need=S.cur==="b"?3:2;
try{finishRound({stageId:"I"+S.cur+"-"+S.lv,stageName:o.n+"・"+LN[S.lv],score:Math.round(S.hit/3*100),right:S.hit,total:3,stars:S.hit>=3?3:S.hit>=need?2:S.hit>0?1:0,types:[{key:"q"+S.lv,label:"難度"+LN[S.lv],right:S.hit,total:3}]})}catch(e){}
S.sc[S.cur]=Math.max(S.sc[S.cur]||0,S.hit);
if(S.hit>=need){S.done[S.cur]=1;S.xp+=S.cur==="b"?60:30}
hud();map();
if(S.hit>=need&&S.cur==="b"){cert();return}
$("box").innerHTML=S.hit>=need?`<b>🎉 取得「${o.n}」島章!</b><p>答對 ${S.hit}/3 題,額外 +30 EXP。</p>`+(Object.keys(S.done).filter(k=>k!=="b").length===4?'<p>🌟 四枚島章集齊,中央島已開放!</p>':'<p class="note">點地圖上其他島嶼繼續冒險。</p>'):`<b>😢 答對 ${S.hit}/3 題,差一點!</b><p class="note">再點一次這座島重新挑戰。</p>`}
function cert(){const t=Object.values(S.sc).reduce((a,b)=>a+b,0);
$("box").innerHTML=`<div class="cert"><h2>🏆 冒險證書</h2><p>茲證明</p><input id="nm" placeholder="輸入你的名字" oninput="$('nn').textContent=this.value||'冒險者'"><h3 id="nn">冒險者</h3><p>完成「國文群島冒險」【${LN[S.lv]}】<br>等級 Lv.${Math.floor(S.xp/60)+1}・EXP ${S.xp}・總答對 ${t}/15 題</p><p>${t>=14?"稱號:🏆 筆下人生大師":t>=11?"稱號:🌙 燈下削筆人":"稱號:🕸️ 蜘蛛絲攀登者"}</p></div><button class="main" onclick="location.reload()">再玩一次</button>`}
ensureStudent(function(){hud();map();lvPick()});
</script>
<script src="../../home-fab.js"></script></body></html>
