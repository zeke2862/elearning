<script>
/* ========== 接上教師後台的程式（整段複製，只改最上面的 GAME_KEY） ========== */
const GAME_KEY = 'math-g9-ch1';            // 遊戲代號：小寫英文／數字／-／_，建議「科目簡碼-遊戲名」

/* 1) 學號：沒有就強迫輸入 */
function ensureStudent(done) {
  const no = keyagentGetActiveStudentNumber();
  if (no) return done(no);
  const v = (prompt('請輸入你的學號') || '').trim();
  if (!/^[A-Za-z0-9_-]{2,12}$/.test(v)) return ensureStudent(done);
  localStorage.setItem('keyagent_active_student', JSON.stringify({ studentNumber: v, verified: false }));
  done(v);
}

/* 2) 練習時間：只算「玩完一局」的時間；切到別的分頁不算；中途關掉的那一局不算 */
let T0 = 0, ACC = 0;
function tStart()  { ACC = 0; T0 = Date.now(); }
function tPause()  { if (T0) { ACC += Date.now() - T0; T0 = 0; } }
function tResume() { if (!T0 && !document.hidden) T0 = Date.now(); }
function tTake()   { tPause(); const s = Math.min(1800, Math.round(ACC / 1000)); ACC = 0; return s; }
document.addEventListener('visibilitychange', () => (document.hidden ? tPause() : tResume()));

/* 3) 一局結束時呼叫 finishRound({...})，會自動記錄並送到老師的後台 */
function finishRound(r) {
  // r = { stageId:'L1', stageName:'第一課 認字', score:80, right:8, total:10, stars:2(可省略), nick:'小勇者'(可省略),
  //       types:[{ key:'read', label:'看字讀音', right:5, total:6 }, ...](可省略) }
  const secs = tTake();
  keyagentUpdateOtherGame(GAME_KEY, prev => {
    const stages = Object.assign({}, prev.stages);
    const s = stages[r.stageId] || {};
    stages[r.stageId] = {
      n: r.stageName || r.stageId,
      bestStars: Math.max(s.bestStars || 0, r.stars || 0),
      bestScore: Math.max(s.bestScore || 0, r.score || 0),
      plays: (s.plays || 0) + 1,
      hist: (s.hist || []).concat([{ at: Date.now(), q: r.total || 0, ok: r.right || 0, s: secs, st: r.stars || 0 }]).slice(-30),   // 每一次的結果（後台點答對率可看）
      totalSecs: (s.totalSecs || 0) + secs,
      totalQ: (s.totalQ || 0) + (r.total || 0),
      totalOk: (s.totalOk || 0) + (r.right || 0)
    };
    const q = Object.assign({}, prev.q);
    (r.types || []).forEach(t => {
      const k = r.stageId + ':' + t.key, o = q[k] || { n: 0, ok: 0 };
      q[k] = { n: o.n + (t.total || 0), ok: o.ok + (t.right || 0), label: t.label || t.key };
    });
    return {
      nick: r.nick || prev.nick || '',
      totalPlays: (prev.totalPlays || 0) + 1,
      bestScore: Math.max(prev.bestScore || 0, r.score || 0),
      totalSecs: (prev.totalSecs || 0) + secs,
      totalQ: (prev.totalQ || 0) + (r.total || 0),
      totalOk: (prev.totalOk || 0) + (r.right || 0),
      lastScore: r.score || 0, lastId: r.stageId, lastName: r.stageName || r.stageId, lastAt: Date.now(),
      stages, q
    };
  });
}
keyagentInstallPageHideSync();           // 4) 離開頁面時補寄一次
/* ========== 以上整段不用改 ========== */
</script>
<script>
const L=[
["第一章　二次函數的意義","森林村莊","惡龍抓走了公主！勇者要先穿過森林村莊。村長說：想過關，先認得什麼是二次函數。","👾 史萊姆王"],
["第二章　y = ax² + k 的圖形","幽暗山洞","山洞的牆上畫著拋物線。看懂開口、頂點和對稱軸，才找得到出口。","🗿 石像怪"],
["第三章　頂點與最大、最小值","龍之城堡","公主就在城堡塔頂！最後的門只有真正的高手才打得開。","🐉 惡龍"]];
// [題目, 選項(第一個是正確答案), 解析]
const Q=[
["二次函數的形式是 y = ax² + bx + c，其中 a ≠ 0。下列哪一個是二次函數？",["y = x² + 3","y = 2x + 1","y = 5","y = x³"],"二次函數中，x 的最高次方必須是 2。y = 2x + 1 最高次是 1，y = 5 沒有 x，y = x³ 最高次是 3。只有 y = x² + 3 最高次是 2，所以選 y = x² + 3。"],
["正方形的邊長是 x，面積是 y。y 和 x 的關係式是什麼？",["y = x²","y = 4x","y = 2x","y = x + x"],"正方形面積 ＝ 邊長 × 邊長 ＝ x × x ＝ x²。所以 y = x²，是二次函數。注意 4x 是周長，不是面積。"],
["y = 3 − 2x² 是二次函數嗎？",["是，因為整理成 y = −2x² + 3，a = −2 ≠ 0","不是，因為有負號","不是，因為沒有 x 的一次項","不是，因為常數項在前面"],"先把順序整理成 y = −2x² + 3。這裡 a = −2，不等於 0，而且最高次是 2，所以是二次函數。負號沒關係，沒有一次項（b = 0）也可以。"],
["y = (x − 2)(1 − 3x) 展開後，x² 的係數是多少？",["−3","3","1","−1"],"展開：(x − 2)(1 − 3x) ＝ x − 3x² − 2 + 6x ＝ −3x² + 7x − 2。x² 的係數是 −3，不等於 0，所以它是二次函數。"],
["下列哪些是二次函數？(A) y = −x² + 3x + 4　(B) y = 3 − 2x²　(C) y = 3x + 7　(D) y = 7 + 11x³",["(A)(B)","只有 (A)","(A)(B)(C)","(B)(D)"],"逐一檢查 x 的最高次方：(A) 是 2 次，(B) 是 2 次，(C) 是 1 次，(D) 是 3 次。所以只有 (A)(B) 是二次函數。"],
["若 y = (a − 1)x² + 2x 是二次函數，則 a 不可以是多少？",["1","0","2","3"],"二次函數要求 x² 的係數不能是 0，也就是 a − 1 ≠ 0，所以 a ≠ 1。當 a = 1 時，函數變成 y = 2x，只是一次函數。"],
["y = x² 的圖形是一條拋物線，開口向哪裡？",["向上","向下","向左","向右"],"看 x² 前面的數 a。y = x² 的 a = 1，大於 0，所以開口向上。口訣：a > 0 向上，a < 0 向下。"],
["下列哪一個函數的圖形開口向下？",["y = −3x² + 1","y = 2x²","y = x² − 5","y = 0.5x²"],"開口方向只看 x² 的係數 a。a < 0 才向下。四個選項中只有 y = −3x² + 1 的 a = −3 是負的。"],
["y = x² + 3 的頂點坐標是什麼？",["(0, 3)","(3, 0)","(0, −3)","(−3, 0)"],"y = ax² + k 的頂點是 (0, k)。這題 k = 3，所以頂點是 (0, 3)。x 坐標永遠是 0，y 坐標就是後面加的數。"],
["y = −2x² − 4 的對稱軸是哪一條直線？",["x = 0（y 軸）","y = 0","x = −4","y = −4"],"y = ax² + k 的圖形左右對稱，對稱軸一定是 y 軸，也就是直線 x = 0。−4 只是讓圖形上下平移，不會改變對稱軸。"],
["y = x² + 3 的圖形，是把 y = x² 怎麼平移得到的？",["向上平移 3","向下平移 3","向右平移 3","向左平移 3"],"y = x² + k：k > 0 向上平移 k，k < 0 向下平移。這題 k = 3，所以向上平移 3。"],
["y = −x² + 5 有最大值還是最小值？是多少？",["最大值 5","最小值 5","最大值 −5","最小值 −5"],"a = −1 < 0，開口向下，頂點 (0, 5) 是最高的點，所以有最大值，就是頂點的 y 坐標 5。"],
["y = 2(x − 3)² + 1 的頂點坐標是什麼？",["(3, 1)","(−3, 1)","(3, −1)","(−3, −1)"],"y = a(x − h)² + k 的頂點是 (h, k)。括號裡是 x − 3，所以 h = 3（不是 −3）；後面 + 1，所以 k = 1。頂點是 (3, 1)。"],
["y = −(x + 2)² + 5 的頂點與開口方向是什麼？",["頂點 (−2, 5)，開口向下","頂點 (2, 5)，開口向下","頂點 (−2, 5)，開口向上","頂點 (2, −5)，開口向上"],"x + 2 ＝ x − (−2)，所以 h = −2；k = 5，頂點是 (−2, 5)。a = −1 < 0，所以開口向下。"],
["用配方法把 y = x² − 6x + 5 改寫，結果是？",["y = (x − 3)² − 4","y = (x + 3)² − 4","y = (x − 3)² + 4","y = (x − 6)² + 5"],"x² − 6x ＝ (x − 3)² − 9（一次項係數 −6 的一半是 −3，平方得 9，要補上再減掉）。所以 y = (x − 3)² − 9 + 5 ＝ (x − 3)² − 4。"],
["承上題，y = x² − 6x + 5 的最小值是多少？",["−4","4","3","−9"],"y = (x − 3)² − 4，a = 1 > 0 開口向上，頂點 (3, −4) 最低，所以最小值是 −4。因為 (x − 3)² 最小是 0。"],
["用 20 公尺的籬笆圍一個長方形，一邊長 x 公尺，面積 y 平方公尺。y 的最大值是多少？",["25","50","100","20"],"周長 20，所以另一邊是 10 − x。y = x(10 − x) ＝ −x² + 10x ＝ −(x − 5)² + 25。當 x = 5 時，y 有最大值 25。"],
["拋物線 y = ax² + k 通過 (0, −1) 和 (2, 7)，求 a + k 的值。",["1","3","2","−1"],"代入 (0, −1)：−1 = 0 + k，所以 k = −1。代入 (2, 7)：7 = 4a − 1，所以 a = 2。a + k ＝ 2 + (−1) ＝ 1。"]];
const MAPS=[
["###########","#P..#....c#","#...#.1...#","#.2....#..#","#..#.c.#3.#","#......#..#","#.4.#..5.BD","#..c#.....#","###########"],
["###########","#P.#..c...#","#..#.#.##.#","#.1..#2#..#","###.##.#.3#","#c..4..#..#","#.####.##.#","#...5c...BD","###########"],
["###########","#P.#..c...#","#..#.##.#2#","#.1....#..#","#.##.#.#.##","#c.#.#.5..#","#..4.#.##.#","#.......3BD","###########"]];
const FL=["#8fbf6f","#9a97a6","#7a6498"],WG=["🌲","🪨","🧱"],MG=["🐛","🦇","💀"],BG=["👾","🗿","🐉"];
const T=32,CW=11,CH=9;
let me={},lv=0,sc=[0,0,0],ph='reg',P,E,G,cur=null,pick=-1,O=[],db=null,ms='',msg='',rt;
const $=id=>document.getElementById(id),esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const tot=()=>sc[0]+sc[1]+sc[2];
(async()=>{try{db=await claude.use("db")}catch(e){}})();
function load(l){G=MAPS[l];E=[];msg='';G.forEach((r,y)=>[...r].forEach((ch,x)=>{
 if(ch=='P')P={x,y};
 else if(ch=='c')E.push({x,y,t:'c'});
 else if(ch>='1'&&ch<='5')E.push({x,y,t:'m',q:l*6+(+ch)-1});
 else if(ch=='B')E.push({x,y,t:'b',q:l*6+5});
 else if(ch=='D')E.push({x,y,t:'d'});
}))}
function recs(){try{return JSON.parse(localStorage.getItem('mq')||'{}')}catch(e){return{}}}
async function save(){
  const r={name:me.n,cls:me.c,id:me.id,s:sc.slice(),t:tot(),at:Date.now()};
  try{const a=recs();a[r.id]=r;localStorage.setItem('mq',JSON.stringify(a))}catch(e){}
  try{if(db)await db.doc("results/"+r.id.replace(/[^\w-]/g,'_')).set(r)}catch(e){}
}
function start(){
  const n=$('n').value.trim(),c=$('c').value.trim(),d=$('d').value.trim();
  if(!n||!c||!d){$('e').textContent='請把姓名、班級、座號／學號都填好';return}
  me={n,c,id:d};lv=0;sc=[0,0,0];RC=[[0,0],[0,0],[0,0]];
  try{if(/^[A-Za-z0-9_-]{2,12}$/.test(d))localStorage.setItem('keyagent_active_student',JSON.stringify({studentNumber:d,verified:false}))}catch(e){}
  tStart();load(0);ph='intro';render();
}
function ask(e){rel();cur=e;pick=-1;O=[0,1,2,3].sort(()=>Math.random()-.5);ph='quiz';render()}
let RC=[[0,0],[0,0],[0,0]];
function ans(k){pick=k;RC[lv][1]++;if(k==0){sc[lv]+=10;RC[lv][0]++}ph='fb';save();render()}
function back(){
  E.splice(E.indexOf(cur),1);msg=cur.t=='b'?'🚪 BOSS 倒下了！門打開了':'';cur=null;ph='map';render();
}
function clear(){rel();
  try{const t=RC[lv][1],r=RC[lv][0];finishRound({stageId:'C'+(lv+1),stageName:L[lv][0].replace(/\s+/g,' '),score:t?Math.round(r/t*100):0,right:r,total:t,stars:t&&r/t>=.9?3:t&&r/t>=.7?2:1,types:[{key:'q',label:L[lv][1],right:r,total:t}]});tStart()}catch(e){}
  if(lv<2){lv++;load(lv);ph='intro'}else ph='end';save();render()}
function mv(dx,dy){
  if(ph!='map')return;
  const x=P.x+dx,y=P.y+dy;
  if(G[y][x]=='#')return;
  const e=E.find(e=>e.x==x&&e.y==y);msg='';
  if(e&&e.t!='c'){
    if(e.t=='m')return ask(e);
    if(e.t=='b'){if(E.some(k=>k.t=='m')){msg='⚔️ 先打敗所有小怪，才能挑戰 BOSS';draw();return}return ask(e)}
    if(E.some(k=>k.t=='b')){msg='🔒 守門的 BOSS 還在';draw();return}
    return clear();
  }
  if(e){sc[lv]+=5;E.splice(E.indexOf(e),1);msg='⭐ 拿到星星 +5 分';save()}
  P.x=x;P.y=y;draw();
}
function hold(dx,dy){mv(dx,dy);clearInterval(rt);rt=setInterval(()=>mv(dx,dy),170)}
function rel(){clearInterval(rt)}
document.addEventListener('keydown',ev=>{
  const m={ArrowUp:[0,-1],w:[0,-1],ArrowDown:[0,1],s:[0,1],ArrowLeft:[-1,0],a:[-1,0],ArrowRight:[1,0],d:[1,0]}[ev.key];
  if(m&&ph=='map'){ev.preventDefault();mv(m[0],m[1])}
});
function draw(){
  const cv=$('cv');if(!cv)return;const c=cv.getContext('2d');
  c.fillStyle=FL[lv];c.fillRect(0,0,CW*T,CH*T);
  c.textAlign='center';c.textBaseline='middle';c.font=(T*.78)+'px serif';
  G.forEach((r,y)=>[...r].forEach((ch,x)=>{if(ch=='#')c.fillText(WG[lv],x*T+T/2,y*T+T/2+1)}));
  E.forEach(e=>c.fillText(e.t=='c'?'⭐':e.t=='m'?MG[lv]:e.t=='b'?BG[lv]:(lv==2?'👸':'🚪'),e.x*T+T/2,e.y*T+T/2+1));
  c.fillText('🧙',P.x*T+T/2,P.y*T+T/2+1);
  $('hud').innerHTML=`<span>${esc(me.n)}</span><span>得分 ${tot()}</span><span>小怪剩 ${E.filter(k=>k.t=='m').length}</span><span>BOSS ${E.some(k=>k.t=='b')?'🔒':'✅'}</span>`;

}
async function summary(){
  let a=recs();
  try{if(db){const s=await db.collection("results").get();s.docs.forEach(d=>{const v=d.data();if(v&&v.id)a[v.id]=v})}}catch(e){}
  const rows=Object.values(a).sort((x,y)=>(x.cls+x.id).localeCompare(y.cls+y.id,'zh'));
  ms=`<div class="card"><h2>成績總表</h2><p class="tag">每題 10 分，每顆星星 5 分</p><div class="wrap"><table><tr><th>班級</th><th>學號</th><th>姓名</th><th>第1章</th><th>第2章</th><th>第3章</th><th>總分</th></tr>${rows.map(r=>`<tr><td>${esc(r.cls)}</td><td>${esc(r.id)}</td><td>${esc(r.name)}</td><td>${r.s[0]}</td><td>${r.s[1]}</td><td>${r.s[2]}</td><td><b>${r.t}</b></td></tr>`).join('')||'<tr><td colspan="7">還沒有紀錄</td></tr>'}</table></div><button class="go" onclick="ph=me.id?'end':'reg';render()">返回</button></div>`;
  ph='sum';render();
}
function render(){
  $('map').innerHTML=[0,1,2].map(k=>`<span class="${k<=lv&&ph!='reg'||ph=='end'?'on':''}">${['🌲','🕳️','🏰'][k]}</span>${k<2?`<i class="${k<lv||ph=='end'?'on':''}"></i>`:''}`).join('')+`<i class="${ph=='end'?'on':''}"></i><span class="${ph=='end'?'on':''}">👸</span>`;
  if(ph=='sum'){$('app').innerHTML=ms;return}
  let h='';const q=cur?Q[cur.q]:null,l=L[lv];
  if(ph=='reg'){
    h=`<div class="card"><h2>出發前請先報到</h2><p class="big">惡龍抓走了公主！你是勇者，要走過三個地方，打倒怪物、收集星星，把公主救出來。</p><label>姓名</label><input id="n" autocomplete="name"><label>班級</label><input id="c"><label>座號／學號</label><input id="d"><p id="e" style="color:var(--red);margin:6px 0 0"></p><button class="go" onclick="start()">開始冒險</button><button class="go sec" onclick="summary()">查看成績</button></div>`;
  }else if(ph=='intro'){
    h=`<div class="card"><p class="tag">${l[1]}</p><h2>${l[0]}</h2><p class="big">${l[2]}</p><p>🧙 用方向鍵或下方按鈕走路。碰到怪物就要回答問題，答錯也會教你怎麼算。打倒所有小怪，才能挑戰 ${l[3]}，打倒後門才會打開。⭐ 每顆 5 分。</p><button class="go" onclick="ph='map';render()">進入${l[1]}</button></div>`;
  }else if(ph=='map'){
    h=`<div class="bar" id="hud"></div><canvas id="cv" width="${CW*T}" height="${CH*T}"></canvas><p class="fb" id="ms" style="margin:8px 0"></p><div class="pad"><button class="dp u" onpointerdown="hold(0,-1)" onpointerup="rel()" onpointerleave="rel()" onpointercancel="rel()" aria-label="上">⬆️</button><button class="dp l" onpointerdown="hold(-1,0)" onpointerup="rel()" onpointerleave="rel()" onpointercancel="rel()" aria-label="左">⬅️</button><button class="dp d" onpointerdown="hold(0,1)" onpointerup="rel()" onpointerleave="rel()" onpointercancel="rel()" aria-label="下">⬇️</button><button class="dp r" onpointerdown="hold(1,0)" onpointerup="rel()" onpointerleave="rel()" onpointercancel="rel()" aria-label="右">➡️</button></div>`;
  }else if(ph=='quiz'||ph=='fb'){
    const f=ph=='fb';
    h=`<div class="card"><p class="tag">${l[1]}・${cur.t=='b'?'BOSS 戰':'小怪'}</p><p class="big">${q[0]}</p>`+O.map(k=>`<button class="opt ${f&&k==0?'ok':''} ${f&&pick==k&&k!=0?'bad':''}" ${f?'disabled':''} onclick="ans(${k})">${q[1][k]}</button>`).join('');
    if(f)h+=(pick==0?`<div class="fb"><b>✅ 答對了！+10 分</b>${q[2]}</div>`:`<div class="fb no"><b>❌ 正確答案：${q[1][0]}</b>${q[2]}</div>`)+`<button class="go" onclick="back()">繼續冒險</button>`;
    h+=`</div>`;
  }else{
    h=`<div class="card"><h2>🎉 公主得救了！</h2><p class="big">${esc(me.n)} 打敗惡龍，總分 ${tot()}</p><p>第一章 ${sc[0]}　第二章 ${sc[1]}　第三章 ${sc[2]}</p><p>${tot()>=170?'你是二次函數大師！':tot()>=110?'很不錯，再看看答錯的題目就更強了。':'已經完成冒險，再玩一次，分數一定會更高！'}</p><button class="go" onclick="summary()">查看成績總表</button><button class="go sec" onclick="lv=0;sc=[0,0,0];load(0);ph='intro';render()">再玩一次</button></div>`;
  }
  $('app').innerHTML=h;if(ph=='map')draw();
}
render();
</script>
<script src="../../home-fab.js"></script>
</body>
</html>
