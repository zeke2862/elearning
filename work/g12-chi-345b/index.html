const GAME_KEY = 'chi-g12-345b';            // 遊戲代號：小寫英文／數字／-／_，建議「科目簡碼-遊戲名」

/* 1) 學號：沒有就強迫輸入 */
function ensureStudent(done) {
  const no = keyagentGetActiveStudentNumber();
  if (no) return done(no);
  const v = (prompt('請輸入你的學號') || '').trim();
  if (!/^[A-Za-z0-9_-]{2,12}$/.test(v)) return ensureStudent(done);
  localStorage.setItem('keyagent_active_student', JSON.stringify({ studentNumber: v, verified: false }));
  done(v);
}

/* 2) 練習時間：只算「玩完一局」的時間；切到別的分頁不算；中途關掉的那一局不算 */
let T0 = 0, ACC = 0;
function tStart()  { ACC = 0; T0 = Date.now(); }
function tPause()  { if (T0) { ACC += Date.now() - T0; T0 = 0; } }
function tResume() { if (!T0 && !document.hidden) T0 = Date.now(); }
function tTake()   { tPause(); const s = Math.min(1800, Math.round(ACC / 1000)); ACC = 0; return s; }
document.addEventListener('visibilitychange', () => (document.hidden ? tPause() : tResume()));

/* 3) 一局結束時呼叫 finishRound({...})，會自動記錄並送到老師的後台 */
function finishRound(r) {
  // r = { stageId:'L1', stageName:'第一課 認字', score:80, right:8, total:10, stars:2(可省略), nick:'小勇者'(可省略),
  //       types:[{ key:'read', label:'看字讀音', right:5, total:6 }, ...](可省略) }
  const secs = tTake();
  keyagentUpdateOtherGame(GAME_KEY, prev => {
    const stages = Object.assign({}, prev.stages);
    const s = stages[r.stageId] || {};
    stages[r.stageId] = {
      n: r.stageName || r.stageId,
      bestStars: Math.max(s.bestStars || 0, r.stars || 0),
      bestScore: Math.max(s.bestScore || 0, r.score || 0),
      plays: (s.plays || 0) + 1,
      hist: (s.hist || []).concat([{ at: Date.now(), q: r.total || 0, ok: r.right || 0, s: secs, st: r.stars || 0 }]).slice(-30),   // 每一次的結果（後台點答對率可看）
      totalSecs: (s.totalSecs || 0) + secs,
      totalQ: (s.totalQ || 0) + (r.total || 0),
      totalOk: (s.totalOk || 0) + (r.right || 0)
    };
    const q = Object.assign({}, prev.q);
    (r.types || []).forEach(t => {
      const k = r.stageId + ':' + t.key, o = q[k] || { n: 0, ok: 0 };
      q[k] = { n: o.n + (t.total || 0), ok: o.ok + (t.right || 0), label: t.label || t.key };
    });
    return {
      nick: r.nick || prev.nick || '',
      totalPlays: (prev.totalPlays || 0) + 1,
      bestScore: Math.max(prev.bestScore || 0, r.score || 0),
      totalSecs: (prev.totalSecs || 0) + secs,
      totalQ: (prev.totalQ || 0) + (r.total || 0),
      totalOk: (prev.totalOk || 0) + (r.right || 0),
      lastScore: r.score || 0, lastId: r.stageId, lastName: r.stageName || r.stageId, lastAt: Date.now(),
      stages, q
    };
  });
}
keyagentInstallPageHideSync();           // 4) 離開頁面時補寄一次

cd();clock();G.tick=setInterval(()=>{G.t--;clock();if(G.t<=0)lose()},1000);hall()}
function hall(){const n=G.got.filter(Boolean).length;
$("box").innerHTML='<div class="grid">'+RN.map((r,i)=>`<button class="room" ${G.got[i]?"disabled":""} onclick="enter(${i})"><b>${G.got[i]?"✅":r[0]}</b>${r[1]}</button>`).join("")+'</div>'+(n===4?'<button class="main" style="margin-top:12px" onclick="door()">🚪 前往出口大門</button>':'<p class="note">已取得 '+n+'/4 位密碼。選一個房間進入。</p>')}
function enter(i){G.room=i;G.qi=0;G.hint=0;$("box").innerHTML=`<div class="card"><b>${RN[i][0]} ${RN[i][1]}</b><p class="note">${RN[i][2]}</p><button class="main" onclick="ask()">開始解謎</button></div>`}
function Q(){return(G.lv==="e"?I[G.room].q:(G.lv==="m"?M:H)[G.room])[G.qi]}
function ask(){if(G.over)return;const q=Q();G.hint=0;
$("box").innerHTML=`<div class="card"><p class="note">${RN[G.room][1]}・第 ${G.qi+1}/3 題</p><b>${q[0]}</b><div id="op">`+sh(q[1].map((t,k)=>({t,k}))).map(p=>`<button data-k="${p.k}" onclick="pick(this)">${p.t}</button>`).join("")+`</div><button id="hb" style="text-align:center" onclick="hint()">💡 提示(扣 60 秒)</button><div id="fb"></div></div>`}
function hint(){if(G.hint)return;G.hint=1;G.t=Math.max(1,G.t-60);clock();const w=[...document.querySelectorAll("#op button")].filter(b=>b.dataset.k!=="0");w.slice(0,w.length>2?2:1).forEach(b=>b.disabled=true);$("hb").disabled=true}
function pick(b){if(G.over)return;const q=Q();
if(b.dataset.k==="0"){G.ok++;document.querySelectorAll("#op button,#hb").forEach(x=>x.disabled=true);b.classList.add("ok");
const last=G.qi===2;$("fb").innerHTML=`<p>✅ 正確!${q[2]}</p><button class="main" onclick="${last?"roomDone()":"G.qi++;ask()"}">${last?"取得密碼":"下一題"}</button>`}
else{G.bad++;b.classList.add("no");b.disabled=true;G.t=Math.max(1,G.t-30);clock();$("fb").innerHTML='<p>❌ 錯了,扣 30 秒!再試一次。</p>'}}
function roomDone(){G.got[G.room]=1;cd();$("box").innerHTML=`<div class="card"><b>🔓 房間通關!</b><p>你取得第 ${G.room+1} 位密碼:<span class="code" style="display:inline;font-size:1.6rem"> ${G.code[G.room]} </span></p><button class="main" onclick="hall()">回到大廳</button></div>`}
function door(){$("box").innerHTML='<div class="card"><b>🚪 出口大門</b><p class="note">依房間順序(血池入口→字詞迷宮→燈下書房→履歷檔案室),輸入 4 位密碼。</p><input id="in" inputmode="numeric" maxlength="4" placeholder="????"><button class="main" onclick="open_()">開門</button><div id="fb"></div></div>'}
function open_(){const v=$("in").value;if(v===G.code.join("")){win()}else{G.t=Math.max(1,G.t-30);clock();$("fb").innerHTML='<p>❌ 密碼不對,扣 30 秒!</p>'}}
function _rep(win,st){try{var t=G.ok+G.bad;finishRound({stageId:"E-"+G.lv,stageName:"密室逃脫・"+LN[G.lv],score:t?Math.round(G.ok/t*100):0,right:G.ok,total:t,stars:win?st:0,types:[{key:"q"+G.lv,label:"難度"+LN[G.lv],right:G.ok,total:t}]})}catch(e){}}
function win(){clearInterval(G.tick);G.over=true;const s=G.t>TL[G.lv]*.5?3:G.t>TL[G.lv]*.25?2:1;_rep(true,s);
$("box").innerHTML=`<div class="card" style="text-align:center"><h2>🎉 成功逃脫!</h2><p>難度:${LN[G.lv]}・剩餘時間 ${fmt(G.t)}</p><p style="font-size:1.8rem">${"⭐".repeat(s)}${"☆".repeat(3-s)}</p><p>${s===3?"稱號:🏆 蜘蛛絲攀登大師":s===2?"稱號:🌙 燈下削筆人":"稱號:🕸️ 驚險逃脫者"}</p><button class="main" onclick="start()">再玩一次</button></div>`}
function lose(){clearInterval(G.tick);G.over=true;_rep(false,0);$("box").innerHTML='<div class="card" style="text-align:center"><h2>💀 時間到!</h2><p>蜘蛛絲斷了……你墜回血池。</p><button class="main" onclick="start()">重新挑戰</button></div>'}
ensureStudent(function(){clock();start()});
</script>
<script src="../../home-fab.js"></script></main></body></html>
