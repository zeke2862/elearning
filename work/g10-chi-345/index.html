<script>
/* ========== 接上教師後台的程式（整段複製，只改最上面的 GAME_KEY） ========== */
const GAME_KEY = 'chi-g10-345';            // 遊戲代號：小寫英文／數字／-／_，建議「科目簡碼-遊戲名」

/* 1) 學號：沒有就強迫輸入 */
function ensureStudent(done) {
  const no = keyagentGetActiveStudentNumber();
  if (no) return done(no);
  const v = (prompt('請輸入你的學號') || '').trim();
  if (!/^[A-Za-z0-9_-]{2,12}$/.test(v)) return ensureStudent(done);
  localStorage.setItem('keyagent_active_student', JSON.stringify({ studentNumber: v, verified: false }));
  done(v);
}

/* 2) 練習時間：只算「玩完一局」的時間；切到別的分頁不算；中途關掉的那一局不算 */
let T0 = 0, ACC = 0;
function tStart()  { ACC = 0; T0 = Date.now(); }
function tPause()  { if (T0) { ACC += Date.now() - T0; T0 = 0; } }
function tResume() { if (!T0 && !document.hidden) T0 = Date.now(); }
function tTake()   { tPause(); const s = Math.min(1800, Math.round(ACC / 1000)); ACC = 0; return s; }
document.addEventListener('visibilitychange', () => (document.hidden ? tPause() : tResume()));

/* 3) 一局結束時呼叫 finishRound({...})，會自動記錄並送到老師的後台 */
function finishRound(r) {
  // r = { stageId:'L1', stageName:'第一課 認字', score:80, right:8, total:10, stars:2(可省略), nick:'小勇者'(可省略),
  //       types:[{ key:'read', label:'看字讀音', right:5, total:6 }, ...](可省略) }
  const secs = tTake();
  keyagentUpdateOtherGame(GAME_KEY, prev => {
    const stages = Object.assign({}, prev.stages);
    const s = stages[r.stageId] || {};
    stages[r.stageId] = {
      n: r.stageName || r.stageId,
      bestStars: Math.max(s.bestStars || 0, r.stars || 0),
      bestScore: Math.max(s.bestScore || 0, r.score || 0),
      plays: (s.plays || 0) + 1,
      hist: (s.hist || []).concat([{ at: Date.now(), q: r.total || 0, ok: r.right || 0, s: secs, st: r.stars || 0 }]).slice(-30),   // 每一次的結果（後台點答對率可看）
      totalSecs: (s.totalSecs || 0) + secs,
      totalQ: (s.totalQ || 0) + (r.total || 0),
      totalOk: (s.totalOk || 0) + (r.right || 0)
    };
    const q = Object.assign({}, prev.q);
    (r.types || []).forEach(t => {
      const k = r.stageId + ':' + t.key, o = q[k] || { n: 0, ok: 0 };
      q[k] = { n: o.n + (t.total || 0), ok: o.ok + (t.right || 0), label: t.label || t.key };
    });
    return {
      nick: r.nick || prev.nick || '',
      totalPlays: (prev.totalPlays || 0) + 1,
      bestScore: Math.max(prev.bestScore || 0, r.score || 0),
      totalSecs: (prev.totalSecs || 0) + secs,
      totalQ: (prev.totalQ || 0) + (r.total || 0),
      totalOk: (prev.totalOk || 0) + (r.right || 0),
      lastScore: r.score || 0, lastId: r.stageId, lastName: r.stageName || r.stageId, lastAt: Date.now(),
      stages, q
    };
  });
}
keyagentInstallPageHideSync();           // 4) 離開頁面時補寄一次
/* ========== 以上整段不用改 ========== */
</script>

function show(id){["home","quiz","end"].forEach(function(s){$(s).hidden=s!==id});window.scrollTo(0,0)}
function start(m){
  var pool=Q.filter(function(x){return m==="all"||String(x.l)===m});
  tStart();st={m:m,pool:(m==="all"?shuffle(pool).slice(0,15):shuffle(pool)),i:0,score:0,streak:0,right:0,lives:999,max:0,wrong:[],done:false};
  show("quiz");draw();
}
function lives(){
  var h="";for(var k=0;k<st.max;k++)h+='<i class="'+(k>=st.lives?"cut":"")+'"></i>';
  $("lives").innerHTML=h;$("lives").removeAttribute("aria-label");
}
function draw(){
  var x=st.pool[st.i];st.cur=x;
  $("prog").textContent="第 "+(st.i+1)+" / "+st.pool.length+" 題";
  $("sc").textContent=st.score+" 分";
  $("fill").style.width=(st.i/st.pool.length*100)+"%";
  $("tag").textContent={3:"第三課　醉翁亭記",4:"第四課　水經",5:"第五課　種樹郭橐駝傳"}[x.l];
  $("q").textContent=x.q;
  lives();
  var box=$("opts");box.innerHTML="";
  shuffle(x.o).forEach(function(t,k){
    var b=document.createElement("button");b.className="opt";
    b.innerHTML="<em>"+"ABCD"[k]+"</em><span></span>";b.lastChild.textContent=t;
    b.onclick=function(){pick(b,t)};box.appendChild(b);
  });
  $("exp").hidden=true;$("next").hidden=true;
}
function pick(btn,t){
  var x=st.cur,good=t===x.a;
  Array.prototype.forEach.call($("opts").children,function(b){
    b.disabled=true;
    if(b.lastChild.textContent===x.a)b.classList.add("ok");
  });
  if(good){st.streak++;st.right++;st.score+=10+Math.min(st.streak-1,5)*2}
  else{btn.classList.add("bad");st.streak=0;st.lives--;st.wrong.push({q:x.q,a:x.a,you:t})}
  $("sc").textContent=st.score+" 分";lives();
  var last=st.i+1>=st.pool.length||st.lives<=0;
  $("exp").innerHTML="<strong>"+(good?"答對了！"+(st.streak>1?" 連對 "+st.streak+" 題":""):"答案是：「"+x.a+"」")+"</strong>";
  var p=document.createElement("span");p.textContent=x.e;$("exp").appendChild(p);
  $("exp").hidden=false;
  $("next").textContent=last?"看結果":"下一題";$("next").hidden=false;
  $("next").focus({preventScroll:true});
  $("exp").scrollIntoView({block:"nearest",behavior:"smooth"});
}
function finish(){
  var n=st.pool.length,fell=st.lives<=0&&st.i+1<n;
  var done=fell?st.i+1:n;
  try{var nm={3:"第三課 醉翁亭記",4:"第四課 水經",5:"第五課 種樹郭橐駝傳",all:"三課綜合挑戰"}[st.m];finishRound({stageId:"L"+st.m,stageName:nm,score:Math.round(st.right/done*100),right:st.right,total:done,stars:st.right/done>=.9?3:st.right/done>=.7?2:st.right/done>=.5?1:0,types:[{key:"q",label:nm,right:st.right,total:done}]})}catch(e){}
  show("end");
  $("title").textContent=st.wrong.length===0?"全部答對":"闖關完成";
  $("msg").textContent=st.wrong.length===0?"一題都沒錯，很棒！":"有些題目還值得複習，看看下面的解析。";
  $("final").textContent=st.score+" 分";
  $("detail").textContent="答對 "+st.right+" / "+done+" 題";
  var r=$("rev");r.innerHTML="";
  st.wrong.forEach(function(w){
    var li=document.createElement("li");li.textContent=w.q;
    var s=document.createElement("small");s.textContent="你選：「"+w.you+"」　正確：「"+w.a+"」";
    li.appendChild(s);r.appendChild(li);
  });
}
$("next").onclick=function(){
  if(st.i+1>=st.pool.length||st.lives<=0){finish();return}
  st.i++;draw();window.scrollTo(0,0);
};
document.querySelectorAll(".mode").forEach(function(b){b.onclick=function(){start(b.getAttribute("data-m"))}});
$("again").onclick=function(){start(st.m)};
$("menu").onclick=function(){show("home")};
ensureStudent(function(){});
</script>
<script src="../../home-fab.js"></script>
</body>
</html>
